name: Weekly extract

on:
  schedule:
    # 06:00 UTC Monday — digest lands before the working week starts.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      weeks:
        description: "Weeks ahead to look"
        default: "8"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # A cold .cache/http does not fit in an hour: stage 2 hops a show page per
    # listing, and polite_get holds 1.5s between hits on the same host. Later
    # runs restore the cache and finish in a fraction of this.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      # Cache fetched pages between runs. Most listings pages are
      # unchanged week to week, so this is the difference between
      # being a polite visitor and being a nuisance.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-

      - name: Recollect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make recollect WEEKS="${{ github.event.inputs.weeks || 8 }}" PYTHON=python

      # Saved separately, and always: a one-line failure downstream should not
      # throw away an hour of politely fetched pages.
      - name: Save fetched pages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}

      # `generated` and `window` move every run, so a plain `git diff`
      # would commit noise forever. Compare the events only.
      - name: Has anything actually changed?
        id: check
        run: |
          if python pipeline/changed.py data/extracts/latest.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No listing changes — nothing to commit."
          fi

      - name: Snapshot and commit
        if: steps.check.outputs.changed == 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          cp data/extracts/latest.json "data/extracts/$DATE.json"
          git config user.name  "theatre-bot"
          git config user.email "actions@github.com"
          git add data/extracts frontend/theatre.html
          if [ -f data/refine-cache.json ]; then
            git add data/refine-cache.json
          fi
          git commit -m "extract: $DATE"
          git push

      - name: Log in to Docker Hub
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          make deploy

      - name: Upload extract as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extract
          path: data/extracts/latest.json
