venues:
- id: almeida
  name: Almeida Theatre
  location:
    area: Islington
  whats_on_url: "https://almeida.co.uk/whats-on/"
  fetch_method: static
  strategy: selectors
  selectors:
    show_card: ".c-event-card"
    title: ".c-event-card__title"
    dates: ".c-event-card__daterange"
    link: a.c-event-card__permalink
- id: young-vic
  name: Young Vic
  location:
    area: South Bank
  whats_on_url: "https://www.youngvic.org/whats-on/"
  fetch_method: rendered
  strategy: selectors
  render_wait: ".c-event-card"
  lookahead_weeks: 12
  selectors:
    show_card: ".c-event-card, .c-billboard"
    title: "h3.c-event-card__title, h2.c-heading"
    dates: ".c-event-card__time, .c-paragraph"
    space: ".c-event-card__event-venue"
    link: "a.c-event-card__cover-link, a.c-btn--primary"
  notes: >
    Cloudflare on the show pages was returning empty copy. Rendering the listing and the
    hops through Chromium is the same path as the JS-only houses. Festival promos sit in
    `.c-billboard` rather than event cards (Shedinburgh). 12-week lookahead keeps the
    rest of the autumn season (Eurotrash opens mid-November).
