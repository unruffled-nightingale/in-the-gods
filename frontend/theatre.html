<style>
  :root{
    --paper:#EFEEE8;
    --ink:#1B1A18;
    --ink-soft:#55524C;
    --mute:#9A948B;
    --line:#DAD7CE;
    --hair:#E4E1D9;
    --claret:#6E2431;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* A title long enough to overflow makes the page pannable sideways, and the
     fixed splash then centres against that wider box instead of the screen. */
  html,body{overflow-x:hidden}
  html{-webkit-text-size-adjust:100%}
  ::selection{background:var(--ink);color:var(--paper)}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Newsreader",Georgia,serif;
    font-size:17px; line-height:1.6;
    padding:26px 22px 90px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:660px;margin:0 auto}

  .caps{
    font-family:"Archivo",system-ui,sans-serif;
    font-size:10px; font-weight:500; text-transform:uppercase;
    letter-spacing:.18em;
  }

  /* ---------- ask ---------- */
  .ask{
    display:flex; align-items:center;
    border-bottom:1px solid var(--ink);
    padding-bottom:2px;
  }
  .ask input{
    flex:1; min-width:0; border:none; background:transparent;
    font-family:"Newsreader",Georgia,serif;
    font-size:17px; font-weight:300; font-style:italic; color:#111;
    padding:10px 0; border-radius:0;
  }
  .ask input::placeholder{
    color:#3F3C38; opacity:1;
    font-style:italic; font-weight:300;
  }
  .ask input:focus,.ask input:focus-visible,.ask button:focus,.ask button:focus-visible{outline:none}
  .ask button{
    font-family:"Archivo",system-ui,sans-serif;
    font-size:10px; font-weight:600; text-transform:uppercase;
    letter-spacing:.2em; background:none; border:none; color:var(--ink);
    padding:10px 0 10px 18px; cursor:pointer; transition:color .2s;
    display:flex; align-items:center; justify-content:flex-end;
    min-width:4.4em;
  }
  .ask button:hover{color:var(--claret)}
  .ask button:disabled{
    color:var(--mute); opacity:.4; cursor:default;
  }
  .ask button:disabled:hover{color:var(--mute)}
  .ask-wait{
    display:none; width:12px; height:12px;
    border:1.5px solid var(--line);
    border-top-color:var(--ink);
    border-radius:50%;
  }
  .ask button.busy{opacity:1}
  .ask button.busy .ask-label{display:none}
  .ask button.busy .ask-wait{
    display:block;
    animation:ask-spin .7s linear infinite;
  }
  @keyframes ask-spin{to{transform:rotate(360deg)}}

  /* ---------- filter row ---------- */
  .bar{
    display:flex; align-items:center; gap:18px;
    padding:22px 0 16px; min-height:21px;
  }
  .bar .grp{display:flex;align-items:center;gap:18px;margin-left:auto}
  .tog{
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--mute); line-height:0; transition:color .2s;
  }
  .tog:hover{color:var(--ink)}
  .tog svg{width:21px;height:21px;display:block;
           stroke-width:1.1;vector-effect:non-scaling-stroke}
  .tog[aria-pressed=true]{color:var(--claret)}
  .tog[aria-pressed=true] svg{stroke-width:1.5}
  .tog#tStar[aria-pressed=true] svg{fill:var(--claret)}
  .tog#tFilter[aria-pressed=true]{color:var(--claret)}
  .bar .n{color:var(--mute)}
  .bar .n b{color:var(--ink);font-weight:600}
  .reset{
    font-family:"Archivo",system-ui,sans-serif;font-size:10px;font-weight:500;
    text-transform:uppercase;letter-spacing:.18em;background:none;border:none;
    color:var(--claret);cursor:pointer;padding:0;
  }
  .reset:hover{color:var(--ink)}
  .reading{
    font-size:16px;font-style:italic;font-weight:300;color:var(--ink-soft);
    line-height:1.5;padding:0 0 6px;max-width:52ch;
  }

  /* ---------- filter panel ---------- */
  #filters{overflow:hidden;height:0}
  .filters-inner{padding:4px 0 8px}
  .f-sec{padding:22px 0;border-top:1px solid var(--hair)}
  .f-sec:first-child{border-top:none;padding-top:10px}
  .f-sec .caps{color:var(--mute);margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-family:"Archivo",system-ui,sans-serif;
    font-size:10px;font-weight:500;text-transform:uppercase;
    letter-spacing:.14em;background:none;cursor:pointer;
    color:var(--mute);border:1px solid var(--hair);
    padding:8px 12px;transition:color .2s,border-color .2s;
  }
  .chip:hover{color:var(--ink);border-color:var(--ink-soft)}
  .chip[aria-pressed=true]{color:var(--claret);border-color:var(--claret)}
  .range{position:relative;height:28px;margin:4px 0 8px}
  .range-line{
    position:absolute;left:0;right:0;top:13px;height:1px;background:var(--hair);
  }
  .range-fill{
    position:absolute;top:13px;height:1px;background:var(--claret);pointer-events:none;
  }
  .range input[type=range]{
    position:absolute;left:0;width:100%;top:6px;margin:0;
    background:none;pointer-events:none;
    -webkit-appearance:none;appearance:none;height:16px;
  }
  .range input[type=range]::-webkit-slider-runnable-track{height:1px;background:transparent}
  .range input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;pointer-events:auto;cursor:pointer;
    width:14px;height:14px;border-radius:50%;
    background:var(--claret);border:none;margin-top:-6.5px;
  }
  .range input[type=range]::-moz-range-track{height:1px;background:transparent;border:none}
  .range input[type=range]::-moz-range-thumb{
    pointer-events:auto;cursor:pointer;
    width:14px;height:14px;border-radius:50%;
    background:var(--claret);border:none;
  }
  .range-labels{
    display:flex;justify-content:space-between;
    font-size:14px;font-weight:300;font-style:italic;color:var(--ink-soft);
  }

  /* ---------- entries ---------- */
  article{
    position:relative;
    border-bottom:1px solid var(--hair);
  }
  .slot{padding:38px 0 34px}
  article.folding{overflow:hidden;pointer-events:none}
  /* opacity nests, so fade the children rather than the article —
     otherwise the title can never sit brighter than its parent */
  article .slot > *{transition:opacity .18s linear}
  article.binned .slot > *:not(h2){opacity:.34}
  article.binned h2{opacity:.66}
  article.binned h2 a{
    text-decoration:line-through;
    text-decoration-thickness:2.5px;
    text-underline-offset:0;
  }
  .when{color:var(--mute);margin-bottom:14px}
  .when i{font-style:normal;color:var(--ink-soft)}
  h2{
    font-family:"Bodoni Moda",Didot,"Times New Roman",serif;
    font-weight:600; font-style:italic;
    font-optical-sizing:none;
    font-variation-settings:"opsz" 10;
    -webkit-font-smoothing:auto;
    font-size:clamp(32px,8vw,46px);
    line-height:1.0; letter-spacing:.022em;
    margin:0 0 16px; max-width:19ch;
    overflow-wrap:break-word;
  }
  h2 a{color:var(--claret);text-decoration:none;transition:color .2s}
  h2 a:hover{color:var(--ink)}
  .venue{color:var(--ink-soft);margin-bottom:10px}
  .venue .sep{
    color:var(--ink-soft);letter-spacing:0;font-weight:400;
    font-size:1.15em;margin:0 1.05em;
  }
  .venue .tag{color:var(--claret)}
  .byline{
    font-size:14px; font-weight:300; font-style:italic;
    color:var(--ink-soft); margin:0 0 14px; max-width:48ch;
  }
  .blurb{
    font-size:15px; font-weight:300; line-height:1.72;
    color:var(--ink-soft); max-width:52ch; margin:0 0 12px;
  }
  .blurb.none{
    font-family:"Archivo",system-ui,sans-serif;font-size:10px;
    text-transform:uppercase;letter-spacing:.18em;color:var(--mute);
  }
  .why{
    font-size:14.5px;font-style:italic;font-weight:300;color:var(--claret);
    margin-top:14px;padding-left:16px;border-left:1px solid var(--claret);
    line-height:1.55;max-width:46ch;
  }
  .acts{display:flex;gap:20px;margin-top:22px}
  .act{
    background:none;border:none;padding:0;cursor:pointer;
    color:var(--mute);line-height:0;transition:color .2s;
  }
  .act:hover{color:var(--ink)}
  .act svg{width:15px;height:15px;display:block;stroke-width:1.1}
  .act[aria-pressed=true]{color:var(--claret)}
  .act[aria-pressed=true] svg{stroke-width:1.5}
  .act.star[aria-pressed=true] svg{fill:var(--claret)}

  .tog:focus-visible,.act:focus-visible,.reset:focus-visible,
  .chip:focus-visible,.range input:focus-visible{
    outline:1px solid var(--claret);outline-offset:4px}

  .bin-tools{padding:4px 0 18px}
  .bin-tools[hidden]{display:none}

  .empty{
    padding:56px 0;font-size:19px;font-weight:200;font-style:italic;
    color:var(--mute);
  }

  @media (max-width:600px){
    /* the desktop greys read as washed out on a phone screen */
    :root{--ink-soft:#3A3730; --mute:#6D675E}
    body{font-size:19px; padding:20px 21px 96px 25px}
    .slot{padding:32px 0 28px}
    h2{max-width:none}

    .caps{font-size:11.5px}
    .ask input{font-size:18px; padding:16px 0 10px}
    .ask button{font-size:11px; padding:16px 0 10px 18px}
    .reading{font-size:17px}
    /* 300 is too thin to hold up at this size on a phone */
    .byline{font-size:16px; font-weight:400}
    .blurb{font-size:17px; font-weight:400; line-height:1.66}
    .blurb.none{font-size:11px}
    .why{font-size:16px; font-weight:400}
    .range-labels{font-size:15px}
    .chip{font-size:11px; padding:10px 14px}
    .reset{font-size:11px}
    .empty{font-size:20px}

    /* thumb-sized targets; negative margins keep the icons flush with the
       text column despite the padding */
    .bar{padding:20px 0 14px}
    .bar .grp{gap:8px; margin-right:-7px}
    .tog{padding:7px}
    .tog svg{width:24px;height:24px}
    .acts{gap:10px; margin-left:-9px}
    .act{padding:9px}
    .act svg{width:20px;height:20px}
  }
  /* ---------- splash ---------- */
  .splash{
    position:fixed; inset:0; z-index:40;
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    padding:26px 22px;
  }
  .splash-inner{max-width:660px; width:100%; text-align:center}
  .splash h1{
    font-family:"Bodoni Moda",Didot,"Times New Roman",serif;
    font-weight:400; font-style:italic;
    font-optical-sizing:none;
    font-variation-settings:"opsz" 10;
    -webkit-font-smoothing:auto;
    font-size:clamp(32px,8vw,46px);
    line-height:1.0; letter-spacing:.022em;
    color:var(--claret);
    margin:0 0 16px;
  }
  .splash .caps{
    color:var(--ink-soft);
  }
  .splash.out{
    opacity:0; pointer-events:none;
    transition:opacity .35s linear;
  }

  @media (max-width:600px){
    /* fixed, not 8vw: a vw-sized title re-centres on any viewport change */
    .splash h1{font-size:34px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
    .ask-wait{animation:none!important}
    .splash.out{transition:none}
  }
</style>
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-inner">
    <h1>In the Gods</h1>
    <p class="caps">A place to find events in London</p>
  </div>
</div>
<div class="wrap">

<div class="ask">
  <input type="text" id="q" autocomplete="off"
         placeholder="" aria-label="Ask">
  <button id="go" disabled aria-label="Ask">
    <span class="ask-label">Ask</span>
    <span class="ask-wait" aria-hidden="true"></span>
  </button>
</div>

<div class="bar">
  <div class="grp">
  <div class="n caps" id="count"></div>
  <button class="tog" id="tStar" aria-pressed="false" aria-label="Starred only">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-linejoin="round"><path d="M12 3.2l2.7 5.9 6.3.85-4.6 4.4 1.15 6.4L12 17.7l-5.55 3.05L7.6 14.35 3 9.95l6.3-.85z"/></svg>
  </button>
  <button class="tog" id="tBin" aria-pressed="false" aria-label="Binned only">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-linecap="round"><path d="M3.6 6.4h16.8M9.4 6.4V4.2h5.2v2.2M6.2 6.4l1 13.4h9.6l1-13.4M10 10.2v6M14 10.2v6"/></svg>
  </button>
  <button class="tog" id="tFilter" aria-pressed="false" aria-expanded="false" aria-label="Filters">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
  </button>
  </div>
</div>
<div id="filters" aria-hidden="true">
  <div class="filters-inner" id="filtersInner">
    <div class="f-sec">
      <button class="reset" id="fReset">Reset</button>
    </div>
    <div class="f-sec">
      <div class="caps">When</div>
      <div class="range">
        <div class="range-line"></div>
        <div class="range-fill" id="rangeFill"></div>
        <input type="range" id="rFrom" min="0" max="1" step="1" aria-label="From date">
        <input type="range" id="rTo" min="0" max="1" step="1" aria-label="To date">
      </div>
      <div class="range-labels"><span id="labFrom"></span><span id="labTo"></span></div>
    </div>
    <div class="f-sec">
      <div class="caps">Tags</div>
      <div class="chips" id="tagChips"></div>
    </div>
    <div class="f-sec">
      <div class="caps">Venues</div>
      <div class="chips" id="venueChips"></div>
    </div>
  </div>
</div>
<div class="reading" id="reading" hidden></div>
<div class="bin-tools" id="binTools" hidden>
  <button class="reset" id="restoreAll">Restore all</button>
</div>

<main id="list"></main>

</div>

en chaos and order.", "description": "Don’t miss The Old Vic’s ‘ must-see ’ (The Telegraph) production of Arcadia by Sir Tom Stoppard as it transfers to the West End this summer following its critically acclaimed run.\n\nBrought vividly to life by acclaimed director Carrie Cracknell , this elegant, witty and deeply moving new production of Arcadia is ‘ a fitting tribute to Tom Stoppard’s genius ’ (The Standard).", "first_date": "2026-06-20", "last_date": "2026-09-12", "url": "https://www.oldvictheatre.com/stage/arcadia-west-end/", "tags": ["theatre"], "id": "e004", "venue_name": "The Old Vic", "venue_area": "Waterloo"}, {"venue_id": "bridge-theatre", "title": "The Oresteia", "byline": "A family is haunted by its part in an unjust war, the painful burden of inherited trauma and intergenerational conflict, and the descent into an increasingly merciless vortex of violence.", "description": "Simon Stone’s adaptation of The Oresteia, shows us that as long as humankind wages wars and families tear themselves apart, this story will remain painfully, cathartically relevant.\n\nWriter and director Simon Stone is joined set designer Lizzie Clachan , lighting designer Nick Schlieper , and casting director Jessica Ronane CDG .", "first_date": "2026-07-03", "last_date": "2026-09-19", "url": "https://www.bridgetheatre.co.uk/whats-on/the-oresteia/", "tags": ["theatre"], "id": "e005", "venue_name": "Bridge Theatre", "venue_area": "London Bridge"}, {"venue_id": "menier", "title": "Midnight At The Never Get", "byline": "1965, New York City. Trevor Copeland and Arthur Brightman’s love is against the law.", "description": "In their secret nightclub act, “Midnight”, they perform love songs in an act of defiance of a world that demands they stay hidden. As tensions rise at the start of a historic movement, Trevor and Arthur are torn between their own surreptitious romance, and the oncoming storm of social revolution.\n\nStarring Tony and Grammy Award-winner Ben Platt ( Dear Evan Hansen ), and written by Golden Globe, Grammy and Academy Award-winner Mark Sonnenblick (“Golden”, KPop Demon Hunters ), MIDNIGHT AT THE NEVER GET comes to the Menier for a strictly limited season in a brand new production directed by Drama Desk and Tony Award-winner David Cromer ( The Band’s Visit ).", "first_date": "2026-07-11", "last_date": "2026-09-12", "url": "https://www.menierchocolatefactory.com/tickets/midnight-at-the-never-get/", "tags": ["musical", "theatre"], "id": "e006", "venue_name": "Menier Chocolate Factory", "venue_area": "Southwark"}, {"venue_id": "troubadour", "title": "I'm Every Woman - The Chaka Khan Musical", "byline": "I’m Every Woman - The Chaka Khan Musical . Get ready to witness the incredible untold life story and music of multi-platinum selling, 10-time GRAMMY® winner and global icon, Chaka Khan !", "description": "With 22 albums, 25 chart-topping hits, 70 million records sold and a career spanning five decades, Chaka Khan has shaped the sound of generations. Now, her story explodes onto stage starring Alexandra Burke ( Sister Act, The Bodyguard, Chicago, The X Factor winner 2008 ) for a limited season at London’s Troubadour Wembley Park Theatre. Featuring a book that includes an array of Chaka’s famous friends from Joni Mitchell and Prince to Stevie Wonder and Steve Winwood in addition to the songs that made her a global icon - including I Feel for You, Tell Me Something Good, Ain’t Nobody, Sweet Thing, Through The Fire and many more. This groundbreaking production delves into the woman behind the music - her rise to fame, her battles behind the spotlight, and her powerful journey of resilience.\n\nTo ensure the right tickets are sold to the right people, we require all access bookers to provide us with a Nimbus registration number in order to qualify for any access discounts available at the time of booking. Registering is a three-step process and completely free. More information can be found on our Access page .", "first_date": "2026-07-22", "last_date": "2026-09-27", "url": "https://www.troubadourtheatres.com/whats-on/i-m-every-woman-the-chaka-khan-musical", "tags": ["musical"], "id": "e007", "venue_name": "Troubadour Theatres", "venue_area": "Wembley Park"}, {"venue_id": "regents-park", "title": "CATS", "byline": "A brand-new production of Andrew Lloyd Webber’s global sensation CATS leaps into the magical outdoor setting of Regent’s Park Open Air Theatre.", "description": "From Euston station to Victoria Grove, the strays and rebels of London gather under the Jellicle moon in the hope they’ll be the chosen one. And each of them asks, because each of them dares, who will it be? Based on T. S. Eliot’s Old Possum’s Book of Practical Cats, and with a legendary score featuring Old Deuteronomy, Macavity: The Mystery Cat, Jellicle Ball and the chart-topping hit Memory , this production of CATS , directed and choreographed by Regent’s Park Open Air Theatre Artistic Director Drew McOnie ( Jesus Christ Superstar, Brigadoon ), is sure to be one of the theatrical events of 2026. Following a limited London run of just 8 weeks, this production will undertake a major UK tour through to July 2027.", "first_date": "2026-07-25", "last_date": "2026-09-19", "url": "https://openairtheatre.com/production/cats", "tags": ["musical", "dance"], "id": "e008", "venue_name": "Regent's Park Open Air Theatre", "venue_area": "Regent's Park"}, {"venue_id": "sohoplace", "title": "Tao of Glass", "byline": "An exploration of life, loss and a single question: Where does true inspiration come from?", "description": "Composer Philip Glass and performer-director Phelim McDermott (Improbable) have worked together on acclaimed opera productions in London, New York and beyond, and Tao of Glass is their most personal collaboration yet. Inspired by a dream, this West End premiere marries ten meditations on life, death and Taoist wisdom with ten brand new pieces of music from Glass, presented by McDermott with an ensemble of musicians and puppeteers.\n\nPart-concert, part-performance, Tao of Glass is a storytelling tapestry, soundtracked by Glass’s mesmerising music and shot through with Improbable’s trademark theatricality.", "first_date": "2026-07-25", "last_date": "2026-09-12", "url": "https://sohoplace.org/shows/tao-of-glass/", "tags": ["opera", "concert"], "id": "e009", "venue_name": "@sohoplace", "venue_area": "Soho"}, {"venue_id": "old-vic", "title": "How the Other Half Loves", "byline": "Read our Content Guidance page for further information.", "description": "Read about our Season In The Round to find out more about the seating configuration for this production.\n\nThree couples, two homes, one laugh-out-loud domestic farce.", "first_date": "2026-07-29", "last_date": "2026-09-19", "url": "https://www.oldvictheatre.com/stage/other-half/", "tags": ["theatre"], "id": "e010", "venue_name": "The Old Vic", "venue_area": "Waterloo"}, {"venue_id": "barbican", "title": "Death Note: The Musical", "byline": "With over 30 million copies sold worldwide, this ' triumphant, fantastical manga thriller' ( WhatsOnStage ) by Tsugumi Ohba and Takeshi Obata is a global sensation that has captivated audiences worldwide.", "description": "Now, boldly reimagined for the London stage, this ' highly entertaining musical' ( The Times ) features an ' electrifying, symphonic and catchy' ( BroadwayWorld ) score by Tony, Grammy and Emmy nominee Frank Wildhorn , lyrics by Jack Murphy and a book by Ivan Menchell .\n\nWhen brilliant student Light Yagami discovers a notebook with the power to determine who lives and who dies, his mission to reshape society quickly spirals out of control and attracts the attention of the elusive and ruthless detective L. What begins as justice descends into obsession and forces both to confront the limits of morality itself.", "first_date": "2026-07-30", "last_date": "2026-09-12", "url": "https://www.barbican.org.uk/whats-on/2026/event/death-note-the-musical", "tags": ["musical"], "id": "e011", "venue_name": "Barbican Centre", "venue_area": "Barbican"}, {"venue_id": "brixton-house", "title": "Pop Up & Vibes", "byline": "Sixty years of colour, culture, and Caribbean joy — and we’re celebrating the only way we know how.", "description": "Before the floats hit the road and the streets fill with sound, POP UP & is taking Brixton by storm for one unforgettable night as we launch our pop up residency at Brixton House.\n\nOn Friday 7th August, we’re taking over the iconic Brixton House Foyer for a Pre-Carnival Pop Up & Vibes Fete and Evening Market, you absolutely cannot miss. Twenty incredible vendors. And the soundtrack? That’s courtesy of Brixton’s own Just Vibez — bringing Soca, Afrobeats, Dancehall and more across the venue all evening long.\n\nAisha is the Founder and Creative Director of POP UP &, a multidisciplinary creative studio and platform dedicated to community building, cultural programming, and meaningful brand experiences. Through my work, I bring together storytelling, strategy, and collaboration to create projects that sit at the intersection of culture, commerce and community.", "first_date": "2026-08-07", "last_date": "2026-09-11", "url": "https://brixtonhouse.co.uk/shows/pop-up-vibes/", "tags": ["social", "cabaret"], "id": "e012", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "barbican", "title": "Lady", "byline": "Samuel Abrahams serves up this delightfully odd mockumentary: an eccentric aristocrat ( Fleabag 's Sian Clifford) ropes a struggling filmmaker into documenting her gloriously mundane life.", "description": "A young filmmaker ( Laurence Kynaston ) arrives at the estate of the eccentric Lady Isabella ( Sian Clifford ) to shoot a documentary about her seemingly ordinary life. But as her quest for artistic legacy grows increasingly unhinged, the project spirals into a wild supernatural territory.\n\nUnexpectedly absurd, Lady feels like the B-side to an eat-the-rich satire, mixing laughs with surprising tenderness. Beneath its eccentricity, themes of loneliness, identity, and the longing to be seen lies at the film's core.", "first_date": "2026-08-14", "last_date": "2026-09-09", "url": "https://www.barbican.org.uk/whats-on/2026/event/lady", "tags": ["theatre", "comedy"], "id": "e013", "venue_name": "Barbican Centre", "venue_area": "Barbican"}, {"venue_id": "puppet-barge", "title": "The Three Little Wolves (RICHMOND)", "byline": "The Three Little Wolves is a musical adventure set right here on the Puppet Barge!", "description": "Performed with glove puppets to an electrifying musical score by Josh Middleton. Expect dancing mice, slippery eels and a lion taming pigeon in this brand new production written by Nick Cassenbaum.\n\nDuration 50mins no interval Age recommendation 4–10", "first_date": "2026-08-17", "last_date": "2026-10-04", "url": "https://www.puppetbarge.com/the-three-wolves-richmond", "tags": ["puppetry", "musical"], "id": "e014", "venue_name": "Puppet Theatre Barge", "venue_area": "Little Venice"}, {"venue_id": "jermyn-street", "title": "A Slow Fire", "byline": "Years after the apocalypse, Ashton and Reece survive in a bunker on the edge of an imaginary city.", "description": "Searching for hope, they spend their days acting out stories from the before times. When a stranger appears, is he here to save them? Or is he telling a tale too good to be true?\n\nThe staggering new play from Tony and Olivier award winning Simon Stephens is part thriller, part excavation of the soul. Rex Ryan directs this UK premiere.", "first_date": "2026-08-20", "last_date": "2026-09-26", "url": "https://www.jermynstreettheatre.co.uk/show/a-slow-fire/", "tags": ["theatre"], "id": "e015", "venue_name": "Jermyn Street Theatre", "venue_area": "St James's"}, {"venue_id": "the-place", "title": "Anatomy of Survival", "byline": "A woman walks into a cafe. She orders a coffee. The barista doesn't understand her request. The woman loses her sh*t. Chaos reigns.", "description": "This offbeat collaboration between award-winning playwright Vivienne Franzmann and choreographer and psychotherapist Frauke Requardt , brings together 22 very different eyewitness accounts of one everyday altercation to show how our nervous systems are stuck in the Stone Age. Performed by two dancers, an actor and a drummer (and one bear). Anatomy of Survival is a show for all the nervous systems in the auditorium. Come and feel the rise and fall of yours.\n\nFrauke Requardt is a German-born, London-based choreographer. Her choreographic work is characterised by physically challenging choreography, a strong theatricality, dark humour and an overall sense of surrealism. She uses text and live music and a mixture of abstract and emotionally based movement to deliver highly engaging work.", "first_date": "2026-08-25", "last_date": "2026-11-26", "url": "https://theplace.org.uk/events/autumn-winter-26-anatomy-of-survival", "tags": ["dance", "theatre"], "id": "e016", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "hampstead", "title": "KIMBERLY AKIMBO", "byline": "Kimberly Levaco is excited to celebrate her upcoming sweet 16 – never mind the fact she looks 74, due to a rare genetic condition prematurely ageing her about four times faster than her friends.", "description": "Or, she would be excited if her family hadn’t suddenly moved town under suspect circumstances, meaning she’s a little short on friends right now. And whilst her heart may be biologically ahead of its time, it’s starting to beat a little quicker after meeting Seth from the ice rink…\n\nKim doesn’t have long to explore the world beyond New Jersey, but she’s damn sure she’s going to once she can afford it. With her dysfunctional parents a little tight on cash, her ex-con aunt shows up with a get-rich-quick scam, and Kim’s all in for the adventure – illegal or not. Can Kim, along with Seth and her new show-choir friends, pull off the heist, find first love and have the great adventures they’ve been dreaming of?\n\nOne of the most acclaimed performers in musical theatre, Maria Friedman will star as Kimberly. She is a four-time Olivier Award winner, with nine nominations and a Tony nomination, and has also won multiple awards from What’s on Stage, Evening Standard, Theatre World and Critics’ Circle Awards, including Broadway Best Newcomer as well as a Drama Desk Award, for her work across both the West End and Broadway.", "first_date": "2026-08-28", "last_date": "2026-11-07", "url": "https://www.hampsteadtheatre.com/whats-on/2026/kimberly-akimbo/", "tags": ["musical"], "id": "e017", "venue_name": "Hampstead Theatre", "venue_area": "Swiss Cottage"}, {"venue_id": "southwark-playhouse", "title": "Jane Eyre A Musical", "byline": "This five-time Tony nominated musical retelling of Charlotte Brontë’s revolutionary novel makes its UK premiere.", "description": "A story of ambition and independence, gothic mystery and great passionate love, Jane Eyre has enchanted generations and is brought into the 21st century with this new production.\n\nAccompanied by an epic sweeping score, prepare to see Jane, the first feminist literary icon, like you never have before.", "first_date": "2026-08-28", "last_date": "2026-10-24", "url": "https://southwarkplayhouse.co.uk/productions/jane-eyre/", "tags": ["musical"], "id": "e018", "venue_name": "Southwark Playhouse", "venue_area": "Borough, SE1"}, {"venue_id": "artsdepot", "title": "Lens & Canvas – Beyond the Frame", "byline": "This event is free and tickets do not need to be booked in advance, just turn up on the day.", "description": "An eclectic mix of photography and artwork by Debbie Jaye and Richard Szerman.\n\nAn exhibition of exciting new work of photography and painting. “A realism meets surrealism experience” not to be missed.", "first_date": "2026-09-01", "last_date": "2026-09-14", "url": "https://www.artsdepot.co.uk/exhibition/lens-canvas-beyond-the-frame/", "tags": ["exhibition"], "id": "e019", "venue_name": "artsdepot", "venue_area": "North Finchley"}, {"venue_id": "drayton-arms", "title": "Twelfth Night", "byline": "Viola is washed ashore in Illyria after surviving a shipwreck. Believing that her twin brother, Sebastian, has drowned, she disguises herself as a young man called Cesario in order to find employment.", "description": "She soon becomes a servant to Duke Orsino, who is hopelessly in love with Olivia.\n\nOrsino sends Cesario to persuade Olivia to return his love, but instead Olivia falls for Cesario. At the same time, Olivia’s servants play a prank on Malvolio, convincing him that Olivia is in love with him. His unusual behaviour makes Olivia believe he has gone mad.\n\nIn this humorous story of mistaken identity, love, and deception, will everything be resolved happily in the end?", "first_date": "2026-09-01", "last_date": "2026-09-26", "url": "https://thedraytonarmstheatre.co.uk/shakespeares-twelfth-night", "tags": ["theatre"], "id": "e020", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "white-bear", "title": "Iceberg Right Ahead", "byline": "Iceberg Right Ahead comes to the White Bear Theatre. Book your tickets today!", "description": null, "first_date": "2026-09-01", "last_date": "2026-09-20", "url": "https://www.whitebeartheatre.co.uk/whatson/iceberg-right-ahead", "tags": ["theatre"], "id": "e021", "venue_name": "White Bear Theatre", "venue_area": "Kennington"}, {"venue_id": "finborough", "title": "Annie Wobbler (Revisited)", "byline": "In 1981, playwriting legend Arnold Wesker ( the Roots trilogy , Chips With Everything , The Kitchen ) wrote Annie Wobbler especially for his friend, Olivier Award winner Nichola McAuliffe.", "description": "Two years later, it was produced in Birmingham, on the London Fringe and transferred to the West End.\n\nAnd now 45 years later, Nichola McAuliffe returns with Annie Wobbler (Revisited) , a new version of the original play cycle for the 21st century.", "first_date": "2026-09-02", "last_date": "2026-09-26", "url": "https://www.finboroughtheatre.co.uk/productions/annie-wobbler-revisited", "tags": ["theatre"], "id": "e022", "venue_name": "Finborough Theatre", "venue_area": "Earl's Court"}, {"venue_id": "lyric-hammersmith", "title": "The Children", "byline": "Hazel and Robin have survived a catastrophe. Living on the edge of a radiation exclusion zone, Hazel still practises her yoga and Robin’s brewing parsnip wine. They are trying to keep going, clinging onto normality.", "description": "That is until their old friend Rose knocks on the door. With her she brings old memories, buried secrets – and a proposition. One which tests their loyalty and forces them to confront their debt to the next generation.\n\nLucy Kirkwood’s gripping, darkly funny drama is directed by Artistic Director Rachel O’Riordan in this 10th anniversary production, starring Declan Conlon ( Faith Healer ) as Robin, Kerry Fox ( Shallow Grave ) as Rose and the Olivier Award-nominated Meera Syal ( A Tupperware of Ashes; Noises Off ) as Hazel.", "first_date": "2026-09-02", "last_date": "2026-10-03", "url": "https://lyric.co.uk/shows/the-children/", "tags": ["theatre"], "id": "e023", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "stratford-east", "title": "BLOODSPORT:  After Helen of Troy", "byline": "New play, modern day retelling of Helen of Troy se...", "description": null, "first_date": "2026-09-03", "last_date": "2026-10-10", "url": "https://stratfordeast.com/whats-on/all-shows/bloodsport-after-helen-of-troy", "tags": ["theatre"], "id": "e024", "venue_name": "Theatre Royal Stratford East", "venue_area": "Stratford"}, {"venue_id": "tabard", "title": "Simon Brodkin", "byline": "From the unique comedy mind that brought you Lee Nelson and Theresa May’s P45, comes brand new material you won’t want to miss.", "description": "Times refresh about once an hour from TicketSolve; availability may change when you open the booking page.", "first_date": "2026-09-03", "last_date": "2026-09-09", "url": "https://www.tabard.org.uk/production/simon-brodkinsept26", "tags": ["stand-up"], "id": "e025", "venue_name": "Tabard Theatre", "venue_area": "Chiswick"}, {"venue_id": "young-vic", "title": "Thelma & Louise", "byline": "On a whim, Louise ( Rachel Tucker ) invites her best friend Thelma ( Amy Lennox ) for a spontaneous weekend getaway.", "description": "After an ill-fated encounter with a stranger at a roadside bar, their lifelong friendship is forged into something dangerous and unbreakable. Propelled by a soaring musical score, they set out on a last-chance adventure in a world where every card is stacked against them.\n\nMore than thirty years after the Oscar and Golden Globe-winning film, writer Callie Khouri reimagines her iconic road movie, Thelma & Louise , as a brand-new musical. With music and lyrics by Grammy-nominated artist Neko Case , this electrifying production, directed by Trip Cullman is wild, hilarious and will rip your heart out.\n\nMonday - Saturday, 7.30pm | Wednesday & Saturday matinees, 2.30pm", "first_date": "2026-09-03", "last_date": "2026-10-24", "url": "https://www.youngvic.org/whats-on/thelma-louise/", "tags": ["musical"], "id": "e026", "venue_name": "Young Vic", "venue_area": "South Bank"}, {"venue_id": "marylebone-theatre", "title": "Tartuffe (Remixed)", "byline": "Following his sell-out performance of Venus and Adonis, Mark Rylance returns to the Marylebone Theatre to star in Tartuffe (Remixed) , a new version of Moliere’s classic comedy, written and directed by Darren Raymond .", "description": "Relocated to a Nigerian-jamaican household in modern England, Tartuffe (Remixed) is a deliciously biting comedy in rhyming couplets, which brings both new humour and modern pathos to the original text.\n\nThe outspoken Afolabi–Williams family gathers at Oga Afolabi's mansion as preparations begin for the wedding of his daughter. With relatives arriving from far and wide, family traditions are in full swing, emotions are running high, and opinions are never in short supply. But when Pastor Blake, a charismatic man of God who has won Oga's unwavering trust, takes up residence in the family home, old wounds reopen, loyalties are tested, and faith itself becomes a battleground. As the wedding day draws ever closer, the family must expose the truth before everything they hold dear is torn apart.\n\nBold, hilarious and heartfelt, Tartuffe (Remixed) reimagines Molière's timeless comedy through the lens of a contemporary Nigerian–Jamaican family. Blending razor-sharp comedy, spoken word, music and beautifully crafted rhyming verse, this vibrant new adaptation is a joyful celebration of faith, family, forgiveness and the courage to speak truth to power", "first_date": "2026-09-04", "last_date": "2026-10-24", "url": "https://www.marylebonetheatre.com/productions/tartuffe-remixed", "tags": ["theatre"], "id": "e027", "venue_name": "Marylebone Theatre", "venue_area": "Marylebone"}, {"venue_id": "soho-theatre", "title": "Tarang Hardikar: If I’m Not Wrong", "byline": "Fresh from his debut at the Edinburgh Fringe, Tarang takes on life’s contradictions, cultural chaos, and his habit of questioning every minute aspect of life.", "description": "Why has no one ever seen a growing coconut tree? Why is the biggest prize in sports a cup? Why didn’t you keep the paneer in the fridge?\n\nFor all of these pressing questions and more, catch Tarang at Soho before everyone else claims they saw him first.\n\nThis show has now passed, but we have a full festival programme of comedy, theatre and cabaret throughout the year. Check out what's on now to find more great shows coming up.", "first_date": "2026-09-05", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/tarang-hardikar-if-im-not-wrong/", "tags": ["stand-up"], "id": "e028", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "artsdepot", "title": "artsdepot Creative Circle (for Over 55s)", "byline": "Explore your creativity and self-expression through writing poetry and prose with a group of creative people.", "description": "Facilitated by experienced tutor Nichola Charalambou, the sessions encourage self-expression and participants can share and develop material together.", "first_date": "2026-09-07", "last_date": "2026-12-14", "url": "https://www.artsdepot.co.uk/project/creative-circle/", "tags": ["class"], "id": "e029", "venue_name": "artsdepot", "venue_area": "North Finchley"}, {"venue_id": "artsdepot", "title": "Youth Hip Hop", "byline": "Elevate is a safe and friendly dance school for dancers to express themselves and be the best versions of themselves!", "description": "Our youth hip hop class for ages 11 – 15 years is designed to give confidence and fun to all.\n\nWe will learn fresh new choreography every week, work on performance skills as well as develop fitness too. Eleni’s top priority is to make sure everyone is comfortable, happy and elevating!", "first_date": "2026-09-07", "last_date": "2026-12-14", "url": "https://www.artsdepot.co.uk/project/elevate-with-eleni/", "tags": ["dance"], "id": "e030", "venue_name": "artsdepot", "venue_area": "North Finchley"}, {"venue_id": "artsdepot", "title": "Monday ‘Every Person’ Group", "byline": "Social group for autistic girls and nonbinary people to develop skills and build relationships with peers.", "description": "This is not an artsdepot-produced class, but is an independent hire. Therefore, some discounts do not apply.", "first_date": "2026-09-07", "last_date": "2026-12-14", "url": "https://www.artsdepot.co.uk/project/monday-every-person-group/", "tags": ["social"], "id": "e031", "venue_name": "artsdepot", "venue_area": "North Finchley"}, {"venue_id": "artsdepot", "title": "Acrylic Painting Workshops", "byline": "This guided acrylic painting workshop will take you step by step through a different painting each week. From Pop Art to Impressionism, street art to abstract, meet new people while learning about different styles of painting.", "description": "This is not an artsdepot-produced class, but is an independent hire. Therefore, some discounts may not be available.", "first_date": "2026-09-07", "last_date": "2026-12-14", "url": "https://www.artsdepot.co.uk/project/acrylic-painting-workshops/", "tags": ["class"], "id": "e032", "venue_name": "artsdepot", "venue_area": "North Finchley"}, {"venue_id": "brixton-house", "title": "Housemates 2026: A Week of Readings", "byline": "After receiving over 200 submissions, we wanted to create space for scripts we loved — stories and voices that stood out to us and deserved further development and audience connection.", "description": "With a new script every night, Housemates Readings invites audiences into the creative process, championing bold new writing and offering artists the chance to hear, test and develop their work in front of a live audience. Part of Brixton House’s ongoing commitment to nurturing artists and supporting new voices, this strand is about making room for exciting work to grow.\n\nKem is da ultimate roadman. Icon is the ultimate diva.\n\nCan love that came alive between Brixton Prison sheets hope to survive on Brixton streets?", "first_date": "2026-09-07", "last_date": "2026-09-11", "url": "https://brixtonhouse.co.uk/shows/housemates-2026-a-week-of-readings/", "tags": ["theatre"], "id": "e033", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "jacksons-lane", "title": "By A Thread: One Fell Swoop Circus", "byline": "Seven acrobats. One web of rope. And every move matters.", "description": "Suspended above the stage, the performers of By a Thread are connected by a network of ropes, pulleys and knots. When one person moves, everyone feels it.\n\nWhat follows is a breathtaking show as trust is tested and relationships are pushed to their limits. Bodies fly, friendships falter and the smallest mistake can send everything spinning.", "first_date": "2026-09-07", "last_date": "2026-09-08", "url": "https://www.jacksonslane.org.uk/events/by-a-thread/", "tags": ["circus"], "id": "e034", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "kings-head", "title": "You & It", "byline": "When Mina (Olivier nominee Frances Mayli McCann ) is killed in a shocking accident, grief-stricken Gyujin ( Zachary Pang ) seeks an experimental technology to rebuild his late wife as an AI.", "description": "She has Mina’s memories, voice, appearance; it’s as if she’s back from the dead.\n\nBut the more and more the AI changes, Gyujin finds it harder to hold on to the wife he remembers instead of the one in front of him. As their perfect life slips away, is the technology the key to their happiness or the source of their ruin?\n\nIn this emotional and intimate South Korean musical, You & It explores memory, love, grief, and how technology can change who we are.", "first_date": "2026-09-07", "last_date": "2026-09-26", "url": "https://kingsheadtheatre.com/whats-on/you-and-it-cs41", "tags": ["musical"], "id": "e035", "venue_name": "King's Head Theatre", "venue_area": "Islington"}, {"venue_id": "museum-of-comedy", "title": "The Monday Club", "byline": "Grab yourself a drink and join us in the Museum bar for a relaxed weekly night of new material from some of the finest comedians on the circuit.", "description": "Featuring pro acts, new acts and maybe the odd one or two off the telly…\n\nLike our Facebook page to see who's performing each month and keep up to date with all things The Monday Club!", "first_date": "2026-09-07", "last_date": "2026-12-21", "url": "https://www.museumofcomedy.com/the-monday-club/", "tags": ["stand-up"], "id": "e036", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "park-theatre", "title": "Lara Ricote: Inkling", "byline": "Melbourne International Comedy Festival Most Outstanding Show Nominee 2026. INKLING is a show about How to Salute to the Mystery of Being Alive (ok?).", "description": "Might that be of intrigue?… To you? Big kisses to you and yours. Love, Lara. PS I am trying my best. Edinburgh Best Newcomer winner 2022. As seen on TV.", "first_date": "2026-09-07", "last_date": "2026-09-26", "url": "https://parktheatre.co.uk/events/lara-ricote-inkling/", "tags": ["stand-up"], "id": "e037", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "park-theatre", "title": "Lou Wall: Where Are All The Tall Grandmas?", "byline": "Where are all the tall grandmas? Be honest, you’ve never seen one, have you? So where the f#%k are they? Do they shrink? Die young? Are short kings eating them?", "description": "In this hilariously unhinged new hour, Lou dives head first into the disappearance of tall old women everywhere. A comedic investigation into height, heritage and what it truly means to live large. ‘Wall is a comedy whirlwind’ (New York Times). Nominee: Most Outstanding Show, Melbourne International Comedy Festival 2024 and 2025.\n\nAs seen on 8 Out of 10 Cats Does Countdown (C4) and Iain Stirling’s Roast The Internet (Comedy Central).", "first_date": "2026-09-07", "last_date": "2026-09-18", "url": "https://parktheatre.co.uk/events/lou-wall-where-are-all-the-tall-grandmas/", "tags": ["stand-up"], "id": "e038", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "riverside-studios", "title": "One Night Only", "byline": "What if one messy night tums out to be the best thing that ever happened to you?", "description": "Recently dumped Owen and hopeful romantic Allie might be the only two singles in the city looking for more than just a quick encounter They both feel a spark when they meet, but a series of missteps and side quests complicate their night, keeping them apart. As they each race toward and away from each other across the city, they just might discover that the one thing they want most is closer than they think.Age Rating:15Language:EnglishContent / Trigger Warnings:strong language, sex referencesDirector:Will GluckCast:Callum Turner, Monica BarbaroCompany:UniversalTrailers:20 minsYear of Release:2026Audio Described:Yes", "first_date": "2026-09-07", "last_date": "2026-09-10", "url": "https://riversidestudios.co.uk/whats-on/ugQ-one-night-only/", "tags": ["theatre"], "id": "e039", "venue_name": "Riverside Studios", "venue_area": "Hammersmith"}, {"venue_id": "royal-court", "title": "Man to Man", "byline": "As the world around her changes, she endures war and dictatorship, hunger and humiliation – always fighting to stay alive.", "description": "More than 30 years after she first brought the role to life, Tilda Swinton ( We Need to Talk About Kevin, Orlando ) makes a long-awaited return to stage as Ella/Max in Manfred Karge ’s Man to Man - the role she originated in the acclaimed 1988 UK premiere at the Traverse Theatre and Royal Court.\n\nThis landmark revival reunites the multi-award-winning creative team, including director Stephen Unwin ( The Conquest of the South Pole ) and designer Bunny Christie ( People, Places and Things ) ahead of transferring to the Traverse Theatre, Berliner Ensemble and a run in New York City in Spring 2027.", "first_date": "2026-09-07", "last_date": "2026-10-24", "url": "https://royalcourttheatre.com/events/man-to-man", "tags": ["theatre"], "id": "e040", "venue_name": "Royal Court", "venue_area": "Sloane Square"}, {"venue_id": "shakespeares-globe", "title": "Much Ado About Nothing", "byline": "Find out how to get here, where to stay and read our FAQs.", "description": "Find assisted performances for this event and explore our provisions for Deaf, disabled, and neurodivergent people below.\n\nLooking for that last-minute way to experience London’s iconic wooden ‘O’ this summer?", "first_date": "2026-09-07", "last_date": "2026-10-24", "url": "https://www.shakespearesglobe.com/whats-on/much-ado-about-nothing/", "tags": ["theatre"], "id": "e041", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "soho-theatre", "title": "You’re So Special", "byline": "Miss June teaches baby ballet in a crumbling village hall, drilling good-toes-naughty-toes into a generation of tiny dancers while her own dreams of greatness quietly rot.", "description": "But when her final shot at fame vanishes, she doubles down, and fights to transform the end-of-term sharing into an all-consuming quest for glory. This is going to be the battle of a lifetime.\n\nA surreal, razor-sharp dark comedy about ambition, delusion, and what happens when the dream refuses to die.\n\nDiscounts may be available on top prices for students, seniors, unwaged.", "first_date": "2026-09-07", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/youre-so-special/", "tags": ["theatre", "dance"], "id": "e042", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "soho-theatre", "title": "Bigfoot Ripped My Dog In Half I Saw It", "byline": "Two teenagers perform fake Bigfoot sightings in their Appalachian town until a neighbour’s dog turns up torn to pieces.", "description": "Aside from sparking a panic that spirals out of their control, it forces them to question what might actually be terrorising their underresourced and already superstitious community.\n\nFrom “the Fringe’s most dynamic theatrical duo” ( Telegraph ) comes a brand new Brechtian puppet show ripped in two about conspiracy, misdirection, and seeing something with your own eyes.\n\nDiscounts may be available on top prices for students, seniors, unwaged.", "first_date": "2026-09-07", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/bigfoot-ripped-my-dog-in-half-i-saw-it/", "tags": ["puppetry", "theatre"], "id": "e043", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "soho-theatre", "title": "Salty Brine : How Strange It Is", "byline": "In How Strange It Is, Neutral Milk Hotel’s indie-rock triumph In the Aeroplane Over the Sea and Anne Frank’s stunning and candid The Diary of a Young Girl fuse with confessions from Salty’s adolescent longings in a genre-defying cabaret…", "description": "In How Strange It Is, Neutral Milk Hotel’s indie-rock triumph In the Aeroplane Over the Sea and Anne Frank’s stunning and candid The Diary of a Young Girl fuse with confessions from Salty’s adolescent longings in a genre-defying cabaret that will take your breath away.\n\nSparks fly, time bends, and the ghosts of our past return to us in this hilarious and devastating work from Salty’s acclaimed and expansive Living Record Collection.\n\nSalty Brine is the creative force behind The Living Record Collection, a dazzling expedition into the heart of popular music that imagines tracklists as blueprints for evenings of musical mayhem, creating the perfect cabaret experience for theatre-lovers.", "first_date": "2026-09-07", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/salty-brine-how-strange-it-is-2/", "tags": ["cabaret"], "id": "e044", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "soho-theatre", "title": "Frankie McNair: Huge Ass Mindset", "byline": "After a lifetime of anxiety, complex PTSD, and low self-esteem, Frankie is finally done making themselves small.", "description": "So now whenever self-doubt creeps in, they ask themselves one simple question: “What would someone with a huge ass do in this situation?”\n\nA chaotic love letter to comedy, delusional optimism, resilience & becoming the ass you want to see in the world!\n\nHuge Ass Mindset references sensitive topics. Please read our content advice for more information.", "first_date": "2026-09-07", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/frankie-mcnair-huge-ass-mindset/", "tags": ["stand-up"], "id": "e045", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "soho-theatre", "title": "Crybabies: The Scaring", "byline": "Heeeeeeeeere’s Crybabies.", "description": "Fresh from the Fringe, join the Edinburgh Comedy Award nominated sketch group and ‘masters of the craft’ (Guardian) for a terrifying tale about fear, faith, fathers (dads), fathers (priests), fantoms (phantoms) and finally moving on.\n\nWhen former priest Arthur Holland checks into a remote hotel, he soon finds out it’s not just the breakfast buffet which poses a threat to life. Forced into an unlikely double act with Gerry, the ghost of a long dead guest, Arthur must tackle demons both public and private under the watchful eye of Mr Lyle – the hotel’s Norman Bates-esque manager.\n\nThe Scaring reunites director Jon Brittain and producers Francesca Moody Productions, the Olivier Award-winning collaboration behind Baby Reindeer and Kathy and Stella Solve a Murder! FMP return to Soho Theatre this autumn following their 2026 Olivier-nominated production Weather Girl , which also transferred from the Fringe.", "first_date": "2026-09-07", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/crybabies-the-scaring/", "tags": ["comedy"], "id": "e046", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "southbank-centre", "title": "Gift to the Future", "byline": "See our brutalist buildings transformed with a giant poetry installation created by thousands of brilliant school pupils.", "description": "Over 90 lines of poetry created with thousands of children from across London, Birmingham and Manchester are realised on an epic scale on our site. As part of our 75th anniversary school project, Imagine the Future, we’ve been diving into creative writing projects with incredible groups of young people, inviting them to express their hopes and dreams for the future. Inspired by the 1951 Festival of Britain and led by renowned poet Lemn Sissay and a team of inspirational poet educators, the project aims to ignite a love for poetry. As you wander around the site, look out for the lines of poetry from each participating class. Working with design studio SOUP, the installation captures the students’ ideas and turns them into part of the fabric of our site. The project has been delivered by Southbank Centre, in partnership with Midlands Art Centre (MAC) and Factory International. Poets involved in the project: Grace Atkinson, Griot Gabriel (Gabriel Oyediwura), Arji Manuelpillai, Astra Papachristodoulou, Lemn Sissay, Bradley Taylor and James Wilkes. It has included teacher training, in-school poetry workshops with professional poets, and concludes with this celebration at the Southbank Centre. Supported by Apple, the Southbank Centre’s 75th-anniversary schools programme features two flagship national projects: Imagine the Future and Reframe: Inspire Schools. While primary students craft visual poetry and secondary students design multimedia digital zines using Apple technology, both projects are united by a shared commitment to upskilling educators. Through dedicated training, teachers across both programmes are equipped with the digital design skills to champion their students’ voices in the classroom and beyond.", "first_date": "2026-09-07", "last_date": "2026-09-27", "url": "https://www.southbankcentre.co.uk/whats-on/gift-to-the-future/", "tags": ["exhibition"], "price_min": 0.0, "id": "e047", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "southbank-centre", "title": "TONIC FLOW: A Communal Chorus in Colour and Sound", "byline": "Imagine a future overflowing with hope through a collaborative sound and visual installation by artist Lakwena Maciver and musician Abimaro Gunnell.", "description": "What does it mean to gather, to listen, to make something new together? Eleven young, sanctuary-seeking artists from Compass Collective and the Southbank Centre Youth Voices choir, collaborated with Maciver and Gunnell to co-design the work through shared workshops. The artists, rooted in collective creativity, respond to the idea of a ‘future tonic’, offering drawings, words, patterns and melodies. These fragments come together as an installation paving Mandela Walk, Level 2 – a bold pathway transformed by colour, collective vision and communicating the artists’ message. Within it is an immersive soundscape weaving together the voices of the Southbank Centre Youth Voices choir with Gunnell’s. As you walk along, hear how their voices hold the emotional resonance of shared experiences and collectivity. We have a memory as clear as glass. Ripple, relax, renew, turning skies from grey to blue. Youth Voices is a free, inclusive all-comers choir made up of children and young people aged nine to 18 who are curious about developing their love for singing, based weekly at the Southbank Centre. TONIC FLOW is an invitation to pause and take part, to consider and experience how creativity and play can nourish us, how connection can sustain us and how together we can begin to make patterns for a brighter, more joyful future. Compass Collective is an arts charity supporting young refugees and asylum seekers through creative projects. For this project, they brought together a diverse group of young people with lived experiences of forced displacement from ten different countries, for a project that celebrates welcomeness and offers a shared sense of belonging.", "first_date": "2026-09-07", "last_date": "2026-09-20", "url": "https://www.southbankcentre.co.uk/whats-on/tonic-flow-a-communal-chorus-in-colour-and-sound/", "tags": ["immersive"], "price_min": 0.0, "id": "e048", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "southbank-centre", "title": "Floating Together", "byline": "A bold public artwork reflecting on solidarity, community and courage, by artist Malak Mattar in collaboration with young people from Ukraine and Greece.", "description": "Responding to the Refugee Week 2026 theme of ‘courage’, and the Choose Love and Creative Visions themes ‘unique and united’, the commission is a bold public artwork inviting reflection on solidarity, community and courage, designed by artist Malak Mattar in collaboration with young people from Ukraine and Greece. ‘Growing up by the sea in Gaza, summer meant long days at the beach and the excitement of new colourful swimming floats that marked our journey from childhood to adulthood. Swan and turtle-shaped floats became symbols of joy and childhood. Over time, the meaning of the sea changed. As life under blockade became difficult, many young people began crossing the sea in search of a better life. Some reached new shores, while others were lost along the way. ‘The installation reflects both memories of my childhood and the realities of displacement. Inspired by swimming floats, the work is large, playful and illuminated with vibrant light, especially at night, honouring the many refugee journeys made in darkness, while sending a message that refugees are seen, welcomed and cared for. ‘The patterns featured on the floats are created in collaboration with young people from Ukraine and Greece, alongside drawings by children from Gaza, expressing family life, flowers, dreams, love and unity.’ (Mattar describing Floating Together) This event sits at the heart of Refugee Week during our 75th anniversary year, and is presented in partnership with Counterpoints Arts and Choose Love.", "first_date": "2026-09-07", "last_date": "2026-09-21", "url": "https://www.southbankcentre.co.uk/whats-on/floating-together/", "tags": ["exhibition"], "price_min": 0.0, "id": "e049", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "almeida", "title": "Golden Boy", "byline": "Joe Bonaparte is a gifted young violinist with extraordinary talent and a future in music, until a chance at fame and fortune lures him into the brutal world of professional boxing.", "description": "Pressured by a ruthless manager, tempted by a forbidden love, and bound by the expectations of his Italian-American family, Joe is a young man torn between the seductive promise of the American Dream and the quiet honour of a decent life. He must confront what he’s willing to sacrifice, who he’s willing to become, and how to find his place in a world that demands he choose a side.\n\nOlivier Award winner Sam Yates ( VANYA ; Magpie ) directs Emmy and Golden Globe winner Josh O’Connor ( The Crown ; Challengers ) in this searing revival of Clifford Odets ’ knockout American classic. Brought to life with a live string quartet, this propulsive drama explores ambition, identity, and the high price of success.\n\nJason is an Associate Artist with Synergy Theatre Project and Playing ON Theatre Company.", "first_date": "2026-09-08", "last_date": "2026-10-31", "url": "https://almeida.co.uk/whats-on/golden-boy/", "tags": ["theatre"], "id": "e050", "venue_name": "Almeida Theatre", "venue_area": "Islington"}, {"venue_id": "barons-court", "title": "Until Proven Human", "byline": "This is an invitation to the next Civic Safety Assembly concerning recent reports ofpossible unknown non-human activity.", "description": "Over the past several months, a number of alarming incidents have been reportedacross the city. Current investigations do not yet rule out the possibility of non-human causes. As a part of the government's continual commitment to public safety, this assembly is an occasion of security updates and public hearing.\n\nDu ring the assembly, attendees will be asked to take part in a series of discussionsand collective decision-making. Your participation is vital to protecting human society.\n\nUntil Proven Human is an interactive theatre experience combining live performanceand gameplay, where the audience drive the story through decision-making andnegotiation as events unfold. Your choices may affect what happens next.", "first_date": "2026-09-08", "last_date": "2026-09-12", "url": "https://www.baronscourttheatre.com/human", "tags": ["theatre", "immersive"], "id": "e051", "venue_name": "Barons Court Theatre", "venue_area": "Barons Court"}, {"venue_id": "bridewell", "title": "Brighton Beach Memoirs", "byline": "Set in New York City in 1937, Brighton Beach Memoirs is Neil Simon’s semi-autobiographical portrait of the writer as a young teen living with his family in a crowded, lower-middle-class Jewish Brooklyn household.", "description": null, "first_date": "2026-09-08", "last_date": "2026-09-08", "url": "https://sbf.org.uk/whats-on/view/brighton-beach-memoirs/", "tags": ["theatre"], "id": "e052", "venue_name": "Bridewell Theatre", "venue_area": "Blackfriars"}, {"venue_id": "bridge-house", "title": "DISS-LEX-IANS", "byline": "Ever made the mistake of overpromising something? Like saying that you’ve written an entire musical about the history of Hip Hop, when you haven’t!", "description": "Well G has… Meet G, a fast-talking daughter of Lewisham. With the help of her friend P, can she overcome the chaos of home life… spellings, the inner demon Negs… spellings, her mother… spellings. G has Missy Elliott, her spelling answer to everything, or is she?\n\nDoragine immersed herself in the vibrant hip-hop scene of the 1980s as a street dancer, forming an all-female breakdance crew. Highlights include competing in the inaugural DMC Hip-Hop Competition at Brixton Academy. Transitioning to theatre, she performed at prestigious London venues and taught Hip-Hop dance to young adults. Doragine supported UK female rap artists and performed alongside Chaka Khan. She also served as creative director for “Spiritual Soul” at Brixton Electric.\n\nPenny lives in Crofton Park, fabulously dyslexic, she met Genie on Chelwood Nursery pick-ups, bonding over our love of the Arts, me costume, her dance. Quirky thing about me is I designed a method to understand Times Tables, despite not even getting a grade at Maths CSE level (showing my age there).", "first_date": "2026-09-08", "last_date": "2026-09-09", "url": "https://thebridgehousetheatre.co.uk/shows/diss-lex-ians/", "tags": ["theatre", "dance"], "id": "e053", "venue_name": "The Bridge House Theatre", "venue_area": "Penge"}, {"venue_id": "brixton-house", "title": "Housemates 2026: We Can’t Be Friends", "byline": "Azhar has built his life on certainty. A devout Muslim training to be a teacher, he is on the cusp of the future he has always been promised: a stable career, a wife, and a life defined by faith and duty.", "description": "Then he meets Rahim. Openly gay and estranged from his family, Rahim has already lost everything Azhar is trying to protect.\n\nCertain it is his responsibility to help, Azhar sets out to guide Rahim back to Islam. But what begins as an act of faith slowly becomes something neither of them expected. The lines between guidance and longing begin to blur, pulling them into a connection neither of them can deny between belief and desire, identity and expectation, love and consequence.", "first_date": "2026-09-08", "last_date": "2026-09-12", "url": "https://brixtonhouse.co.uk/shows/housemates-2026-we-cant-be-friends/", "tags": ["theatre"], "id": "e054", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "brixton-house", "title": "Housemates 2026: Pressure", "byline": "Driven by the basslines of lovers rock, reggae, dub, sound-system culture, dance, and ritual, the play follows Paulette…", "description": "Driven by the basslines of lovers rock, reggae, dub, sound-system culture, dance, and ritual, the play follows Paulette, a Jamaican woman in Brixton living under the shadow of the barrel child and the revolutionary legacy of Jamaica’s Blue Mountains.\n\nBy 2011, Paulette barely recognises herself. But when the police killing of Mark Duggan ignites the Tottenham Uprising, the unrest tears open a portal between past and present. Pulled through memory, hallucination, and ancestral invocation, Paulette is thrust into a living history of revolt – journeying through the 1981 Brixton Uprisings, Jamaica’s traditions of resistance, and the revolutionary spirits that refuse to stay buried.\n\nAs the streets erupt once more, Paulette’s living room becomes a battleground where personal awakening and collective struggle collide. Blending Kumina, sound-system culture, and the vibration of rebellion, Pressure traces a path from Nanny Town to Brixton, asking whether riot is the language of the oppressed, what it means to inherit a legacy of resistance, and whether every revolution begins at home.", "first_date": "2026-09-08", "last_date": "2026-09-12", "url": "https://brixtonhouse.co.uk/shows/housemates-2026-pressure/", "tags": ["theatre", "dance"], "id": "e055", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "brockley-jack", "title": "The Obituary", "byline": "Three siblings return to their old family house before it is demolished, with one hour to complete a property report. What begins as paperwork becomes a fight over memory, migration, and who gets to decide what a family is worth.", "description": "As they sort through decades of belongings, resentments, and conflicting memories, it becomes clear that they have not only inherited the same house, but entirely different ideas of home.\n\nUsing one East Asian family story to reflect wider experiences of migration and cross-cultural identity, The Obituary is a sharp and tender new play about inheritance, belonging, and what remains when the people you love no longer share the same understanding of where they come from.", "first_date": "2026-09-08", "last_date": "2026-09-09", "url": "https://brockleyjack.co.uk/jackstudio-entry/the-obituary/", "tags": ["theatre"], "id": "e056", "venue_name": "Brockley Jack Studio", "venue_area": "Crofton Park"}, {"venue_id": "bush", "title": "Darkling", "byline": "Born under a blue sky in a city of lakes, a girl grows up with her father and sister. The three of them together, always.", "description": "But as she grows, the land begins to change. A giant factory rises over her town. Her mother always wanted more for them – now the girl wants more too.\n\nFerocious, brutal and damning, this epic story of a life ravaged by ecological disaster is written by Titas Halder ( Foal , Finborough), directed by Matthew Xia ( Tambo & Bones , ATC / Stratford East) and stars Linnea Berthelsen ( Stranger Things ) .", "first_date": "2026-09-08", "last_date": "2026-10-24", "url": "https://www.bushtheatre.co.uk/event/darkling/", "tags": ["theatre"], "id": "e057", "venue_name": "Bush Theatre", "venue_area": "Shepherd's Bush"}, {"venue_id": "cafe-oto", "title": "Duo Vergara & Carrasco + special guest Steve Noble", "byline": "This duo is the result of a collaboration between the Chilean musicians Benjamín Vergara and Edén Carrasco, spanning more than 20 years.", "description": "This partnership is reflected in practices in the context of experimental music, noise, minimalism, free jazz, site specific performance. The music of this project explores the limits of the timbres of these two acoustic air instruments, trumpet & sax, building zones with melodic lines camouflaged by textures, a noisy touch of dron blues, and a submarine version of cool jazz. This 2026 the duo released a cassette álbum called -secuelas- by the italian label Tsss Tapes, that they will be playing in some cities of Europe that includes Cafe Oto, Echoraum (Viena), Sowieso (Berlin), Richten 25 (Berlin), Cap 30 (Copenhague), Hörbar (Hamburg).\n\nChilean trumpet player, improviser and educator, based in the city of Valdivia, Chile. His work focuses on improvised music, written contemporary music, free jazz and experimental music. Director of the Festival of experimental music –Relincha- occurring since 2014 in the city of Valdivia. Professor in music improvisation at School of Music and SoundArt of the Universidad Austral de Chile. He has collaborated with a huge range of musicians like Fred Frith, Felipe Araya, Ben Bennett, Keefe Jackson, Jim Baker, Edén Carrasco, Amanda Irarrázabal, ensembles and multi disciplinary projects. His music is available in labels like Inexhaustible Editions, 577 records, Relative Pitch, Tour de Bras.\n\nhttps://www.benjaminvergara.com/ https://benjaminvergara.bandcamp.com", "first_date": "2026-09-08", "last_date": "2026-09-08", "url": "https://www.cafeoto.co.uk/events/duo-vergara-carrasco/", "tags": ["concert"], "id": "e058", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "courtyard", "title": "Serious Money - Preview", "byline": null, "description": null, "first_date": "2026-09-08", "last_date": "2026-09-09", "url": "https://thecourtyardtheatre.seetickets.com/event/serious-money-preview/the-courtyard-theatre/3709459", "tags": ["theatre"], "id": "e059", "venue_name": "The Courtyard Theatre", "venue_area": "Hoxton"}, {"venue_id": "donmar", "title": "A Month in the Country", "byline": "Natalya Petrovna looks to all the world like a contented woman, but the arrival of a penniless young tutor stirs a restless heart, igniting a spark of desire that sets the Summer ablaze.", "description": "A Month in the Country pits passion against propriety, as a cast of characters struggle to reconcile the lives they lead with the happiness they crave. Lyndsey Turner directs Thomas Arnold , Jessica Brindle, Susan Brown , Rachelle Diedericks , Patrick Gibson , Mark Hadfield , Michael Hodgson , Jonathan Livingstone, Sophie Okonedo, Alistair Petrie , Daniel Rigby and Amanda Wilkin in Brian Friel ’s reworking of Turgenev ’s most famous play.\n\nWe would also like to thank our Production Supporters for A Month In The Country , Charles J Burdick and Tiina Lee CBE", "first_date": "2026-09-08", "last_date": "2026-10-03", "url": "https://www.donmarwarehouse.com/events/a-month-in-the-country#content-dates-and-times", "tags": ["theatre"], "id": "e060", "venue_name": "Donmar Warehouse", "venue_area": "Covent Garden"}, {"venue_id": "etcetera", "title": "To Stay Mum", "byline": "London, 2029. On a rainy night in South London, Lara meets Steven and Steven meets Lara.", "description": "On that same rainy night, with a general election landslide, a new government win a majority in parliament. To Stay Mum is a deeply intimate, speculative look into the current political climate", "first_date": "2026-09-08", "last_date": "2026-09-08", "url": "https://www.etceteratheatrecamden.com/events/to-stay-mum-52mwg-c64yf", "tags": ["theatre"], "id": "e061", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "golden-goose", "title": "The Revival", "byline": "Two actresses. One dead director. A puppet show that means way more than it should.", "description": "From Maciej Wojtyszko — one of Poland’s most celebrated playwrights and directors — comes this quiet masterwork, in London for only 5 performances. Two actresses restage a play, the final performance of a great director. As they unpack their history with Tadeusz, and the circumstances of his death, they must come to terms with a story of artistic brilliance, abuse, and codependency that is far more complicated than either could have imagined. Sharp, funny, and quietly devastating — a rare opportunity to see a masterwork of Polish theatre. In the original Polish (with surtitles).\n\nThis Production is using a third-party ticketing provider.", "first_date": "2026-09-08", "last_date": "2026-09-12", "url": "https://www.goldengoosetheatre.co.uk/whatson/the-revival", "tags": ["theatre", "puppetry"], "id": "e062", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hen-and-chickens", "title": "There is a Light and a Whistle for Attracting Attention", "byline": "Tickets booked online must be collected 15mins before showtime. Cash tickets are available for 30 mins at the box office. TICKETS ARE NON-REFUNDABLE*", "description": null, "first_date": "2026-09-08", "last_date": "2026-09-13", "url": "https://www.unrestrictedview.co.uk/events/there-is-a-light-and-a-whistle-for-attracting-attention", "tags": ["theatre"], "id": "e063", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "home", "title": "Lennox Mutual by Candle House Collective", "byline": "When your 20 minute session ends, book another to pick up where you left off, enjoying an increasingly personalized experience every time you return. Lennox Mutual is here to remember you.", "description": "Lennox Mutual combines theater, gaming, meditation, psychotherapy, and live music\n\ninto a sprawling imaginary world for you to explore. Every choice you make has", "first_date": "2026-09-08", "last_date": "2027-10-13", "url": "https://candlehousecollective.com/ourwork#/lennox-mutual", "tags": ["immersive", "theatre"], "id": "e064", "venue_name": "HOME", "venue_area": "At home"}, {"venue_id": "home", "title": "CLAWS by Candle House Collective", "byline": "You get a call from a young man named Danny. There’s a monster in his closet, and he needs your help.", "description": "But as the call goes on and more sinister intentions are revealed, you may start to wonder: which side of the closet door is the danger really on?\n\nCLAWS is an interactive thriller, performed live for one person via phone call. It’s a spine-chilling exploration of shared trust and the consequences of taking things for granted. Your choices matter as the story unfolds – for better or worse.\n\nAvailable worldwide. All you need is your mobile phone.", "first_date": "2026-09-08", "last_date": "2027-10-13", "url": "https://candlehousecollective.com/tickets/claws", "tags": ["immersive", "theatre"], "id": "e065", "venue_name": "HOME", "venue_area": "At home"}, {"venue_id": "hope-theatre", "title": "The Love That I've Lost", "byline": "Betty, Lillie and Michelle, a family of three women, are all fed up with love and it just not going their way.", "description": "With Betty’s husband suffering with dementia, Michelle separating from her partner and Lillie fearful of the next rejection around the corner; Michelle decides to throw a Galentine’s day to cure her own loneliness and to help her family forget about theirs too. We follow the three women on the lead up to this crucial day as they explore what love really means. A heartbreaking female led play full of emotion, warmth and of course love. The Love That I’ve Lost begs the question: What is love when you only feel its absence. A unique story focused on the forgotten loveless tales of women of all ages, and the hardships and fears that love brings us all. While deeply emotional, it’s honest and brutally human.", "first_date": "2026-09-08", "last_date": "2026-09-09", "url": "https://www.thehopetheatre.com/thelovethativelost", "tags": ["theatre"], "id": "e066", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "hoxton-hall", "title": "Hidden Jazz Club", "byline": "Experience exhilarating live jazz in the incredibly atmospheric setting of a Grade II Listed Music Hall from the 1800s!!", "description": "Discover one of London’s best kept secrets and join us at Hoxton Hidden Jazz Club for an underground performance. An electrifying, intimate and fun musical experience like no other.\n\nfor the past five years Hidden Jazz Club has been the place for Londoners in the know to discover the best of the city’s jazz scene within a unique setting.", "first_date": "2026-09-08", "last_date": "2026-11-20", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173649756", "tags": ["concert"], "id": "e067", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "hoxton-hall", "title": "Access All Areas present The Knowledge", "byline": "From the Rainbow Drama Group back in 1976 to the wild, wonderful chaos of today, we’re dishing up tales and memories, straight from the hearts and minds of learning disabled artists .", "description": "Every sketch and cheeky turn is a bit of precious knowledge we’ve been gathering for decades. And tonight? You’re in for the cabaret ride of your life at Hoxton Hall. Buckle up for a joyfully loud, unapologetic celebration of disability arts, Hackney style.", "first_date": "2026-09-08", "last_date": "2026-09-30", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173686872", "tags": ["cabaret", "theatre"], "id": "e068", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "hoxton-hall", "title": "London Burning Theatre Festival: As We All Lay Dying", "byline": "A two-day festival unfolding life and death across theatre, sound art, and performative, immersive installations supported by RCA and UAL.", "description": "echoes of old compulsions with no-hand on no-string:\n\nin sunset we fall into furious attitudes, dead gestures of dolls.”", "first_date": "2026-09-08", "last_date": "2027-09-06", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173690430", "tags": ["theatre"], "id": "e069", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "hoxton-hall", "title": "Pip Millett", "byline": "Born and raised in Greater Manchester — spending the majority of her childhood in Marple…", "description": "Born and raised in Greater Manchester — spending the majority of her childhood in Marple — Pip Millett shares that her early experiences of loss and grief played a huge part in her resonating with and being obtusely aware of her emotions from her infancy.\n\nRemaining centred and a vigorous source of strength for her meant that musicality organically found its way into Pip Millett’s ether, before she realised that she wanted to become a professional vocalist. “Hearing the warmth of other people’s voices, the pain, or the joy that they experienced made me feel at peace,” she clarifies wholesomely. “I feel like they were able to make me feel understood; it’s so powerful, music, the ability to make me feel just as they did when they recorded.”\n\nRecalling the moment that she’d got her first iPod nano midway through Primary school, Millett’s brother setting it up for her, she says that over the years her aptitude for music only grew, with Otis Redding and Bob Marley featuring heavily across her early collection of songs. “I must’ve been in year 7, when I became obsessed with Otis Redding’s ‘Try A Little Tenderness’ and Candi Sta
