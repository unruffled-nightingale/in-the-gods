p on one of our unique stages – the Sam Wanamaker Playhouse .", "description": "Using a range of activities and games designed to draw out elements of the play’s language, characters and themes, this session will bring you together with other families to dive into the world of Shakespeare’s spine-chilling tale.\n\nWorkshops will be led by one of the Globe’s highly experienced practitioners who include actors, teachers and directors.", "first_date": "2026-10-26", "last_date": "2026-10-31", "url": "https://www.shakespearesglobe.com/whats-on/macbeth-on-stage-family-workshop-9-11-years/", "tags": ["class"], "id": "e800", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "shakespeares-globe", "title": "Young Actors Short Course (11-13 years)", "byline": "Spend time working with one of our Globe Practitioners in this interactive course designed especially for aspiring actors.", "description": "Receive hands-on instruction from Globe actors to explore Shakespeare in an exciting way through lively workshops and practical activities. Designed for young performers, this course provides an active, creative learning experience to bring Shakespeare to life in a new way.\n\nEach session will involve warm-up games, tips and tricks for getting into character, and having fun with Shakespeare’s language and performance. There will be plenty of opportunities to perform and play scenes, trying out different styles and approaches. This course will involve voice, text and movement sessions with participants working collaboratively with their peers.", "first_date": "2026-10-26", "last_date": "2027-04-06", "url": "https://www.shakespearesglobe.com/whats-on/young-actors-short-course-11-13-years/", "tags": ["class"], "id": "e801", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "shakespeares-globe", "title": "Young Actors Short Course (8–10 years)", "byline": "Spend time working with one of our Globe Practitioners in this interactive course designed especially for aspiring actors.", "description": "Receive hands-on instruction from Globe actors to explore Shakespeare in an exciting way through lively workshops and practical activities. Designed for young performers, this course provides an active, creative learning experience to bring Shakespeare to life in a new way.\n\nEach session will involve warm-up games, tips and tricks for getting into character, and having fun with Shakespeare’s language and performance. There will be plenty of opportunities to perform and play scenes, trying out different styles and approaches. This course will involve voice, text and movement sessions with participants working collaboratively with their peers.", "first_date": "2026-10-26", "last_date": "2027-04-06", "url": "https://www.shakespearesglobe.com/whats-on/young-actors-short-course-8-10-years/", "tags": ["class"], "id": "e802", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "shakespeares-globe", "title": "Macbeth: Workshop (12-16 years)", "byline": "For priority access to future events, become a Friend and receive two free Groundling tickets plus a host of other benefits.", "description": "Bring Macbeth to life in this practical and interactive workshop, designed for 12-16 year olds.\n\nExplore Shakespeare through a practical approach with a range of activities and games designed to draw out elements of the play’s language, characters and themes.", "first_date": "2026-10-26", "last_date": "2026-10-30", "url": "https://www.shakespearesglobe.com/whats-on/macbeth-workshop-12-16-years/", "tags": ["class"], "id": "e803", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "shakespeares-globe", "title": "Othello: On Stage Workshop (17-19 years)", "byline": "Bring Shakespeare’s Othello to life in this practical workshop on one of our unique stages – the Sam Wanamaker Playhouse or the Globe Theatre . For ages 17–19.", "description": "Take a fresh approach to studying Shakespeare’s blistering tragedy with a practical exploration of the play. This in-depth session, led by one of the Globe’s highly experienced education practitioners, uses activities and games designed to draw out elements of the language, characters and themes of one of the most influential tragedies ever written.\n\nThis workshop is an engaging way to enhance studies of Shakespeare and theatre, or a brilliant opportunity for aspiring young actors and Shakespeare enthusiasts to tread the boards. No previous experience is required, just a desire to take part and learn more.", "first_date": "2026-10-26", "last_date": "2026-10-31", "url": "https://www.shakespearesglobe.com/whats-on/othello-onstage-workshop-17-19-years/", "tags": ["class"], "id": "e804", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "soho-theatre", "title": "Sophie Duker: Hot Beef Injection", "byline": "In her latest hour, Sophie dares to get both sexy and political, reflecting on hypermasculinity, heavy-handed handymen and that old-chestnut Would You Rather: ‘Man or Bear? ’.", "description": "Hot Beef Injection reckons with the primal fear driving Duker’s distrust of heterosexual he/ hims , and out of a challenging comedy club encounter a new question emerges : what would she say if she spoke to men, instead of shutting them out?\n\nDiscounts may be available on top prices for students, seniors, unwaged.", "first_date": "2026-10-26", "last_date": "2026-11-26", "url": "https://sohotheatre.com/events/sophie-duker-hot-beef-injection/", "tags": ["stand-up"], "id": "e805", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "the-cockpit", "title": "Dominic Ingham & Jay Verma, Guesde + more TBA", "byline": "Dominic Ingham + Jay Verma (duo) Guesde [EMERGENCE] More artists to be announced soon!", "description": "Yorkshire-born violinist and vocalist Dominic Ingham is ‘fast establishing himself as one of the UK’s leading proponents of jazz violin’ (Jazzwise), following the release of his critically acclaimed debut album Role Models. The record presents a compelling suite of lucidly crafted, characterful pieces that showcase Dominic’s distinctive and highly personal style, deeply rooted in folk and classical traditions. He has toured extensively across the UK with his quartet, performing at renowned venues and festivals including Ronnie Scott’s, Love Supreme, the Royal Albert Hall, and the EFG London Jazz Festival. Recent collaborations include Emma Rawicz, Trish Clowes, and Elliot Galvin. In 2020, Dominic was nominated for a Parliamentary Jazz Award for Jazz Newcomer and was a finalist in the prestigious Zbigniew Seifert International Jazz Violin Competition. He currently teaches jazz violin at Chetham’s School of Music and the Royal Welsh College of Music and Drama.", "first_date": "2026-10-26", "last_date": "2026-10-26", "url": "https://www.thecockpit.org.uk/show/dominic_ingham_jay_verma_guesde_more_tba", "tags": ["concert"], "id": "e806", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "bac", "title": "The Dark", "byline": "Laszlo is afraid of the dark. The dark lives in the basement. It doesn’t visit Laszlo in his room. Until one night it does . . .", "description": "Merging vibrant physicality with live music to create captivating performances, The Dark is accessible for blind and visually impaired children through integrated audio-description and touch tours.\n\nJoin Laszlo on his journey to meet the dark, and find out why it will never bother him again.", "first_date": "2026-10-27", "last_date": "2026-10-31", "url": "https://bac.org.uk/whats-on/the-dark/", "tags": ["theatre", "dance"], "id": "e807", "venue_name": "Battersea Arts Centre", "venue_area": "Battersea"}, {"venue_id": "brixton-house", "title": "October Half Term Activities", "byline": "Drop in anytime between 12pm–4pm on Tuesday 27 October and Wednesday 28 October for free family drop-in activities celebrating the season with our Harvest Roots Scavenger experience.", "description": "Families are invited to explore the idea of roots in nature and community through hands-on seasonal crafts using leaves, conkers, acorns and pine cones. Together, children and grown-ups can contribute to our growing autumn walls, building a shared space shaped by creativity, connection, and the changing season, while sensory play brings the outdoors inside.\n\nTake part in the Harvest Roots Scavenger Hunt , an indoor trail where families search for natural treasures hidden throughout the space. Each discovery becomes part of storytelling adventures inspired by the season and the world around us.", "first_date": "2026-10-27", "last_date": "2026-10-28", "url": "https://brixtonhouse.co.uk/shows/october-half-term-activities/", "tags": ["class"], "id": "e808", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "camden-peoples-theatre", "title": "Chicken Girl (WIP)", "byline": "This is a show about chickens. It’s also about childhood obsessions, memory, guilt, human overconsumption and climate responsibility (...but mostly chickens).", "description": "As a teenager, Miranda was obsessed with her two chickens, Amber and Mercedes. As an adult, she’s still thinking about chickens - all 29 billion of them.\n\nIn this new solo show, award-winning artist Miranda Prag unearths the skeletons in her closet and tackles some of the biggest questions facing humanity today - all through the lens of chickens.", "first_date": "2026-10-27", "last_date": "2026-10-27", "url": "https://cptheatre.co.uk/whatson/Chicken-Girl-WIP", "tags": ["theatre"], "id": "e809", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "camden-peoples-theatre", "title": "Bubbly (WIP)", "byline": "Bubbly is a darkly funny pop musical about three sisters and their internal battles with self-image and identity.", "description": "When they return to their family home for a fateful dinner, memories and trauma are resurfaced, and they must confront the insecurities that ultimately tie them together. This four-woman musical blends sharp humour with dynamic pop music and self-mythologising lyrics. A raw exposure of the clash between the body shaming of the nineties and the body positivity of today, it explores with radical honesty what it means to be both confident and shamed, careful and chaotic, angry and apathetic: to be multiple women all at once.", "first_date": "2026-10-27", "last_date": "2026-10-27", "url": "https://cptheatre.co.uk/whatson/Bubbly-WIP", "tags": ["musical"], "id": "e810", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "drayton-arms", "title": "The Man Who Thought He Was A Baboon", "byline": "Teenage Hugo had no idea that howling at the moon like a wolf would turn him into the black sheep. The brutal punishment that followed from his family became a shame he vowed to keep to himself.", "description": "Adult Hugo, far removed from his dark childhood, now lives a quiet life with his wife, Summer… til one event changes everything: the eye-watering inheritance left to him by his beloved aunt.\n\nSummer and the newly-hired village doctor start to carefully convince Hugo that he's a baboon.", "first_date": "2026-10-27", "last_date": "2026-10-31", "url": "https://thedraytonarmstheatre.co.uk/baboon-2", "tags": ["theatre"], "id": "e811", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "etcetera", "title": "LIVE & SPOOKY: A HALLOWEEN SCRATCH NIGHT", "byline": "Five writers. Five stories. One very haunted evening. Step into the darkness this Halloween for Live & Spooky, Flame Tree Publishing’s first ever Scratch Night.", "description": "Expect five brand-new ten-minute tales of horror, the supernatural, folk terror and gothic unease, brought to life on stage at The Etcetera Theatre. From things that lurk in the shadows to things that should never have been summoned, these short stories are designed to unsettle, surprise and send a shiver down your spine. Fresh from the page and onto the stage, this is new writing at its most frightening. Come for the stories. Stay for the scares.\n\n@flametreepress (all socials) / @flametreebooktok (TikTok) Age: +18", "first_date": "2026-10-27", "last_date": "2026-10-27", "url": "https://www.etceteratheatrecamden.com/events/live-spooky", "tags": ["theatre"], "id": "e812", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "finborough", "title": "The Moth", "byline": "A chance meeting on a train between John, a Black British journalist, and Marius, a White South African ex-soldier, sets in motion an escalating chain of events that reshapes their lives over the next thirty years…", "description": "A chance meeting on a train between John, a Black British journalist, and Marius, a White South African ex-soldier, sets in motion an escalating chain of events that reshapes their lives over the next thirty years – as John withholds forgiveness and Marius becomes increasingly obsessed with seeking it.\n\nFinally, before the nation's television cameras, they face each other to confront the past and lay bare their conflicting truths. Inspired by a true story, The Moth is a gripping new play that speaks directly to our times – a psychological thriller of memory, race, war, trauma, the legacy of Apartheid and the limits of forgiveness…\n\nOriginally developed from a ten-minute video monologue which has since had over 30,000 views, it was selected for 26 festivals across the world, winning the Kwanzaa Film Festival Best Monologue Award in New York City. The stage version took the North by storm on tour in 2025, playing to packed houses at venues including Live Theatre Newcastle, the Lowry Salford and Shakespeare North in Liverpool, it received rave reviews, and won actor Micky Cochrane the award for Best Performance at the North-East Culture Theatre Awards for his portrayal of Marius.", "first_date": "2026-10-27", "last_date": "2026-11-21", "url": "https://www.finboroughtheatre.co.uk/productions/the-moth", "tags": ["theatre"], "id": "e813", "venue_name": "Finborough Theatre", "venue_area": "Earl's Court"}, {"venue_id": "golden-goose", "title": "Emerging Forms", "byline": "spare the rod have curated a fantastic evening of entertainment from some of London's finiest up-and-coming creatives.", "description": "Playwrights, performers and musicians will be showcasing some of their latest work - some of which has never before been seen by an audience. From sketch comedy to rap to experimental performance and more, there's something for everyone here.\n\nStick around afterwards to meet fellow creatives, or simply for a drink and a chat with likeminded people.\n\nIf you're stuck for something to do this weekend, we guarantee this is the night for you.", "first_date": "2026-10-27", "last_date": "2026-10-27", "url": "https://www.goldengoosetheatre.co.uk/whatson/emerging-forms", "tags": ["theatre", "comedy"], "id": "e814", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hackney-empire", "title": "Dexys Midnight Runners", "byline": "Join Dexys Midnight Runners live in Hackney for their U. K. tour starting this October! The dates will be the first time Dexys, fronted by Kevin Rowland, ha", "description": null, "first_date": "2026-10-27", "last_date": "2026-10-28", "url": "https://www.hackneyempire.co.uk/events/dexys-midnight-runners", "tags": ["concert"], "id": "e815", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "hope-theatre", "title": "The Devil's Punchbowl", "byline": "Olivia has more than a few reasons to disbelieve 'tales of the supernatural'. If she hears a story of a ghostly haunting, she will dig deeper until she finds a rational explanation.", "description": "So when she is given a tip-off to investigate the historic murder of Amelia Harbinger, by the Devil's Punchbowl in Norfolk, she thinks the truth will be easy to uncover. Are the grisly circumstances of Amelia's death the result of a freak animal attack? There's no way it could be the legendary demon dog Black Shuck... could it? As Olivia peels back the layers on the case, she finds herself getting drawn in deeper than she should. When she tracks down and interviews Amelia's orphaned sons, she discovers that their family house was filled with secrets. Old ghosts are resurfacing, and before Olivia knows it, she finds that she cannot escape from this story. The creature that killed Amelia is still out there... and ready to strike again. True crime meets gothic horror in this chilling story perfect for a dark Halloween night.", "first_date": "2026-10-27", "last_date": "2026-10-31", "url": "https://www.thehopetheatre.com/thedevilspunchbowl", "tags": ["theatre"], "id": "e816", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "ica", "title": "In the Round: Duet Emmo", "byline": "Not many bands leave it 45 years after forming to make their live debut, but Duet Emmo aren't your usual band!", "description": "The sole collaboration between The Normal’s Daniel Miller, and Wire’s Edvard Graham Lewis and B. C. Gilbert – Duet Emmo will perform their world premiere performance together, nearly 45 years after they first assembled in Blackwing Studio in London to record Or So It Seems .", "first_date": "2026-10-27", "last_date": "2026-10-27", "url": "https://www.ica.art/live/duet-emmo", "tags": ["concert"], "id": "e817", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "lyric-hammersmith", "title": "FRANKY", "byline": "This Halloween, join Prof Frankenstein and her lovable creation for a monstrously fun family adventure!", "description": "Prof Frankenstein is feeling lonely. With no friends and the local villagers afraid of her, she dreams of creating a little companion who will bring joy into her life. So, on a dark and stormy night, with a flash of lightning and the help of her trusty robot Igor, she creates… FRANKY!\n\nAlthough Franky is not quite what the Prof imagined, he sets off on a hilarious quest to win the hearts of the grumpy villagers with the help of his new friend Fairground Annie and a dazzling light display from Igor the Robot.", "first_date": "2026-10-27", "last_date": "2026-10-31", "url": "https://lyric.co.uk/shows/franky/", "tags": ["theatre"], "id": "e818", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "shakespeares-globe", "title": "Twelfth Night: Family Workshop (5-8 years)", "byline": "Bring Shakespeare’s whirlwind comedy of love and confusion Twelfth Night to life in this fun and practical Family Workshop . Aimed at children aged 5–8 and their grown-ups.", "description": "Using a range of activities and games designed to draw out elements of the play’s language, characters and themes, the session will visit one of our rehearsal rooms, and bring you together with other families to discover this enchanting and chaotic tale.\n\nWorkshops will be led by one of the Globe’s highly experienced practitioners, who include actors, teachers and directors.", "first_date": "2026-10-27", "last_date": "2026-10-31", "url": "https://www.shakespearesglobe.com/whats-on/twelfth-night-family-workshop-5-8-years/", "tags": ["class"], "id": "e819", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "shakespeares-globe", "title": "Twelfth Night: Family Workshop (9-11 Years)", "byline": "Explore disguise, mischief and love in Shakespeare’s Twelfth Night during this fun and practical Family Workshop , designed for children aged 9–11 and their grown-ups.", "description": "You’ll visit one of our rehearsal rooms to take part in an interactive workshop for the whole family. Using a range of activities and games designed to draw out elements of the play’s language, characters and themes, you’ll discover Shakespeare’s own rom-com.\n\nWorkshops will be led by one of the Globe’s highly experienced practitioners, who include actors, teachers and directors.", "first_date": "2026-10-27", "last_date": "2026-10-31", "url": "https://www.shakespearesglobe.com/whats-on/twelfth-night-family-workshop-9-11-years/", "tags": ["class"], "id": "e820", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "the-albany", "title": "The Librarians", "byline": "The performance on Tuesday, 27 October 2026 at 11:00am will include British Sign Language.", "description": "A magical story for family audiences in BSL and spoken English together. And you can join in too! At the end of the show, celebrate everyone’s stories by becoming a new author for the library, with a chance to perform your ideas on stage. Discover how many ways tales can be told and how exciting books can be.\n\nChoose how much to pay for your ticket, based on how much you think the event is worth. There will also be a chance to make a further donation on the day and after the event.", "first_date": "2026-10-27", "last_date": "2026-10-27", "url": "https://www.thealbany.org.uk/events/the-librarians", "tags": ["theatre"], "id": "e821", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "the-place", "title": "Eshu at the Crossroads", "byline": "Afro-Cuban choreographer Miguel Altunaga joins forces with pioneering puppetry company Theatre-Rites for a vibrant family adventure inspired by Yorubic culture, myth and storytelling.", "description": "A traveller in search of a road to take, a magical rooster guarding the crossroads and Eshu the trickster spinning chaos and joy at every turn. Blending dance, live performance and puppetry, Eshu at the Crossroads invites audiences into a magical world where every choice can change your path.\n\nMiguel Altunaga is an Afro-Cuban choreographer who started his career as a dancer at Danza Contemporanea de Cuba, Rambert, Hofesh Schechter Company, Akram Khan Company , and Lost Dog . Since then, Miguel has shifted his career and is an emerging choreographer whose work is inspired by his Yorubic culture. www.miguelaltunaga.com", "first_date": "2026-10-27", "last_date": "2026-10-27", "url": "https://theplace.org.uk/events/autumn-winter-26-eshu-at-the-crossroads", "tags": ["dance", "puppetry"], "id": "e822", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "theatre503", "title": "Location, Location, Location: Using Place to Shape Your Story with Brad Birch: Online Masterclass", "byline": "How we use space is integral to creating atmosphere, tension and feeling.", "description": "In this one off masterclass, award winning playwright and screenwriter Brad Birch will help you explore and interrogate the choices around where your play is set, and utilise location to get the most from your script. Referencing modern, classic and overlooked gems, we will learn how to use space, and how that space can influence characters and narrative.\n\nThanks to our Share The Drama scheme , we want to make sure those of you who are struggling in the current climate can still take part in our Writers Programme. If you would like to book a Share The Drama bursary for the Writer’s Programme, please call our box office on 02079787040 to enquire about payment and availability.\n\nFor further details of the 503Studio’s Accessibility, please visit the Access page of our website.", "first_date": "2026-10-27", "last_date": "2026-10-27", "url": "https://theatre503.com/whats-on/location-location-location-using-place-to-shape-your-story-with-brad-birch-online-masterclass/", "tags": ["class"], "id": "e823", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "bush", "title": "The Bridge", "byline": "Palestinian actor and comedian Alaa Shehada returns following his heartfelt and hilarious Scotsman Fringe First winning debut, The Horse of Jenin .", "description": "Every year, Alaa’s mother sends a gift of separation from her home in Jenin to her sister in Amman. A container of olive oil made from his grandfather’s olive trees. And this year, as every year, Alaa is delivering it himself.\n\nCarrying a large yellow container, he leaves his home alongside thousands of other Palestinians. To make this journey he must cross ‘the bridge’ in the heart of Jordan Valley – the only way Palestinians in the West Bank are permitted to leave or return home. But the container leaks, dripping oil throughout its journey through border crossings, Israeli occupation, and into Jordan.", "first_date": "2026-10-28", "last_date": "2026-11-11", "url": "https://www.bushtheatre.co.uk/event/the-bridge/", "tags": ["theatre", "comedy"], "id": "e824", "venue_name": "Bush Theatre", "venue_area": "Shepherd's Bush"}, {"venue_id": "camden-peoples-theatre", "title": "RAT RAT RAT", "byline": "Welcome to the Class! We’re so glad you could join us today.", "description": "Please take a seat, nice and quietly, eyes forward, and keep your paws where we can see them. The lesson will begin very soon. When it’s time to obey, don’t hesitate. You’ll get used to it quickly.\n\nIt’s a lovely system, really, you might even find it comforting, the way each step follows the last without question.", "first_date": "2026-10-28", "last_date": "2026-10-31", "url": "https://cptheatre.co.uk/whatson/RAT-RAT-RAT", "tags": ["theatre"], "id": "e825", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "coronet", "title": "D_Antidote: Non-Ordinary Services", "byline": "Non-Ordinary Services, from internationally acclaimed Taiwanese company D_Antidote Production and choreographer Chuang Po-Hsiang explores the strange and often invisible systems that shape human relationships…", "description": "Non-Ordinary Services, from internationally acclaimed Taiwanese company D_Antidote Production and choreographer Chuang Po-Hsiang explores the strange and often invisible systems that shape human relationships, blending abstract choreography with a striking sci-fi visual aesthetic.\n\nThe concept of service can be understood as an act – paid or unpaid – through which one fulfils responsibilities and supports others, existing only in the moment of its enactment.\n\nIn Non-Ordinary Services , the body becomes a living archive. Moving through shifting states of service, submission, intimacy and control, the dancers’ bodies are constantly intertwined, carried, manipulated and supported, creating images that feel simultaneously tender and unsettling.", "first_date": "2026-10-28", "last_date": "2026-10-31", "url": "https://www.thecoronettheatre.com/whats-on/d-antidote-non-ordinary-services/", "tags": ["dance"], "id": "e826", "venue_name": "The Coronet Theatre", "venue_area": "Notting Hill"}, {"venue_id": "pleasance-islington", "title": "THE ROGERING", "byline": "Fear is coming… Join globally-renowned paranormal investigators-cum-demonologists Ned and Elaine Burrows as they deliver this special lecture on their life’s work - in the flesh and for the first time outside of the States.", "description": "This is a unique retrospective of their most (in)famous cases - including haunted houses, possessed dolls, and other things that go bump in the night.\n\nBut does any even greater evil lurk in the shadows..?", "first_date": "2026-10-28", "last_date": "2026-10-29", "url": "https://www.pleasance.co.uk/event/rogering", "tags": ["theatre", "comedy"], "id": "e827", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "shakespeares-globe", "title": "Romeo and Juliet: On Stage Workshop (14-16 years)", "byline": "For priority access to future events, become a Friend and receive two free Groundling tickets plus a host of other benefits.", "description": "Bring Romeo and Juliet to life in this fun and practical workshop on one of our unique stages. For ages 14-16.\n\nTake a fresh approach to studying Shakespeare’s tragedy with a practical exploration of the play. This in-depth session, led by one of the Globe’s highly experienced education practitioners, uses activities and games designed to draw out elements of the language, characters and themes of the play.", "first_date": "2026-10-28", "last_date": "2026-10-30", "url": "https://www.shakespearesglobe.com/whats-on/romeo-juliet-onstage-workshop-14-16-years/", "tags": ["class"], "id": "e828", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "southbank-centre", "title": "Michael Douglas: One Helluva Ride", "byline": "Michael Douglas finally gives the full and uncensored account of a remarkable life that has spanned an extraordinary eight decades.", "description": "A boy lost in the shadow of his father’s legacy. A gifted artist dismissed as just a ‘TV actor’. A first-time film producer who stunned the world by winning an Oscar at 31. A maverick who changed Hollywood and became a global movie star. Michael Douglas shares incredible behind-the-scenes stories featuring a who’s who of Hollywood, many of them never revealed before and some outrageously funny, with an unflinching honesty about his sometimes bad-boy life. Here, for the first time live on stage with a special guest host, he recounts the unfiltered story of his turbulent first marriage; infidelity and affairs with some of the most beautiful actresses in Hollywood; his own serious struggle with alcohol, drugs and rehab; the heartbreaking fight to save his son from an addiction that sent him to prison for years; and his against-all-odds battle with stage four cancer. Father, son, husband, actor, producer, brother and friend. This is the real, raw, deeply honest and vulnerable Michael Douglas you didn’t know – until now.", "first_date": "2026-10-28", "last_date": "2026-10-28", "url": "https://www.southbankcentre.co.uk/whats-on/michael-douglas-one-helluva-ride/", "tags": ["talk"], "price_min": 25.0, "price_max": 60.0, "id": "e829", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "southbank-centre", "title": "Creative Encounters: Manifesto Library", "byline": "Join artist Zoe Thompson for an evening of making inspired by Livraria Lello’s Manifesto Library: a permanent library of books challenging power and censorship.", "description": "As part of Dua Lipa’s London Literature Festival, you’re invited to an evening of exploration and discovery as we create new book dust jackets that illuminate and celebrate the Manifesto Library’s collection. Working with London-based artist Zoe Thompson, craft new covers drawing on the tradition of radical DIY zine culture and Thompson’s distinctive collage practice, investigating what it means to make the suppressed and hidden visible. In June 2026, the Manifesto Library opened in Livraria Lello, an iconic bookshop in Porto, Portugal. This new, permanent library is a collaboration between Livraria Lello and Service95 Book Club (founded by Dua Lipa) and is dedicated to books that challenge power, censorship, exclusion and dominant narratives, creating a living cultural space for reading, debate and public reflection. The Manifesto Library is not an archive of censorship, but a contemporary statement about the role of books in society. Dua Lipa says, ‘here you will find 100 books that ask questions, or have been questioned. Some have been banned by school districts for themes of race or sexuality. Others, written for LGBTQIA+ readers, have been restricted from display. In some cases, the author has paid for their words with their life. This library is a shrine to books that have disappeared, to authors whose courage unmasks structures of power and control, and to readers who refuse to be told what book they are allowed to read.’ So join us for this extra special Creative Encounters, your creative space in the heart of the city, bringing together Londoners old and new for art, making and conversation. Founded by Dua Lipa, the Service95 Book Club is a space to enjoy all things literary, including Dua’s hand-picked Monthly Reads and her exclusive author interviews, plus new book trends, recommendations from the Service95 team and more ways for you to read the world differently.", "first_date": "2026-10-28", "last_date": "2026-10-28", "url": "https://www.southbankcentre.co.uk/whats-on/creative-encounters-manifesto-library/", "tags": ["class"], "price_min": 0.0, "id": "e830", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "underbelly-boulevard", "title": "Drag Queens vs Aliens", "byline": "Set phasers to stunning in this third and brand new installment of the award-winning drag-comedy-horror series Drag Queens vs Aliens !", "description": "Kate Butch ( RuPaul’s Drag Race UK ) and Crudi Dench are gambling on breaking America with a glamorous Vegas residency. But a very close encounter leads to chaos of galactic proportions. Area fifty-one? More like Area fifty-hun. Featuring stellar musical numbers, probing audience interaction and stupid sci-fi nonsense.\n\nWritten by West End writers Eleanor Mason and Matthew Stallworthy (as heard on BBC Radio 4 Extra. )", "first_date": "2026-10-28", "last_date": "2026-10-30", "url": "https://underbellyboulevard.com/tickets/drag-queens-vs-aliens-2026/", "tags": ["musical", "comedy"], "id": "e831", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "alexandra-palace", "title": "Gary Delaney – Gary On Laughing", "byline": "Gary Delaney’s last UK tour ran for two and a half years across 378 dates. People laughed a lot and kept coming back.", "description": "His videos have hundreds of millions of views. So now he’s doing it all again, bringing his brand-new show to Alexandra Palace Theatre.\n\nAll new jokes and utterly splendid filth. Come along. It’ll be fun. Don’t bring the kids or people who like to get their knickers in a twist. Do wear a TENA pad or dark trousers.\n\nPre-order your interval drinks online when booking your tickets, or at the bar before the show begins. Fancy something more? Drop by the East Court Café for sweet treats, snacks, and daily hot specials.", "first_date": "2026-10-29", "last_date": "2026-10-29", "url": "https://www.alexandrapalace.com/whats-on/gary-on-laughing/", "tags": ["stand-up"], "id": "e832", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "bac", "title": "La Dame de Pique", "byline": "Witty, gritty opera La Dame de Pique (The Queen of Spades) by Fromental Halévy premiered in 1850 but has never been staged since.", "description": "Featuring a cast of exciting emerging singers and a chamber orchestra, this operatic game of power will transport you to the dying days of the Ancien Régime in France.\n\nLoosely based on the Pushkin story of the same name, Halévy’s La Dame de Pique pre-dates Tchaikovsky’s better-known opera adaptation by forty years.", "first_date": "2026-10-29", "last_date": "2026-11-01", "url": "https://bac.org.uk/whats-on/la-dame-de-pique/", "tags": ["opera"], "id": "e833", "venue_name": "Battersea Arts Centre", "venue_area": "Battersea"}, {"venue_id": "coronet", "title": "D_Antidote: Palingenesis", "byline": "A haunting work exploring the fragile boundary between individuality and the collective from Taiwanese choreographer Chuang Po-Hsiang with his internationally acclaimed company D_Antidote Production .", "description": "Palingenesis is inspired by the “Rat King” phenomenon in which rats become fatally entangled by their tails. Lithe, masked bodies twist, bind and transform into uncanny biological forms, inhabiting a dreamlike audiovisual landscape. Are they individuals, a single organism or both? Informed by a biological concept of regeneration, this timeless, absorbing dance is an extreme expression of intimacy, trust and transformation.\n\nPalingenesis examines humanity’s growing dependence on external validation and the gradual erosion of the self in the digital age.", "first_date": "2026-10-29", "last_date": "2026-10-31", "url": "https://www.thecoronettheatre.com/whats-on/d-antidote-palingenesis/", "tags": ["dance"], "id": "e834", "venue_name": "The Coronet Theatre", "venue_area": "Notting Hill"}, {"venue_id": "hackney-empire", "title": "Maisie Adam: Whatsherface", "byline": "Join the “tall, chaotic one with the weird hair”* as she returns with her trademark wit, firecracker gags, and probably a few angry outbursts along the way.", "description": "*A genuine description given by her best friend’s Mum at a wedding this year.\n\nPresented by Mick Perrin Worldwide in association with PBJ Management.", "first_date": "2026-10-29", "last_date": "2026-10-29", "url": "https://www.hackneyempire.co.uk/events/maisie-adam-whatsherface", "tags": ["stand-up"], "id": "e835", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "ica", "title": "In the Round: WACK x lovemusic", "byline": "Acclaimed Strasbourg-based music collective lovemusic join with experimental composer-performers Jennifer Walshe and Neil Luck (aka WACK) for two UK premieres. Co-presented with Nonclassical.", "description": null, "first_date": "2026-10-29", "last_date": "2026-10-29", "url": "https://www.ica.art/live/wack-collective-lovemusic", "tags": ["concert"], "id": "e836", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "playground-theatre", "title": "The Playground Theatre’s Stand-Up Comedy Night", "byline": "Get ready for a night of big laughs and bold voices at The Playground Theatre’s Stand-Up Comedy Night.", "description": "Set in the heart of White City, our monthly Thursday of laughs continues after it's conception with a sell-out show that rounded off this year’s Women’s Voices Festival.\n\nThis lively evening brings together a mix of rising stars and seasoned comedians, each delivering their own unique take on life, love, and everything in between. Expect sharp wit, unexpected punchlines, and an electric atmosphere in an intimate theatre setting that puts you right at the heart of the action.\n\nWhether you're a die-hard comedy fan or simply looking for a fun night out, this is the perfect place to unwind, connect, and enjoy top-tier live entertainment. Have a drink, bring a friend, and we’ll all have a laugh. Acts to be announced - giggles guaranteed.", "first_date": "2026-10-29", "last_date": "2026-10-29", "url": "https://www.theplaygroundtheatre.org.uk/projects/tptcomedynight", "tags": ["stand-up"], "id": "e837", "venue_name": "The Playground Theatre", "venue_area": "North Kensington"}, {"venue_id": "pleasance-islington", "title": "Champagne", "byline": "Vampire Count Stabbenspine visits his childhood friend, Duchess Marguerite, but brings a terrible curse. Can the duchess’ son Edvin save his mother and her disgraced-sledger-manservant Igor from the terror in the night?", "description": "Champagne is a big, bold, and campy gothic-horror comedy play returning to London after a sell-out run at the Old Red Lion Theatre last October.\n\nThis Halloween season, join a cast of larger-than-life characters reimagined from vintage gothic horror classics like Dracula and Frankenstein with a comic burlesque twist.", "first_date": "2026-10-29", "last_date": "2026-10-29", "url": "https://www.pleasance.co.uk/event/champagne", "tags": ["theatre", "comedy"], "id": "e838", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "shakespeares-globe", "title": "Youths That Thunder", "byline": "Discover two scholars who are shaping the next generation of early modern race studies.", "description": "new research for anyone curious about Shakespeare, race, and performance.\n\nThis event is part of the Shakespeare and Race Festival 2026 .", "first_date": "2026-10-29", "last_date": "2026-10-29", "url": "https://www.shakespearesglobe.com/whats-on/youths-that-thunder/", "tags": ["talk"], "id": "e839", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "southbank-centre", "title": "Search for a Story", "byline": "See our giant storytelling bed, help the Story-collector with their mission and celebrate the magic of stories with these drop-in activities.", "description": "Stories are everywhere, just waiting to be told. Scattered around a giant storytelling bed, are fragments of stories. Can you piece them together to discover well-loved tales, or unleash your imagination to invent new adventures of your own? Listen out for the Story-collector, popping up throughout the day looking for all the stories they can find. The search is on! With your help, the Story-collector will find everything they need to tell their tales. This is a drop-in activity celebrating the magic of stories and storytelling. On the storytelling bed, take a look at our newly commissioned quilt made by the hands of many families in community quilting sessions this Spring. Inspired by the Southbank Centre’s 75th Anniversary this collective artwork was designed by textile artist Natasha Shah. Created by Robin Belfield. Commissioned by the Southbank Centre.", "first_date": "2026-10-29", "last_date": "2026-11-01", "url": "https://www.southbankcentre.co.uk/whats-on/search-for-a-story/", "tags": ["social"], "price_min": 0.0, "id": "e840", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "the-albany", "title": "Deptford Scratch: Global Majority Spotlight", "byline": "Don’t miss the fresh voices and unstoppable energy taking over the Lounge!", "description": "Choose how much to pay for your ticket, based on how much you think the event is worth. There will also be a chance to make a further donation on the day and after the event.\n\nThis poetic SWANA piece follows Nazgûl, a Hyena in harsh sands who refuses to drink from the fruit of the desert’s nectar. Who faces off the questioning and overbearing curiosity of the voiced sands and the presented temptations of water-full plants that mean to quench the ‘thirst’ of heated travellers.", "first_date": "2026-10-29", "last_date": "2026-10-29", "url": "https://www.thealbany.org.uk/events/deptford-scratch-2026", "tags": ["theatre"], "id": "e841", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "the-place", "title": "Hang Time", "byline": "A choreographic meditation on hanging out. Hanging in the air. Hanging in there.", "description": "Hanging by rope. Hanging braids off the nape of the neck. Hanging on to life. Hanging by a thread. Hanging bodies. Duration. Divination. Invocation. Congregation. Haunting.\n\nBuilding upon Marikiscrycrycry ’s decade-long practice of motorising otherwise fatalistic and marginal perspectives, Hang Time engages an emergent mode of creation that is at once genre-defying and spiritually itinerant.\n\nSuspended between bouyon and soca, séance, ritual, social gathering, and catastrophe, the work transforms hanging into a social, historical, choreographic, and metaphysical condition. Through states of endurance, collapse, congregation, and reverberation, Hang Time listens to the gulf in order to sense what remains suspended in the air after disappearance.", "first_date": "2026-10-29", "last_date": "2026-10-31", "url": "https://theplace.org.uk/events/autumn-winter-26-hang-time", "tags": ["dance"], "id": "e842", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "alexandra-palace", "title": "London Bollywood Orchestra – Sounds Of Mumbai", "byline": "This Diwali, experience the spectacular sound of Bollywood live at Alexandra Palace Theatre as the London Bollywood Orchestra returns with its dazzling new concert, Sounds of Mumbai .", "description": "Led by acclaimed Music Director Tim Pottier, whose credits include the BBC Prom celebrating Lata Mangeshkar, the City of Birmingham Symphony Orchestra’s Best of Bollywood, and Sonu Nigam’s Rafi Resurrected, the orchestra features some of London’s finest musicians from the West End, leading orchestras and the jazz world.\n\nPre-order your interval drinks online when booking your tickets, or at the bar before the show begins. Fancy something more? Drop by the East Court Café for sweet treats, snacks, and daily hot specials.", "first_date": "2026-10-30", "last_date": "2026-10-30", "url": "https://www.alexandrapalace.com/whats-on/london-bollywood-orchestra-sounds-of-mumbai/", "tags": ["concert"], "id": "e843", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "eno", "title": "Tosca", "byline": "Experience the thrill of Giacomo Puccini's Tosca. Book your opera tickets now for a night of captivating music at the London Coliseum in 2026.", "description": null, "first_date": "2026-10-30", "last_date": "2026-12-11", "url": "https://www.eno.org/events/tosca/", "tags": ["opera"], "id": "e844", "venue_name": "English National Opera", "venue_area": "St Martin's Lane"}, {"venue_id": "etcetera", "title": "Fruit Salad", "byline": "FRUIT SALAD What happens when you try to measure a life that refuses to fit the numbers?", "description": "Fruit Salad is a darkly comic psychological horror solo performance following a young woman whose childhood obsession with food, numbers and rules slowly becomes something far more sinister.\n\nFrom fruit and calorie counts to beauty, punishment and the impossible mathematics of being “good enough”, she has learned that everything can be measured, and that every number has a consequence.", "first_date": "2026-10-30", "last_date": "2026-10-31", "url": "https://www.etceteratheatrecamden.com/events/fruit-salad", "tags": ["theatre"], "id": "e845", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "golden-goose", "title": "SKELETON SAM'S SPOOKY THEATRE NIGHTS!", "byline": "This Production is using a third-party ticketing provider.", "description": "The event is on from Friday the 30th to Saturday 31st October from 7pm to 9:30pm (With a 15-20 min interval with live piano playing)", "first_date": "2026-10-30", "last_date": "2026-10-31", "url": "https://www.goldengoosetheatre.co.uk/whatson/skeleton-sams-spooky-theatre-nights", "tags": ["theatre"], "id": "e846", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hampstead", "title": "DOGSTAR", "byline": "The crew of the Dogstar are dropping like flies. Whalers with no whales left to catch, they have been icebound for months and a whiff of mutiny is in the air as they look to cast blame.", "description": "But something strange is happening. Are the crew’s heavenly visions a symptom of scurvy, a result of the endless polar night – or a chance at salvation?\n\nDaisy Hall returns to Hampstead Downstairs, following sell-out hit Bellringers in 2024. Dogstar is a darkly comic story about the forces that shape our lives, even at the edge of the world.\n\nLucy Morrison returns to Hampstead following 2025 sell-out hit Personal Values , Akedah and The Animal Kingdom . Her other credits include Hope Has a Happy Meal , That Is Not Who I Am and Scenes with girls (all Royal Court).", "first_date": "2026-10-30", "last_date": "2026-12-05", "url": "https://www.hampsteadtheatre.com/whats-on/2026/dogstar/", "tags": ["theatre"], "id": "e847", "venue_name": "Hampstead Theatre", "venue_area": "Swiss Cottage"}, {"venue_id": "ica", "title": "In the Round: Discovery Zone", "byline": "Discovery Zone is the experimental pop project of New York musician and multimedia artist JJ Weihl. On stage, Discovery Zone explores a widescreen pop sound speckled with luminous vocal performances and baroque instrumental flourishes.", "description": null, "first_date": "2026-10-30", "last_date": "2026-10-30", "url": "https://www.ica.art/live/discovery-zone", "tags": ["concert"], "id": "e848", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "london-coliseum", "title": "Tosca", "byline": "Book to see Olivier Award-winning director Annilese Miskimmon’s gripping new contemporary opera production of Puccini's Tosca.", "description": null, "first_date": "2026-10-30", "last_date": "2026-12-11", "url": "https://londoncoliseum.org/events/tosca/", "tags": ["opera"], "id": "e849", "venue_name": "London Coliseum", "venue_area": "St Martin's Lane"}, {"venue_id": "lyric-hammersmith", "title": "For the Culture: Theatre503 Masterclass - Winsome Pinnock", "byline": "Time Travel: The relationship between space and time.", "description": "This session will explore how space and time can be utilised in your play and the importance of developing how these two significant aspects of playwriting craft work in conjunction with each other.\n\nWinsome Pinnock is an award-winning playwright. Her work in theatre includes The Authenticator (National Theatre) an adaptation of Pig Heart Boy on a UK tour (London Theatre Award for Best Play for Young People); Can You Keep a Secret at the National Theatre; Rockets and Blue Lights at Manchester Royal Exchange and the National Theatre; One Under on tour and at the Kiln; Leave Taking at Liverpool Playhouse, the National Theatre, Coventry Belgrade, the Lyric Hammersmith and the Bush; The Principles of Cartography at the Bush; Glutathione at the Young Vic; Tituba at Hampstead; Cleaning Up for Clean Break; Taken at Soho Theatre; IDP and Water at the Kiln; The Stowaway at Theatre Royal Plymouth; Mules (also Young Vic and in the US), Talking in Tongues , A Hero’s Welcome and A Rock in Wate r at the Royal Court; The Wind of Change for Half Moon Theatre; and Picture Palace for Sphinx Theatre. TV includes Bitter Harvest , Chalkface and South of the Border . Radio includes Faith, Hope and Glory , Rockets and Blue Lights (On Comm Award for Best Audio Production), Leave Taking , Singin’ and Swingin’ and Gettin ’ Merry Like Christmas , LetThem Call It Jazz and Clean Trade . Awards include the George Devine Award, Unity Theatre Trust Award, Alfred Fagon Award, Susan Smith Blackburn Prize Special Commendation, Pearson Plays on Stage Award, Ruth and Golden Harris Prize and the Windham-Campbell Prize. Winsome Pinnock was UNESCO Fellow at University of East Anglia and Senior Visiting Fellow at Cambridge University. She is currently Writer in Residence at Bristol Old Vic and Professor of Professional Practice at the Central School of Speech and Drama. Winsome is currently writing a biopic of Dinah Washington for Rolling Fork Productions and holds commissions for Headlong Theatre Company and the Royal Court Theatre.", "first_date": "2026-10-30", "last_date": "2026-10-30", "url": "https://lyric.co.uk/shows/for-the-culture-theatre503-masterclass-winsome-pinnock/", "tags": ["class"], "id": "e850", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "lyric-hammersmith", "title": "For the Culture: William Blake Remixed: Testament & Matthew Bourne", "byline": "Experience the visionary world of William Blake like never before, in this electrifying live performance from two remarkable performers: acclaimed rapper, poet and world record holding beatboxer Testament…", "description": "Experience the visionary world of William Blake like never before, in this electrifying live performance from two remarkable performers: acclaimed rapper, poet and world record holding beatboxer Testament, and celebrated composer and award-winning pianist Matthew Bourne.\n\nWilliam Blake Remixed fuses Blake’s iconic work with captivating spoken word, rap, beatboxing and song from Testament , and spectral music and live soundscapes from pianist Matthew Bourne . Expect a whirlwind mix of beats, song, jazz and poetry.\n\nBourne and Testament’s previous performances together include opening the Manchester Jazz Festival 2024, and a show at Downing Street and The Royal Exchange Theatre in 2025. The show includes the duo’s versions of Blake’s Tyger, London, Poison Tree, and of course, Jerusalem among others. Whether you’re curious about Blake’s work or a longtime fan – this show is a muse-see!", "first_date": "2026-10-30", "last_date": "2026-10-30", "url": "https://lyric.co.uk/shows/for-the-culture-william-blake-remixed/", "tags": ["spoken-word"], "id": "e851", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "marylebone-theatre", "title": "Speculations", "byline": "‍ Marilyn Monroe. JFK. Lee Harvey Oswald. You know how they died. Or do you?", "description": "Janie Dee stars as legendary journalist Dorothy Kilgallen in Speculations , Torben Betts' gripping new political thriller about Hollywood, the Kennedys, organised crime — and one woman's determination to uncover the truth. Directed by Sir Trevor Nunn .", "first_date": "2026-10-30", "last_date": "2027-01-03", "url": "https://www.marylebonetheatre.com/productions/speculations", "tags": ["theatre"], "id": "e852", "venue_name": "Marylebone Theatre", "venue_area": "Marylebone"}, {"venue_id": "pleasance-islington", "title": "The Triumph of Death", "byline": "For more information about our venues and performance spaces, please visit our access pages here .", "description": "Assistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-10-30", "last_date": "2026-10-31", "url": "https://www.pleasance.co.uk/event/triumph-death", "tags": ["theatre"], "id": "e853", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "pleasance-islington", "title": "Scary Movies: Gigi and Crusty Play Literally Everybody", "byline": "For more information about our venues and performance spaces, please visit our access pages here .", "description": "Assistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-10-30", "last_date": "2026-10-31", "url": "https://www.pleasance.co.uk/event/scary-movies-gigi-and-crusty-play-literally-everybody", "tags": ["comedy"], "id": "e854", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "greenwich-theatre", "title": "The Séance", "byline": "The Séance is a chilling theatrical experience for audiences who prefer their Halloween atmosphere thick and unsettling.", "description": "Following the suspicious death of their father, four siblings gather at the family home, where grief, rivalry and long buried resentments simmer beneath the surface. When a séance begins as little more than a game, the evening quickly turns darker. The room shifts. The house answers. And something that has been waiting in the shadows begins to make itself known. As the siblings confront a truth far more dangerous than any ghost story, the lines between the living and the dead blur, leaving you with the chilling suspicion that the darkness in the theatre is no longer empty. And, as the story will tell, some things do not stay buried.", "first_date": "2026-10-31", "last_date": "2026-10-31", "url": "https://greenwichtheatre.org.uk/events/the-seance/", "tags": ["theatre"], "id": "e855", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "ica", "title": "Circuit des Yeux feat. Alan Sparhawk presents Nosferatu (1922)", "byline": "Horror cinema’s foundational text, this iconic classic of silent-era expressionism will be taken to a new, otherworldly realm with a hypnotic and haunting original live score by acclaimed musician Circuit des Yeux…", "description": "Horror cinema’s foundational text, this iconic classic of silent-era expressionism will be taken to a new, otherworldly realm with a hypnotic and haunting original live score by acclaimed musician Circuit des Yeux, accompanied by Alan Sparhawk of Duluth indie legends Low.", "first_date": "2026-10-31", "last_date": "2026-10-31", "url": "https://www.ica.art/live/cdy-nosferatu", "tags": ["concert"], "id": "e856", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "lyric-hammersmith", "title": "For the Culture: FOC IT UP! Comedy Workshop", "byline": "A comedy workshop hosted by Kemah Bob and The Femmes of Colo(u)r Comedy Club.", "description": "Since 2018 FOC ITUP! has presented the fiercest mixed bills unapologetically celebrating and centring women and trans comedians of colour.\n\nFor all our productions, we offer one complimentary carer/companion seat for every full price access ticket booked.", "first_date": "2026-10-31", "last_date": "2026-10-31", "url": "https://lyric.co.uk/shows/for-the-culture-foc-it-up-comedy-workshop/", "tags": ["class"], "id": "e857", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "lyric-hammersmith", "title": "For the Culture: FOC IT UP! Comedy Club", "byline": "The FOC IT UP! Comedy Club stays doing it For The Culture. But on 31st October, they’re doing it for us at Lyric!", "description": "With new line-ups curated by host and founder Kemah Bob (Comedy Central, Netflix, BBC… etc) , each show is impossible to repeat, disrupting the status quo with a 100% no-white-dudes-on-stage guarantee. Expect big energy and even bigger laughs.\n\nPrevious performers include Michelle DeSwarte, Desiree Burch, Thanyia Moore, Sophie Duker, Kate Cheka, Meka Mo, Joyelle Nicole Johnson, Sharifa Butterfly and so many more", "first_date": "2026-10-31", "last_date": "2026-10-31", "url": "https://lyric.co.uk/shows/for-the-culture-foc-it-up-comedy-club/", "tags": ["comedy"], "id": "e858", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "orange-tree", "title": "Saturday Seminar: Murder in the Cathedral", "byline": "Our Saturday Seminars offer audiences the chance to go beyond the stage.", "description": "Taking place on selected Saturdays during the season, these engaging talks invite leading academics, authors, and cultural commentators to explore the world behind our productions.\n\nFrom unpicking historical detail to examining social and political themes, each seminar is designed to deepen your understanding of the play and enrich your theatre experience.\n\nPrevious speakers have included renowned broadcaster Jonathan Dimbleby , Martin Fitzpatrick , Head of Music at English National Opera, and Dr Will Tosh of Shakespeare’s Globe.", "first_date": "2026-10-31", "last_date": "2026-10-31", "url": "https://orangetreetheatre.co.uk/whats-on/saturday-seminar-murder-in-the-cathedral/", "tags": ["talk"], "id": "e859", "venue_name": "Orange Tree", "venue_area": "Richmond"}, {"venue_id": "rich-mix", "title": "Deaf Rave Festival – Nighttime", "byline": "Enjoy outstanding performances from talented d/Deaf artists, performers, and dancers, showcasing the creativity, diversity, and energy of the d/Deaf community.", "description": "Join us for a fun, accessible, and thrilling night of live entertainment. Come celebrate with us, connect with the community, and show your support for d/Deaf culture!\n\nThe advertised time for this event is the doors time. The event will commence shortly afterwards, depending on act and/or line-up.", "first_date": "2026-10-31", "last_date": "2026-10-31", "url": "https://richmix.org.uk/live-events/deaf-rave-festival-nighttime", "tags": ["dance"], "id": "e860", "venue_name": "Rich Mix", "venue_area": "Shoreditch"}, {"venue_id": "stone-nest", "title": "Garefowl", "byline": "their new album 'Things That Vanish' with support from Visit Me.", "description": "Ewan Macdonald and his father Murdo are relatives of one of the men who killed the last Great Auk (Garefowl). Ewan conceived the Garefowl project to reflect on and mark this family history and connection to St Kilda. Garefowl is made up of an international collective of musicians combining strings and electronics: Nathan Bontrager (viola da gamba/harmonium/banjo), Stuart Graham (bouzouki/harmonica/harmonium), Chris Jones (concertina/mandolin), Ewan Macdonald (fiddle/smallpipe drone), Richard O’Flynn (island sounds/percussion/XRD drones) and Jess Whelligan (cello).\n\ntheir new album 'Things That Vanish' with support from Visit Me.", "first_date": "2026-10-31", "last_date": "2026-10-31", "url": "https://www.stonenest.org/events/garefowl", "tags": ["concert"], "id": "e861", "venue_name": "Stone Nest", "venue_area": "Soho"}, {"venue_id": "underbelly-boulevard", "title": "Bar Burlesque: Halloween Special", "byline": "Tickets are free but we strongly recommend you book in advance.", "description": "Tucked away on Level 1 of Underbelly Boulevard Soho, our bar is one of Soho’s best kept secrets. With a selection of well-crafted classic cocktails, wines, beer and cider, as well as delicious non-alcoholic and soft options, tea and coffee, there’s a drink for every occasion and every taste on the menu.", "first_date": "2026-10-31", "last_date": "2026-10-31", "url": "https://underbellyboulevard.com/tickets/bar-burlesque-halloween-special/", "tags": ["cabaret"], "id": "e862", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "alexandra-palace", "title": "Wallace & Gromit with live brass band", "byline": "Two different shows, three classic Wallace & Gromit films, and the unforgettable music of Julian Nott performed live by one of the UK’s leading brass bands – The KNDS Fairey Band at Alexandra Palace Theatre.", "description": "14:00 – 15:30 SHOWING A Grand Day Out & A Close Shave: Live World Premiere\n\nThe first show is a very special Wallace & Gromit double bill, beginning with A Grand Day Out — the original film that introduced audiences to Wallace & Gromit. Watch as the pair build a homemade rocket and blast off to the moon in search of cheese.", "first_date": "2026-11-01", "last_date": "2026-11-01", "url": "https://www.alexandrapalace.com/whats-on/wallace-gromit-brass-band/", "tags": ["concert"], "id": "e863", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "greenwich-theatre", "title": "John Lydon: I Could Be Wrong, I Could Be Right", "byline": "He’s a legend and an icon, a revolutionary and an immortal.", "description": "John Lydon – aka Johnny Rotten – changed the face of music and sparked a cultural revolution. The frontman and lyricist of the Sex Pistols and Public Image Ltd (PiL) caused a political earthquake and transformed music for good. In his spoken word show, I Could Be Wrong, I Could Be Right, Lydon is touring the UK. He will talk about how he sees life, along with his unique and extraordinary career, and take audience questions during a pyrotechnic, one-off tour. Lydon will be sharing his thoughts with audiences. He Could Be Wrong. He Could Be Right.", "first_date": "2026-11-01", "last_date": "2026-11-01", "url": "https://greenwichtheatre.org.uk/events/johnlydon/", "tags": ["spoken-word"], "id": "e864", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "greenwich-theatre", "title": "Victorian Gothic", "byline": "an anthology stage show based on a classic trio of nineteenth century chillers - The Body-Snatcher, The Monkey's Paw and Lot No. 249. Dramatic storytelling in the theatre-style at its best! Actor Jonathan Goodwin performs a show scripted by", "description": null, "first_date": "2026-11-01", "last_date": "2026-11-01", "url": "https://greenwichtheatre.org.uk/events/victorian-gothic/", "tags": ["theatre"], "id": "e865", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hoxton-hall", "title": "Waterstones: Sabaa Tahir in Conversation at Hoxton Hall", "byline": "Join bestselling author Sabaa Tahir at London’s Hoxton Hall as we celebrate the publication ofthe highly anticipated sequel to Heir , Empire.", "description": "Bestselling author Sabaa Tahir returns to the expansive world of fury and vengeance of Heir, weaving a story of legacy and rebellion, of loyalty and freedom, and of what it means to confront the monsters that lurk within us all.\n\nSabaa Tahir is the bestselling author of the An Ember in the Ashes series, which has been translated into over thirty-five languages. She grew up in California’s Mojave Desert at her family’s eighteen-room motel. There, she spent her time devouring fantasy novels, listening to thunderous indie rock, and playing guitar and piano badly.", "first_date": "2026-11-01", "last_date": "2026-11-30", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173692366", "tags": ["talk"], "id": "e866", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "little-angel", "title": "Relaxed Performance - Pip and Posy Live on Stage", "byline": "Inspired by the BAFTA nominated animated series from Magic Light Pictures and based on the picture books by multi-award-winning illustrator Axel Scheffler (The Gruffalo) this exciting new live stage show celebrates the power of…", "description": "Inspired by the BAFTA nominated animated series from Magic Light Pictures and based on the picture books by multi-award-winning illustrator Axel Scheffler (The Gruffalo) this exciting new live stage show celebrates the power of imagination, kindness, and creativity for little ones and families everywhere.", "first_date": "2026-11-01", "last_date": "2026-11-01", "url": "https://www.littleangeltheatre.com/whats-on/relaxed-performance-pip-and-posy-live-on-stage/", "tags": ["theatre"], "id": "e867", "venue_name": "Little Angel Theatre", "venue_area": "Islington"}, {"venue_id": "museum-of-comedy", "title": "LST New Comedian of the Year 2026: Quarter Finals", "byline": "Now in it’s 17th year. Leicester Square Theatre’s showcase for the UK's best up & coming New Comedians.", "description": "The best acts from almost 40 heats compete for a place in the grand final at Leicester Square Theatre, the cash prize & the coveted title of New Comedian of the Year. Previous finalists include Rob Beckett, Rachel Parris, Viggo Venn, Jessica Fostekew, Tez Ilyas, Harriet Kemsley, Tim Renkow, Nigel Ng, Rosie Holt, Alasdair Becket-King, Olga Koch, Ian Smith, Amy Gledhill & many more…", "first_date": "2026-11-01", "last_date": "2026-11-15", "url": "https://www.museumofcomedy.com/leicester-square-theatre-new-comedian-of-the-year-2026-quarter-finals/", "tags": ["stand-up"], "id": "e868", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "museum-of-comedy", "title": "Gary Faulds: Panic at the Midlife Disco", "byline": "Join Gary Faulds, the Glaswegian comedian who’s survived every type of life crisis imaginable, in Panic At The Midlife Disco.", "description": "With his kids getting older and the looming reality of mortality getting closer, Gary’s having a hilarious meltdown – and you’re invited to the party. From desperate attempts to stay “cool” with his kids to grappling with his rapidly growing waistline and crumbling youth, Gary’s journey through midlife is anything but graceful. Expect gut busting stories, sharp wit and a brutally honest look at the chaos of growing up, getting old and trying to keep it together while everything falls apart. It’s a comedy show that proves the only thing more awkward than a midlife crisis is trying to laugh about it.", "first_date": "2026-11-01", "last_date": "2026-11-30", "url": "https://www.museumofcomedy.com/gary-faulds-panic-at-the-midlife-disco/", "tags": ["stand-up"], "id": "e869", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "rich-mix", "title": "Manding Melody featuring Habib Koite & Sura Susso", "byline": "An innovative and refreshing approach to creativity that will take listeners and", "description": "audiences on a journey through West Africa, grounded with traditions full of joyful melodic\n\nvibes in a setting celebrating friendship and culture.", "first_date": "2026-11-01", "last_date": "2026-11-01", "url": "https://dice.fm/event/pyby3w", "tags": ["concert"], "id": "e870", "venue_name": "Rich Mix", "venue_area": "Shoreditch"}, {"venue_id": "shoreditch-town-hall", "title": "Theatre Re: Monthly Training Classes 2026", "byline": "Come and get your monthly Theatre Re fix! Theatre Re's monthly Sunday professional classes are returning to Shoreditch Town Hall this Autumn.", "description": "Rooted in Theatre Re ’s training and creative process, sessions will focus on conditioning the body in preparation for: rigorous training, Corporeal Mime technique and repertoire, as well as improvisation and composition inspired by the company’s current projects.\n\nWhether you are a seasoned professional performer wanting to enhance your physical presence and the specificity of your actions on stage, a newcomer to the theatre looking for a specific technique to ground your explorations, or an artist in need of a fresh approach to making, participants will develop their skills and creativity in an open, playful and generous environment.", "first_date": "2026-11-01", "last_date": "2026-11-30", "url": "https://shoreditchtownhall.com/whats-on/theatre-re-monthly-training-classes-2026", "tags": ["class"], "id": "e871", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "southbank-centre", "title": "Hanif & Carlo Kureishi: Are You With Me Now?", "byline": "The playwright discusses his fiercely funny, unflinching account of survival – of creativity, desire and companionship persisting when the body falls apart.", "description": "Join Hanif Kureishi and his son Carlo Kureishi in conversation with broadcaster Emma Barret. The song ‘Are You with Me Now?’ was a regular soundtrack to the drives Hanif Kureishi and partner Isabella d’Amico would take from Rome to her mother’s house on the Amalfi Coast, both of them singing along as they skirted the Bay of Naples, in the time before the accident which paralysed him. This book takes its title from that music – and it is a question that has now become more urgent and more complex. Beginning with this memory of the past and ending with his marriage and his first faltering steps, Hanif Kureishi, with son Carlo, charts how a writer, a couple and a family adapt to disability – through arguments and jokes, memories of lovers and friends, and a new way of working word by word at the kitchen table. Are You With Me Now? is a fiercely funny, unflinching account of survival – and of creativity, desire and companionship persisting when the body, and conventional life, fall apart. Hanif Kureishi’s novels include The Buddha of Suburbia, which won the Whitbread Prize for Best First Novel, The Black Album, Intimacy and The Last Word. His screenplays include My Beautiful Laundrette, which received an Oscar nomination for Best Screenplay. He has been awarded the Chevalier de l’Ordre des Arts et des Lettres and his work has been translated into 36 languages. Presented in association with the Service95 Book Club. Founded by Dua Lipa, the Service95 Book Club is a space to enjoy all things literary, including Dua’s hand-picked Monthly Reads and her exclusive author interviews, plus new book trends, recommendations from the Service95 team and more ways for you to read the world differently.", "first_date": "2026-11-01", "last_date": "2026-11-01", "url": "https://www.southbankcentre.co.uk/whats-on/hanif-carlo-kureishi-are-you-with-me-now/", "tags": ["talk"], "price_min": 29.0, "price_max": 60.0, "id": "e872", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "tabard", "title": "The Phantom Raspberry Blower of Old London Town", "byline": "A mysterious raspberry blower is terrorising Victorian society, leaving a trail of shocked aristocrats in his wake.", "description": "As the repetitive din-dins echo through London's foggy streets, Inspector Corner of the Yard and his faithful sidekick Sergeant Bowles set out to unmask the culprit before another upper-class victim falls foul of the Phantom.\n\nCelebrating fifty years since its original television broadcast, this newly adapted stage production brings to life one of The Two Ronnies' most beloved creations. Packed with Spike Milligan and Ronnie Barker's trademark wordplay, outrageous puns, surreal silliness and gloriously bad behaviour, The Phantom Raspberry Blower of Old London Town is a riotous comedy adventure unlike anything else on stage.\n\nThe case is afoot. The raspberries are primed. The Phantom awaits...", "first_date": "2026-11-01", "last_date": "2026-11-01", "url": "https://www.tabard.org.uk/production/the-phantom-raspberry-blower-of-old-london-town", "tags": ["theatre"], "id": "e873", "venue_name": "Tabard Theatre", "venue_area": "Chiswick"}, {"venue_id": "the-cockpit", "title": "New Stuff: November", "byline": "Our monthly night of rehearsed readings. Join us for the opportunity to see exciting new work and engage in conversation with other writers, creatives, and theatre-goers.", "description": "Two friends that share a room in London. As they navigate London life, they are also navigating their room with everything, and everyone, that comes with it.\n\nHELD is a psychological thriller that explores power, identity, memory and the stories we tell to survive.", "first_date": "2026-11-01", "last_date": "2026-11-01", "url": "https://www.thecockpit.org.uk/show/new_stuff_november_1", "tags": ["theatre"], "id": "e874", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-space", "title": "Voila! at the Space - Launch Party", "byline": "As part of our 3rd year hosting the Voila! Festival we are welcoming our performing companies and artists to join us for an evening of meeting and greeting and YOU are invited!", "description": "Join us for a mini-season launch as we see extracts of shows, meet the makers and enjoy a game or two of mingle bingo to bring our international and migrant artists to East London.\n\nWith a free glass of fizz (alcoholic or non) as part of your ticket, come join us to kick off the festival.", "first_date": "2026-11-01", "last_date": "2026-11-01", "url": "https://space.org.uk/event/voila-launch-party/", "tags": ["theatre"], "id": "e875", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "greenwich-theatre", "title": "Macbeth", "byline": "Enter the Dark Ages, where power, passion, and prophecy collide. Witness Shakespeare’s Macbeth unfold in a storm of witchcraft, betrayal, and brutal battles for Scotland’s cursed crown.", "description": "This full-scale production of Shakespeare’s Macbeth immerses audiences in the murky Dark Ages - a world where love, politics, and witchcraft collide. Returning from battle, the warworn Macbeth encounters three mysterious sisters whose chilling prophecy foretells his rise to the throne of Scotland. Consumed by ambition and spurred on by his formidable Lady, he seizes fate with bloodied hands, unleashing a chain of betrayal, tyranny, and despair that leads to the downfall of kings, friends, and souls alike. Set amidst shadow and superstition, this production conjures a Scotland haunted by sorcery and spectral visions. Ghostly apparitions, dark omens, and spectacular sword fights bring to life the brutal beauty of Shakespeare’s timeless tragedy. With powerful performances, stirring battle scenes, and an atmosphere thick with foreboding, this full-scale retelling of Macbeth captures the epic scope and enduring power of one of theatre’s greatest works - a tale of fate, desire, and the corruption of the human soul.", "first_date": "2026-11-02", "last_date": "2026-11-05", "url": "https://greenwichtheatre.org.uk/events/macbeth/", "tags": ["theatre"], "id": "e876", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "national-theatre", "title": "Cloud 9", "byline": "In Victorian Africa, where Clive is a colonial administrator and patriarch, his wife, son and servant struggle to be what’s expected of them.", "description": "When the family turn up a hundred years later in 70s London, what can they make of themselves in a world where empire lingers and freedom calls?\n\nWith its audacious theatricality and razor-sharp wit, Caryl Churchill’s ( Top Girls ) landmark work continues to challenge how we think about gender, power and the legacies of empire.", "first_date": "2026-11-02", "last_date": "2027-01-13", "url": "https://www.nationaltheatre.org.uk/productions/cloud-9/", "tags": ["theatre"], "id": "e877", "venue_name": "National Theatre", "venue_area": "South Bank"}, {"venue_id": "siobhan-davies", "title": "Living Image – Chapter 2", "byline": "Sheri King, Akeim Toussaint Buck, Subathra Subramaniam, Jules Cunningham and Charlie Morrissey are the five artists making work for this second chapter of Living Image .", "description": "Each artist will remake Siobhan Davies’ solo from her work Sphinx (1977) over five days, concluding in public performances on Thursday 5 November and Friday 6 November.\n\nLiving Image is taking place over the course of four ‘chapters’ between July 2026 – July 2027. Twenty artists have been invited to deconstruct, dismantle, and reclaim movement traditions in a project that dis/honours Siobhan Davies’ original work and pushes against the edges of how dance is archived, remembered, and celebrated.\n\nThese new/old works celebrate different practices, experiences and perspectives that have shaped and will continue to shape the Studios over the last two decades, the next 20 years and way beyond.", "first_date": "2026-11-02", "last_date": "2026-11-07", "url": "https://www.siobhandavies.com/events/living-image-chapter-2/", "tags": ["dance"], "id": "e878", "venue_name": "Siobhan Davies Studios", "venue_area": "Elephant and Castle"}, {"venue_id": "soho-theatre", "title": "Ginger Johnson: Show Pony", "byline": "Join Drag Race Superstar and Celebrity Masterchef Champion, Ginger Johnson, on a surprisingly psychedelic adventure into the outer reaches of her tiny little mind, as she gallops through the cosmos in search of love…", "description": "Join Drag Race Superstar and Celebrity Masterchef Champion, Ginger Johnson, on a surprisingly psychedelic adventure into the outer reaches of her tiny little mind, as she gallops through the cosmos in search of love, light and the little horse that got away.\n\nPacked full of whip-smart comedy and the kind of chaos only a queen who’s ‘unapologetically daft’ (Guardian) can deliver, Show Pony is a barnstorming night at the theatre, soundtracked by original songs that sound like they’re astral projecting straight into your ears from the radio of a 1970s VW camper – think Janis Joplin… if she was a geordie.\n\nFollowing the explosive success of her smash hit 2024 tour Ginger Johnson Blows Off! , the nation’s silliest sausage is back on the road with a brand new show that promises to be outrageous, untamed and completely off the reins.", "first_date": "2026-11-02", "last_date": "2026-11-26", "url": "https://sohotheatre.com/events/ginger-johnson-show-pony/", "tags": ["stand-up", "comedy"], "id": "e879", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "southwark-playhouse", "title": "Nero", "byline": "Andrew Barth Feldman will star as Nero in the highly anticipated new musical NERO , with book and lyrics by Tony Award® winner Steven Sater, music by Tony Award® winner Duncan Sheik, and directed by acclaimed director Lindsay Posner.", "description": "From the award-winning creators of ‘Spring Awakening’, NERO is a thrilling new musical that reimagines one of history’s most notorious figures for a modern age.\n\nLong before his name became synonymous with tyranny, Nero was an artist, a performer, and a reluctant heir thrust into unimaginable power. As ambition collides with family, love, and political intrigue, a young ruler’s desperate search for identity spirals into madness, forging one of history’s most infamous legends. Blurring the line between celebrity and leadership, this story reveals why the fall of ancient Rome feels more urgent, and more relevant, than ever.", "first_date": "2026-11-02", "last_date": "2026-12-05", "url": "https://southwarkplayhouse.co.uk/productions/nero/", "tags": ["musical"], "id": "e880", "venue_name": "Southwark Playhouse", "venue_area": "Borough, SE1"}, {"venue_id": "bridewell", "title": "Goldfish", "byline": "Set in the unforgiving winter of 1899 at the tail-end of the Alaskan Klondike Gold Rush, GOLDFISH is a darkly comic, atmospheric fable that tackles startlingly modern themes of fake news, mass hysteria, gender identity…", "description": "Set in the unforgiving winter of 1899 at the tail-end of the Alaskan Klondike Gold Rush, GOLDFISH is a darkly comic, atmospheric fable that tackles startlingly modern themes of fake news, mass hysteria, gen
