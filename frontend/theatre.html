le": "Two Names, That Meet and Part", "byline": "Youssef, a young Palestian student newly arrived in New York, wants what so many before him have wanted: the American dream. A good education, a new life, the girl. But America has other ideas.", "description": "Haunted by the ghost of Rachel Corrie - the American activist killed in Gaza in 2003 - and pulled into campus protests that spiral beyond his control, Youssef finds that the life he came for keeps slipping out of reach. The harder he reaches for belonging, the more the world reminds him of who he is and where he comes from until he is forced to act, with devastating consequences.\n\nPart love story, part political reckoning, Two Names, That Meet and Part puts the immigrant experience at the heart of the American dream - and asks what happens when that dream was never really yours to have.", "first_date": "2026-09-29", "last_date": "2026-10-03", "url": "https://www.pleasance.co.uk/event/two-names-meet-and-part", "tags": ["theatre"], "id": "e475", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "sadlers-wells", "title": "Eliza: A Bloomin' New Ballet", "byline": "Based on George Bernard Shaw’s Pygmalion , one of Britain’s most enduring stories, Eliza: A Bloomin’ New Ballet transports audiences to 1930s London…", "description": "Based on George Bernard Shaw’s Pygmalion , one of Britain’s most enduring stories, Eliza: A Bloomin’ New Ballet transports audiences to 1930s London, where a young flower seller dreams of a life beyond Covent Garden until an unexpected encounter with the brilliant but uncompromising Henry Higgins changes her future forever.\n\nChoreographed and directed by Joseph Poulton , and set to the much-loved music of Eric Coates , this bold new dance theatre work brings Shaw’s timeless story to life through dance, romance and richly theatrical storytelling. Exploring themes of class, reinvention and identity, it asks a timeless question: can we ever truly change, and at what cost?\n\nThis first public workshop performance offers audiences an exclusive glimpse of a new work in development.", "first_date": "2026-09-29", "last_date": "2026-09-29", "url": "https://www.sadlerswells.com/whats-on/eliza-a-bloomin-new-ballet/", "tags": ["dance"], "id": "e476", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "shoreditch-town-hall", "title": "Preview: A DYING PROFESSION", "byline": "Written and performed by designer turned clown & theatre-maker Paulina Lenoir, and dance artist and choreographer Patricia Langa, A DYING PROFESSION is a new clown , danc e, and theatre piece exploring humanity's relationship to death.", "description": "The show follows Conchita & Lola, two professional mourners who have dedicated their lives to grieving for humanity. But as the weight of their calling begins to grow heavier, they are confronted by a haunting question: who, in turn, will mourn them?\n\nAs artists of mixed heritage, Patricia (Spanish) and Paulina (Swiss-Mexican) draw on their research into the multicultural roots of flamenco and the rich folklore traditions embedded within their diverse cultural backgrounds. Through this, they explore their relationship to death, displacement, and the blending of traditions, in order to create a new space for shared and communal grieving.", "first_date": "2026-09-29", "last_date": "2026-09-29", "url": "https://shoreditchtownhall.com/whats-on/paulina-lenoir-patricia-langa-a-dying-profession", "tags": ["theatre", "dance"], "id": "e477", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "shoreditch-town-hall", "title": "Ban the Bailiffs", "byline": "Council tax debt has soared in recent years, and rates just keep going up. 4.4 million people are now in debt.", "description": "For many, it’s becoming impossible to pay when the cost of living crisis and economic turmoil have squeezed budgets to the limit.\n\nBut instead of supporting families to get out of debt, councils are using violence, harassment and intimidation - sending in the bailiffs. Worse, the cost of a bailiff visit is added to people’s debt – leaving them hundreds of pounds worse off.", "first_date": "2026-09-29", "last_date": "2026-09-29", "url": "https://shoreditchtownhall.com/whats-on/debt-justice-ban-the-bailiffs", "tags": ["theatre"], "id": "e478", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "the-cockpit", "title": "Extremism by Anders Lustgarten", "byline": "One student has disappeared. Nobody knows why. Everyone has an opinion.", "description": "When a classmate is removed from school under suspicion of radicalisation, a group of teenagers are left alone to make sense of what has happened. As rumours spread and tensions rise, friendships are tested and prejudices exposed.\n\nWritten by award-winning playwright Anders Lustgarten , Extremism is a gripping and urgent drama exploring identity, belonging, fear, and the dangers of division in modern Britain.", "first_date": "2026-09-29", "last_date": "2026-10-02", "url": "https://www.thecockpit.org.uk/show/extremism_by_anders_lustgarten", "tags": ["theatre"], "id": "e479", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "underbelly-boulevard", "title": "BEN HART: Hex", "byline": "The real-life witch returns to London with Hex . This show celebrates and showcases the very best of Ben Hart’s creations to date.", "description": "Internationally acclaimed magician Ben Hart’s shows are a unique kind of alchemy. Funny, dark and baffling, he’s an altogether new species of conjurer… Hex is a curated collection of Ben’s favourite and most exciting material from the last decade alongside new ideas fresh from his laboratory, guaranteed to put a spell on you.\n\nA truly unique, in the round experience of exceptional magic, wonder and bewilderment.", "first_date": "2026-09-29", "last_date": "2026-10-04", "url": "https://underbellyboulevard.com/tickets/ben-hart-hex/", "tags": ["magic"], "id": "e480", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "union-theatre", "title": "PACK IT UP", "byline": "New Musical Theatre’, we invite you to come and watch ‘PACK IT UP’.", "description": null, "first_date": "2026-09-29", "last_date": "2026-09-29", "url": "https://uniontheatre.biz/show/pack-it-up/", "tags": ["musical"], "id": "e481", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "union-theatre", "title": "THE LITTLE FROG WHO COULDN’T JUMP", "byline": "New Musical Theatre’, we invite you to come and watch ‘The Little Frog Who Couldn’t Jump’.", "description": null, "first_date": "2026-09-29", "last_date": "2026-09-29", "url": "https://uniontheatre.biz/show/the-little-frog-who-couldnt-jump/", "tags": ["musical"], "id": "e482", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "etcetera", "title": "The “How Are You?” Game", "byline": "Ready to play ‘The “How Are You?” Game’? It’s not that difficult a question! Right?", "description": "Contestant Andy battles through classic gameshow rounds and everyday life, desperate to win the big prize. Can he avoid feeling like a loser? Will he even make it to the end of the game before everything falls apart?\n\nFun challenges! Celebrity guests! A mystery box potentially full of emotional trauma! This show sort of has some of those things.", "first_date": "2026-09-30", "last_date": "2026-10-02", "url": "https://www.etceteratheatrecamden.com/events/the-how-are-you-game", "tags": ["theatre"], "id": "e483", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "ica", "title": "Klein + Angel Gray", "byline": "Klein is an artist and musician whose work often blurs the lines between fact and fiction.", "description": "Her music releases, films, and performances are often informed by urban mapping, surveillance, humor, hip-hop, noise, identity, and beyond. Support from Angel Gray.", "first_date": "2026-09-30", "last_date": "2026-09-30", "url": "https://www.ica.art/live/klein", "tags": ["concert"], "id": "e484", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "museum-of-comedy", "title": "A Mind Full - Work In Progress", "byline": "A Mind Full, is a work in progress show telling the story of one man's healing journey, from chasing laughs and dopamine hits to moving into a Buddhist community and trying (badly) to meditate.", "description": "Blending stand-up, storytelling and immersive sound design, A Mind Full explores what happens when a wide boy with impulse issues goes full mindfulness. Along the way: spiritual bypassing, compulsive behaviour and the ongoing tension between craving peace and needing the spotlight.", "first_date": "2026-09-30", "last_date": "2026-09-30", "url": "https://www.museumofcomedy.com/a-mind-full-work-in-progress/", "tags": ["stand-up"], "id": "e485", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "museum-of-comedy", "title": "The Instant Musical", "byline": "The Instant Musical - just add suggestions! Formed in 2025, The Instant Musical team are set on bringing happy chaos to musical theatre.", "description": "At every performance a fully improvised musical is created on the spot, brimming with heart warming and hilarious songs, catchy lyrics, dance routines and plot twists - all set in the wonderful world of wherever you, the audience, decide! They’ve trained with the best and aim for the stars. Finalists of the 2026 London Improv Festival Fan Faves competition.", "first_date": "2026-09-30", "last_date": "2026-11-25", "url": "https://www.museumofcomedy.com/the-instant-musical/", "tags": ["musical", "theatre"], "id": "e486", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "park-theatre", "title": "Bull", "byline": "Four colleagues sit in a meeting room. Jobs are on the line. The rules are unspoken, but everyone knows them.", "description": "Bull is a strained and unsettling examination of workplace bullying, power and survival. As pressure builds, alliances shift and cruelty surfaces, exposing a system where fear thrives and empathy disappears.\n\nSharp, darkly funny and deeply uncomfortable, Bull lays bare the human cost of a working culture shaped by competition, hierarchy and silence. How far will people go to protect themselves?", "first_date": "2026-09-30", "last_date": "2026-10-24", "url": "https://parktheatre.co.uk/events/bull/", "tags": ["theatre"], "id": "e487", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "pleasance-islington", "title": "Return to Palestine", "byline": "Return to Palestine follows Jad, an American-born Palestinian, on his first journey to Palestine.", "description": "Seeking connection with his roots, he discovers a reality far removed from the one portrayed in the media. Directed by Micaela Miranda and devised at The Freedom Theatre in Jenin Refugee Camp, the production was created through story-gathering with communities involved in The Freedom Theatre’s annual Freedom Ride, drawing on stories from Jenin, Fasayel, Dheisheh, Mufaqara and Gaza’s Jabalia Camp. Blending physical storytelling, live music, comedy and testimony, a dynamic ensemble of Palestinian actors transform a stage “as small as Palestine” into a vivid theatrical landscape of characters, memories and lived experience. Founded in Jenin Refugee Camp, The Freedom Theatre is internationally recognised for its work in artistic expression, youth empowerment and cultural resistance. Part of PalArt Festival 2026, PalArt Collective’s multidisciplinary celebration of Palestinian arts and culture.\n\nFor more information about our venues and performance spaces, please visit our access pages here .\n\nAssistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-09-30", "last_date": "2026-10-03", "url": "https://www.pleasance.co.uk/event/return-palestine", "tags": ["theatre"], "id": "e488", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "royal-court", "title": "How Not To Disappear", "byline": "An open space style event for playwrights who are parents or guardians. We will explore HOW NOT TO DISAPPEAR WHEN BRINGING UP CHILDREN.", "description": "Maybe that’s disappearing from the industry due to lack of time, headspace, or childcare. Maybe it’s a sense of your creative self disappearing now you’re responsible for a whole other human (or more.) Maybe it’s a sense of your identity disappearing, leaving you homesick for the You that you were before. Maybe you feel you disappear from your children when you go into work mode. Whatever it is, you’re not alone.\n\nLed by Anna Jordan and Morgan Lloyd Malcolm, together we will vent, share, be heard, swap ideas, and support each other.", "first_date": "2026-09-30", "last_date": "2026-09-30", "url": "https://royalcourttheatre.com/events/how-not-to-disappear", "tags": ["class"], "id": "e489", "venue_name": "Royal Court", "venue_area": "Sloane Square"}, {"venue_id": "sadlers-wells", "title": "Flamenc Oh!!", "byline": "Direct from sun-drenched Spain, the powerful rhythm and fast feet of Flamenco are taken to the next level in this brand-new production by Yllana.", "description": "Join a family of flamenco artists on tour as the younger generation begins to challenge the old rules with unexpected musical mashups, map cap moments and surprising role reversals. Bursting with passion, humour and dazzling dance, this is a playful and irreverent tribute to classic flamenco, while honoring this iconic art form.\n\nAfter a sell out in Madrid, and its debut at the Edinburgh Fringe, Yllana bring this smash hit to London, full of frills and fancy footwork.", "first_date": "2026-09-30", "last_date": "2026-10-10", "url": "https://www.sadlerswells.com/whats-on/flamenc-oh/", "tags": ["dance"], "id": "e490", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "the-place", "title": "the body symphonic", "byline": "Created in response to the multiple political and geopolitical crises in Lebanon, the body symphonic is a meditation on the body’s place in the struggle against occupation.", "description": "Lebanese dancer, choreographer and musician Charlie Khalil Prince transforms the stage into a space of resistance in a magnetic solo performance, where the body asserts its agency against erasure. At once a concert and a choreographic offering, the work blurs the line between dance and music; gestures generate sound, while rhythms from virtuoso percussionist Joss Turnbull give rise to movement. Prince draws from both contemporary and folk dances, allowing traditions to fracture and reconfigure into new mythologies. It is a meditation, a purge, a prayer, invoking the possibility of imagined futures.\n\nCharlie Khalil Prince is a Lebanese dancer, choreographer, and musician whose work merges movement, sound, and political consciousness into transcendent performance. His practice explores the body as site, symbol, and archive, positioning vulnerability as rebellion, and performance as a space of memory, resistance, and renewal. Blending music and movement into one living gesture, he transforms the body into both vessel and witness, navigating between mourning and visionary futures that resist cultural subjugation. Prince’s choreographic work has been presented internationally at FTA - Festival TransAmèriques, ImPulsTanz, Dansmakers Amsterdam, Les Rencontres chorégraphiques internationales de Seine-Saint-Denis and the Vancouver International Dance Festival among others, and the Beirut International Platform of Dance . In 2023, he was artist-in-residence at the Villa Empain in Brussels, where he received the Boghossian Foundation award for dance and performance. He was selected as one of the Aerowaves 2025 artists with his solo work the body symphonic . For Prince, dance is essential: an insistence on life, memory, and resistance in times of crisis.\n\nLive Music: Charlie Khalil Prince and Joss Turnbull", "first_date": "2026-09-30", "last_date": "2026-09-30", "url": "https://theplace.org.uk/events/autumn-winter-26-the-body-symphonic-black-sheep", "tags": ["concert", "dance"], "id": "e491", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "union-theatre", "title": "EXTREMELY LOUD & INCREDIBLY CLOSE – The Musical", "byline": "Nine-year-old Oskar Schell is searching for a lock.", "description": "One year after losing his father, Oskar discovers a mysterious key hidden among his belongings. Convinced it holds one final message from him, Oskar embarks on a remarkable journey across New York City to find the lock it opens.\n\nAlong the way, he encounters a community of strangers whose lives become intertwined with his own, uncovering hidden family secrets and unexpected connections.", "first_date": "2026-09-30", "last_date": "2026-09-30", "url": "https://uniontheatre.biz/show/extremely-loud-incredibly-close-the-musical/", "tags": ["musical"], "id": "e492", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "brixton-house", "title": "Connecting Dots: Lambeth Cultural Research Exchange", "byline": "Connecting Dots is an Arts Council England-funded project exploring one simple but ambitious question: Can poetry translate policy and raise a new generation of leaders?", "description": "Join us for the Lambeth Cultural Research Exchange, an evening bringing together artists, local government, community organisations and young people to explore local issues through creativity, conversation and collaboration.\n\nWhether you’re an artist, policymaker, student, community organiser or local resident, Connecting Dots offers a space to share ideas, build relationships and imagine new ways of shaping Lambeth’s future together.", "first_date": "2026-10-01", "last_date": "2026-10-01", "url": "https://brixtonhouse.co.uk/shows/connecting-dots-lambeth-cultural-research-exchange/", "tags": ["talk", "theatre"], "id": "e493", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "bush", "title": "The Hungry Ghost", "byline": "Tonight’s the night. She’s got a plan. And it involves her (secret) girlfriend, and the house they’re about to move into together.", "description": "And it doesn’t matter to her that her mum warns tonight is the first night of the ghost month. Because parents will say anything to keep you home.\n\nSwiping an orange from the family altar and pocketing a coin she finds on her way over to the new place, she steps through the doorway – and unwittingly invites a hungry ghost into both of their lives. As the ghost starts to take over and she wrestles for control of her own body, her carefully constructed house of lies comes tumbling down around her.", "first_date": "2026-10-01", "last_date": "2026-10-31", "url": "https://www.bushtheatre.co.uk/event/the-hungry-ghost/", "tags": ["theatre"], "id": "e494", "venue_name": "Bush Theatre", "venue_area": "Shepherd's Bush"}, {"venue_id": "greenwich-theatre", "title": "Drive: A Mixed Colours Extravaganza", "byline": "Drive: A Mixed Colours Extravaganza Following a sold-out West End run at Seven Dials Playhouse and straight off the back of its national tour…", "description": "Drive: A Mixed Colours Extravaganza Following a sold-out West End run at Seven Dials Playhouse and straight off the back of its national tour, DRIVE: A Mixed Colours Extravaganza returns to London for a special performance at Greenwich Theatre. Four friends from an East London estate form a band with big ambitions. But as music", "first_date": "2026-10-01", "last_date": "2026-10-01", "url": "https://greenwichtheatre.org.uk/events/drive-a-mixed-colours-extravaganza/", "tags": ["theatre"], "id": "e495", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hen-and-chickens", "title": "Conflict of Interest", "byline": "Following successful runs in London and Yorkshire, Righton Productions returns to The Hen and Chickens Theatre for a brand new legal drama from Thomas Carruthers, directed by Jazmine Sewsanker.", "description": "Arthur Carmichael and Mitchell Hargrieve run one of the most successful law practises in Philadelphia; however, when they take on the shocking case of Rita Lempkin, who openly admits that she murdered her real-estate mogul husband, Ralph, things grow tense. Complications grow further with the similarities the Lempkin case shares with that of Lucy Balsam, whom nine years ago Arthur got off when accused of murdering her own father. However, Lucy Balsam has been Lucy Carmichael now for some time. Also in the office is Talia Cooper, a young intern, who is being put at odds as a pawn in the endless power struggle shared by Arthur and Mitch.", "first_date": "2026-10-01", "last_date": "2026-10-03", "url": "https://www.unrestrictedview.co.uk/events/conflict-of-interest", "tags": ["theatre"], "id": "e496", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "ica", "title": "Carla dal Forno + Guests", "byline": "Carla dal Forno is an Australian composer, songwriter and producer based in Castlemaine, Victoria.", "description": "Working between post-punk minimalism, experimental pop and atmospheric electronics, she has built a dedicated international following through a series of acclaimed releases and extensive touring across Europe and North America. Support from Guests.", "first_date": "2026-10-01", "last_date": "2026-10-01", "url": "https://www.ica.art/live/carla-dal-forno", "tags": ["concert"], "id": "e497", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "jacksons-lane", "title": "Mixed Doubles: Poppy Plowman / Brainfools", "byline": "Mixed Doubles brings together two performances in one night. Carefully paired, each programme showcases different artists, disciplines and perspectives.", "description": "_____________________________________________________________________________________________\n\nRaindrops on Roses is a family friendly circus show that explores the reality of living with neurodiversity and how it can shape our mental health. By combining tight wire and clowning, this topic is explored with playfulness and joy, inviting the audience to join clown Rosie on her chaotic and charming pursuit of happiness and self-acceptance. Through humour, poetry and circus, Rosie’s journey never fails to leave the audience touched to their very core.\n\nBalancing Secrets. Juggling Trust. When the world tips over, we find our feet. Using beer kegs, bottles, and planks, two strangers turn a dusty cellar into a high-energy acrobatic playground. A life-affirming, charming acrobatic spectacle co-produced by Hoxton Hall.", "first_date": "2026-10-01", "last_date": "2026-10-01", "url": "https://www.jacksonslane.org.uk/events/mixed-doubles-brainfools-poppy-plowman/", "tags": ["circus"], "id": "e498", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "kings-head", "title": "The Gang Of Three", "byline": "Deep in the heart of the corridors of power, the Labour Party's Roy Jenkins, Denis Healey and Tony Crosland clash over the soul of British socialism and their own relentless ambitions.", "description": "Set against the backdrop of economic crisis, Robert Khan and Tom Salinsky’s acclaimed political drama brings to life the personalities, principles and private tensions that shaped a generation of politics.\n\nA chance to revisit a defining moment in the battle for the soul of the Labour Party, which captures the towering intellects, fierce rivalries and the private tensions behind public power.", "first_date": "2026-10-01", "last_date": "2026-10-10", "url": "https://kingsheadtheatre.com/whats-on/the-gang-of-three-t84c", "tags": ["theatre"], "id": "e499", "venue_name": "King's Head Theatre", "venue_area": "Islington"}, {"venue_id": "museum-of-comedy", "title": "Terror At The Haunted Starbucks: a Weirdos Comedy Halloween Special", "byline": "Be prepared to scream! Terror awaits! Nightmares are certain! Can we take your name for the order?", "description": "It’s… TERROR AT THE HAUNTED STARBUCKS, the Weirdos Comedy annual Hallowe'en show. This yearly comedy tradition: is part arthouse comedy farce, part terrifying horror pantomime with a cast of the very best character comedy, sketch and stand-up oddballs the London Comedy scene has to offer. While we are a bit weird the show is for all tastes (newbies welcome), highly interactive, highly daft and very almost rehearsed. Audience are very welcome to come in fancy dress (you don't have to, but it is fun). A Weirdos Comedy production Written & Directed by Adam Larter \"You never forget how to enjoy an evening in the company of these joyous fools. Basically: prepare yourself for the silliest, happiest, most incredible escapism, and just cling on for the ridiculous ride\". ToDoList London \"The knockabout spirit in which it’s delivered makes for a fun evening precisely BECAUSE it is so ramshackle, not despite it.\" - Chortle Best Show Nominee – Leicester Comedy Festival 2021/2022 Event of the Year – Chortle Awards - 2017", "first_date": "2026-10-01", "last_date": "2026-10-31", "url": "https://www.museumofcomedy.com/terror-at-the-haunted-starbucks-a-weirdos-comedy-halloween-special/", "tags": ["comedy", "stand-up"], "id": "e500", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "old-vic", "title": "Martin Guerre", "byline": "Read about our Season In The Round to find out more about the seating configuration for this production.", "description": "The extraordinary true story of forbidden love, deceit and passion on trial… in an all-new version.\n\nAlain Boublil and Claude-Michel Schönberg ’s Olivier Award-winning musical is reimagined for the London stage with new music, new lyrics, new folk-inflected orchestrations and a thrilling new In The Round staging.", "first_date": "2026-10-01", "last_date": "2026-10-31", "url": "https://www.oldvictheatre.com/stage/martin-guerre/", "tags": ["musical"], "id": "e501", "venue_name": "The Old Vic", "venue_area": "Waterloo"}, {"venue_id": "polka", "title": "The Three Little Pigs", "byline": "On the run and with the need to build a strong shelter, our three problem-solving pigs call on you to save their bacon.", "description": "Be blown away by the world of Stuff and Nonsense in this joyful retelling of a classic tale. Told in a unique physical style with raucous puppets, this is high-octane family theatre that will make you howl!\n\nCreatives Director Niki McCretton Executive Producer Jane McGibbon Producer Ben Vleminckx Design and Puppetry Holly Miller Music Jeremy Bradfield Lighting Design Mark Webber Co-writers: Anna Murphy with, Lola, Ivy, Kiki, Layton, Molly-Anna, Bella, Leland, Oliver, Kiera (Yr 6 Children)\n\nAll children under the age of 16 must be accompanied by an adult or young person aged 16 years or over.", "first_date": "2026-10-01", "last_date": "2026-10-04", "url": "https://polkatheatre.com/event/the-three-little-pigs/", "tags": ["puppetry", "theatre"], "id": "e502", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "royal-court", "title": "Blood of my Blood", "byline": "Bullock Creek, South Carolina, 1862. As war rages beyond the plantation, Ginnie Good raises her five children in a cabin that will outlast them all.", "description": "Today. At the same cabin, now a trendy Airbnb, a pregnant Black woman uses conjure to commune with her ancestors, seeking answers to the questions she's afraid to ask anyone else.\n\nPlaywright Joy Nesbitt makes her Royal Court debut with a haunting new play about inheritance, belonging, and what we hear when we listen to the voices of the past. Directed by Tatenda Shamiso ( No I. D. ).", "first_date": "2026-10-01", "last_date": "2026-11-07", "url": "https://royalcourttheatre.com/events/blood-of-my-blood", "tags": ["theatre"], "id": "e503", "venue_name": "Royal Court", "venue_area": "Sloane Square"}, {"venue_id": "royal-vauxhall-tavern", "title": "MISS JILL TYRELL 2026", "byline": "EVERYBODY PLEASSSSE! This is a night dedicated to the queer icon that is Jill Tyrell, and all things Nighty Night.", "description": "There will also be questions from our judges and a round where you can make an impression on the audience. We suggest you try and stock up on your breathing before you apply. That’s your best bet.\n\nTo enter, simply email jason.reid@vauxhalltavern.com or drop us a message on RVT socials!", "first_date": "2026-10-01", "last_date": "2026-10-01", "url": "https://www.vauxhalltavern.com/events/event/miss-jill-tyrell-2026/?oid=6612", "tags": ["cabaret"], "price_min": 10.0, "price_max": 250.0, "id": "e504", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "the-space", "title": "Kate Kelly", "byline": "This performance is a script in hand rehearsed staging.", "description": "October 1936. In London’s East End, survival is a daily struggle against relentless poverty and hardship. But when the British Union of Fascists bring hatred, division and fear to the streets, life becomes even more cruel.\n\nAs Sir Oswald Mosley plans his march through the East End on Sunday 4 October 1936, the stakes rise for Irish docker’s wife and community firebrand Kate Kelly. Her three-month-old granddaughter is struggling to breathe as her health deteriorates, while the local Blackshirts are drawing in Kate’s youngest son, who is becoming dangerously fascinated by their cause.", "first_date": "2026-10-01", "last_date": "2026-10-04", "url": "https://space.org.uk/event/kate-kelly/", "tags": ["theatre"], "id": "e505", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "theatre503", "title": "Advanced Playwriting with Satinder Chohan: 5 Week Online Course", "byline": "Theatre503’s flagship course for playwrights who wish to have a refresher from an industry leading contemporary. Intended for playwrights who have a grip on the basics and want to further hone their skills.", "description": "Thanks to our Share The Drama scheme , we want to make sure those of you who are struggling in the current climate can still take part in our Writers Programme. If you would like to book a Share The Drama bursary for the Writer’s Programme, please call our box office on 02079787040 to enquire about payment and availability.\n\nWhether you’re suffering from writer’s block, are half way through a draft, or are looking for your next idea. Over the course you will explore how to push and develop ideas, giving you the accountability and confidence to take those next steps while adding to your playwriting toolkit. The course will consist of a mix of writing exercises, discussion and exploration of texts.", "first_date": "2026-10-01", "last_date": "2026-10-01", "url": "https://theatre503.com/whats-on/advanced-playwriting-with-satinder-chohan-5-week-online-course/", "tags": ["class"], "id": "e506", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "upstairs-gatehouse", "title": "Magic at the Gatehouse", "byline": "Join us, once a season, for an evening of Magic at the Gatehouse presented by an exciting line-up of top magicians. Witness miracles manifest before your eyes in an intimate theatre that puts you at the heart of the magic.", "description": null, "first_date": "2026-10-01", "last_date": "2026-10-31", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173648209", "tags": ["magic"], "id": "e507", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "white-bear", "title": "THE PLAY’S THE THING", "byline": "A rehearsal takes a dramatic turn. A friendship implodes in real time. A misunderstanding has catastrophic consequences.", "description": "Maisie has decided to stage a play about her friends. And it isn’t flattering. As accusations are hurled and tears are shed, our characters take a trip down the rabbit hole as they endeavour to find an answer to the impossible question: can we find truth in the theatre? And if so, who has the right to tell it?\n\nBack by popular demand after a successful 5* run, THE PLAY’S THE THING is a story in three parts about representation, (mis)communication, art, and artifice. It’s a love letter to theatre, in all its messiness, contradiction, silliness, and joy.", "first_date": "2026-10-01", "last_date": "2026-10-31", "url": "https://www.whitebeartheatre.co.uk/whatson/the-play%E2%80%99s-the-thing", "tags": ["theatre"], "id": "e508", "venue_name": "White Bear Theatre", "venue_area": "Kennington"}, {"venue_id": "bridewell", "title": "Mr Moore’s Bizarre Secret Society", "byline": null, "description": null, "first_date": "2026-10-02", "last_date": "2026-10-02", "url": "https://sbf.org.uk/whats-on/view/mr-moores-bizarre-secret-society/", "tags": ["theatre"], "id": "e509", "venue_name": "Bridewell Theatre", "venue_area": "Blackfriars"}, {"venue_id": "coronet", "title": "Berliner Ensemble: De Profundis by Oscar Wilde", "byline": "From the Berliner Ensemble , award-winning German actor Jens Harzer performs Oscar Wilde ’s De Profundis .", "description": "Directed by Berliner Ensemble Artistic Director Oliver Reese , this masterful performance captures Wilde’s impassioned reflection on his life and society.\n\nIn 1895, Oscar Wilde was sentenced to two years in prison – for being provocative; for loving men, for not hiding his true self and for defying convention. His trial was meant to be a warning to others – against the crime of homosexuality and his irrepressible drive for freedom and recognition. While imprisoned, he wrote a long, impassioned letter to his estranged young lover, Lord Alfred Douglas. Later published as De Profundis , Wilde’s letter describes the unbearable pains and blissful pleasures of his love, as well as his views on art, Christianity, and incarceration, and a society that doesn’t tolerate what it doesn’t understand.\n\nDe Profundis is the last outcry of a broken but untamed spirit. Bankrupt and shunned by society, Wilde writes with literary mastery about contempt and loneliness, about pride and pain. What remains when everything that a person once was is taken away from them?", "first_date": "2026-10-02", "last_date": "2026-10-07", "url": "https://www.thecoronettheatre.com/whats-on/berliner-ensemble-de-profundis-by-oscar-wilde/", "tags": ["theatre"], "id": "e510", "venue_name": "The Coronet Theatre", "venue_area": "Notting Hill"}, {"venue_id": "etcetera", "title": "Sex! With Becky Fury", "byline": "Fresh from a sell out 4 star run at Edinburgh festival former dominatrix , comedian and bastard daughter of baron Frankenfurter (RIP Tim) brings Sex!", "description": "With Becky Fury to the Etcetera Theatre. This is a Rocky Horror inspired mistress class in comic story telling , featuring liberatory insights into the intimacies of human sexuality, our weird and wonderful kinks and fucking Nazis in the ass. If this show doesn’t save the world, then Becky will at least make you belly laugh and inspire you to be more adventurous in bed. “Our host, comedian Becky Fury is a very funny, charismatic, engaging and dare I say it, sexy performer.” On the mic **** “Blew me away with her comic ingenuity” Lancaster Guardian **** “Finest schticks of comedy dynamite to be found for love or money “ Scotsgay insta @becky_fury TikTok @becky_fury", "first_date": "2026-10-02", "last_date": "2026-10-02", "url": "https://www.etceteratheatrecamden.com/events/sex-with-becky-fury", "tags": ["stand-up", "comedy"], "id": "e511", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "ica", "title": "White Flowers", "byline": "White Flowers is Katie Drew and Joey Cobb. Following the announcement of their debut album Dreams For Somebody Else out via State51 Conspiracy in May, we are pleased to announce a headline show this autumn.", "description": null, "first_date": "2026-10-02", "last_date": "2026-10-02", "url": "https://www.ica.art/live/white-flowers", "tags": ["concert"], "id": "e512", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "jacksons-lane", "title": "Mixed Doubles: Gandini Juggling / Nikki & JD", "byline": "Mixed Doubles brings together two performances in one night. Carefully paired, each programme showcases different artists, disciplines and perspectives.", "description": "_____________________________________________________________________________________________\n\nYou Too Can Tutu: Building on the success of their 2015 juggling-meets-ballet performance 4X4:Ephemeral Architectures , Gandini Juggling brings this captivating fusion of grace and playful precision to a whole new audience. This time, with a mischievous twist – a witty take on classic ballet storytelling, following two ambitious characters determined to create the world’s first juggling ballet. Bursting with celebratory energy and slapstick fun, You Too Can Tutu comes to life in a vibrant Bauhaus-inspired palette. Colourful pointe shoes and hyper-coloured balls dance together, forming mesmerising patterns and shapes in a joyful spectacle of movement and rhythm.\n\nKnot: Physically exhilarating and touchingly poignant, Knot is the internationally acclaimed circus and dance work by Nikki Rummer and JD Broussé. These talented performers use hand-to-hand circus skills to tell the tale of an impossible choice: How can we be honest with ourselves without hurting those we love? Knot is a finely crafted theatrical journey through the struggles of commitment.", "first_date": "2026-10-02", "last_date": "2026-10-03", "url": "https://www.jacksonslane.org.uk/events/you-too-can-tutu-gandini-juggling-knot-nikki-jd/", "tags": ["circus", "dance"], "id": "e513", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "oso-arts", "title": "OSO Book Club 2026: The Ragged Trousered Philanthropists by Robert Tressell", "byline": "Fuel your love of reading! Join our monthly Book Club to meet fellow bookworms, explore a diverse ranges of novels and share your thoughts over a cup of coffee in our cosy Café.", "description": "Originally published in 1914, The Ragged Trousered Philanthropists is a timeless story of Socialism, political awakenings and class struggle, told with a volatile mix of heartfelt rage and sly humour. The Ragged Trousered Philanthropists tells the story of a group of working men who are joined one day by Owen, a journeyman-prophet with a vision of a just society. Owen's spirited attacks on the greed and dishonesty of the capitalist system rouse his fellow men from their political quietism. It is both a masterpiece of wit and political passion and one of the most authentic novels of English working class life ever written. This enduring favourite is now reinvigorated by a smart new jacket and exclusive extra material as part of Perennial's Modern Classics line of reissues. Now its timeless message of justice, equality and reason will be introduced to a whole new generation of discerning readers.\n\nThe books are all available at the Barnes Book Shop who are kindly offering a 10% discount off each monthly book on production of your ticket for each session.", "first_date": "2026-10-02", "last_date": "2026-10-02", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173674923", "tags": ["class"], "price_min": 5.0, "price_max": 5.0, "id": "e514", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "piehouse", "title": "Decolonise Fest 2026 Launch Party", "byline": "Be first in the door for Decolonise Fest 2026 with a free evening of live music, DJs and good company.", "description": "We'll be joined by three incredible artists: Floralis, HTMLJONES, Princess Xixi, bringing the genre-defying energy that our festival is all about. Whether you've been coming to the festival for years or you're discovering us for the first time, this is the perfect chance to celebrate with the community before the main event. Come down, grab a drink, discover your next favourite artist and be", "first_date": "2026-10-02", "last_date": "2026-10-02", "url": "https://dice.fm/event/6dovr8-decolonise-fest-2026-launch-party-2nd-oct-piehouse-co-op-london-tickets", "tags": ["concert"], "id": "e515", "venue_name": "Piehouse Co-op", "venue_area": "Deptford"}, {"venue_id": "stone-nest", "title": "Soho Hidden Jazz Club 02.10.26", "byline": "An electrifying, intimate and fun musical experience like no other. For the past few years Hidden Jazz Club has been the place for Londoners in the know to discover the best of the city’s jazz scene within a unique setting.", "description": "Completely artist-run, fun, spontaneous, and relaxed, this is not like your parents’ jazz club. Hidden Jazz Club is the type of space where guests are able to relax and connect with world class artists between sets of amazing live music.", "first_date": "2026-10-02", "last_date": "2026-10-02", "url": "https://www.stonenest.org/events/soho-hidden-jazz-club-02-10-26", "tags": ["concert"], "id": "e516", "venue_name": "Stone Nest", "venue_area": "Soho"}, {"venue_id": "the-albany", "title": "Good Chaos Party", "byline": "Heart n Soul will be launching the Good Chaos album full of bangers created by the Do Your Own Thing crew, plus DJs, live performances and art activities to get involved in.", "description": "This event will feature loud music. There will be photography and filming happening on the day - please speak to a member of staff if you don't wish to be photographed or filmed.\n\nThey believe in the power and talents of people with learning disabilities and autistic people. They work together to make great art with imagination, love and trust. Heart n Soul are based at the Albany.", "first_date": "2026-10-02", "last_date": "2026-10-02", "url": "https://www.thealbany.org.uk/events/good-chaos-party", "tags": ["concert"], "id": "e517", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "unicorn", "title": "Home Song", "byline": "In this multi-sensory show, meet young Adwoa and her mum as they embark on a journey to find the true meaning of home, from the bustling streets of Kumasi to the vibrant heart of London.", "description": "Home Song is written, directed and composed by theatre-maker and composer Cassiopeia Berkeley-Agyepong .\n\nA Unicorn Theatre production. Originally commissioned and produced by Unicorn Theatre and Talawa Theatre Company. Developed through Talawa Theatre Company’s Early Years Programme, supported by the Paul Hamlyn Foundation and Arts Council England.", "first_date": "2026-10-02", "last_date": "2026-11-08", "url": "https://www.unicorntheatre.com/events/home-song-2026", "tags": ["theatre"], "id": "e518", "venue_name": "Unicorn Theatre", "venue_area": "London Bridge"}, {"venue_id": "bethnal-green-wmc", "title": "DISCO 54: RE-MIXED!", "byline": "------------------------------- DISCO 54 is back.. and she's evolved... You can still expect all the usual ’54 goodness we’re famous for, now with a healthy dose of disco-fied house to get you twirling under the mirrorball.", "description": "DJ GEOFF LEONARD will keep the dance floor throbbing and the beat pulsing. We start with authentic and addictive Disco hits; rare grooves, blaring trumpets 'n' bass, before the hypnotising, house-inflected tracks take over. It’s all 4-to-the-floor grooves, designed to make you dance. Played as they were meant to be heard: on pristine vinyl - Warm, DEEP and delicious!\n\nIt’s not just about the music though... Look out for our fierce and fabulous pop up performers; who’ll leave you screaming out for more! Follow the beat and head to BGWMC for a night of heedless optimism - where GLITTER, GLAMOUR, GREAT MUSIC AND GOOD TIMES combine in a dancefloor crescendo!", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://www.tickettailor.com/events/workingmens-club/2396943", "tags": ["theatre"], "price_min": 5.0, "price_max": 12.0, "id": "e519", "venue_name": "Bethnal Green Working Men's Club", "venue_area": "Bethnal Green"}, {"venue_id": "canal-cafe", "title": "The Experience", "byline": "A magic comedy mentalism show like never seen before.", "description": "Step into the captivating world of magic, mind-reading, comedy, and daring escapes with Mind Bender’s electrifying live show — The Experience. Now touring across Canada, Ireland, and the U. K. — including a special stop in London — The Experience is a high-energy, interactive spectacle that blurs the line between reality and illusion. From impossible feats of mentalism to Mind Bender’s shocking body bag escape, this is a show you have to see to believe.", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://canalcafetheatre.com/our-shows/experience/", "tags": ["magic", "comedy"], "id": "e520", "venue_name": "Canal Café Theatre", "venue_area": "Little Venice"}, {"venue_id": "greenwich-theatre", "title": "Jimmy Nail: Stories and Songs", "byline": "Acclaimed actor, singer, musician and writer — and proud Geordie icon — Jimmy Nail heads out on the road in 2026 with Stories and Songs, a series of intimate retrospective shows reflecting on an extraordinary seven-decade career.", "description": "From the landmark television series Auf Wiedersehen, Pet to Spender and then Crocodile Shoes — which spawned multi-platinum albums and chart-topping singles — Jimmy Nail has left an indelible mark on British popular culture. His career spans hit records, television series, major film roles including Evita and Still Crazy, and leading performances on both Broadway and London’s West End.\n\nFollowing a recent run of sell-out shows in Newcastle, celebrating the songs of Crocodile Shoes, Jimmy now brings audiences something more personal.", "first_date": "2026-10-03", "last_date": "2026-10-30", "url": "https://greenwichtheatre.org.uk/events/jimmy-nail/", "tags": ["concert"], "id": "e521", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "half-moon", "title": "FREE Family Fun Day", "byline": "Our Fun Palace free family fun day returns for an eleventh year with another selection of fun community events to get involved in.", "description": "Join us from 10am-4pm as we create a Fun Palace throughout our building and garden with an inspiring programme of events for all ages, celebrating arts, culture and science.\n\nThroughout the day, we will have pop-up storytelling performances, music and movement workshops, plus art and craft activities for everyone to get involved with. We’ll also have tea, cake and a few surprises along the way. Dip into one or two events or stay for the whole day!", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://www.halfmoon.org.uk/events/fun-palace-free-family-fun-day/", "tags": ["theatre"], "id": "e522", "venue_name": "Half Moon Theatre", "venue_area": "Limehouse"}, {"venue_id": "hoxton-hall", "title": "Fun Palace 2026", "byline": null, "description": null, "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173691590", "tags": ["theatre"], "id": "e523", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "lyric-hammersmith", "title": "Mr Sleepybum's Dream Machine", "byline": "To solve this problem, he invents a machine that magically brings dreams to life, featuring dinosaurs, robots, car chases, the world’s largest blanket, and much more!", "description": "This award-winning interactive show is filled with sketches, slapstick, and silliness, ensuring maximum fun for the whole family.\n\nFor all our productions, we offer one complimentary carer/companion seat for every full price access ticket booked.\n\nYou can book by calling our box office on 020 8741 6850, via email access@lyric.co.uk or you can pop into the theatre in person.", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://lyric.co.uk/shows/mr-sleepybums-dream-machine/", "tags": ["theatre"], "id": "e524", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "museum-of-comedy", "title": "Logan Murray’s Stand Up Course (Weekends)", "byline": "Past participants have gone on to win every major comedy award.", "description": "Perhaps that’s why it is one of the most highly regarded comedy workshops in Europe. Logan takes a special pride in helping you unlock your own unique comic voice. He will encourage you to be the best comedian you can possibly be.\n\nThis six week course gives you a chance to go deeper into the art and craft of making people laugh. From finding your creative inspiration to learning the building blocks of jokes, these sessions will help you become a better writer and performer.", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://www.museumofcomedy.com/logan-murrays-stand-up-course-weekends/", "tags": ["class"], "id": "e525", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "polka", "title": "A Class of Your Own", "byline": "Following the huge success of Tangled Feet’s ‘Need a Little Help’, ‘Butterflies’ and ‘Belongings’ (nominated for two OFFIES Awards) the company return with the next instalment of their transformative theatre for young people.", "description": "Everyone has things bubbling inside them. Some things are confusing, some are exciting and others are a total surprise! Do we let them burst out or keep them in? What if it’s not what anyone wants to hear? What if it’s a problem? What if people think I’m a problem? How can I release the bubbles before I pop?\n\nWith their exhilarating physical theatre and stunning video projection, Tangled Feet reveal the wisdom we can learn from those excluded from school and how the labels we’re given don’t have to define us.", "first_date": "2026-10-03", "last_date": "2026-10-04", "url": "https://polkatheatre.com/event/a-class-of-your-own/", "tags": ["theatre"], "id": "e526", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "puppet-barge", "title": "LIVE STORYTELLING: The Embers Collective & Something Sleeps (RICHMOND)", "byline": "The Embers Collective and Something Sleeps are climbing aboard The Puppet Barge for a magical evening of stories, songs and poems.", "description": "The Embers Collective have spent years creating shows combining storytelling and live music that’s taken them to festivals and theatres across the UK and abroad. They’ve hosted their own radio show, produced a monthly podcast and been commissioned to create work for the London Literature Festival, The Southbank Centre, History Hit TV, The National Trust and Wilderness. Something Sleeps blend exquisite vocal-harmonies through a dreamy underbed of guitars, shruti box and clarinet, creating a dream-like experience with their vocal harmonies and emotionally provocative lyrics. Their debut album was released by Cuculi Records and was played across BBC Radio and saw them touring the UK Festivals, playing iconic venues such as The Green Note (London) and Band On The Wall (Manchester) as well as supporting Martin & Eliza Carthy. They have recently been awarded a mentorship pathway with Sound Roots UK (English Folk Expo/Manchester Folk Expo) and their second album is due to be released in 2027, partially funded by EFDSS.", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://www.puppetbarge.com/the-embers-collective-something-sleeps-richmond", "tags": ["spoken-word", "concert"], "id": "e527", "venue_name": "Puppet Theatre Barge", "venue_area": "Little Venice"}, {"venue_id": "shoreditch-town-hall", "title": "Shoreditch Town Hall is a Fun Palace! 2026", "byline": "J oin us for a family-friendly day of creativity and chat with activities like board games and colouring in, alongside workshops, taster sessions and stalls!", "description": "Come along to chill out with some free refreshments (tea, coffee, snacks) and be part of what happens in our building\n\nConfirmed activities include: Shoreditch Town Hall History Tours , colouring and board games in our Council Chamber, a Tea Party with Compassionate Neighbours , workshops with Change, Act! , costuming with House of Trius , and stalls with It Takes a Village and Shoreditch Trust .", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://shoreditchtownhall.com/whats-on/shoreditch-town-hall-is-a-fun-palace-2026", "tags": ["theatre"], "id": "e528", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "stone-nest", "title": "Wind Alone, Sand Alone - Make No Sound", "byline": "Six musicians from Korea and France explore sound as a collective phenomenon born of encounter and relationship: Wind Alone, Sand Alone - Make No Sound.", "description": "‍ The breath, vocalisation, friction, and resonance of sound artist Rémi Klemensiewicz, haegeum player Yeji Kim , viola d'amore player Olivier Marin , geomungo player Eunyong Sim of JAMBINAI, medieval vocalist Christian Ploix , and jeongga (traditional Korean vocal music) singer Yoonyoung Cho interweave.\n\nThis performance unfolds in the round, immersing audiences within the evolving sonic landscape. As jeongga and medieval chant, traditional instruments, and ambient soundscapes seep into one another, we surrender to a boundless world where space itself takes centre stage. Through the act of relating, sound transforms into melody, harmony, and rhythm, organizing itself into music that carries emotion. Wind Alone, Sand Alone - Make No Sound unfolds this process of sound's emergence, relation, expansion, dissolution, and return across multiple layers of acoustic space. It is a sonic theatre that treats music as a living entity. Here, the hum of ventilation units, the buzz of lighting rigs, our shared breath, our voices, and our playing endlessly blur the lines between foreground and background. They appear and dissolve in harmony, transforming the space into one living, breathing organism.", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://www.stonenest.org/events/wind-alone-sand-alone", "tags": ["concert"], "id": "e529", "venue_name": "Stone Nest", "venue_area": "Soho"}, {"venue_id": "tabernacle", "title": "Song Academy Young Songwriter 2026 Showcase", "byline": "A celebration of the most original and exciting young songwriting talent in the country The top finalists in each of the 8–18 years old categories take to the stage to perform their own original songs alongside the Song Academy band.", "description": "Award-winning singer-songwriter RuthAnne is our special guest performer, and rising star and radio presenter Tallia Storm comperes and performs on the night. The winners will be announced live. Two times Grammy nominated songwriter RuthAnne has worked with some of the biggest names in pop with multi-Platinum global No.1’s totalling over 10 Billion streams with artists such as Niall Horan (Slow Hands/Nice to Meet ya), Britney Spears (Work B**tch), Martin Garrix & Bebe Rexha (In the Name of Love), JoJo (Too Little Too Late) plus has written with artists as varied as Jennifer Hudson, Tiesto, Maren Morris, Becky Hill, One Direction and Avicii. On top of this Ruth-Anne’s own artist project has seen huge success. Tallia Storm is a presenter, creator and media personality reaching over 2.5 million followers across her platforms. A former Capital Breakfast Scotland host, Tallia has fronted red carpet coverage, celebrity interviews, live events and digital content for some of the world's biggest entertainment brands, including the GRAMMY Awards, BAFTA Film Awards and Miami Swim Week. For 17 years Song Academy has been the launchpad for the next generation of songwriters and artists — GAYLE, Matilda Mann, Lexie Carroll, Hetta Falzon and Natalie Shay have all come through our programmes — and this is your chance to hear tomorrow's voices today. The showcase brings together songwriters, producers, artists and leading players from across the music industry — so as well as an unforgettable night of music, it's a rare chance to be in the room with the people shaping it. For parents with musical children it's an opportunity to inspire and motivate them to write their own songs & develop their creative talent. The Young Songwriter 2026 judges include Tom Odell, Toby Gad, RuthAnne, Jin Jin, Eg White, Dan Gillespie Sells, Hannah V, Tallia Storm, Miranda Cooper and Connie Talbot. TICKETS", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://www.thetabernaclew11.com/events/2026/7/27/5dkwioyrfe5hoxuynj4hlyqvk1djkq", "tags": ["concert"], "id": "e530", "venue_name": "The Tabernacle", "venue_area": "Notting Hill"}, {"venue_id": "the-albany", "title": "Jazz Saturdays", "byline": "Free performances in our café from Trinity Laban Conservatoire of Music and Dance.", "description": "Take a break from the hustle and bustle of Deptford market with Jazz Saturdays.\n\nTap your feet in our garden oasis, or take in the sounds over a spot of café lunch, this family-friendly drop-in makes the pleasure of live music free for the community.", "first_date": "2026-10-03", "last_date": "2026-12-05", "url": "https://www.thealbany.org.uk/events/jazz-saturdays", "tags": ["concert"], "id": "e531", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "the-cockpit", "title": "Living With... Love", "byline": "The second in a series of talks bringing together professionals from the arts, science, religion and philosophy, to ask: how can we help each other navigate and connect as fully as possible with the defining experiences of being human?", "description": "Speakers: (tbc). Curated by Natasha Wood (Podiatrist, Lewisham and Greenwich NHS Trust).\n\nSuitable for an adult audience (18 and above). The content may touch on sensitive issues.", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://www.thecockpit.org.uk/show/living_with_love", "tags": ["talk"], "id": "e532", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "theatre503", "title": "Directing New Writing with Anthony Simpson-Pike: 1-Day Intensive", "byline": "In this one day-intensive Theatre503’s Artistic Director and Co-CEO will take you through his process when working with new Writing.", "description": "Using Donbas, the first show he directed and dramaturged as part of his inaugural season as Theatre503’s Artistic director, you will learn how to analyse text and use your dramaturgical skills, work collaboratively with writers and actors, come up with a concept, how to solve creative roadblocks collaboratively, and practically work through sections of text to sharpen your skills. The day will culminate with a Q&A on the job of an Artistic Director and the journey to becoming one.\n\nSaturday 3 October 2026, 10am – 6pm at The 503Studio in Nine Elms (including a one hour break for lunch).\n\nThis masterclass will take place in-person at Theatre503’s Studio.", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://theatre503.com/whats-on/directing-new-writing-with-anthony-simpson-pike-1-day-intensive/", "tags": ["class"], "id": "e533", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "underbelly-boulevard", "title": "Ari Eldjárn: The Icelander’s Guide to Europe", "byline": "Star of Netflix & Mock the Week , Ari Eldjárn returns with a brand new stand up show! Iceland’s biggest comedian takes you on a hilarious journey through European habits, razor sharp impressions and cultural contradictions.", "description": "If a customer requires the assistance of a personal assistant or a carer to attend, the companion is eligible for a complimentary personal assistant ticket. Free companion tickets can be booked in person, by email or over the phone.\n\nTucked away on Level 1 of Underbelly Boulevard Soho, our bar is one of Soho’s best kept secrets. With a selection of well-crafted classic cocktails, wines, beer and cider, as well as delicious non-alcoholic and soft options, tea and coffee, there’s a drink for every occasion and every taste on the menu.", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://underbellyboulevard.com/tickets/ari-eldjarn-the-icelanders-guide-to-europe/", "tags": ["stand-up"], "id": "e534", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "union-theatre", "title": "TOY SOLDIER", "byline": "The Falkland Islands, July 2002.", "description": "Jane has been keeping a secret for 20 years, and amidst the grip of patriotism as the islanders celebrate the Queen’s Golden Jubilee, Jane returns to pack up the family home following the death of her mother.\n\nJane takes the audience on a journey through the Falklands conflict of 1982, which she shared with her younger brother, where isolation and fear became the daily norm.", "first_date": "2026-10-03", "last_date": "2026-10-18", "url": "https://uniontheatre.biz/show/toy-soldier/", "tags": ["theatre"], "id": "e535", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "vfd", "title": "Sani Play Readings: The Third Country", "byline": "Amira is a child refugee from Afghanistan held in an Australian detention centre in the Pacific.", "description": "Alone and afraid, her dream world cant keep her safe forever. Someone is watching. On the mainland the heat gets to Dolores and she wants out. Her decisions unleash repercussions that ignore time and space, but she’s too hot to notice. The Australian governments policy on detaining children in detention centre’s comes under scrutiny in this tale of choice and the states of being human.", "first_date": "2026-10-03", "last_date": "2026-10-03", "url": "https://www.vfdalston.com/our-events/2026/10/3/sani-play-readings-the-third-country", "tags": ["theatre"], "id": "e536", "venue_name": "VFD", "venue_area": "Dalston"}, {"venue_id": "canal-cafe", "title": "How To Win a Pub Quiz", "byline": null, "description": null, "first_date": "2026-10-04", "last_date": "2026-10-04", "url": "https://canalcafetheatre.com/our-shows/how-to-win-a-pub-quiz/", "tags": ["talk"], "id": "e537", "venue_name": "Canal Café Theatre", "venue_area": "Little Venice"}, {"venue_id": "eno", "title": "Barkouf", "byline": "this rare gem of an opera in a concert performance with narration by Alistair McGowan.", "description": null, "first_date": "2026-10-04", "last_date": "2026-10-04", "url": "https://www.eno.org/events/barkouf/", "tags": ["opera", "concert"], "id": "e538", "venue_name": "English National Opera", "venue_area": "St Martin's Lane"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: On The Edge", "byline": "This is a hugely energetic but skilfully controlled character comedy show which reveals the hilarious dynamics between three women who find themselves in a therapy session led by a therapist who never seems to get past the warm up.", "description": "These women are street smart parkour-enthusiast Cheryl; genteel widow Janet; Bonnie, the wannabe Aussie yogi influencer and ineffective therapist Linda who - try as she may - simply cannot escape them. This patchwork of intriguing characters looks at how the human brain navigates life’s challenges to find ways to cope and flourish, which leaves audiences laughing and reflecting. The four quirky yet relatable characters tell their unique stories by the means they know best including parkour, instagram live videos and dissociative conversations.\n\nDate & Time: Sunday 4th & Monday 5th October @ 7pm\n\nThe Bread & Roses Theatre is an unfunded venue that continues to operate on ticket sales only. Donations help support independent arts and theatremakers, an essential step in preserving the future of fringe theatre.", "first_date": "2026-10-04", "last_date": "2026-10-05", "url": "https://www.goldengoosetheatre.co.uk/whatson/on-the-edge", "tags": ["comedy", "theatre"], "id": "e539", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "greenwich-theatre", "title": "Soulsation", "byline": "Soulsation Get ready for an unforgettable night of Soul, Disco & Motown hits from the 70s 80s & More!", "description": "With “SOULSATION” This 5-Star Rated Show will have you dancing in your seat with LIVE performances, powerful vocals, dazzling dancers, and so much drama. ​ Relive the memories through the stories of those who partied to", "first_date": "2026-10-04", "last_date": "2026-10-04", "url": "https://greenwichtheatre.org.uk/events/soulsation/", "tags": ["concert"], "id": "e540", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hen-and-chickens", "title": "Keeping Your Spots", "byline": "It's a busy night, but there might be some calls even Jared might find difficult to deal with.", "description": "With a controversially neutral take on the subject, this darkly comic play attempts to dissect the reason (or reasons) why people choose to fulfil their darkest temptations.\n\nWritten & Performed by Joshua J. Jewkes Featuring the Voice Talents of Ben Felton, Jessica Ivy, Sara Sioufi, Will Tusker, and Cerys Jones", "first_date": "2026-10-04", "last_date": "2026-10-08", "url": "https://www.unrestrictedview.co.uk/events/keeping-your-spots-1", "tags": ["theatre", "comedy"], "id": "e541", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "orange-tree", "title": "Sunday Morning Coffee Concert", "byline": "Our Sunday Morning Coffee Concert series is curated by Dorothea Vogel, violist of the much-loved Allegri Quartet.", "description": "Dorothea Vogel and her colleagues return to the OT this October for an intimate concert in our unique space.\n\nThe programme opens with Mendelssohn’s String Quartet No.6, Op. 80 , a passionate and tragic four-movement work written as a requiem for his beloved sister, Fanny. Its sombre atmosphere is echoed in Puccini’s Crisantemi , a lyrical and deeply moving work written in a single night in 1890 following the sudden death of Amadeo I of Spain.", "first_date": "2026-10-04", "last_date": "2026-10-04", "url": "https://orangetreetheatre.co.uk/whats-on/sunday-morning-coffee-concert/", "tags": ["concert"], "id": "e542", "venue_name": "Orange Tree", "venue_area": "Richmond"}, {"venue_id": "southbank-centre", "title": "About Us! Artists' Scratch Showcase", "byline": "Join us for an evening of diverse new work from five artists, hosted by curator and lead scratch artist Awate.", "description": "Get a glimpse behind the curtain of creation and imagination as five artists take to the floor to share new works in progress. Audiences are invited to give feedback and ask questions in a safe, communal space to help lift up artists. This event is open to all audiences wanting to experience work in its initial stages of development, and applications to present work are open to artists aged over 18 from a global majority background (or tackling the subjects of diaspora and migration), whether you’re a writer, musician, dancer, film-maker, designer or anything in between. In the past we’ve had films inspired by Greek mythology, stylists presenting their original textile designs, stand-up comedy, powerful rap music, innovative piano performances and short plays reflecting on the trans experience. After presenting at our Scratch event, artists have gone on to embark on their first UK music tours, had their short-films made/presented at the BFI London Film Festival, secured options from high-profile TV production companies, started their own regular comedy nights and found lasting connections with other artists in the audience or presenting alongside them. This Scratch Showcase is a collaboration between Awate, Counterpoints Arts and the Southbank Centre.", "first_date": "2026-10-04", "last_date": "2026-10-04", "url": "https://www.southbankcentre.co.uk/whats-on/about-us-artists-scratch-showcase/", "tags": ["theatre"], "price_min": 0.0, "id": "e543", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "the-cockpit", "title": "New Stuff: October", "byline": "Our monthly night of rehearsed readings. Join us for the opportunity to see exciting new work and engage in conversation with other writers, creatives, and theatre-goers.", "description": "Set up by a mutual friend, two strangers meet for a blind date at a London restaurant. As awkward introductions turn into genuine conversation, they discover their paths may have crossed long before that evening. A warm, funny two-hander about timing, chemistry, and finding connection when you least expect it.\n\nIn Their Image explores the cycle of trauma, what it means to love, and which elements of human nature remain constant even in vastly different worlds. The story follows two intertwined timelines: Sunhee’s youth in North Korea and her present life in London. Young Sunhee, an upper-class high school student, begins a secret romance with Jintae, who introduces her to forbidden ideas. Their growing secrecy ultimately leads to a desperate plan to escape. In the present, Sunhee lives with her 19-year-old son Adam, who she keeps under strict control while recounting memories with \"Ghost Jintae\"", "first_date": "2026-10-04", "last_date": "2026-10-04", "url": "https://www.thecockpit.org.uk/show/new_stuff_october_1", "tags": ["theatre"], "id": "e544", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-glitch", "title": "Bard As Nails: Classical Acting Workshop", "byline": "Bard As Nails workshops provide a fun, playful space for actors to practice working with classical texts.", "description": "They are less of a class and more of a mini R&D, and are suitable for all levels of experience, whether you're new to the Bard or a seasoned veteran! This month we will be working with scenes from \"The Duchess of Malfi\" (1612) by John Webster. We'll start with a check-in, then do some exercises to get ourselves feeling familiar with the scenes. Then, we get the scene up on its feet and experiment with it as much as possible, trying out different playing spaces, contexts, and objectives to see what discoveries we can make. There's no pressure to sound clever or \"get it right\" - just two hours of bashing the scene out in the space and being silly with it! The workshops are relaxed - you can pop out of the room whenever you need - and scripts are provided on the day. There is no expectation to be off book - just bring your creative energy and come ready to play! We cap our workshops at 10 participants max, so that everyone gets plenty of stage time.", "first_date": "2026-10-04", "last_date": "2026-10-04", "url": "https://www.tickettailor.com/events/vaultcreativearts/2403478", "tags": ["class"], "id": "e545", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "hen-and-chickens", "title": "Shake it Up: The Improvised Shakespeare Show", "byline": "Shakespeare hasn’t written anything new for an age, so we thought we’d give him a hand.", "description": "Using his language, your audience suggestions and our overactive imaginations, we create a brand new Shakespeare play live on stage! Join ShakeItUp Theatre for an evening of improvised Bard-based Bedlam. Every show is a classic Shakespeare would have been proud to write…. (probably).\n\n**_“Quick witted, inexhaustible and absolutely hysterical.” *****_** London Theatre Reviews\n\n**_“Alas I wishe I had written this myselffe”_** Christopher Marlowe", "first_date": "2026-10-05", "last_date": "2026-12-07", "url": "https://www.unrestrictedview.co.uk/events/shake-it-up", "tags": ["theatre", "comedy"], "id": "e546", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "hope-theatre", "title": "Fathom", "byline": null, "description": null, "first_date": "2026-10-05", "last_date": "2026-10-07", "url": "https://www.thehopetheatre.com/fathom", "tags": ["theatre"], "id": "e547", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "theatre503", "title": "Playing With Form: Different Ways of Telling Stories with Danny James King: In Person Masterclass", "byline": "In this masterclass we’ll explore playing with form and structure in playwriting.", "description": "Beginning with linear narratives and traditional structure, we will learn the basic rules of narrative before exploring the different ways that form can be disrupted. We will examine the difference between closed and open uses of time and space as well as more abstract employments of the form. I will be using my upcoming play, The Houseguest, as an example, which uses a rare closed time, open space structure.\n\nThis masterclass will take place in-person at Theatre503’s Studio.\n\nThanks to our Share The Drama scheme , we want to make sure those of you who are struggling in the current climate can still take part in our Writers Programme. If you would like to book a Share The Drama bursary for the Writer’s Programme, please call our box office on 02079787040 to enquire about payment and availability.", "first_date": "2026-10-05", "last_date": "2026-10-05", "url": "https://theatre503.com/whats-on/playing-with-form-different-ways-of-telling-stories-with-danny-james-king-in-person-masterclass/", "tags": ["class"], "id": "e548", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "bac", "title": "NINA", "byline": "A series of actresses audition to play Nina in The Seagull for a charismatic, yet sinister director. His methods are unorthodox, annihilating, and very effective.", "description": "In a debut play from celebrated director Caroline Williams , co-directed by award-winning artist Deborah Pearson , NINA questions why so many women are drawn to play an actress who has everything taken away from her by men. And why do the men in Chekhov’s original play keep trying to turn the girls they fancy into dead seagulls?\n\nIn a post #MeToo era, NINA is a meta theatrical fever dream on coercion, power and the quest for creative expression.", "first_date": "2026-10-06", "last_date": "2026-10-24", "url": "https://bac.org.uk/whats-on/nina/", "tags": ["theatre"], "id": "e549", "venue_name": "Battersea Arts Centre", "venue_area": "Battersea"}, {"venue_id": "brockley-jack", "title": "ORWELL – The Road to 1984", "byline": "ORWELL: The Road to 1984 tells the fascinating story of one of the greatest writers of the twentieth century and the extraordinary personal experiences that inspired his classic tales Animal Farm and Nineteen Eighty-Four.", "description": "It is a timely portrait of a writer whose words remain a warning – and a hope.\n\nGeorge Orwell is perhaps the most influential English writer of the twentieth century. His classic tales Animal Farm and Nineteen Eighty-Four which warn of the dangers of totalitarianism – erosion of free speech, abuse of power, increasing control of all aspects of our everyday lives – resonate now more than ever.", "first_date": "2026-10-06", "last_date": "2026-10-10", "url": "https://brockleyjack.co.uk/jackstudio-entry/orwell-the-road-to-1984/", "tags": ["theatre"], "id": "e550", "venue_name": "Brockley Jack Studio", "venue_area": "Crofton Park"}, {"venue_id": "camden-peoples-theatre", "title": "Tripping Out (WIP)", "byline": "What can you be made to do? Would you notice if you were part of an experiment?", "description": "The CIA wanted to discover whether mind control was possible. They called the programme MK ULTRA.\n\nTripping Out explores one of the Cold War's most notorious secret programmes and its relationship with the countercultural movement of the 1960s. Drawing on declassified documents, testimonies, archival imagery, and historical research the piece is part history play, part mind control experiment, part LSD light show. We ask what people can be made to do and how belief can be shaped? Why is this secret history still echoing through today's world of conspiracy theories, political distrust, and competing realities?", "first_date": "2026-10-06", "last_date": "2026-10-06", "url": "https://cptheatre.co.uk/whatson/Tripping-Out-WIP", "tags": ["theatre"], "id": "e551", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "camden-peoples-theatre", "title": "Standing Ovation (WIP)", "byline": "Miggy wants to keep you entertained and they’ll do whatever it takes to make sure you are.", "description": "Never mind their upcoming PIP reassessment, their phone call to the GP, the council not emailing back or the ramp-less train - Miggy is determined not to let their disability get in the way of your good time!\n\nBlending drag, clowning, stand-up and storytelling with the realities of living as a disabled person, Miggy is attempting to figure out what it takes to make you listen.", "first_date": "2026-10-06", "last_date": "2026-10-06", "url": "https://cptheatre.co.uk/whatson/Standing-Ovation-wip", "tags": ["stand-up", "comedy"], "id": "e552", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "drayton-arms", "title": "Tides (An Autism Story)", "byline": "Dylan Ward is autistic. He has his own way of thinking and his own way of doing things, but no one seems to understand him. How do you navigate a world which operates on a completely different wavelength to the one that you’re on?", "description": "Following its hugely successful and critically acclaimed run at the 2025 Edinburgh Fringe Festival , and based on real experiences of growing up autistic, Tides (An Autism Story), combines Monty Pythonesque humour with a touch of drama to offer an insight into the wonderful, yet challenging world of autism... From one particularly silly individual.\n\nCatch a sneak peak Tides (An Autism Story) - Trailer", "first_date": "2026-10-06", "last_date": "2026-10-10", "url": "https://thedraytonarmstheatre.co.uk/tides", "tags": ["theatre", "comedy"], "id": "e553", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "etcetera", "title": "I'm Not Myself Today: A Villainous Cabaret", "byline": "At the end of a summer holiday, an eccentric child delights in watching villains from Cruella DeVil to Dick Dastardly.", "description": "But nothing can prepare him for the scariest villain of all...reality. Along his journey, he faces trials and tribulations of classism & violence, which brings him to the conclusion that he himself may well be a villain too. With no alternative, he creates a machine that breaks down cruel reality and mixes it with manageable fiction, leading to a finale most… villainous! Packed with songs such as: Be Prepared (The Lion King), Rogues Are We (Holy Musical Batman) & Stay With Me (Into The Woods). Instagram - inmt_avillainiouscabaret", "first_date": "2026-10-06", "last_date": "2026-10-06", "url": "https://www.etceteratheatrecamden.com/events/im-not-myself-today-a-villainous-cabaret", "tags": ["musical", "theatre"], "id": "e554", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "etcetera", "title": "Halfway Home", "byline": "Halfway Home (5* The Wee Review) follows the Crighton family, Freddie, an aspiring policeman, and his fiancée, Laura, a nurse working in a strained healthcare system.", "description": "Everything seems to be going for the young couple until Davie, Freddie’s brother, is released from prison with nowhere to go. Attempting to reconnect the family, Davie is taken in, however his dark past of alcohol addiction casts a shadow over the couples’ suburban dreams. Worldviews collide, hard truths are told, and secrets are revealed. Can the past be put to rest and will these three characters ever live the conventional family life they all want?\n\n16+, depictions of addiction, swearing, mention of domestic violence, use of alcohol", "first_date": "2026-10-06", "last_date": "2026-10-08", "url": "https://www.etceteratheatrecamden.com/events/halfway-home", "tags": ["theatre"], "id": "e555", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: Romeo and Juliet in Kathmandu", "byline": "Kathma
