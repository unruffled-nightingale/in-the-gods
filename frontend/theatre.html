 family, folklore and love, all accompanied by a live folk band; think euphoric ensemble numbers, ceilidh dances and a focus on nature, its continued importance and its folklore. This musical work is made up of talented and passionate young actors, creatives and friends and is appropriate for families and older audiences alike. We look forward to seeing you there!\n\nComposer/Writer - Erinn McDonnell Cello/vocals - Teresa Garcia Ribeiro Percussion/vocals - Oliver Spicer Violin/Vocals - Matthew Potts Aíne - Ellie Smith Aoife - Chloe Puchert Fiadh - TBC Aiden - TBC\n\nThis Production is using a third-party ticketing provider.", "first_date": "2026-10-19", "last_date": "2026-10-19", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-the-ballad-of-cailleach", "tags": ["musical"], "id": "e719", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: Tall Tails", "byline": "Five mermaids. People-pleasers retreat. Doing the work so you don’t have to.", "description": "Dive into a hilarious coming-of-quarter-age comedy that makes waves navigating dating disasters, epic misadventures and the choppy waters between girlhood and womanhood. An ocean away from home, catch them entangled in the fishnets of friendship, big feelings and our tall tails. Witness the clam-ities, or don’t – we want what’s best for you!!\n\nDate & Time: Monday 19th, Tuesday 20th, Wednesday 21st October @8:30pm\n\nThis Production is using a third-party ticketing provider.", "first_date": "2026-10-19", "last_date": "2026-10-21", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-tall-tails", "tags": ["comedy"], "id": "e720", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "greenwich-theatre", "title": "Confessions of Sweeney Todd", "byline": "Confessions of Sweeney Todd An original one-man performance featuring an audience with the infamous Demon Barber of Fleet Street himself, Sweeney Todd!", "description": "The classic penny dreadful tale is performed with gusto and swagger by Jonathan Goodwin in a show directed by Gary Archer. Please note, this is not a musical.", "first_date": "2026-10-19", "last_date": "2026-10-19", "url": "https://greenwichtheatre.org.uk/events/confessions-of-sweeney-todd/", "tags": ["theatre"], "id": "e721", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "ica", "title": "In the Round: HYD", "byline": "Critically acclaimed artist HYD creates dynamic, seductive pop that blends experimental sound with striking visual worlds. They perform as part of our In the Round series, using the venue's 360° Soundsystem, d&b Soundscape.", "description": null, "first_date": "2026-10-19", "last_date": "2026-10-19", "url": "https://www.ica.art/live/hyd", "tags": ["concert"], "id": "e722", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "shoreditch-town-hall", "title": "Workshop – Re:Treat", "byline": "Join Theatre Re to mark 15 years and celebrate 10 years of their acclaimed show The Nature of Forgetting with this week-long intensive.", "description": "Meet fellow performers, makers, recent graduates and actors in training and immerse yourself into the devising methods behind the company’s internationally acclaimed work and unique method of storytelling.\n\nCombining rigorous physical training with collaborative creation, the intensive offers a rare opportunity to explore how Theatre Re builds emotionally powerful narratives through movement, rhythm, live music and ensemble work - without relying on text.", "first_date": "2026-10-19", "last_date": "2026-10-23", "url": "https://shoreditchtownhall.com/whats-on/theatre-re-retreat", "tags": ["class"], "id": "e723", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "the-cockpit", "title": "Theatre in The Pound: October", "byline": "A not-for-profit scratch night, designed for individuals or groups of performers to try out 10-15 minutes of new work at The Cockpit.", "description": "Our legendary scratch nights are an accessible, affordable way for artists to try out new work on stage with full support from our backstage and tech crew.\n\nFor audiences, they're a cheap and fun night out, with the chance to see new work and share your thoughts directly with the performers!", "first_date": "2026-10-19", "last_date": "2026-10-19", "url": "https://www.thecockpit.org.uk/show/theatre_in_the_pound_october_2", "tags": ["theatre"], "id": "e724", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "union-theatre", "title": "HIM.", "byline": "When Jane unexpectedly falls pregnant with Charlie, she agrees that he will raise the child with his new partner, Osmond.", "description": "But, over time, their genuine yet imperfect agreement begins to crack under the weight of lingering doubt, buried resentment and conflicting loyalties.\n\nDarkly funny, emotionally charged and painfully honest, HIM explores the fragile truths and lies we construct to protect ourselves and the people we care about most. Because some decisions shape a lifetime. And some debts will never truly be repaid.", "first_date": "2026-10-19", "last_date": "2026-10-30", "url": "https://uniontheatre.biz/show/him/", "tags": ["theatre"], "id": "e725", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "wiltons", "title": "OneTrackMinds", "byline": "The award-winning live show returns to Wilton’s Music Hall for another night of music and storytelling.", "description": "An engaging cross between Desert Island Discs, TED Talks and The Moth, OneTrackMinds asks a selection of five guests to tell a story about one song that has changed their life – before we play that song to the audience.\n\nPrevious guests have included: Sir David Suchet, Katie Melua, Jane Horrocks, Harry Hill, Peter Tatchell, Inua Ellams, Tom Basden, Jessie Buckley, Deborah Frances White and Chris Difford.", "first_date": "2026-10-19", "last_date": "2026-10-19", "url": "https://wiltons.org.uk/whats-on/onetrackminds/", "tags": ["talk"], "id": "e726", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "barons-court", "title": "Grimfest 2026", "byline": "A celebration of dark & twisted theatre in the bleeding heart of London!", "description": "What better way to celebrate Halloween month than by revelling in the darkest and most twisted theatre London has to offer? So grab your tickets and come see a show or ten! We got plenty! ​", "first_date": "2026-10-20", "last_date": "2026-10-31", "url": "https://www.baronscourttheatre.com/grimfest2026", "tags": ["theatre"], "id": "e727", "venue_name": "Barons Court Theatre", "venue_area": "Barons Court"}, {"venue_id": "bridewell", "title": "Be More Chill", "byline": null, "description": null, "first_date": "2026-10-20", "last_date": "2026-10-20", "url": "https://sbf.org.uk/whats-on/view/be-more-chill/", "tags": ["musical"], "id": "e728", "venue_name": "Bridewell Theatre", "venue_area": "Blackfriars"}, {"venue_id": "bridge-house", "title": "Dracula", "byline": "When celebrated vampire hunter Mina Harker is invited to speak at a Victorian scientific society, their aim is to belittle and discredit her ridiculous claims.", "description": "But as they hear the tale of her fight with the sinister Count Dracula, they are chilled to the bone by a story they will never forget.\n\nAndrew Hobbs, writer and director of previous acclaimed adaptations of F rankenstein , The Strange Case Of Dr Jekyll & Mr Hyde and The Hound Of The Baskervilles and director of this year’s popular horror premiere The Horrors Of Hell House , brings Bram Stoker’s gothic classic to life in a thrilling and innovative new version starring Ellie Ward (Penge West, The Horrors Of Hell House) as Mina Harker, Will Croft (The Unkillable Mike Molloy, The Legacy Of William Ireland) as Abraham Van Helsing and Paul Winterford (Frankenstein, The Strange Case of Dr Jekyll & Mr Hyde) as Count Dracula.", "first_date": "2026-10-20", "last_date": "2026-10-31", "url": "https://thebridgehousetheatre.co.uk/shows/dracula/", "tags": ["theatre"], "id": "e729", "venue_name": "The Bridge House Theatre", "venue_area": "Penge"}, {"venue_id": "brockley-jack", "title": "Complicité", "byline": "Simon, a primary school teacher, has handcuffed himself to a tree for a climate protest. Hours have passed. His friends have abandoned him.", "description": "Benoit, an oil drilling engineer, roams the streets looking for kicks. Drunk, desperate and totally alone, he has nothing left to lose.\n\nWhat can ensue but a clash of personality, ideology, and culture?", "first_date": "2026-10-20", "last_date": "2026-10-31", "url": "https://brockleyjack.co.uk/jackstudio-entry/complicite/", "tags": ["theatre"], "id": "e730", "venue_name": "Brockley Jack Studio", "venue_area": "Crofton Park"}, {"venue_id": "camden-peoples-theatre", "title": "SIGH (WIP)", "byline": "Through movement, text and sound, -SIGH- offers audiences an intimate, accessible and emotionally rich portrait of a man navigating queerness, loss and the complicated legacy of a father who's never fully accepted him.", "description": null, "first_date": "2026-10-20", "last_date": "2026-10-20", "url": "https://cptheatre.co.uk/whatson/SIGH-WIP", "tags": ["theatre"], "id": "e731", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "camden-peoples-theatre", "title": "Deen over Dunya (WIP)", "byline": "'Deen Over Dunya' is a musical exploring the commercialisation of Islam and environmentalism from an Islamic point of view.", "description": null, "first_date": "2026-10-20", "last_date": "2026-10-20", "url": "https://cptheatre.co.uk/whatson/Deen-over-Dunya-WIP", "tags": ["musical"], "id": "e732", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "drayton-arms", "title": "The Two-Character Play", "byline": "The Two-Character Play is an intimate two-hander about a brother and sister bound together by love, but also by circumstance and a past trauma that has slowly cut them off from the outside world.", "description": "Their relationship is tender and fierce, but also codependent and edging toward toxicity, two people trapped in patterns they cannot break, and in each other. It is a play within a play, where the boundaries between reality and performance dissolve entirely the space they inhabit may be a theatre or a home, and we are never certain what is real and what is not. At its heart it is a play about those who are deemed too broken, too strange, too damaged to belong and what becomes of them when the world walks away.\n\nAs South Asian immigrant artists, we know something of living on the edge of a world that wasn't built with us in mind and in Felice and Clare, we recognise that truth. Too often, the world assumes that stories like Tennessee Williams's aren't ours to tell. Contemporary theatre too often frames these stories through a narrow lens of race, accent, or geography, stripping away the universality and depth of his work. Reimagined through a South Asian lens, this is our way of claiming our author back, because the truth we keep returning to is that this story was never anyone's to keep, and always everyone's to tell.\n\nFancy dinner and a show? Book at table at the Drayton Arms pub now and enjoy the pre-theatre menu before heading upstairs", "first_date": "2026-10-20", "last_date": "2026-10-24", "url": "https://thedraytonarmstheatre.co.uk/the-two-character-play", "tags": ["theatre"], "id": "e733", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "etcetera", "title": "BRONSON", "byline": "BRONSON is a powerful one-man theatrical exploration inspired by the extraordinary public persona and life surrounding one of Britain’s most notorious prisoners.", "description": "Performed by Francis Saunders and directed by Sean Broughton, the production takes the audience inside a world of confinement, violence, humour, identity and survival.\n\nMoving between characters and states of mind, the performance explores the man behind the mythology and asks a much bigger question: when someone spends decades inside an institution, where does the individual end and the character created by that institution begin?", "first_date": "2026-10-20", "last_date": "2026-10-20", "url": "https://www.etceteratheatrecamden.com/events/bronson", "tags": ["theatre"], "id": "e734", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "hackney-empire", "title": "The World As We See It", "byline": "two powerful contrasting visions of our world today.", "description": "Find out about getting here, access & support, plus food & drink", "first_date": "2026-10-20", "last_date": "2026-10-20", "url": "https://www.hackneyempire.co.uk/events/twawsi-the-world-as-we-see-it", "tags": ["theatre"], "id": "e735", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "ica", "title": "In the Round: Tara Clerkin Trio (SOLD OUT)", "byline": "Tara Clerkin Trio perform a two night residency as part of our In the Round series in October.", "description": null, "first_date": "2026-10-20", "last_date": "2026-10-21", "url": "https://www.ica.art/live/tara-clerkin-trio", "tags": ["concert"], "id": "e736", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "pleasance-islington", "title": "I Was Always Here", "byline": "For more information about our venues and performance spaces, please visit our access pages here .", "description": "Assistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-10-20", "last_date": "2026-10-22", "url": "https://www.pleasance.co.uk/event/i-was-always-here", "tags": ["theatre"], "id": "e737", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "shakespeares-globe", "title": "Samurai Othello: Sharing and Discussion", "byline": "a work-in-progress sharing of Othello , set in medieval Japan.", "description": "This project delves into what new meanings and ideas could emerge when Shakespeare meets Samurai, both as a popular culture genre and part of Japanese cultural history.\n\nThis sharing is the culmination of a week of workshops exploring the idea. Join us to see extracts of the play in development. Then stay for a panel discussion with the cast, creatives, and cultural collaborators, where you can feed back, ask questions, and help shape the future direction of the piece.", "first_date": "2026-10-20", "last_date": "2026-10-20", "url": "https://www.shakespearesglobe.com/whats-on/samurai-othello/", "tags": ["theatre"], "id": "e738", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "shoreditch-town-hall", "title": "Taster Menu", "byline": "Following a successful Taster Menu earlier this year, Mod Collective are back with a free evening of games, chats and heists.", "description": "Can you safeguard your street from elemental monsters?\n\nHow about assembling a band of co-conspirators and undertaking a reverse heist?", "first_date": "2026-10-20", "last_date": "2026-10-20", "url": "https://shoreditchtownhall.com/whats-on/taster-menu-autumn-2026", "tags": ["theatre"], "id": "e739", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "stratford-east", "title": "Surinderella", "byline": "Rifco Arts Indian retelling of the Cinderella story in a panto style....", "description": null, "first_date": "2026-10-20", "last_date": "2026-10-31", "url": "https://stratfordeast.com/whats-on/all-shows/surinderella", "tags": ["theatre"], "id": "e740", "venue_name": "Theatre Royal Stratford East", "venue_area": "Stratford"}, {"venue_id": "alexandra-palace", "title": "Rhythm Stick Club Night – Live From Ally Pally", "byline": "Join us as our Victorian Theatre is transformed into Rhythm Stick – the most exclusive inclusive club night in London!", "description": "Rhythm Stick is an inclusive club night designed by and for adults with disabilities, and it finally returns home to Alexandra Palace Theatre this October. Grab your glowsticks, slap on some glitter, don your best party fit and throw some shapes.\n\nRhythm Stick is part of Live From Ally Pally , a programme of events that marks 90 years since the start of television broadcasting at Alexandra Palace.", "first_date": "2026-10-21", "last_date": "2026-10-21", "url": "https://www.alexandrapalace.com/whats-on/rhythm-stick-club-night/", "tags": ["social"], "id": "e741", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "camden-peoples-theatre", "title": "The Only Brown Deaf Man in England", "byline": "All performances are in BSL with spoken English voiceover and English captions.", "description": "Fleeing genocide, dodging racists, losing loved ones, and somehow finding laughter in it all, Rajkumar plays each moment like a batsman at the crease - reading the spin, riding the bounce, and swinging when it counts. His story is funny, fierce, and deeply moving. Told through a dynamic blend of British Sign Language and Visual Vernacular, the show transforms memory into vivid, cinematic storytelling - where whole worlds are built through the body, rhythm and imagination. It’s bold, inventive and visually striking, offering a rich theatrical experience for Deaf and hearing audiences alike. No prior knowledge of BSL is needed - the storytelling is immediate, intuitive, and universally felt.\n\nA Mercury Theatre Original in association with CPT in collaboration with Fuse Theatre.", "first_date": "2026-10-21", "last_date": "2026-11-07", "url": "https://cptheatre.co.uk/whatson/The-Only-Brown-Deaf-Man-in-England-26", "tags": ["theatre"], "id": "e742", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "etcetera", "title": "On Air…", "byline": "Originally performed at Ventnor Fringe in 2024, On Air… comes to London in a newly reimagined production.", "description": "Set during a live radio broadcast, an ambitious young presenter lands the opportunity of a lifetime, only to find the studio is far from what it seems. As the pressure mounts and the show starts to spiral out of control, a gripping psychological drama unfolds. The audience is left questioning, far would you go to stay in control?", "first_date": "2026-10-21", "last_date": "2026-10-22", "url": "https://www.etceteratheatrecamden.com/events/on-air", "tags": ["theatre"], "id": "e743", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "hackney-empire", "title": "Susan Calman: Tall Tales", "byline": "A decade older, but not necessarily wiser, Susan has found herself in some improbable situations over the years.", "description": "Tall Tales is a show about cruising, driving tanks, cats and getting older. You might have seen her on the television or heard her on the radio but the absolute best way to see her is live on stage. You won’t believe how short she really is.\n\nPrepare yourself for an evening of barely believable stories, laughter and probably some dancing. As seen on Grand Day Out , Cruising with Susan Calman , QI , House of Games and (a long time ago) Strictly Come Dancing .\n\nFind out about getting here, access & support, plus food & drink", "first_date": "2026-10-21", "last_date": "2026-10-21", "url": "https://www.hackneyempire.co.uk/events/susan-calman-tall-tales", "tags": ["stand-up"], "id": "e744", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "hen-and-chickens", "title": "Too Many Cuckoos", "byline": "A musician makes a reckless bet, that he can survive a week without using his credit card.", "description": "But when his busking plan collapses on day one, it sparks chaos. Friends get pulled into dubious schemes, strange rituals, and escalating mayhem—revealing they’re probably not just their own worst enemies, but everyone else’s too.\n\nTickets booked online must be collected 15mins before showtime. Cash tickets are available for 30 mins at the box office. TICKETS ARE NON-REFUNDABLE*", "first_date": "2026-10-21", "last_date": "2026-10-24", "url": "https://www.unrestrictedview.co.uk/events/too-many-cuckoos", "tags": ["theatre"], "id": "e745", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "pleasance-islington", "title": "Terry's: An American Tragedy About Cars, Customers, and Selling Cars to Customers", "byline": "David Lynch meets Wes Anderson in this absurd, hilarious, and incisive take on the hamster-wheel hellscape of sales work.", "description": "Memorial Day weekend. The US-of-A. The motley, motor-mouthed sales team at Terry’s Cars & Automobiles has just four days to hit their monthly target. With their salaries and sanity on the line, they must shift 66 cars by Monday or face the wrath of their overlord boss, Terry.\n\nWith clowning, physical theatre, and original music, Terry’s 'turns marketing jargon into a hilarious and horrifying poetry' ( The Scotsman ), in a fast-paced, darkly comic look at capitalist culture’s pressure to “sell, sell, sell”. Expect superheroes, pop-rock ballads, the D-Day landings, and one very special balloon.", "first_date": "2026-10-21", "last_date": "2026-10-24", "url": "https://www.pleasance.co.uk/event/terrys-american-tragedy-about-cars-customers-and-selling-cars-customers", "tags": ["theatre"], "id": "e746", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "stone-nest", "title": "midori jaeger", "byline": "midori jaeger is a cellist and songwriter originally from Japan. She brings an intimate and captivating performance to launch her new EP (Re)planted with a full band.", "description": "(Re)planted and her previous EP (Un)planted draw upon a childhood spent across multiple continents and an adulthood geographically separated from family, exploring themes of displacement, belonging, heritage, and solace found in creative expression. The songs were written at the cello, an instrument that was once a living tree. The cello and the songs together draw poignant parallels between the natural world and the human search for home, and self.\n\nStrikingly personal and totally unique in style, midori’s music has been championed by The New York Times (‘Ten Songs We’re Talking About This Week’), CLASH, The Line of Best Fit, BBC Radio 3, BBC 6 Music and KEXP.", "first_date": "2026-10-21", "last_date": "2026-10-21", "url": "https://www.stonenest.org/events/midori-jaeger", "tags": ["concert"], "id": "e747", "venue_name": "Stone Nest", "venue_area": "Soho"}, {"venue_id": "the-place", "title": "After After", "byline": "Celebrated for his immersive and visually striking performances, Dutch artist Arno Schuitemaker brings seven dancers together beneath a single strip of light in After After .", "description": "As old ideas of progress and endless growth begin to fray, the performers claim a blank canvas and start to imagine what might come next. What if \"the after\" is not a future to wait for, but something to rehearse together? Drawing on the spirit of the dance floor, seven distinct voices and ways of moving unfold side by side. Through touch, attention and care, the dancers create a shifting field of difference, connection and possibility. An electronic score and striking lighting transform the space around them as small gestures gather momentum, creating an atmosphere that is both intimate and exhilarating.\n\nExploring recreation in every sense of the word, After After is an act of reimagining, a celebration of pleasure, and a performance about the effort of making another kind of world imaginable.", "first_date": "2026-10-21", "last_date": "2026-10-21", "url": "https://theplace.org.uk/events/autumn-winter-2026-after-after", "tags": ["dance"], "id": "e748", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "alexandra-palace", "title": "Beth Orton", "byline": "Folktronica pioneer Beth Orton brings her new album The Ground Above to Alexandra Palace Theatre this October.", "description": "For more than three decades, Beth Orton has remained one of the most distinctive voices in contemporary music. Since her 1996 debut Trailer Park , she has built a catalogue marked by emotional clarity and constant evolution, from Comfort of Strangers to the spectral, self-produced Weather Alive . Released in 2022, Weather Alive became a major critical breakthrough, signaling not just a return but a reinvention. Her first self-produced album and debut for Partisan Records, it earned widespread acclaim, with The New York Times praising its “modal vocal phrases and marveling” storytelling, Pitchfork awarding Best New Music (8.7), and MOJO highlighting its richness and extraordinary writing. With The Ground Above , Orton returns with renewed urgency and conviction.\n\nThis is not a theatre ticket – the upgrade only grants access to the Theatre Lounge", "first_date": "2026-10-22", "last_date": "2026-10-22", "url": "https://www.alexandrapalace.com/whats-on/beth-orton/", "tags": ["concert"], "id": "e749", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "coronet", "title": "Boram Kim: Gwantong 18", "byline": "Raw, exhilarating and deeply personal, Gwantong 18 is a rare chance to encounter one of Korea’s most distinctive dance artists.", "description": "Acclaimed Korean choreographer and performer Boram Kim , founder of Ambiguous Dance Company comes to The Coronet with his darkly funny and physically demanding solo work, Gwantong 18 , for its one and only international performance.\n\nFirst premiered in Seoul in 2018, he revisits the solo that asks him to give everything. Requiring extraordinary stamina, emotional resilience, precision and vulnerability, Gwantong 18 is a piece Kim wants to perform before his body says no.", "first_date": "2026-10-22", "last_date": "2026-10-24", "url": "https://www.thecoronettheatre.com/whats-on/boram-kim-gwantong-18/", "tags": ["dance"], "id": "e750", "venue_name": "The Coronet Theatre", "venue_area": "Notting Hill"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: Code Tea Party", "byline": "Two adult siblings fall down the “rabbit hole” of the modern healthcare system. Mary Ann has given up her life to become a full-time caretaker for her brother as he progressively loses control of his body and looks for a way out.", "description": "Darkly comedic with a surreal edge, the play highlights the absurdity of the bureaucratic circus standing between patients and care.\n\nFaced with rising costs and overburdened healthcare workers, how far will Mary Ann go and what taboos will she break in order to “save” her loved one?\n\nAn original play written by Shannon Damery and inspired by personal experiences of medical debt and caregiving.", "first_date": "2026-10-22", "last_date": "2026-10-22", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-code-tea-party", "tags": ["theatre"], "id": "e751", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: MANBand the Story", "byline": "Set in everyone’s favourite pub, events take a turn when one of the regulars sits in the wrong seat and for once they all have to talk to each other.", "description": "Musical dreams discussed and dissected , Kev, Bas, Eric and Frank are too old to form a Boyband. But what about a MANBand?\n\nAdapted from the acclaimed production MANBand the Musical, this show is an uplifting feel–good story in word and song . They hope for one last shot at fame and fortune, sending women wild with their sensible haircuts and cuddly physiques. But the path to success is a tricky one. Will arguments, arrogance and egos bring it all crashing down or is it never too late to live out your dreams.\n\nFollowing The Musical Production audiences and critics said;", "first_date": "2026-10-22", "last_date": "2026-10-23", "url": "https://www.goldengoosetheatre.co.uk/whatson/manband", "tags": ["musical"], "id": "e752", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hackney-empire", "title": "Empire Nights with Jamali Maddix", "byline": "The first edition of Empire Nights is hosted by Jamali Maddix ( Never Mind the Buzzcocks ), who has handpicked a stacked line-up featuring Guz Khan ( Man Like Mobeen , Taskmaster ), Michelle de Swarte (Spent)…", "description": "The first edition of Empire Nights is hosted by Jamali Maddix ( Never Mind the Buzzcocks ), who has handpicked a stacked line-up featuring Guz Khan ( Man Like Mobeen , Taskmaster ), Michelle de Swarte (Spent), Kyrah Gray ( Mo Gilligan’s Black British Takeove r ), Manga Saint Hilare (BBC 1Xtra), DJ Lex Blondin (Church of Sound, Total Refreshment Centre).\n\nFrom West to East, the legends of the UK Garage scene, Kurupt FM , will headline the night. Seapa , MC Beats and Steves bring a headline finale of UK Garage, Drum & Bass and Grime. Expect big tunes, big personalities and a proper Kurupt FM takeover.\n\nBest known as the pirate radio crew at the centre of BAFTA-winning BBC comedy People Just Do Nothing , Kurupt FM have grown from cult comedy phenomenon into an acclaimed live and recording act in their own right, taking their unmistakable blend of UK Garage, Grime and comedy to stages across the UK and internationally. Empire Nights celebrates the artists shaping contemporary British culture, with this first edition blending stand-up, grime and underground culture.", "first_date": "2026-10-22", "last_date": "2026-10-22", "url": "https://www.hackneyempire.co.uk/events/empire-nights-with-jamali-maddix", "tags": ["stand-up"], "id": "e753", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "royal-vauxhall-tavern", "title": "Pick&Mix Cabaret: Halloween Special", "byline": "Trick or Treat!! It’s Halloween and HOMOPARODY have something devilishly delicious for you to celebrate!", "description": "Welcome to Pick’N’Mix Cabaret! An evening of queer variety and cabaret where new and established creatures of the night share their work in a room filled with love.\n\nHOMOPARODY Queer Collective and their sweet sapphic sisters from Fingerz are back to create the ultimate candy cabaret show that celebrates the variety of acts in London’s queer cabaret scene.\n\nLet’s do cabaret the queer way and get ready for a delicious night of dance, drag, parodies, powerhouse vocalists and fundraising! Featuring a lip smacking cast of queer Londoners, this event is a celebration of who we are and what we love and promises to be unmissable! Everyone is welcome here… Bring your besties, ride solo or take one of your lovers for the ultimate date night!", "first_date": "2026-10-22", "last_date": "2026-10-22", "url": "https://www.vauxhalltavern.com/events/event/pickmix-cabaret-halloween-special/?oid=6642", "tags": ["cabaret"], "id": "e754", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "shakespeares-globe", "title": "Shakespeare and Windrush", "byline": "Join us for a roundtable discussion celebrating the British Caribbean community and their contributions to theatre, performance and the study of Shakespeare.", "description": "Bringing together creatives, writers and academics, this conversation will explore the enduring legacies of Caribbean migration, British identity and their connections to Shakespeare.\n\nThis event is part of the Shakespeare and Race Festival 2026 .", "first_date": "2026-10-22", "last_date": "2026-10-22", "url": "https://www.shakespearesglobe.com/whats-on/shakespeare-and-windrush/", "tags": ["talk"], "id": "e755", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "soho-theatre", "title": "ROLEPLAY", "byline": "A struggling feminist podcaster reinvents herself in pursuit of fame, only to lose herself in the performance.", "description": "Darkly hilarious, gripping and surreal, ROLEPLAY is a ferocious interrogation of modern sex, the commodification of feminism and the era of the personal brand.\n\nWriter, actress and comic Hannah Reilly brings her ‘fresh, female-first approach’ (Elle) to London in this NSFW one-woman show developed and directed by Paige Rattray ( Fangirls ). ROLEPLAY also marks a major collaboration between award-winning producers Francesca Moody Productions ( Fleabag, Baby Reindeer ) and Global Creatures ( Moulin Rouge! The Musical, Muriel’s Wedding The Musical ).\n\nGuardian, Time Out & Telegraph Top Pick, Edinburgh Fringe 2026.", "first_date": "2026-10-22", "last_date": "2026-11-26", "url": "https://sohotheatre.com/events/roleplay/", "tags": ["theatre", "comedy"], "id": "e756", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "southwark-playhouse", "title": "Memoriam", "byline": "In the near future, tech company Memoriam is able to extract and repackage human memories as immersive VR experiences.", "description": "When her grandmother Rivka becomes the last living Holocaust survivor, Memoriam employee Rachel sees an opportunity to preserve her memories and safeguard an invaluable piece of history. But as the boundaries between commerce and remembrance begin to blur, the repercussions for their family prove far greater than anyone could imagine.\n\nStartlingly funny and deeply moving, Noga Flaishon’s new play is a searing look at the commodification of memory, the legacy of trauma and the stories we pass on.", "first_date": "2026-10-22", "last_date": "2026-11-21", "url": "https://southwarkplayhouse.co.uk/productions/memoriam/", "tags": ["theatre"], "id": "e757", "venue_name": "Southwark Playhouse", "venue_area": "Borough, SE1"}, {"venue_id": "the-cockpit", "title": "Space Hamlet", "byline": "It's Shakespeare. In space. With Norse hammers. And Muppet-like aliens running amok.", "description": "The Bard's tragedy gets blasted into orbit, transformed into a cosmic Glam rock comedy featuring norse gods, gladiator pits, space misfits and a golden robot.\n\nContaining adult language, puppet violence and at least one song that Shakespeare definitely didn't write, it is the ultimate treat for fans of Operation Mincemeat, Avenue Q and Forbidden Planet.", "first_date": "2026-10-22", "last_date": "2026-10-31", "url": "https://www.thecockpit.org.uk/show/space_hamlet", "tags": ["theatre"], "id": "e758", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "young-vic", "title": "Girls", "byline": "Nigeria, 2014. Teenagers Tisana, Haleema, and Ruhab are best friends, busy swapping notes on celebrities, sex positions, and dodging carbs.", "description": "But when they’re kidnapped by militant insurgents and forced towards an uncertain future, they have only each other to turn to. As fear and religious differences begin to fracture their bond, how far can their friendship be tested before it breaks?\n\nEwa Dina , winner of the 2026 JMK Award, makes her Young Vic debut directing Theresa Ikoko’s powerful story of friendship under fire - winner of the Alfred Fagon Award (2015), the George Devine Award (2016), and a finalist for the Verity Bargate Award.\n\nMonday - Saturday, 8pm | Wednesday & Saturday matinees, 3pm", "first_date": "2026-10-22", "last_date": "2026-11-21", "url": "https://www.youngvic.org/whats-on/girls/", "tags": ["theatre"], "id": "e759", "venue_name": "Young Vic", "venue_area": "South Bank"}, {"venue_id": "alexandra-palace", "title": "Qurat-ul-Ain Balouch", "byline": "Quratulain Balouch (also known as QB), one of Pakistan’s most powerful and distinctive voices, live in London for the very first time!", "description": "One of Pakistan’s most distinctive and celebrated voices, QB is known for her powerful, soulful vocals and unmistakable sound. She rose to prominence with the iconic “Woh Humsafar Tha” from Humsafar and has since become a much-loved voice of Pakistani music, with memorable performances including “Sammi Meri Waar,” “Faasle,” “Laal Meri Pat,” “Baliye (Laung Gawacha)” and “Thagyan” on Coke Studio Pakistan. Her Bollywood playback work also includes “Kaari Kaari” from Pink. Now, for the first time in London, experience QB and that unmistakable voice live on stage at Alexandra Palace Theatre.\n\nUnder 16s must be accompanied by an adult 21 or older.", "first_date": "2026-10-23", "last_date": "2026-10-23", "url": "https://www.alexandrapalace.com/whats-on/qurat-ul-ain-balouch/", "tags": ["concert"], "id": "e760", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "camden-peoples-theatre", "title": "Trash Salad", "byline": "Some call it a clown opera; a sexual odyssey; a compost-heap romance. Trash calls it a joyful queer-femme love story in the shape of a salad. Come and see the piece that’s made audiences ‘laugh, cry, and nearly piss’.", "description": "For two nights only, she’s back - and where could be more fitting than her birthplace, CPT?", "first_date": "2026-10-23", "last_date": "2026-10-24", "url": "https://cptheatre.co.uk/whatson/Trash-Salad-26", "tags": ["theatre", "comedy"], "id": "e761", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: The Unexpected Depth to the Grief Felt by Goats", "byline": "After the unexpected death of their mentor, two, young-ish, men find themselves managing both the family funeral business and the old man’s final farewell.", "description": "With the financial realities of being business-owners in the dying industry dawning on them both, fight and flight find new personifications as we watch two friends figure out how to get out of the hole they’ve found themselves in without digging any deeper.\n\nThere’s always a couple of characters at a wake, and with a cast of four; that’s all we can afford. So come celebrate the life of Old Man Proctor and if you see, hear or smell anything you shouldn’t have, you can take it to the grave.\n\nCast: Greg Turner Sean Leacy Joe Coates Liv Baldock", "first_date": "2026-10-23", "last_date": "2026-10-24", "url": "https://www.goldengoosetheatre.co.uk/whatson/the-unexpected-depth-to-the-grief-felt-by-goats", "tags": ["theatre"], "id": "e762", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hackney-empire", "title": "Seann Walsh: This Is Torture", "byline": "Sure, life’s hard — but not as hard as it is for Seann Walsh . After his hit UK tour Back From The Bed , one of Britain’s best comedians is back, bringing his signature blend of chaos and charm in a brand-new, anxiety-soaked hour.", "description": "Welcome to This Is Torture.\n\nAs seen on Live at the Apollo , The Wheel , 8 Out of 10 Cats , The Last Leg , I’m A Celebrity Get Me Out of Here , The Stand Up Sketch Show , Alan Davies: As Yet Untitle d and World’s Most Dangerous Roads .\n\nFind out about getting here, access & support, plus food & drink", "first_date": "2026-10-23", "last_date": "2026-10-23", "url": "https://www.hackneyempire.co.uk/events/seann-walsh-this-is-torture", "tags": ["stand-up"], "id": "e763", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "ica", "title": "In the Round: PVA", "byline": "London genre-defying trio, PVA, join our October In the Round series. Their music thrives on tension and release: raging yet hopeful, alienated yet joyful, dark yet radiant with possibility.", "description": null, "first_date": "2026-10-23", "last_date": "2026-10-23", "url": "https://www.ica.art/live/pva", "tags": ["concert"], "id": "e764", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "immersive-rumours", "title": "Hell's Waiting Room", "byline": "Since the pandemic, the underworld has become overwhelmed.", "description": "The queues are endless. And Satan has begun outsourcing the overflow.\n\nHidden behind an old curiosity shop in East London lies Hell’s Waiting Room —", "first_date": "2026-10-23", "last_date": "2026-10-31", "url": "https://screamworks.co.uk/experience-hells-waiting-room/", "tags": ["immersive"], "id": "e765", "venue_name": "Immersive Rumours", "venue_area": "London"}, {"venue_id": "lyric-hammersmith", "title": "For the Culture: Theatre503 Masterclass - Roy Williams", "byline": "Rewriting and holding on to your vision of the play.", "description": "This session will explore the sometimes difficult undertaking of moving your play beyond that initial draft and onto the next stages whilst ensuring that your original vision and intentions for a play remain core to the rewriting, when often being asked to take feedback from multiple different places.\n\nRoy Williams is a leading playwright, dramatist and screenwriter In 2000 he was the joint-winner of the George Devine Award and in 2001 he was awarded the Evening Standard Award for Most Promising Playwright. He was awarded an OBE for Services to Drama in the 2008 Birthday Honours List. His plays include an adaptation of The Loneliness of the Long Distance Runner (Pilot Theatre/UK tour); Sucker Punch (Royal Court – Olivier Award nomination for Best Play, Joint winner Alfred Fagon Award 2010); Category B (Kiln); Angel House (Eclipse Theatre/UK tour); Days of Significance (RSC); Joe Guy (Soho Theatre/Tiata Fahodzi); There’s Only One Wayne Matthews (Polka Theatre); Baby Girl (National Theatre Connections); Wildefire (Hampstead Theatre) Absolute Beginners (Lyric Hammersmith); Little Sweet Thing (Nottingham Playhouse/Eclipse Theatre UK tour); Slow Time (National Theatre Education); Fallout (Royal Court); Sing Yer Heart Out For the Lads (National Theatre); Clubland (Royal Court); The Gift (Birmingham Rep/Tricycle); Local Boy (Hampstead Theatre); Lift Off (Royal Court); Starstruck (Tricycle – Winner of John Whiting Award, Alfred Fagon Award, 1997); The No-Boys Cricket Club and Kingston 14 (both Theatre Royal, Stratford East); an adaptation of Antigone (Pilot Theatre/UK tour); Soul: The Untold Story of Marvin Gaye (Royal & Derngate Northampton/Hackney Empire co-production) The Firm (Hampstead Theatre Downstairs) Death Of England (National Theatre) Death Of England: Delroy (National Theatre). Radio work includes adaptations of ER Braithwaite’s A Choice of Straws and To Sir With Love, John Wyndham’s The Midwich Cuckoos, The Likes of Us (Radio 3), as well as eight series of The Interrogation for BBC Radio 4. TV and film work includes Fallout (Channel 4); Babyfather (BBC); Offside (BBC), Let It Snow (Sky One); Soon Gone: The Windrush Chronicles (BBC); and Fast Girls (DJ Films).", "first_date": "2026-10-23", "last_date": "2026-10-23", "url": "https://lyric.co.uk/shows/for-the-culture-theatre503-masterclass-roy-williams/", "tags": ["class"], "id": "e766", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "lyric-hammersmith", "title": "For the Culture: The Black Print", "byline": "BBC Live Lounge meets Tiny Desk - an intimate, acoustic-led concert featuring up-and-coming Black artists performing a mix of original songs and reimagined covers.", "description": "Produced by Emmanuel Akwafo and his company No Name Creatives , with Marcus Collick as Associate Producer, The Black Print Concert is more than a gig it’s a platform for the next generation of Black musical talent.\n\nBlending the intimacy of NPR Tiny Desk Concerts with the raw energy of the BBC Live Lounge , audiences can expect an unforgettable evening of live music, storytelling and exceptional artistry from emerging performers on the cusp of their breakthrough.", "first_date": "2026-10-23", "last_date": "2026-10-23", "url": "https://lyric.co.uk/shows/for-the-culture-the-black-print/", "tags": ["concert"], "id": "e767", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "pleasance-islington", "title": "Beth Wants the D", "byline": "A comedy about all the times Beth May has thought about killing herself!", "description": "This autobiographical one-woman show puts you in the splash zone of death and delusion as Beth journeys through her struggle with bipolar disorder, but like, in a funny way. Through the bizarre highs and perilous lows, Beth knits comedy and drama together to find the scariest thing of all — a future full of hope.\n\nWinner of the 2025 Mental Health Foundation Fringe Award.\n\nWritten and performed by Beth May. Directed by Riley Rose Critchlow. Produced by Alison Zatta.", "first_date": "2026-10-23", "last_date": "2026-10-24", "url": "https://www.pleasance.co.uk/event/beth-wants-d", "tags": ["theatre", "comedy"], "id": "e768", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "pleasance-islington", "title": "David's One-Man Band (F*ck You, Steven)", "byline": "Emo teen David is a poet, a philosopher, a musical genius. And he’s here to headline Sticky Floors – the coolest under 16s band night in the Bay Area.", "description": "But when his bandmate doesn't show, will he handle himself with a sense of poise and rationality?\n\nThis coming-of-age character comedy with live music is a nostalgia bomb of teenage awkwardness – from angsty poetry, to failed flirtations, to the perils of wearing black layers during a heatwave. It’s a silly, sweet exploration of how teenage boys communicate when, like, words are hard.\n\nFor more information about our venues and performance spaces, please visit our access pages here .", "first_date": "2026-10-23", "last_date": "2026-10-24", "url": "https://www.pleasance.co.uk/event/davids-one-man-band-fck-you-steven", "tags": ["comedy", "musical"], "id": "e769", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "polka", "title": "You’ll See", "byline": "James Joyce’s odyssey is brought to life in an inventive show telling the story of Ireland’s most notorious book to audiences aged 8 and upwards, and to all those who haven’t got around to reading it yet.", "description": "From page and stage, this origianal production from acclaimed Irish Theatre company Branar , creatively tells the 100 year old story in a theatre expereince that will excite both young and old.\n\nCast & Creatives Adapted by March MacLochlainn and Helen Gregg Performer Helen Gregg Director Marc Mac Lochlainn Producer Joanne Beirne Composer Michael Chang Book Design and Creation Maeve Clancy Lighting Design Michael Foley Sound Design Adrian Ferry Costume Design Elaine Mears Cinematography James Ryan and StationHouse Media Set Build Ciaran Kelly Paper Creation Sorcha Ní Chróinín Stage-Manager & Technician Michael Foley Line Producer Niamh Ní Fhlatharta Marketing Noel Minogue Production Assistant Nóra Burke Design Assistant Oisín Parslow", "first_date": "2026-10-23", "last_date": "2026-10-25", "url": "https://polkatheatre.com/event/youll-see/", "tags": ["theatre"], "id": "e770", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "shoreditch-town-hall", "title": "Ceilidh The Musical", "byline": "CEILIDH is a brand new musical that invites you to step into the heart of one of Scotland's oldest and most beloved traditions. It’s a gathering of songs, stories and dances, all while sharing a dram or two along the way.", "description": "Led by a lively caller, you’ll be swept up in a whirlwind of music and memories from the moment you walk through the door. But as the music builds and the night takes hold, a story begins to unfold. A family story. One of love, legacy, and why tonight's ceilidh matters more than most.\n\nFresh from a sell-out season in Baltimore , CEILIDH makes its premiere at Shoreditch Town Hall . This joyous, irreverent, heart-pounding night is created by award-winning duo Scott Gilmour and Claire McKenzie ( Noisemaker ) and directed and choreographed by Tony Award -winner Sam Pinkleton ( Oh, Mary! ).", "first_date": "2026-10-23", "last_date": "2026-11-13", "url": "https://shoreditchtownhall.com/whats-on/ceilidh-the-musical", "tags": ["musical", "dance"], "id": "e771", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "stone-nest", "title": "PORTRAITS FOR GUITAR", "byline": "Guitarist Ahmed Dickinson Cárdenas celebrates the launch of his new album Portraits for Guitar on Convivium Records, in the company of composers Flores Chaviano, Walfrido Domínguez, Stephen Goss and Dominique Le Gendre.", "description": "Portraits for Guitar , brings together bold contemporary voices and rich cultural traditions from the Afro-Cuban, Caribbean and European sound worlds. Performed by Ahmed Dickinson Cárdenas and Helen Sanderson, this unique album weaves together rhythm, vivid colour, contrast, and a deep sense of travel and place into an irresistibly compelling and engaging musical narrative.\n\nCuban-born, London-based guitarist Ahmed Dickinson Cárdenas is an internationally acclaimed classical guitarist and a passionate advocate for contemporary and Latin American music. His work brings together exceptional musicians, composers and cultural traditions, creating projects that place the guitar at the centre of new musical conversations.", "first_date": "2026-10-23", "last_date": "2026-10-23", "url": "https://www.stonenest.org/events/portraits-for-guitar", "tags": ["concert"], "id": "e772", "venue_name": "Stone Nest", "venue_area": "Soho"}, {"venue_id": "the-place", "title": "Rotten Work & The Game of Life", "byline": "the London premiere of a new programme by internationally acclaimed choreographers Emilie Leriche (US/Sweden) and Edouard Hue (Switzerland).", "description": "In Rotten Work , Leriche offers a poetic, slow-burning choreography that lingers in moments of connection, intimacy, and quiet emotional depth: “It is simple: No one is allowed to be left behind, though they may tire or weaken. If ever we arrive, we must arrive together. Not me alone, or them without me. But us, as one. That’s the work, Rotten as it is. Carry me along, though I may be a weight.”\n\nIn sharp contrast, Hue’s choreography is organic and sensation-driven, combining raw virtuosity and emotional intensity in a dynamic physical language that reveals both strength and vulnerability. Inspired by puzzle and pattern, The Game of Life explores how individuals come together into a living, evolving whole without surrendering their uniqueness. What if failing to reach the form we imagined were not a failure, but the very condition of a living society?", "first_date": "2026-10-23", "last_date": "2026-10-24", "url": "https://theplace.org.uk/events/autumn-winter-26-rotten-work-the-game-of-life", "tags": ["dance"], "id": "e773", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "the-space", "title": "Comedy In (the) Space - Lou Wall", "byline": "Spring Kathryn Day , as seen on BBC’s Live at the Apollo, Spring Day is an American stand-up comedian, writer and actor in London.", "description": "Spring’s uniquely acerbic and sassy style of comedy is always a crowd pleaser, or shocker… A fluent Japanese speaker and a mild cerebral palsy haver, Spring began her career headlining at the Tokyo Comedy Store whilst based in Japan. She has written, produced, directed and performed seven solo shows at the Edinburgh Fringe Festival. She has also written for and appeared in BBC Three sitcom Jerk; performed on UKTV’s Rosie Jones’s Disability Extravaganza; and has written for BBC’s Horrible Histories, Horrible Science, as well as, Audible’s first ever musical comedy—Crush Hour. “A Definite Must See!” ✭✭✭✭ – ThreeWeeks\n\nLou Wall Most Outstanding Show at Melbourne International Comedy Festival Nominee Lou Wall is a multi-award-winning comedian, composer and content creator known for their genre-defying, politically savvy, and musically driven comedy.\n\nIn 2023, Lou won the prestigious Moosehead Award and premiered Lou Wall vs The Internet at Melbourne Fringe and Edinburgh—going on to win Best of the Festival at the 2024 Sydney Comedy Festival and earning a nomination for Most Outstanding Show at the 2024 Melbourne Comedy Festival for their show “The Bisexual’s Lament”. In 2025, Breaking the Fifth Wall opened to critical acclaim with a Melbourne Comedy Festival Award nomination, and a sell out run at the Edinburgh Fringe. On-screen, Lou has written and performed on ABC’s WTFAQ (2023), and appeared in ABC America’s Reef Break and ABC Australia’s FISK.", "first_date": "2026-10-23", "last_date": "2026-10-23", "url": "https://space.org.uk/event/citsoct26/", "tags": ["stand-up"], "id": "e774", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "alexandra-palace", "title": "Best of Both Worlds", "byline": "Best of Both Worlds brings together some of the biggest names and most recognisable sounds in Black British music and comedy for a spectacular Black History Month celebration at Alexandra Palace Theatre this October.", "description": "Presented by ACAF and Supreme Live in support of the African Caribbean Leukaemia Trust (ACLT), this one-night-only extravaganza journeys through reggae, Lovers Rock, soul, UK garage, funky house, gospel and comedy, bringing generations together under one roof. Leading the comedy charge is legendary comedian Curtis Walker , a veteran of all five original series of the groundbreaking BBC comedy classic The Real McCoy , alongside Junior Booker , bringing his distinctive brand of stand-up to our Theatre stage. The music line-up is packed with iconic voices and unforgettable anthems. Janet Kay , the undisputed Lovers Rock favourite and voice behind the timeless smash hit Silly Games , takes to the stage alongside UK Garage superstar Kele Le Roc , known for classics including My Love and Little Bit of Lovin’ . Katie Pearl , the unmistakable voice behind the funky house favourite In the Air , brings the dancefloor energy, while former Lotto Boyzz star Imrhan brings his powerful vocals and contemporary gospel sound, adding a fresh, uplifting energy to an already spectacular line-up. A full Reggae Choir will add even more soul and atmosphere to the evening. Keeping the whole night moving are charismatic hosts and presenters Ibe Gantkiller and Terri Walker , guiding audiences through an unforgettable celebration of music, comedy and culture.\n\nBest of Both Worlds isn’t just a show: it’s a celebration of the sounds, laughter and artists that have shaped generations.", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://www.alexandrapalace.com/whats-on/best-of-both-worlds/", "tags": ["stand-up", "concert"], "id": "e775", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "canal-cafe", "title": "Ugly Baby > Broken Mirrors WIP", "byline": "An anthology of original short plays exploring identity, trauma, and what remains of the self when our understanding of who we are begins to fracture.", "description": "When you look in the mirror, who do you see? Would someone else see the same person? And what happens if that image starts to change, to distort and, in some cases, fall away completely?\n\nWriters, Directors and Cast: Alex Botto, Ri de Medeiros, Rui Lourenço, Brandon J Pascal and Hannah Wilder", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://canalcafetheatre.com/our-shows/broken_mirrors/", "tags": ["theatre"], "id": "e776", "venue_name": "Canal Café Theatre", "venue_area": "Little Venice"}, {"venue_id": "etcetera", "title": "A Girl is a Haunted House  (women writers festival)", "byline": "I wonder what happens on a date with Death? Some talk about a white light or a tunnel.", "description": "Imagine it. Perfect brightness, like looking into the sun. But my mind doesn’t work that way. It always picks and picks and looks and picks and what if the tunnel is black? What if it has beady red eyes? What if it has long sharp teeth? What if it has been waiting all this time to eat me alive so that other things can then eat me too? A girl is a haunted house - the horror of being a woman.", "first_date": "2026-10-24", "last_date": "2026-10-25", "url": "https://www.etceteratheatrecamden.com/events/a-girl-is-a-haunted-house", "tags": ["theatre"], "id": "e777", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "hackney-empire", "title": "Pioneers of Comedy meets Next Gen", "byline": "As more and more black comedians find major success on our television screens, we pay homage to those who paved the way and opened the doors for Black comedy in the UK with the Pioneers Of Comedy by bringing you a massive superstar line up…", "description": "As more and more black comedians find major success on our television screens, we pay homage to those who paved the way and opened the doors for Black comedy in the UK with the Pioneers Of Comedy by bringing you a massive superstar line up of award-winning stand-up comedians, television & radio presenters and actors. Also, we introduce the next generation of comedians; we’ve handpicked the funniest and best new comedians already doing big things on television, social media and the comedy circuit and signed to the same agencies as Mo Gilligan , Judi Love and Slim.\n\nFind out about getting here, access & support, plus food & drink", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://www.hackneyempire.co.uk/events/pioneers-of-comedy-meets-next-gen", "tags": ["stand-up"], "id": "e778", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "half-moon", "title": "The Elves and the Shoemaker", "byline": "Elvis Schumacher, cobbler and craftsman, has worked all his life creating the most beautiful footwear.", "description": "But now he’s hit hard times as everyone’s buying boring shoes from the evil businessman, Bunyan Sole-less. Time is running out for Elvis. With one piece of leather left and Bunyan’s factory growing, can anyone help him?\n\nThis well-known and well-loved tale has been re-heeled by Theatre of Widdershins in their own inimitable style. Beautifully crafted puppets, original music, a kaleidoscope of miniature shoes and a comic mouse make this show a magical must-see.", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://www.halfmoon.org.uk/events/the-elves-the-shoemaker/", "tags": ["puppetry", "theatre"], "id": "e779", "venue_name": "Half Moon Theatre", "venue_area": "Limehouse"}, {"venue_id": "hoxton-hall", "title": "An Evening with Ewan Bleach", "byline": "Playing music from his new album Mystic Mood and featuring the Fleeting Paradise Orchestra and Special Guests.", "description": null, "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173690439", "tags": ["concert"], "price_min": 4.0, "price_max": 32.5, "id": "e780", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "ica", "title": "In the Round: Broadside Hacks Takeover ft. Brown Wimpenny, Sam Grassie, Myer U Clark, Spitzer Space Telescope.", "byline": "Following last year’s In the Round show with Milkweed, we’re teaming up with Broadside Hacks again, headlined by 11-piece folk ensemble Brown Wimpenny, with Sam Grassie, Myer U Clark, and Spitzer Space Telescope.", "description": null, "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://www.ica.art/live/broadside-hacks-takeover", "tags": ["concert"], "id": "e781", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "lyric-hammersmith", "title": "Penguin", "byline": "Long Nose Puppets show Penguin is based on the award-winning book by Polly Dunbar.", "description": "Ben is delighted when he rips open his present, inside is a penguin. ‘Hello Penguin!’ says Ben. Penguin says nothing. Ben tickles Penguin; he pulls his funniest face; he puts on a happy hat, sings a silly song and does a dizzy dance. Penguin says nothing…so Ben fires Penguin into OUTER SPACE, and Penguin comes back to earth without a word! It isn’t until a passing lion intervenes that Penguin finally speaks…and when he does, Ben discovers something that was really worth the wait.\n\nFor all our productions, we offer one complimentary carer/companion seat for every full price access ticket booked.", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://lyric.co.uk/shows/penguin/", "tags": ["puppetry", "theatre"], "id": "e782", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "lyric-hammersmith", "title": "For The Culture: The Cocoa Butter Club Cabaret Masterclass", "byline": "The Cocoa Butter Club decolonise cabaret with radical, high octane celebrations of self. Their cabarets are diverse in skills and performer identity; filled with sing-a-long moments and always end in a standing ovation.", "description": "an exhilarating Cabaret celebrating everything from neo-burlesque and poetry, to drag, hoops and voguing. Only the best from the most exciting Black performers and performers of colour. So, lotion up, baby, because Sadie Sinner The Songbird will bring you a night bold enough to have you screaming ‘yaaaaas queen, smell like cocoa butter up in hurr!’\n\nFor all our productions, we offer one complimentary carer/companion seat for every full price access ticket booked.", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://lyric.co.uk/shows/for-the-culture-the-cocoa-butter-club-cabaret-masterclass/", "tags": ["cabaret", "class"], "id": "e783", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "lyric-hammersmith", "title": "For the Culture: The Cocoa Butter Club", "byline": "Ready for a dose of fun, powerful and provocative performances by The Cocoa Butter Club?", "description": "Decolonising cabaret with radical, high octane celebrations of self. Their cabarets are diverse in skills and performer identity; filled with sing-a-long moments and always end in a standing ovation.\n\nan exhilarating Cabaret celebrating everything from neo-burlesque and poetry, to drag, hoops and voguing. Only the best from the most exciting Black performers and performers of colour. So, lotion up, baby, because Sadie Sinner The Songbird will bring you a night bold enough to have you screaming ‘yaaaaas queen, smell like cocoa butter up in hurr!’", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://lyric.co.uk/shows/for-the-culture-the-cocoa-butter-club/", "tags": ["cabaret"], "id": "e784", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "puppet-barge", "title": "The Town Mouse and the Country Mouse (Little Venice)", "byline": "These two famous cousins visit each other and both experience exciting new sights and sounds.", "description": "The Town Mouse must face the wild countryside, while the Country Mouse watches for the house cat and learns to navigate the noisy city traffic. They both end up much wiser as a result of their exciting adventures. A delight for young and old, told with music, songs and rod puppets.\n\nThis show has a storyline that can be followed and enjoyed by 3- to 4-year olds including some nursery rhymes and fun visuals but also uses some slightly more complex ideas, humour, dialogue and song lyrics that older children might get more out of. There is nothing really scary in this show but it does use dramatic music and lighting, for example the theatre will go dark during the performance which some children might find unsettling and the characters may face some perils. Please have a look at the trailer for the show to get an idea of the tone.\n\nAll ages are welcome at our shows and age ranges can only be a rough guide, but please bear in mind that The Town Mouse and the Country Mouse was not specially designed for under-3s. A show aimed at 2-year olds would have some differences – those shows are carefully made to hold their attention for the duration, and not to be unsettling for them. If you do bring under threes to the show, we ask that you take them out if they become upset or distracted so as not to effect the enjoyment of the rest of the audience.", "first_date": "2026-10-24", "last_date": "2026-11-15", "url": "https://www.puppetbarge.com/the-town-mouse-and-the-country-mouse-little-venice", "tags": ["puppetry", "theatre"], "id": "e785", "venue_name": "Puppet Theatre Barge", "venue_area": "Little Venice"}, {"venue_id": "rich-mix", "title": "Memory in Motion", "byline": "Experience an amazing evening of stories, dancing, music and participation. Part of Touch The Floor, a Dance Umbrella event curated by Anthea Lewis exploring the history and evolution of Black British social dance and music cultures.", "description": "Through talks, movement, music, making and participation, it celebrates the informal spaces where people gathered, connected and created community.6pm – 7.30pmWe Come TogetherA conversation hosted by former director of the Black Cultural Archives Lisa Anderson with DJ and music curators Cyndi Handson, Spider J, Dean Bryce, interdisciplinary artist Amarnah Ufuoma Cleopatra and visual theatre maker Benji Reid. This panel will explore the role of social dance, music and collective memory in shaping Black British cultural life. Benji Reid and Amarnah Ufuoma Cleopatra offer personal reflections to open the session and set the tone for the conversations ahead.8pm – 8:45pmStep To It with Paradigmz and Guest ArtistsAn interactive exploration of social dance through archival footage, music, live demonstration and participation with performance artist, poet, teacher and choreographer Paradigmz.9pm – 11:30pmCome We Go – A Closing DJ Set with Cyndi HandsonThe evening ends on the dance floor as DJ Cyndi Handson of the Handson Family invites everyone to move together through a shared musical journey, celebrating the joy, connection and collective memory held within social dance. Together, we become part of a living archive.", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://richmix.org.uk/live-events/dance-umbrella-memory-in-motion", "tags": ["dance"], "id": "e786", "venue_name": "Rich Mix", "venue_area": "Shoreditch"}, {"venue_id": "shakespeares-globe", "title": "MakeBeth", "byline": "Join us for a brand-new, interactive, craft-a-long retelling of Shakespeare’s Macbeth , created by award-winning playwright Hannah Khalil and brought to life entirely with the recycled cardboard magic of designer Sam Wilde .", "description": "Created for families and young audiences aged 7+, this exciting make-along production is created by Cardboard Adventures and Shakespeare’s Globe , in partnership with Chichester Festival Theatre and Leeds Playhouse , continuing a shared commitment to making classic stories accessible, imaginative and fun for new generations.\n\nDirected by Ian Nicholson , MakeBeth bursts with live music, puppetry, and hands-on creativity, transforming Shakespeare’s darkest tragedy into a joyful, laugh-out-loud cardBARD adventure.", "first_date": "2026-10-24", "last_date": "2026-11-01", "url": "https://www.shakespearesglobe.com/whats-on/makebeth/", "tags": ["theatre", "puppetry"], "id": "e787", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "shakespeares-globe", "title": "Hamlet: Workshop (14-16 years)", "byline": "Bring Shakespeare’s famous tragedy Hamlet to life in this fun and practical workshop designed for ages 14–16.", "description": "Exploring themes of grief, madness, and family relationships, this play contains some of Shakespeare’s best-known speeches. This in-depth session will analyse Shakespeare’s use of language and stagecraft and will take place in one of our rehearsal spaces. Led by one of the Globe’s highly experienced education practitioners, this workshop will develop understanding through active discussion and practical drama activities.\n\nThis workshop is an engaging way to enhance studies of Shakespeare and theatre, or a brilliant opportunity for aspiring young actors and Shakespeare enthusiasts to explore the story. No previous experience is required, just a desire to jump in and enjoy.", "first_date": "2026-10-24", "last_date": "2026-10-31", "url": "https://www.shakespearesglobe.com/whats-on/hamlet-workshop-14-16-years/", "tags": ["class"], "id": "e788", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "southbank-centre", "title": "Service95 Book Club: Authors of the Estate", "byline": "Play, explore and be creative at an afternoon of activities from the team behind Authors of the Estate, artist André Anderson, Abdou Cissé and Nabil Al-Kinani.", "description": "A publishing house is a group of people who find, curate and share stories amongst themselves and the wider world. If you were a publishing house, what stories would you tell? ‘The word author and the word authority have the same root meaning. As a matter of fact, the word ‘author’ in the original Latin tongue is a term to describe someone who is a creator, a master, an enlarger. And a sustainer. So when we say that we are the Authors of the Estate, we are not just saying we simply write. We are saying we are the creators, masters, enlargers and sustainers of the estate. Those who rule are those who write.’ Authors of the Estate is a platform created by the people, for the people, a reclamation of authorship and authority. What began as a grassroots publishing project has evolved into a documentary that amplifies those same voices, bringing their words to life and inspiring the next generation of writers from estates across the United Kingdom. What started as a simple idea to help the neighbours of the St. Raphael’s Estate and Chalkhill Estate in north-west London, connected through storytelling, has since grown into a movement. A movement not just to write their stories but to own them. These books shattered stereotypes and allowed residents once seen as statistics or nameless faces to emerge as authors, voices of authority over their own lives. Presented in partnership with Service95. Founded by Dua Lipa, the Service95 Book Club is a space to enjoy all things literary, including Dua’s hand-picked Monthly Reads and her exclusive author interviews, plus new book trends, recommendations from the Service95 team and more ways for you to read the world differently.", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://www.southbankcentre.co.uk/whats-on/service95-book-club-authors-of-the-estate/", "tags": ["social"], "price_min": 0.0, "id": "e789", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "the-albany", "title": "Eshu at the Crossroads", "byline": "This show is d/Deaf friendly. This means that little or no verbal language is used, and we blieve the story can be followed equally by d/Deaf and hearing audiences.", "description": "At a mysterious crossroads, a traveller must decide which way to turn. Watching over them is a powerful rooster, while nearby waits Eshu – the playful and unpredictable trickster spirit who delights in mischief, surprises and unexpected possibilities. As the journey unfolds, the traveller encounters challenges, moments of joy and new ways of seeing the world around them.\n\nAfro-Cuban choreographer Miguel Altunaga joins forces with pioneering puppetry company Theatre-Rites for a vibrant family adventure inspired by Yorubic culture, myth and storytelling. Blending dance, live performance and puppetry, Eshu at the Crossroads invites audiences into a magical world where every choice can change your path.", "first_date": "2026-10-24", "last_date": "2026-10-24", "url": "https://www.thealbany.org.uk/events/eshu-at-the-crossroads", "tags": ["dance"], "id": "e790", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "alexandra-palace", "title": "Crouch End Festival Chorus – Mozart Requiem", "byline": "Join us as we welcome back Crouch End Festival Chorus to Alexandra Palace Theatre this Autumn.", "description": "Mozart’s cherished Requiem is intensely dramatic, with origins shrouded in mystery. Mozart received an anonymous commission for a Requiem Mass in 1791 and came to believe he was composing it for his own funeral. By the time of his death that December at the age of 35, it remained unfinished; it is widely believed that his pupil, Süssmayr, completed it but the space for doubt keeps alive the mystique. It is truly a masterpiece, with its extraordinary beauty, subtlety and profound expression touching each new generation.\n\nThe first half of the concert includes works by Christopher Tin on the theme of flight including the iconic theme Sogno di Volare from the video game Civilization, to follow Gibbons’s pristine The Silver Swan, as well as Jessica Curry’s haunting Echo, a CEFC commission dedicated to her late father.", "first_date": "2026-10-25", "last_date": "2026-10-25", "url": "https://www.alexandrapalace.com/whats-on/crouch-end-festival-chorus-mozart-requiem/", "tags": ["concert"], "id": "e791", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "camden-peoples-theatre", "title": "Dottie", "byline": "A bold, musical joyride through showbiz. Jazz cabaret backed by a live band, Old Hollywood glamour and a sharp, modern bite.", "description": "The show follows the lives of forgotten star Dorothy Dandridge, the first African-American nominated for an Oscar in a leading role in 1955; and Lola, a young mixed-race actress today, who finds out just how far she’ll go to make it big.\n\nExpect laughs, belting vocals and brutal truths. Inspired by Dorothy Dandridge’s own words and modern experiences.", "first_date": "2026-10-25", "last_date": "2026-10-26", "url": "https://cptheatre.co.uk/whatson/Dottie", "tags": ["cabaret", "musical"], "id": "e792", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "drayton-arms", "title": "Kiss In After-Plague", "byline": "Affliction and Pestilence are running amok across the land, with bodies piling up quicker than the departure of their last exhaled breath.", "description": "Amongst them hill dead fleshes, a dark aged romance stirs between Corvin, a body collector, and Mortalia, a holy man’s daughter. Narrated and debated in the exchange of dangerous curiosity on deprived lusted touches, as the world falls apart around them.\n\nPart of GrimFest 2026 , Produced and Curated by Medium Rare Productions & Pither Productions\n\nFancy dinner and a show? Book at table at the Drayton Arms pub now and enjoy the pre-theatre menu before heading upstairs", "first_date": "2026-10-25", "last_date": "2026-10-26", "url": "https://thedraytonarmstheatre.co.uk/kiss-in-after-plague", "tags": ["theatre"], "id": "e793", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "hackney-empire", "title": "Henning Wehn: Acid Wehn", "byline": "Award-deserving German Comedy Ambassador Henning Wehn takes an unbiased look at climate change, a topic sure to delight audiences and no surprise.", "description": "After all, everyone loves talking about the weather. Rain or shine, all will be fine. Or maybe it won’t. Who knows?! Come along. Or else.\n\nFind out about getting here, access & support, plus food & drink", "first_date": "2026-10-25", "last_date": "2026-10-25", "url": "https://www.hackneyempire.co.uk/events/henning-wehn-acid-wehn", "tags": ["stand-up"], "id": "e794", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "ica", "title": "In the Round: Shane Parish - 'Autechre Guitar'", "byline": "an intimate in-the-round performance of his new album Autechre Guitar .", "description": null, "first_date": "2026-10-25", "last_date": "2026-10-25", "url": "https://www.ica.art/live/shane-parish-autechre-guitar", "tags": ["concert"], "id": "e795", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "orange-tree", "title": "Wives as They Were and Maids as They Are", "byline": "Written in the revolutionary decade of the 1790s, Elizabeth Inchbald ’s comedy places women at the centre of a changing society.", "description": "Wives as They Were and Maids as They Are exposes the tension between female autonomy and the idealism, nostalgia, and expectations imposed by the men determined to shape their futures.\n\nAs old values clash with new ways of thinking, Inchbald’s characters navigate love, marriage, and independence in a world that insists on defining them before they can define themselves. What unfolds is a play that is witty, subversive, and strikingly modern.\n\nRevived for today by Creation Theatre and the Orange Tree Theatre , this script-in-hand performance of Wives as They Were and Maids as They Are reminds us that debates around gender, power, and choice are anything but historical. Bold, playful and incisive, this is a comedy with teeth…and a past that speaks directly to the present.", "first_date": "2026-10-25", "last_date": "2026-10-25", "url": "https://orangetreetheatre.co.uk/whats-on/wives-maids/", "tags": ["theatre"], "id": "e796", "venue_name": "Orange Tree", "venue_area": "Richmond"}, {"venue_id": "tabernacle", "title": "Bellows Across Borders", "byline": "the latest concert in their ‘Bellows Across Borders’ concert series, showcasing some of the best accordion orchestras from around the world.", "description": "This year, they welcome the superb Akkordeon-Studio-Orchester Bielefeld from Germany. The programme includes Big Band classics, celebrated film music, classical works by Elgar and Holst, as well as original music for accordion orchestra. Tickets", "first_date": "2026-10-25", "last_date": "2026-10-25", "url": "https://www.thetabernaclew11.com/events/2026/10/25/bellows-across-borders", "tags": ["concert"], "id": "e797", "venue_name": "The Tabernacle", "venue_area": "Notting Hill"}, {"venue_id": "greenwich-theatre", "title": "Allegation 21", "byline": "ALLEGATION 21 is a court drama, set in St. Audrey’s psychiatric hospital, Suffolk.", "description": "It follows Lucie’s labyrinthine struggle to protect her son from abuse and lifts the lid on the Family Court, a topsy turvy world where social workers lie under oath.\n\nLucie’s journey from psychosis to sanity, proceedings in the closed and secretive world of the court and a love story play out on Kestrel Ward.\n\nAllegation 21 takes on the Family Court system, its sinister machinations and notorious code of silence, a method that has broken families and hurt generations of children.", "first_date": "2026-10-26", "last_date": "2026-10-26", "url": "https://greenwichtheatre.org.uk/events/allegation-21/", "tags": ["theatre"], "id": "e798", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "park-theatre", "title": "The Revlon Girl", "byline": "Since it’s inaugural performance in 2016, The Revlon Girl has grown from an unknown work to one of the most talked about plays in recent years…", "description": "Since it’s inaugural performance in 2016, The Revlon Girl has grown from an unknown work to one of the most talked about plays in recent years; enjoying overwhelming critical praise and audience acclaim- not just in the UK but also internationally.\n\nNeil Anthony Docking’s funny, moving and deeply compassionate drama based on events following the Aberfan Disaster tells the remarkable true story of the mothers who met above the Aberfan Hotel every Tuesday night — where they could talk, cry and laugh without feeling guilty — and who, one evening, secretly invited a representative from Revlon to give them beauty tips.\n\nWith an impressive all-female cast, this Olivier-nominated production first found success during its inaugural tour in Wales during the 50th Anniversary Year of the Aberfan Disaster; soon finding itself to be a smash hit at the Edinburgh Festival before transferring to a sell-out London run.", "first_date": "2026-10-26", "last_date": "2026-11-14", "url": "https://parktheatre.co.uk/events/the-revlon-girl/", "tags": ["theatre"], "id": "e799", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "shakespeares-globe", "title": "Macbeth: On Stage Family Workshop (9-11 years)", "byline": "Bring Macbeth to life in this fun and practical worksho
