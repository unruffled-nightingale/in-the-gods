ton’s ‘Young Hearts Run Free’.” Highlighting Staton’s tone in particular, she still has strong appreciation for “Young Hearts Run Free” to this day. “There’s this yearning for love, and yearning to be close to loved ones that I really value,” she clarifies.", "first_date": "2026-09-08", "last_date": "2026-10-15", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173692908", "tags": ["concert"], "id": "e070", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "hoxton-hall", "title": "Hayden Thorpe: Performing the songs of Wild Beasts", "byline": "Hayden Thorpe performs the Wild Beasts songbook for the first time in almost 9 years. Playing entirely solo, the shows will be an exploration of the much-loved collection in their purest form – voice and instrument, as they were written.", "description": "I’ve been missing the songs myself of late, so it felt like a ripe time to reach for the high notes and call on my hand’s muscle memory. It’s a full-circle manoeuvre as the dates perfectly align with the 20 th anniversary of Wild Beasts first single release, Brave Bulging Buoyant Clairvoyants .\n\nThe venue choices are also very deliberate. Each room played an important role in the history of the band. Brewery Arts was our cultural HQ growing up in Kendal, Hoxton Hall was the scene of a breakthrough show for Two Dancers and Brudenell Social Club will always be where we came of age as musicians.", "first_date": "2026-09-08", "last_date": "2026-11-19", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173678614", "tags": ["concert"], "id": "e071", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "immersive-rumours", "title": "LUMINISCENCE", "byline": "The story of the city, voiced by Hugh Bonneville, in 360° video projection concert like no other.", "description": "After captivating over one million spectators across the world and following its hugely successful UK debut in Manchester, LUMINISCENCE arrives in London, to transform Westminster Cathedral into a fully immersive world of sound and light.\n\nFeaturing the music of some of classical music’s greatest composers, including Beethoven, Verdi, Debussy, Vivaldi, Bach and more, performed by the stunning Lux Aeterna choir, with a specially commissioned script by BAFTA and Olivier Award winner Tim Whitnall telling the story of London and one of its most important Cathedrals.", "first_date": "2026-09-08", "last_date": "2026-09-27", "url": "https://fever.pxf.io/bkvYRm", "tags": ["concert", "immersive"], "id": "e072", "venue_name": "Immersive Rumours", "venue_area": "London"}, {"venue_id": "immersive-rumours", "title": "Chat Noir! by The Lost Estate", "byline": "Glaslights flicker. In their gilded apartments, wayward Parisians stir, hungry for pleasures that lie beyond polite society.", "description": "Under cover of darkness, they sneak from their beds and onto the cobbled streets of Montmartre, all thirsty for one thing - Le Chat Noir, Paris's legendary Bohemian night club, palace of nocturnal delights, the one place that can set them free.\n\nVisionaries, artists, aristocrats, bohemians, dance in a fever dream of art, absinthe, and anarchy. Toulouse-Lautrec sketches at the bar. Erik Satie mutters philosophies at passing strangers. The air hums with daring, possibility, the unmistakable feeling that you are witnessing something historic. Because you are.\n\nA three-course Menu Haute Cuisine, conceived by The Lost Estate's Executive Chef Ashley Clark, honours the original dishes served at Le Chat Noir, elevated with modern mastery. It is true time-travel dining: a taste of the culinary movement that created modern gastronomy.", "first_date": "2026-09-08", "last_date": "2026-09-27", "url": "http://www.chatnoirlondon.com", "tags": ["dance", "immersive"], "id": "e073", "venue_name": "Immersive Rumours", "venue_area": "London"}, {"venue_id": "immersive-rumours", "title": "Faulty Towers - The Dining Experience", "byline": "With over 13 years of faultless service right in the heart of Bloomsbury, you’re in for a quintessentially British experience like no other as Basil, Sybil and Manuel serve up theatre and chaos alongside a 70s-style 3-course meal.", "description": "Join us at the President Hotel, London, where the trio have spent over a decade setting West End records for longest running immersive experience, longest running show based on a TV series, and the longest running Fawlty Towers show of any kind worldwide!\n\nThis is the show where you step inside the TV series and become part of the action itself. Highly improvised, highly interactive, and fully immersive, join the action for an unforgettable night where guests are not just audience members, but welcomed as highly esteemed guests of Torquay’s most aspirational hoteliers. Pack your sense of humour and be prepared for a hotel experience where anything can (and will) go wrong…", "first_date": "2026-09-08", "last_date": "2027-10-13", "url": "https://www.interactivetheatre.com.au/faulty-towers-the-dining-experience-london-west-end/", "tags": ["immersive", "theatre"], "id": "e074", "venue_name": "Immersive Rumours", "venue_area": "London"}, {"venue_id": "immersive-rumours", "title": "The Murdér Express: Part Deux, The Jewel of the Empire", "byline": "The Murdér Express is a 2hr experience like no other that combines a comedy theatre show, a delicious meal and some of the best cocktails in town, all set in a 1920's themed venue; Pedley Street Station & onboard The Murdér Express.", "description": "Step into the enchanting world of 1920’s East London to have your taste buds and tummy tickled by our delicious menu and our comedic murder mystery. Our unique immersive food experience will have you savouring a unique 3-course bespoke menu crafted for your journey by our highly acclaimed Chef Partner, Two Star Michelin Chef, Niall Keating. We also offer handcrafted cocktails at our stylish bar whilst unravelling a gripping murder mystery.\n\nThe Murdér Express is where gastronomy meets entertainment. Buckle up for a memorable immersive experience with unique twists and turns.", "first_date": "2026-09-08", "last_date": "2027-10-13", "url": "http://fever.pxf.io/JKQJk2", "tags": ["immersive", "theatre"], "id": "e075", "venue_name": "Immersive Rumours", "venue_area": "London"}, {"venue_id": "kings-head", "title": "Under The Influence", "byline": "After becoming a viral sensation, identical twins Carine and Frances land in couples therapy as the world’s most co-dependent non‑couple.", "description": "The session erupts into a hilarious musical intervention and a reckoning that threatens to collapse their lifelong duet.\n\nBest known as @thegilberttwins to their 3M+ followers online, Carine and Frances return to their musical theatre roots with their original score composed by Shona Maule.\n\nLoud, ridiculous, and unexpectedly heartfelt, this new musical comedy explores the chaos of sisterhood, online pressure, and the search for your own voice.", "first_date": "2026-09-08", "last_date": "2026-09-26", "url": "https://kingsheadtheatre.com/whats-on/under-the-influence-jzdy", "tags": ["musical", "comedy"], "id": "e076", "venue_name": "King's Head Theatre", "venue_area": "Islington"}, {"venue_id": "little-angel", "title": "Puppetry Foundation Course (Tuesdays)", "byline": "This 10 week evening course is designed for absolute beginners. It takes place on Tuesday evenings and is open to all those who have always wanted to have a go at puppetry but never had the opportunity to do so.", "description": "Explore a variety of different puppet forms and learn the basics of puppet manipulation over 10 weeks.", "first_date": "2026-09-08", "last_date": "2026-09-08", "url": "https://www.littleangeltheatre.com/whats-on/puppetry-foundation-course-tuesdays-5/", "tags": ["class", "puppetry"], "id": "e077", "venue_name": "Little Angel Theatre", "venue_area": "Islington"}, {"venue_id": "london-coliseum", "title": "Sam Smith", "byline": "Multi-Platinum, GRAMMY®, BRIT, Golden Globe and Oscar winning artist and songwriter Sam Smith will play an 8-night run in London as part of their global ‘To Be Free’ residencies.", "description": null, "first_date": "2026-09-08", "last_date": "2026-09-19", "url": "https://londoncoliseum.org/events/sam-smith/", "tags": ["concert"], "id": "e078", "venue_name": "London Coliseum", "venue_area": "St Martin's Lane"}, {"venue_id": "national-theatre", "title": "The Story", "byline": "When a white teacher is killed in a black neighbourhood, four journalists race to get the headline – at any cost.", "description": "But when shocking new evidence pulls them into the dark heart of the case, they are each forced to confront what they’re prepared to risk to tell their version of the truth.\n\nGripping and adrenaline-fuelled, Tracey Scott Wilson’s seminal newsroom thriller is directed by Clint Dyer ( Death of England ) with a cast including BAFTA Award-winner Letitia Wright ( Black Panther ), Ashley Thomas ( Hostage ), Lorraine Toussaint ( Orange is the New Black ), and Wilf Scolding ( Cabaret ).\n\nBook official tickets for The Story , playing at the Olivier Theatre at the National Theatre in London from 27 August to 24 October 2026, it’s ideal for those looking for things to do on the South Bank.", "first_date": "2026-09-08", "last_date": "2026-10-24", "url": "https://www.nationaltheatre.org.uk/productions/the-story/", "tags": ["theatre"], "id": "e079", "venue_name": "National Theatre", "venue_area": "South Bank"}, {"venue_id": "national-theatre", "title": "Pride", "byline": "A joy-filled new musical based on an incredible true story", "description": "Summer 1984. The country is in turmoil. With Thatcher battling to dismantle the coal industry, and a lethal pandemic on the rise, 24-year-old activist Mark Ashton founds an unlikely new alliance with the pit communities of South Wales: Lesbians and Gays Support the Miners.", "first_date": "2026-09-08", "last_date": "2026-09-12", "url": "https://www.nationaltheatre.org.uk/productions/pride/", "tags": ["musical"], "id": "e080", "venue_name": "National Theatre", "venue_area": "South Bank"}, {"venue_id": "national-theatre", "title": "Electra/Persona", "byline": "Electra. A daughter consumed by grief and rage, clinging to the idea of justice as her world comes apart.", "description": "Persona. During a performance of Electra, an actress suddenly falls silent. What follows is a rupture: two women drawn into an intense, unsettling encounter where speech breaks down and the boundaries between self and role give way.\n\nFeaturing Cate Blanchett ( The Seagull ), Nina Hoss ( The Cherry Orchard ), and Ella Lily Hyland ( Black Doves ), Benedict Andrews’ ( A Streetcar Named Desire ) thrilling production fuses ancient myth and modern psychology in a powerful exploration of identity, and the fragile line between who we are and who we play.", "first_date": "2026-09-08", "last_date": "2026-10-10", "url": "https://www.nationaltheatre.org.uk/productions/electra-persona/", "tags": ["theatre"], "id": "e081", "venue_name": "National Theatre", "venue_area": "South Bank"}, {"venue_id": "oso-arts", "title": "Hammersmith Bridge is Falling Down", "byline": "For over thirty years, Edward Stiles MP and his adviser, Violet, have been loyal to the Labour Party and to each other.", "description": "Yet eighteen months after the party takes power, Hammersmith Bridge still hasn’t been repaired, despite Edward’s election promises. But then a new adviser enters their lives: a young woman with growing influence over Edward, who persuades him to tell the truth; to tell the truth about everything. Soon after, Edward and Violet are forced to confront the past and face an uncertain future.\n\nBlending political satire, emotional drama and dark comedy, Hammersmith Bridge is Falling Down explores power, ageing, idealism and a nation losing faith in both its leaders and the system itself.\n\nA new play set during the crisis surrounding the long-delayed repair of Hammersmith Bridge.", "first_date": "2026-09-08", "last_date": "2026-09-11", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173674580", "tags": ["theatre"], "id": "e082", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "oso-arts", "title": "OSO Crochet Club", "byline": "Whether you’ve never picked up a hook before or have been crafting for years, the OSO Crochet Club is a warm and welcoming space for all.", "description": "This is the perfect place to learn something new, revisit an old hobby, or simply enjoy the calming rhythm of stitching in good company.", "first_date": "2026-09-08", "last_date": "2027-09-02", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173663945", "tags": ["class"], "id": "e083", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "oso-arts", "title": "The Comedy Store", "byline": "Comedy at its very best is brought to the OSO by the iconic, world-famous Comedy Store, where some of the most famous names in stand-up comedy started their journey to stardom.", "description": "Performers at the OSO have included the household names of Paul Sinha, Zoe Lyons, Paul Thorne and Laura Lexx. Join us for a hilarious night of the best stand-up from regular circuit comedians and rising stars of the future.", "first_date": "2026-09-08", "last_date": "2026-11-27", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173674831", "tags": ["stand-up"], "id": "e084", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "oso-arts", "title": "In the Night Time (Before the Sun Rises)", "byline": "How about a story? A man and woman have a child. It’s the middle of the night and she won’t stop crying.", "description": "As exhaustion turns to hallucination, fairy tales collide with the 24-hour news cycle and a fractured world breaks through from the shadows.\n\nThis darkly funny and poetic debut play from acclaimed, award-winning writer Nina Segal (Cow|Deer & Associate Playwright at The Royal Court) transforms one sleepless night into an intimate yet epic portrait of parenthood, anxiety and the stories we tell to survive.\n\nFollowing the success of Trip the Light Fantastic earlier this year, director Ella Strauss returns to the OSO with a multi-disciplinary storytelling feast, for anyone who’s negotiated with a baby through the small hours - or anyone grappling with what their life should look like.", "first_date": "2026-09-08", "last_date": "2026-10-10", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173674835", "tags": ["theatre"], "id": "e085", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "playground-theatre", "title": "EINSTEIN! - A Genius in Tumultuous Times", "byline": "The Playground Theatre & Sew and Sew Productions presents...", "description": "It’s Berlin 1914, a younger, pre-crazy-haired, Albert Einstein awaits news from an eclipse expedition that will prove his theory of general relativity. But Einstein is sent sideways in a world crumbling around him due to The Great War, a colleague trying to commandeer his theories, being isolated for his pacifist views, a wife who won't give him a divorce, his failing health, a huge scientific backlash, anti-Semitism, thoughts of suicide, his own self destructive genius and a young son fighting for his father's affections. Meanwhile, he comes up with a theory that changes the way we live our lives today.\n\nEINSTEIN! is an inspirational and true story. Based on the 2007 release of 8,000 documents and three years of research-- writer and performer Jack Fry shares insight into Einstein's early life, a story that few people know. Among many things, this play highlights the trials we all face as individuals in a world that at times doesn't want us to succeed.", "first_date": "2026-09-08", "last_date": "2026-09-13", "url": "https://www.theplaygroundtheatre.org.uk/projects/einstein", "tags": ["theatre"], "id": "e086", "venue_name": "The Playground Theatre", "venue_area": "North Kensington"}, {"venue_id": "riverside-studios", "title": "Rep: Radical Classical", "byline": "Flywheel Theatre Company, Veritas Productions, and Riverside Studios Productions present&nbsp;REP: RADICAL CLASSICAL5 ACTORS.", "description": "5 PLAYS. 5 WEEKS.Rep is back. Inspired by traditional companies of the past, Flywheel use one of the most intense formats of theatre-making to celebrate 50 years of the iconic Riverside Studios.With a season of plays inspired by half a century of past productions, Flywheel breathe new life into classics. Expect a season of comedies and tragedies that reflect today’s world - exploring themes of&nbsp; judgement, division, and the imbalance of power within family, society, and politics.A core ensemble of five actors will perform in all five productions, embracing the flexibility and fast-paced nature of the creative work and injecting each show with a unique intensity.Embracing the history of not just the plays, but the creatives who have worked at Riverside in the last 50 years, our interpretations of classics are inspired by legendary playwrights like Samuel Beckett; internationally renowned companies including Cheek By Jowl, Complicité, and The Wooster Group; and individually brilliant artists like Brian Cox, Helen Mirren, Peter Gill, and Simon Callow.A season of Rep is a whirlwind journey for cast, crew, and audience alike. Join us for an incredible season of five productions, and immerse yourself in the full experience of Rep.Rep Season Offer: book all 5 shows in the same transaction and receive 25% off! Discount will automatically apply in basket.&nbsp;&nbsp;The Season:The Cherry Orchard by Anton ChekhovWhat must be sacrificed to give way to the new?When Riverside Studios opened in 1976, the first production was Chekhov’s infamous comedy-drama, directed by Riverside’s first Artistic Director, Peter Gill, and starring Judy Parfitt in the role of Madame Ranevskaya.&nbsp;The School for Wives by MolièreA man must protect his honour, but at what cost?The controversial and absurd French comedy was brought to Riverside by The English Touring Company in 1995.&nbsp;Phaedra by Jean RacineForbidden love threatens to overwhelm a family torn apart.The Greek classic, retold by a French Master, has been performed several times at Riverside, including a production by Willem Dafoe’s The Wooster Group in 2002.&nbsp;Measure for Measure by William ShakespeareThe path to justice is rarely clear.&nbsp;A problem play, both comedy and tragedy, this notoriously unplaceable play starred Helen Mirren in its 1979 Riverside production.&nbsp;The Virtuous Burglar by Dario Fo (translation by Joe Farrell)What’s wrong with some good old-fashioned thievery? Well, you might get caught red-handed!With his wife Franca Rame, Fo worked at Riverside Studios several times, developing new works that were performed by both of the couple.&nbsp;Praise for Flywheel’s inaugural season at the Old Red Lion:For The Rover:‘an excellent production; ebullient, exuberant, entertaining, grabbing theatre by the balls, pumping new blood, vigour and accessibility into the 1600’s.’ - London At LargeFor Lysistrata:‘deliciously bawdy humour and a powerful message of female power’ - London Pub TheatresFor The Lodger:‘Ingenious… Rep theatre is alive and well’ - The Guardian&nbsp;The Rep​ Core Ensemble:Jaemon Anthony CrosbyConor DumbrellCash Holland&nbsp;Rachel-Leah Hosker&nbsp;Jessica Temple&nbsp;​Satellite Actors:&nbsp;Maggie BainPaul BentallBen FensomeElliot Pritchard&nbsp;&nbsp;Creative Team:Adeyinka AkinrinadeBenedict EsdaleNik HaukohlMercy OlaJack Dugan&nbsp;Rebecca WardLauren VickersWáng​ Shùyīn&nbsp;&nbsp;Fran CattaneoWilliam DunleavyBrett KaszaThea BuglinAnna WoodPierre FlasseMiranda MazzarellaRebecca Thomas​Nell Rose​Isobel JonesCatalina TudoracheCostumes Supplied By Thespis Theatrical CostumiersMarketing By Cup Of AmbitionProducer​ (Veritas Productions)Artistic Director​ (Flywheel Theatre)Associate ProducerAssistant ProducerCreative AssociateCostume &amp; Set DesignerStage Manager&nbsp;Stage Manager&nbsp;Casting DirectorDramaturgCo-Lighting DesignerCo-Lighting DesignerCo-Sound DesignerCo-Sound DesignerPhotographerGraphic Designer​Costume Supervisor/Maker​Design AssistantCostume Assistant", "first_date": "2026-09-08", "last_date": "2026-10-10", "url": "https://riversidestudios.co.uk/whats-on/uqe-rep-radical-classical/", "tags": ["theatre"], "id": "e087", "venue_name": "Riverside Studios", "venue_area": "Hammersmith"}, {"venue_id": "riverside-studios", "title": "The Cherry Orchard", "byline": "Must the house be sold?&nbsp;A childhood home, held in the family for generations, and a failing business alongside it.", "description": "Debts are mounting, times are changing, and impending doom is coming for the old guard.&nbsp;Amongst the rooms of tired luxury, a quirky and disjointed family gather for what might be their last summer, haunted by the ghosts of the past and their own strange demons.&nbsp;In 1976, after the departure of the BBC, the Riverside Studios arts centre opened with a community-led drive to celebrate local artists. The Cherry Orchard was the first play to be produced at the newly hand-refurbished theatre, directed by the first artistic director, Peter Gill, whose minimalist production starred Judy Parfitt in the role of Madame Ranevskaya.Our production takes inspiration from the Gill production’s context, using the political upheaval of the 70s as the stylistic backdrop of an aristocratic family who are soon to be upset by a country at war with itself.&nbsp;In a society of unrest, Chekhov subversively presents a world where everyone is talking, but no-one is listening.Rep Season Offer: book all 5 shows in the same transaction and receive 25% off! Discount will automatically apply in basket.&nbsp;&nbsp;REP: RADICAL CLASSICAL5 ACTORS. 5 PLAYS. 5 WEEKS.Rep is back. Inspired by traditional companies of the past, Flywheel use one of the most intense formats of theatre-making to celebrate 50 years of the iconic Riverside Studios.With a season of plays inspired by half a century of past productions, Flywheel breathe new life into classics. Expect a season of comedies and tragedies that reflect today’s world - exploring themes of&nbsp; judgement, division, and the imbalance of power within family, society, and politics.&nbsp;CASTJaemon Anthony Crosby As TrofimovConor Dumbrell As DunyashaCash Holland As AnyaRachel-Leah Hosker As LopakhinJessica Temple As VaryaMaggie Bain As LubovPaul Bentall As FiersElliot Pritchard As Gaev&nbsp;CREATIVE TEAM:Adeyinka AkinrinadeBenedict EsdaleNik HaukohlMercy OlaJack Dugan&nbsp;Rebecca WardLauren VickersFran CattaneoWilliam DunleavyBrett KaszaAnna WoodMiranda MazzarellaRebecca Thomas​Nell Rose​Isobel JonesCatalina TudoracheCostumes Supplied By Thespis Theatrical CostumiersMarketing By Cup Of AmbitionProducer​ (Veritas Productions)Artistic Director​ (Flywheel Theatre)Associate ProducerAssistant ProducerCreative AssociateVideo, Costume &amp; Set DesignerStage Manager&nbsp;Casting DirectorDramaturgLighting DesignerSound DesignerPhotographerGraphic Designer​Costume Supervisor/Maker​Design AssistantCostume Assistant&nbsp;", "first_date": "2026-09-08", "last_date": "2026-09-12", "url": "https://riversidestudios.co.uk/whats-on/u1Z-the-cherry-orchard/", "tags": ["theatre"], "id": "e088", "venue_name": "Riverside Studios", "venue_area": "Hammersmith"}, {"venue_id": "roundhouse", "title": "Self Made Online: How to manage your time as a neurodivergent creative", "byline": "Rigid schedules don’t work for everyone – especially neurodiverse people.", "description": "In this online workshop we’ll look at practical techniques to manage your time and help you get things done – from flexible time blocking, task organisation and restful boundaries built specifically for neurodivergent minds.\n\nVivienne Isebor is an award winning Creative-social Entrepreneur & Womanist, blending community activism, advocacy, psychology, and the arts to drive social change. She is the founder of ADHD Babes, the UK’s only community organisation supporting Black women and non-binary people with ADHD, and a qualified Clinical Associate in Psychology from UCL.\n\nSince being diagnosed in her 20’s with ADHD and living with mental health difficulties Vivienne has run awareness workshops and advocated at institutions, business and platforms such as BBC, The Guardian and Forbes. She is currently writing a book about the experiences of Black Women and Non-binary people with ADHD.", "first_date": "2026-09-08", "last_date": "2026-09-26", "url": "https://www.roundhouse.org.uk/whats-on/smo-time-management-neurodiverse-au26/", "tags": ["class", "talk"], "id": "e089", "venue_name": "Roundhouse", "venue_area": "Chalk Farm"}, {"venue_id": "shakespeares-globe", "title": "Love's Labour's Lost", "byline": "Passion, power, and poetry collide as four women arrive in Navarre on a diplomatic mission, testing the devotion of the King and his lords whose vows are undone by love, desire, and wit.", "description": "In her Globe Theatre directing debut, Associate Artist Indiana Lown-Collins (former Globe Resident Artist, JMK Award winner for The Solid Life of Sugar Water , Orange Tree) channels the warmth and vibrancy of her rural Spanish roots into this celebrated comedy, igniting it with the feeling and artistry of flamenco.\n\nStep into a world of rhythm and fiery romantic tension, where joy and revelry mingle with longing, grief, and melancholy.", "first_date": "2026-09-08", "last_date": "2026-09-13", "url": "https://www.shakespearesglobe.com/whats-on/loves-labours-lost/", "tags": ["theatre"], "id": "e090", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "soho-theatre", "title": "Wally Baram: My Snake’s Quinceañera", "byline": "Wally is a Mexican-Syrian stand-up comedian, writer, and actress currently living in NYC…", "description": "Wally is a Mexican-Syrian stand-up comedian, writer, and actress currently living in NYC, who earned a 2026 Independent Spirit Award nomination for Best Breakthrough Performance for her acting debut as a high school outsider on a mission to fit in at all costs in college. She is also a co-executive producer of the show created by Benito Skinner, with its second season on the way later this year.\n\nWally was named a Just For Laughs New Face of stand-up comedy, made her late-night debut on The Late Show With Stephen Colbert , and performs regularly at clubs and venues across the US.\n\nShe was a producer on the Netflix series, Neon , a co-producer on Apple TV’s, Shrinking , and has written for the Disney+ series English Teacher, What We Do In The Shadows on the BBC , HBO’s Betty , and Amazon’s Sprung .", "first_date": "2026-09-08", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/wally-baram-my-snakes-quinceanera/", "tags": ["stand-up"], "id": "e091", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "southbank-centre", "title": "Musquiqui Chihying: A Life of Navigation", "byline": "A multimedia exhibition from the Taiwanese artist, serving up both humour and societal critique to explore themes of urban life and technological advancement.", "description": "The exhibition brings together four works by Musquiqui Chihying, showcasing his imaginative, idiosyncratic and quietly provocative practice. A Life of Navigation begins with Chihying’s early, quirky attempts to navigate the impacts of our busy and often high-stress urban life. Alongside these early works, The Jog (2014) and The Toyota (2015), sit two newly produced video installations. These latest works cast a playful yet critical eye on the development of artificial intelligence and gaming culture, alongside the rising tension between manual labour and automation. All underpinned by a sense of humour and performativity, these new works explore Chihying’s recent interest in unpacking the rarely discussed modern-day colonial attitudes at the centre of our pursuit of technological advancement. Musquiqui Chihying is a Taiwanese artist known for his humorous practice that navigates between reality and the surreal. Working across installation, video, photography and sculptural objects, and often incorporating performativity, Chihying explores the impacts of modern-day technologies on contemporary societal structures and the human condition. Presented as part of the RC Foundation Project Space Exhibition Series, with support from the RC Foundation, Taiwan (R. O. C.). Additional support provided by the Ministry of Culture, Taiwan (R. O. C.)", "first_date": "2026-09-08", "last_date": "2026-10-18", "url": "https://www.southbankcentre.co.uk/whats-on/musquiqui-chihying-a-life-of-navigation/", "tags": ["exhibition"], "price_min": 0.0, "id": "e092", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "southbank-centre", "title": "Quentin Blake: The Southbank Parade", "byline": "The much-loved illustrator and author celebrates the 1951 Festival of Britain with a new installation for you to discover across our site.", "description": "With these illustrations, created as part of our 75th anniversary celebrations, Sir Quentin Blake pays tribute to some of the many legends who have graced our stages over the decades. At the same time, they honour the Londoners of all backgrounds who fill our riverfront each and every day. You can discover illustrations throughout our indoor spaces from February to November, and a procession of Blake’s characters outside the Royal Festival Hall from May. Look out for rock stars, ballet dancers, authors, skaters, parkour athletes, dub poets, jazz singers and heaps more characters waiting to be discovered.", "first_date": "2026-09-08", "last_date": "2026-11-08", "url": "https://www.southbankcentre.co.uk/whats-on/quentin-blake-the-southbank-parade/", "tags": ["exhibition"], "price_min": 0.0, "id": "e093", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "southbank-centre", "title": "Luke Jerram: Stepping Out", "byline": "Your feet make the tunes as your steps trigger rising and falling arpeggios of music in this installation from artist Luke Jerram and composer Dan Jones.", "description": "The staircase by the Royal Festival Hall becomes a playground of sonic exploration in Stepping Out, an interactive musical artwork commissioned for our 75th anniversary. Rising and falling arpeggios are triggered as people walk up and down the steps. As people step onto the round ‘islands’ of colour, additional music and instruments are activated, which combine with the arpeggios to create a wonderfully interactive, live musical experience. The piece is a collaborative work from the creative minds of Luke Jerram, known for his large-scale environmental installations; the BAFTA- and Ivor Novello Award-winning composer and sound designer Dan Jones; and musicians from the London Philharmonic Orchestra. Hop between the round ‘islands’ of colour that adorn the concrete steps and walkway to trigger the bespoke music. Programmed to change each week, you can pass through the site again and again – it’s an ever-changing artwork sure to put a spring in everyone’s step. We are grateful for the financial support and participation of the London Philharmonic Orchestra in Stepping Out.", "first_date": "2026-09-08", "last_date": "2026-09-30", "url": "https://www.southbankcentre.co.uk/whats-on/luke-jerram-stepping-out/", "tags": ["immersive"], "price_min": 0.0, "id": "e094", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "tabard", "title": "Horatio Nelson: Fever and Fire", "byline": "Back by popular demand following a sell-out run at the Tabard Theatre.", "description": "Written and performed by Adam Preston, Horatio Nelson, Fever and Fire is a powerful one-man show exploring the life, loves and legacy of Britain's greatest naval hero.\n\nDrawing on extensive historical research, the play goes beyond the familiar legend to reveal the man behind the myth. From the loss of his mother in childhood and his early struggles at sea to his greatest victories and his passionate relationship with Emma Hamilton, Nelson's extraordinary story is brought vividly to life with wit, humanity and emotional depth.", "first_date": "2026-09-08", "last_date": "2026-09-12", "url": "https://www.tabard.org.uk/production/horatio-nelson-fever-and-fire", "tags": ["theatre"], "id": "e095", "venue_name": "Tabard Theatre", "venue_area": "Chiswick"}, {"venue_id": "the-cockpit", "title": "Tête à Tête: The Opera Festival 2026", "byline": "Tête à Tête’s flagship festival returns, presenting adventurous new opera from across the UK and internationally.", "description": "Shows include stories from Cornwall to Hong Kong, Scotland to Ukraine, ancient myths to contemporary circus.\n\nSince 2007, the festival has premiered hundreds of works and remains a vital platform for emerging artists.", "first_date": "2026-09-08", "last_date": "2026-09-20", "url": "https://www.thecockpit.org.uk/Teteatete2026", "tags": ["opera"], "id": "e096", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "A Catalan Fairytale", "byline": "Discover the magic of Catalunya through a triptych of fairytales!", "description": "Come wander misty mountain ranges, fight prickly dragons (or are they simply cactus...?), and watch magical dragonflies take flight in an exploration of stories old and new from one of Europe's oldest and most legendary regions.\n\nhttps://www.tete-a-tete.org.uk/event/a-catalan-fairytale/", "first_date": "2026-09-08", "last_date": "2026-09-08", "url": "https://www.thecockpit.org.uk/show/a_catalan_fairytale", "tags": ["theatre"], "id": "e097", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-place", "title": "Choreodrome: making progress", "byline": "Six choreographers share works-in-progress in a series of short performances, developed through The Place’s Choreodrome residency in Summer 2026.", "description": "Expect beautiful, bold and bonkers experiments as these artists try new things in our intimate studio theatre! This year's artists are Eleanor Sikorski, Annie Hanauer, Oluwatosin Omotosh o, Joe Moran, Isaac Ouro-Gnao and Kesha Raithatha . Choreodrome: making progress takes place across two evenings, both of which end in a facilitated feedback session with the choreographers and performers.\n\nEleanor Sikorski works in dance as a performer, choreographer, rehearsal director and teacher. She is also a filmmaker and comics artist. Eleanor’s choreographic work includes solo performances, stand-up sets, music videos, group pieces, and sculpture. She combines formal elements with humour and off-kilter storytelling.", "first_date": "2026-09-08", "last_date": "2026-09-09", "url": "https://theplace.org.uk/events/autumn-winter-26-choreodrome-making-progress", "tags": ["dance"], "id": "e098", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "underbelly-boulevard", "title": "Woody Sez: The Life & Music of Woody Guthrie", "byline": "A musical journey through the fascinating, defiant, wildly prolific life and all-too-relevant career of Woody Guthrie .", "description": "The Rock & Roll Hall of Fame calls him “the original folk hero”, the man who turned the folk ballad into a vehicle for social protest. Now this award-winning show brings his story to London.\n\nJoin us on an authentically American musical journey, told in Guthrie’s own words and over two dozen of his timeless songs, in one joyous, toe-tapping musical.", "first_date": "2026-09-08", "last_date": "2026-09-19", "url": "https://underbellyboulevard.com/tickets/woody-sez-the-life-music-of-woody-guthrie/", "tags": ["musical", "concert"], "id": "e099", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "upstairs-gatehouse", "title": "Mammy’s House", "byline": "Camden, 1985. Behind the door of a London terrace, a queer Irish household is cobbling together a life filled with humour, drag, and a freedom they could never have imagined back home.", "description": "But their community is on the edge of their greatest challenge yet. Being Irish in the UK is complicated. Being queer and Irish during the early years of the AIDS crisis is downright perilous.\n\nMammy’s house rises to meet the challenge; offering warmth, care, sarcasm, petty squabbling, and the fierce loyalty of chosen family. As the epidemic threatens to engulf them and the world turns away, this resilient group of gay and lesbian Irish people know they have survived shame before, and they intend to survive it again\n\nProudly supported by the Emigrant Support Programme and the Meitheal Muintire Irish End of Life Care Project, Mammy’s House is about the families we build when the ones we were born into cannot accept us for who we are.", "first_date": "2026-09-08", "last_date": "2026-09-13", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173674251", "tags": ["theatre"], "id": "e100", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "upstairs-gatehouse", "title": "Love Me, Love Me Not...", "byline": "Produced by LIVEWIRE Prods, this cabaret showcases 24 outstanding emerging performers across two performances, each bringing their own voice, personality, and story to the stage.", "description": "Audiences can expect powerhouse vocals, moving ballads, moments of laughter, and heartfelt reflections on love in all its messy, beautiful complexity.\n\nWhether you've fallen head over heels, had your heart broken, or are still figuring it all out, Love Me, Love Me Not... promises an evening of unforgettable music, honest storytelling, and performances that will stay with you long after the final note.", "first_date": "2026-09-08", "last_date": "2026-09-27", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173676061", "tags": ["cabaret"], "id": "e101", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "upstairs-gatehouse", "title": "The Musical Medea", "byline": "The Musical Medea A new folk musical retelling of the Ancient Greek myth. This time, Medea’s holding the mic.", "description": "You will hear her. Leaving behind the safety of her homeland, Medea places her trust in Jason and his promise of a glittering future together. But is her faith misguided? With an original folk score, an ensemble of actor-musicians brings a new dimension to the story you thought you knew of sacrifice, betrayal, and the cataclysmic power of love.", "first_date": "2026-09-08", "last_date": "2026-10-04", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173675562", "tags": ["musical"], "id": "e102", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "upstairs-gatehouse", "title": "Love's Labour's Lost", "byline": "Four of the King’s entourage wake up in the garden to find they have made a terrible drunken decision: no food, no fun, and, most disastrously, absolutely NO women. For three whole years. What could possibly go wrong?", "description": "Enter the Princess and her dazzling retinue, and… well, you can guess. Cue love at first sight, love notes gone rogue, disguises that fool nobody, and four men falling head-over-heels faster than you can say \"so much for that vow.\"\n\nThink of it as the rom-com the genre was born from; all the fumbling, the pining and the grand romantic gestures you'd expect from a Hugh Grant, Julia Roberts or Colin Firth flick just with 400 years' head start. In an new edition, we've taken Shakespeare's sunniest comedy, given it a good trim, and set it loose in the garden of a grand hotel. Think riotous colour, larger-than-life characters, quick-witted, quick-fire delivery, and all served with a proper great-British nudge-nudge-wink-wink.", "first_date": "2026-09-08", "last_date": "2026-10-11", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173675559", "tags": ["theatre"], "id": "e103", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "upstairs-gatehouse", "title": "Long After the Labyrinth", "byline": "Crete 1944. A young girl hides in the hollow of an ancient olive tree, watching helplessly, as her family are rounded up and loaded onto trucks. A horned shadow looms and she finds herself falling… falling…", "description": "This epic new play is inspired by the Minotaur and the true tale of the lost Jews of Crete. A gripping narrative told via text, movement and shadow-play, we follow the life of Rena Depas on her labyrinthine quest to find peace in the wake of violence.\n\nFor this production, NMT Automatics have brought together a team of creatives, who have worked with some of the most internationally renowned contemporary theatre companies, including: 1927, Gecko, Theatre Re, Ephemeral Ensemble, and Les Enfants Terribles.", "first_date": "2026-09-08", "last_date": "2026-11-08", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173675580", "tags": ["theatre"], "id": "e104", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "wiltons", "title": "The Elixir of Love", "byline": "Donizetti ’s timeless comedy, The Elixir of Love , bursts to life in this beautiful new production, fresh from Waterperry.", "description": "Produced by WOF’s and CCO’s Artistic Director, John Savournin , it is directed by John Wilkie and musically directed by CCO’s David Eaton .\n\nUnder the glow of lanterns and bunting, a lively fête transforms the stage into a village green beside a bustling chocolate factory. Adina, savvy and independent, delights in her freedom, while the lovestruck Nemorino longs to be noticed. When the swaggering Belcore arrives to claim Adina’s hand, and the charismatic Dulcamara offers bottled courage, misunderstandings multiply and passions run high.\n\nThe production is designed by Ceci Calf and lighting design is by Jake Wiltshire .", "first_date": "2026-09-08", "last_date": "2026-09-19", "url": "https://wiltons.org.uk/whats-on/the-elixir-of-love/", "tags": ["opera"], "id": "e105", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "arcola", "title": "Fire Fire", "byline": "Today, Eddie is holding a memorial for his brother at a park near their council estate. Today is also the day Paige decides to close the road to this countryside sanctuary in a protest about climate action.", "description": "Naturally, when the pair meet, sparks fly, insults are traded in a fiery exchange, and they expect never to see each other again.\n\nUntil they feel there’s no choice but to join forces and take drastic action together.", "first_date": "2026-09-09", "last_date": "2026-10-03", "url": "https://www.arcolatheatre.com/event/fire-fire/", "tags": ["theatre"], "id": "e106", "venue_name": "Arcola Theatre", "venue_area": "Dalston, E8"}, {"venue_id": "barbican", "title": "Our Eyes Looking for God", "byline": "A groundbreaking opera exploring Black British experiences, telling an urgent national story of state violence through joy, love, laughter and pain.", "description": "An opera. A ghost story. A love story. Black boy joy and Black boy nightmares. Our Eyes Looking for God is an exceptional and vital work written during the 2020 global racial reckoning. Writer/Director TD Moyo uses the operatic form, with its drama, music, staging and instrumentals, to tell an all-encompassing story about identity, state violence and love.\n\nThis production is brought to life by a visionary team. TD Moyo is a director, teacher, poet and activist whose work focuses around new stories and social engagement. Renell Shaw is an Ivor Novello award-winning composer, platinum selling songwriter and music producer who works across a range of genres, British-Nigerian soprano April Koyejo-Audiger is an operamaker, award-winning opera singer and librettist. Mateus Daniel is a movement director, choreographer and facilitator.", "first_date": "2026-09-09", "last_date": "2026-09-13", "url": "https://www.barbican.org.uk/whats-on/2026/event/our-eyes-looking-for-god", "tags": ["opera"], "id": "e107", "venue_name": "Barbican Centre", "venue_area": "Barbican"}, {"venue_id": "brixton-house", "title": "Housemates 2026: Open Mic Night", "byline": "Whether you’re a writer, poet, musician, performer, spoken word artist or creative experimenting with something new…", "description": "Whether you’re a writer, poet, musician, performer, spoken word artist or creative experimenting with something new, these evenings are designed to celebrate emerging voices and create opportunities for artists to connect with audiences and one another. At Housemates, we believe great work starts with having the space to try things out. Our Open Mic Nights offer a platform for artists at every stage of their journey to build confidence, receive encouragement and become part of a vibrant creative community. Expect an evening of fresh ideas, exciting talent and unexpected moments as artists from across South London and beyond. Come along to perform, discover new talent, or simply enjoy an evening of creativity and connection.", "first_date": "2026-09-09", "last_date": "2026-09-16", "url": "https://brixtonhouse.co.uk/shows/housemates-2026-open-mic-night/", "tags": ["spoken-word", "class"], "id": "e108", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "cafe-oto", "title": "Yumi Hara's Groove Study (Yumi Hara / Chris Cutler / Toshiaki Sudoh) + TAKU + DJ Marina Organ", "byline": "Yumi Hara’s Groove Study are avant-rock trio consisting of ex-Henry Cow drummer Chris Cutler…", "description": "Yumi Hara’s Groove Study are avant-rock trio consisting of ex-Henry Cow drummer Chris Cutler; London-based Japanese composer/pianist/vocalist Yumi Hara, the driving force of Lindsay Cooper Songbook, who has been collaborating extensively with Canterbury/Rock in Opposition/Krautrock/contemporary classical music such as Hugh Hopper of Soft Machine, Daevid Allen of Gong, Jean-Hervé Péron of faUSt, Tim Hodgkinson, John Greaves, Geoff Leigh, Dagmar Krause of Henry Cow, and PianoCircus; and ex-MELT-BANANA and collaborator of Jim O'Rourke and Eiko Ishibashi (also appeared her score for the film Drive My Car) bassist Toshiaki Sudoh, performing music with complex rhythm and harmony, yet accessible with memorable melodies, fusing ever-changing odd metres and world rhythms (expect Gamelan in 6, reggae in 7, West-African polyrhythms in 10, Baroque fugue in 15), medieval modes and Japanese scales which would appeal fans of Canterbury Scene, Rock in Opposition, Avant-Prog and Recommended Records: ‘incisive’, ‘fizzes with invention and inspiration’, ‘distils so many of the musical ideas’, ‘nothing short of majestic’ (Sid Smith, PROG magazine).\n\nYumi Hara studied the piano from 3 years old but stopped at the age of 12 when she felt the classical material she was practising was boring compared to British rock she found then. She subsequently studied North Indian music and dance, and went on to study medicine and became psychiatrist, but at the age of 33, she decided to go back to music and settled in London. She studied West African percussion, Korean percussion, North Indian vocal music, Javanese Gamelan at SOAS as occasional student, then continued to study 20th Century piano music, ethnomusicology, instrumental and electroacoustic composition and recording at City University and gained BMus and PhD. She performed as a member of Frank Chickens, run a concert series Bonobo’s Ark, did some drum’n’bass production and DJ, and her compositions have been performed by contemporary classical ensembles such as PianoCircus and the BBC Singers, but she has become increasingly well-known as an improvisor and performer in the avant-rock, Canterbury and RIO scene since she performed with David Cross (ex-violinist of King Crimson), and released a CD album DUNE with Hugh Hopper (ex-Soft Machine bassist) as HUMI in 2008. Since then, she has been collaborating with ex-Henry Cow musicians Chris Cutler, Tim Hodgkinson, Geoff Leigh, John Greaves and Dagmar Krause, faUSt musicians Jean-Herve Peron and Zappi, ex-GONG Daevid Allen as The Artaud Beats, THE WATTS, Half the Sky/Lindsay Cooper Songbook, you me & us, and Jump for Joy! She has also performed and/or collaborated with Tatsuya Yoshida, Kazuhisa Uchihashi, David Jackson, Guy Evans, Asaf Sirkis, Charles Hayward, Fred Frith, Akira Sakata, Chloe Herington, Pierre Chevalier, Guy Harries, David Toop and Kiku Day, among others.\n\nChris Cutler (drums) is a renowned drummer whose activities encompasses from rock to contemporary art music, composition to improvisation, tonal song form to found sound. At the start of the seventies, he co-founded The Ottawa Music Company before joining British experimental group Henry Cow, with whom he toured, recorded and worked for the next eight years. Subsequently he co-founded a series of mixed national groups such as Art Bears and Cassiber. He is a permanent member of The Artaud Beats (with Yumi Hara Cawkwell, Geoff Leigh, John Greaves) and Half the Sky/Lindsay Cooper Songbook. He also founded and runs the independent label ReR Megacorp www.rermegacorp.com and is author of the theoretical collection File Under Popular as well as of numerous articles and papers published in 16 languages.", "first_date": "2026-09-09", "last_date": "2026-09-09", "url": "https://www.cafeoto.co.uk/events/byh-yumi-haras-groove-study/", "tags": ["concert"], "id": "e109", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "etcetera", "title": "Jamie Radcliffe: What Are Kippers?", "byline": "Comedian Jamie Radcliffe is on tour in 2026 with his brand new show, 'What Are Kippers?'.", "description": "In this hour of stand-up, theatre and poetry, Radcliffe (who has previously appeared on BBC Radio Oxford and reached the quarter-finals of the Musical Comedy Awards) covers a variety of topics from silliness, to Shakespeare, to sadness and back to silliness again in a show that acts as his love letter to comedy, performance and family. And he might even get round to answering the show's titular question...", "first_date": "2026-09-09", "last_date": "2026-09-09", "url": "https://www.etceteratheatrecamden.com/events/jamie-radcliffe-what-are-kippers", "tags": ["stand-up", "theatre"], "id": "e110", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "ica", "title": "Loraine James + Eden Samara", "byline": "Quite simply one of the most consistent and visionary producers working today, we are excited to welcome back Loraine James following her new release on Hyperdub Detached From The Rest Of You - her experimental approach is struck through…", "description": "Quite simply one of the most consistent and visionary producers working today, we are excited to welcome back Loraine James following her new release on Hyperdub Detached From The Rest Of You - her experimental approach is struck through with vulnerability, curiosity and hope. Support from Eden Samara.", "first_date": "2026-09-09", "last_date": "2026-09-09", "url": "https://www.ica.art/live/loraine-james", "tags": ["concert"], "id": "e111", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "piehouse", "title": "Piehouse Presents: Lobby, spread thin, Baby Grol, The Juoh Liv and Grace Birthday Edition", "byline": "Piehouse Presents: Lobby, spread thin, Baby Grol, The Juoh Liv and Grace Birthday Edition", "description": null, "first_date": "2026-09-09", "last_date": "2026-09-09", "url": "https://piehouse.coop/events", "tags": ["concert"], "id": "e112", "venue_name": "Piehouse Co-op", "venue_area": "Deptford"}, {"venue_id": "sadlers-wells", "title": "San Francisco Ballet - Mere Mortals", "byline": "A Pandora’s Box of technology, creativity and movement – do you dare lift the lid?", "description": "Step inside a world where myth meets modern day. Mere Mortals reimagines the story of Pandora’s Box through the lens of our tech-driven age. Exploring eternal philosophical questions through the timely subject of artificial intelligence, this ballet examines the promises and perils of humankind forging new paths in unknown territory. This fully immersive experience fuses movement, music, and cutting-edge visuals into a breathtaking sensory journey.\n\nCommissioned as a world premiere for Artistic Director Tamara Rojo ’s inaugural season, the program returns as a fusion of electronic music, festival culture, and contemporary ballet – an otherworldly journey all around.", "first_date": "2026-09-09", "last_date": "2026-09-12", "url": "https://www.sadlerswells.com/whats-on/san-francisco-ballet-mere-mortals/", "tags": ["dance"], "id": "e113", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "shakespeares-globe", "title": "As You Like It", "byline": "Rosalind is suffocating in the newly reigning Duke’s court. Surrounded by high wigs and even higher tempers, when egos come to a head, Rosalind and Celia flee into the Forest of Arden.", "description": "They arrive, stumbling into a world where opposites attract, revelry is king and love is easy to find, if hard to recognise…\n\nPhotography: Felicity McCabe Art Direction: Doug Kerr\n\nFind out how to get here, where to stay and read our FAQs.", "first_date": "2026-09-09", "last_date": "2026-10-25", "url": "https://www.shakespearesglobe.com/whats-on/as-you-like-it/", "tags": ["theatre"], "id": "e114", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "soho-theatre", "title": "Right Before I Go.", "byline": "Drawing on real suicide notes and personal testimonies, the play gives voice to individuals from a wide range of backgrounds including public figures, veterans, young people, members of the LGBTQ+ community…", "description": "Drawing on real suicide notes and personal testimonies, the play gives voice to individuals from a wide range of backgrounds including public figures, veterans, young people, members of the LGBTQ+ community, and people living with mental health challenges.\n\nFeaturing a rotating cast of all-stars including Claire-Marie Hall ( Operation Mincemeat ), Edward DeRuiter (Judging Amy), Emrhys Cooper ( Nosferatu , Coronation Street , Vanity ), Jessica Lia Berry ( I’m Still Not That Girl ), Lucy Speed ( EastEnders, The Archers ), Maureen Lipman ( Educating Rita , Agony ), Paul Bigley ( Shakespeare in Love , The Danish Girl ) and Tosh Wanogho-Maud ( Kinky Boots , Titanique ).\n\n5 Sep: Edward DeRuiter, Emrhys Cooper, Jessica Lia Berry, Lucy Speed and Stan Zimmerman.", "first_date": "2026-09-09", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/right-before-i-go/", "tags": ["theatre"], "id": "e115", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "southbank-centre", "title": "futuretense: Teshay Makeda + NEONE The Wonderer", "byline": "Teshay Makeda’s intoxicating blend of reggae, soul, R&B and spirituality meets NEONE The Wonderer’s electric alt hip-hop genre fusions.", "description": "Powerful vocals, uplifting lyrics and a healing presence encapsulate the hypnotic magic of multi-award-winning artist Tashey Makeda’s music.\n\nMakeda’s blend of reggae, soul and R&B, dubbed ‘Roots Soul’, creates a unique sound rooted in her Jamaican heritage and Rastafari upbringing.", "first_date": "2026-09-09", "last_date": "2026-09-09", "url": "https://www.southbankcentre.co.uk/whats-on/futuretense-teshay-makeda-neone-the-wonderer/", "tags": ["concert"], "id": "e116", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "the-cockpit", "title": "Eight Days", "byline": "1st February 1587. Mary, Queen of Scots, after twenty years of captivity, still remains imprisoned in Fotheringhay castle. Unbeknownst to her, Queen Elizabeth I - her own cousin - has signed her death warrant.", "description": "Haunted by her past and still protesting her innocence, in these final eight days Mary is confronted by the consequences of her decisions, grappling with her inner demons whilst remaining devoted to her faith.\n\nAs she braces herself for death, Mary, still a queen, deliberately sows the seeds for her own enduring legacy as martyr and icon.", "first_date": "2026-09-09", "last_date": "2026-09-09", "url": "https://www.thecockpit.org.uk/show/eight_days", "tags": ["theatre"], "id": "e117", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "The History of Mr Polly: Part One", "byline": "He’s stuck in a marriage with his cousin and dragged down by their failing shop. He detests them both. How did he let his life get so intolerable?", "description": "Was it his failure to make his own choices? His escapism and wanderlust? Or, inspired by the books he so avidly reads, falling head over heels for the unattainable Christabel?\n\nWhatever, he’s reached the point where drastic measures are called for. What else can he do but burn everything down?", "first_date": "2026-09-09", "last_date": "2026-09-09", "url": "https://www.thecockpit.org.uk/show/the_history_of_mr_polly_part_one", "tags": ["theatre"], "id": "e118", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "theatre503", "title": "Character Building: Building 3 Dimensional Characters with Tyrell Williams: In-Person Masterclass", "byline": "A personal approach to building three dimensional characters. A session exploring the process and importance of ensuring how our work represents complex human beings in its storytelling.", "description": "Tyrell will explore his own journey into writing and his experience in relation to the topic plus there will be Q&A opportunities.\n\nThis masterclass will take place in-person at Theatre503’s Studio.\n\nThanks to our Share The Drama scheme , we want to make sure those of you who are struggling in the current climate can still take part in our Writers Programme. If you would like to book a Share The Drama bursary for the Writer’s Programme, please call our box office on 02079787040 to enquire about payment and availability.", "first_date": "2026-09-09", "last_date": "2026-09-09", "url": "https://theatre503.com/whats-on/character-building-building-3-dimensional-characters-with-tyrell-williams-in-person-masterclass/", "tags": ["class"], "id": "e119", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "theatre503", "title": "Write Your First Full Length Play with Steve Harper: 8-Week Online Course", "byline": "Theatre503’s flagship writing course, to support you to write your first full length play led by Literary Manager, Steve Harper.", "description": "Thanks to our Share The Drama scheme , we want to make sure those of you who are struggling in the current climate can still take part in our Writers Programme. If you would like to book a Share The Drama bursary for the Writer’s Programme, please call our box office on 02079787040 to enquire about payment and availability.\n\nOur course will provide a structured exploration at pivotal stages of the process and incorporate discussion, exercises and shared experience around particular points in the process and directly in response to the work you are creating throughout.", "first_date": "2026-09-09", "last_date": "2026-09-09", "url": "https://theatre503.com/whats-on/write-your-first-full-length-play-with-steve-harper-8-week-online-course/", "tags": ["class"], "id": "e120", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "underbelly-boulevard", "title": "Belly Laugh", "byline": "We’re showcasing rising talent from London’s buzzing comedy scene, with performers handpicked from the circuit to give you a taste of our Edinburgh Fringe roots in the heart of Soho.", "description": "This is your chance to catch the next big thing—or maybe even be it.\n\nThe show on 9 Sep is part of Fringe Fix – a cracking handpicked selection of shows we think you’ll love from this year’s Edinburgh Festival Fringe.", "first_date": "2026-09-09", "last_date": "2026-12-09", "url": "https://underbellyboulevard.com/tickets/belly-laugh-2/", "tags": ["stand-up"], "id": "e121", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "bridge-house", "title": "The Obituary", "byline": "Three siblings return to their old family house before it is demolished, with one hour to complete a property report. What begins as paperwork becomes a fight over memory, migration, and who gets to decide what a family is worth.", "description": "As they sort through decades of belongings, resentments, and conflicting memories, it becomes clear that they have not only inherited the same house, but entirely different ideas of home. Using one East Asian family story to reflect wider experiences of migration and cross-cultural identity, The Obituary is a sharp and tender new play about inheritance, belonging, and what remains when the people you love no longer share the same understanding of where they come from.\n\nAt its heart, The Obituary asks a simple but difficult question: if home can no longer hold a family together, what can?", "first_date": "2026-09-10", "last_date": "2026-09-10", "url": "https://thebridgehousetheatre.co.uk/shows/the-obituary/", "tags": ["theatre"], "id": "e122", "venue_name": "The Bridge House Theatre", "venue_area": "Penge"}, {"venue_id": "brockley-jack", "title": "Diss-Lex-ians", "byline": "Meet G, a fast-talking daughter of Lewisham. With the help of her friend P, can she overcome the chaos of home life…", "description": "spellings, the inner demon Negs… spellings, her mother… spellings. G has Missy Elliott, her spelling answer to everything, or is she?\n\nThe Company: Doragine immersed herself in the vibrant hip-hop scene of the 1980s as a street dancer, forming an all-female breakdance crew. Highlights include competing in the inaugural DMC Hip-Hop Competition at Brixton Academy. Transitioning to theatre, she performed at prestigious London venues and taught Hip-Hop dance to young adults. Doragine supported UK female rap artists and performed alongside Chaka Khan. She also served as creative director for “Spiritual Soul” at Brixton Electric.\n\nPenny lives in Crofton Park, fabulously dyslexic, she met Genie on Chelwood Nursery pick-ups, bonding over our love of the Arts, me costume, her dance. Quirky thing about me is I designed a method to understand Times Tables, despite not even getting a grade at Maths CSE level (showing my age there).", "first_date": "2026-09-10", "last_date": "2026-09-10", "url": "https://brockleyjack.co.uk/jackstudio-entry/diss-lex-ians/", "tags": ["dance"], "id": "e123", "venue_name": "Brockley Jack Studio", "venue_area": "Crofton Park"}, {"venue_id": "cafe-oto", "title": "Seijiro Murayama / Jean-Luc Guionnet (duo) + Vespertilio folia ferens", "byline": "An evening of two duo sets from 4 musicians who have a longstanding history with one another.", "description": "Seijiro Murayama and Jean-Luc Guionnet have been consistantly playing as a duo from 2006 and this is the second concert from Vespertilio folia ferens - the duo of Seymour Wright and Luciano Maggiore.\n\nPercussionist Seijiro Murayama was born in 1957 in Nagasaki, Japan. He started performing improvised music in 1972, under some influence of Vinko Globokar and musicologist Fumio Koizumi. After graduated from Tokyo University in 1982 in Urdu studies he toured the USA with Keiji Haino as part of the seminal psychedelic band Fushitsusha. Returning to Japan after a period in NYC he continued playing drums and electronics in K. K. Null‘s noise/rock band A. N. P. (Absolut Null Punkt), while further exploring free improvisation. A relocation to France in 1999 led to collaborations that extended into dance, theatre and performance as well as ongoing partnerships with musicians Jean-Luc Guionnet, Eric Cordier, Michel Doneda, Mattin, Lionel Marchetti, among many others. After over a decade in Europe he relocated back to Japan in 2013.\n\nHis artistic principal is to work with the idea of the plural or inter-disciplinary relationships between music and other disciplines of art: dance, video, paintings, photos, literature etc. In this way, he collaborates with musicians, composers, and sound artists. Improvisation is always the major concern for him, even if it is not his artistic goal. His approach is based on the attention to space and place, to the energy of the audience and to the quality and perception of silence on various levels.", "first_date": "2026-09-10", "last_date": "2026-09-10", "url": "https://www.cafeoto.co.uk/events/seijiro-murayama-jean-luc-guionnet-duo-vespertilio/", "tags": ["concert"], "id": "e124", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "courtyard", "title": "Serious Money", "byline": null, "description": null, "first_date": "2026-09-10", "last_date": "2026-09-19", "url": "https://thecourtyardtheatre.seetickets.com/event/serious-money/the-courtyard-theatre/3709462", "tags": ["theatre"], "id": "e125", "venue_name": "The Courtyard Theatre", "venue_area": "Hoxton"}, {"venue_id": "etcetera", "title": "FEAR", "byline": "“Fear used to be simple, a public information film, a government leaflet, a shark.", "description": "Job done. Then someone upgraded the system. &nbsp;The only thing to fear is fear itself. A comedy\"   Instagram @stevevertigo /   stevevertigo.com   +16 Age restriction - fear, swearing and adult themes", "first_date": "2026-09-10", "last_date": "2026-09-10", "url": "https://www.etceteratheatrecamden.com/events/fear5", "tags": ["comedy"], "id": "e126", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "hackney-empire", "title": "Fatiha El-Ghorri: Cockney Stacking Doll", "byline": "BRUV. The break-out star of Taskmaster and Mr Bigstuff is only embarking on her first ever stand-up tour, isn’t she?!", "description": "Fatiha’s ironed her swaggest hijab and she’s ready to hit the road to serve up her one-of-a-kind and award-winning stand-up.\n\nExpect a lot of laughs, stereotype-smashing, and to fall side-splittingly in love with this knock-out comic who is destined for stardom.\n\nAs seen on Live At The Apollo , QI , The Last Leg , The Jonathan Ross Show , Cats Does Countdown and Donkey . As heard on Off Menu , Alan Carr's Life's A Beach and A Match Made Inshallah for BBC Radio 4. Winner of Leicester Comedy Festival’s Best Debut Show award.", "first_date": "2026-09-10", "last_date": "2026-09-10", "url": "https://www.hackneyempire.co.uk/events/fatiha-el-ghorri-cockney-stacking-doll", "tags": ["stand-up"], "id": "e127", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "hope-theatre", "title": "The Greater Good Company", "byline": "Sigma Solutions has long been in the business of delivering on extraordinary commissions.", "description": "Missing a plane? They’ve got you. Curious about ‘solving’ emotions? So are they. Found some ancient runes you can’t decipher? They’ll at least try. At the heart of this enterprise are curious minds and dogged nerds of all disciplines; specialists working right at the cutting edge of their fields. Among them are four of Sigma’s superstars: computer scientist ALISHA, archaeologist MAYA, cryptographer GRAHAM and adventurer FRAN. This super-group was tasked with locating a missing piece of history. Happily, they’ve succeeded, and are on the brink of claiming stardom. Or at least, they would be – if they knew how to tidy up the messier history they’ve located alongside it. In our overwhelming, ever-darkening world, reliable torchbearers are more precious than ever. Who would you be, if your own career high has the potential to be a planetary low? Inspired by real-life stories of political and social resistance figures, THE GREATER GOOD COMPANY explores the pressure between personal morals and corporate interests. The project was developed through devised workshops (2025, Theatre Peckham INCUBATE) and work-in-progress performances (2026, The Old Red Lion), with additional support from Immersive Arts.", "first_date": "2026-09-10", "last_date": "2026-09-12", "url": "https://www.thehopetheatre.com/thegreatergoodcompany", "tags": ["theatre"], "id": "e128", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "hoxton-hall", "title": "NDK Presents", "byline": "Joining us from Brighton, FATECRIMES have been featured on BBC introducing and are creating ripples with their dynamic sound.", "description": "“The rising duo — Anna and Kieran — are crafting music that crashes like a storm and simmers with feeling” (As reviewed by Lauren Webber for Urbanista magazine) Norma Night\n\nThe fantastical and theatrical Norma Night is a whirlwind of glitter and musical talent. Queerassfolk say that \"listeners have been capticated by songs such as Passenger Princess, Practical Magic and ROMANTASY. She mixed the old with new-all while incorporating her disability and queerness in her own feral, unique style.\"\n\nTarot With Juliette About Why NDK? ‘ND’ or 'Neurodivergent', because it's a night run by an ND team. 'Karneval' is a colourful in-between world where normal social rules are lifted and a new set of rules apply.", "first_date": "2026-09-10", "last_date": "2026-09-10", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173673639", "tags": ["concert"], "price_min": 2.5, "price_max": 14.0, "id": "e129", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "ica", "title": "GHOSTWOMAN + Desert Liminal", "byline": "There is no reason for GHOSTWOMAN’s fourth album to exist.", "description": "Welcome to the Civilized World is born to a broken world; a corrupt inheritance – Evan Uschenko and Ille van Dessel are under no illusions about its futility – and yet, this thing is alive. It’s an allergic reaction to the times we are living in. Support from Desert Liminal.", "first_date": "2026-09-10", "last_date": "2026-09-10", "url": "https://www.ica.art/live/ghostwoman", "tags": ["concert"], "id": "e130", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "museum-of-comedy", "title": "LST New Comedian of the Year 2026: Heats", "byline": "Now in it’s 17th year. Leicester Square Theatre’s showcase for the UK's best up & coming New Comedians.", "description": "The best acts from almost 40 heats compete for a place in the grand final at Leicester Square Theatre, the cash prize & the coveted title of New Comedian of the Year. Previous finalists include Rob Beckett, Rachel Parris, Viggo Venn, Jessica Fostekew, Tez Ilyas, Harriet Kemsley, Tim Renkow, Nigel Ng, Rosie Holt, Alasdair Becket-King, Olga Koch, Ian Smith, Amy Gledhill & many more…", "first_date": "2026-09-10", "last_date": "2026-10-11", "url": "https://www.museumofcomedy.com/leicester-square-theatre-new-comedian-of-the-year-2026-heats/", "tags": ["stand-up"], "id": "e131", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "roundhouse", "title": "Animation Club", "byline": "Ready to bring your own stories to life on screen?", "description": "Dive into our 8-week stop-motion animation project and create a short film from scratch. Under guidance from award-winning filmmakers from the Rainbow Collective, you’ll learn how to tell stories, create your own characters and film and edit together a short animated film.\n\nThis project is specially designed for young people aged 11–14 with a passion for storytelling. Absolutely no prior film or animation experience is required to join – just bring your imagination!", "first_date": "2026-09-10", "last_date": "2026-11-26", "url": "https://www.roundhouse.org.uk/whats-on/animation-club-au26/", "tags": ["class"], "id": "e132", "venue_name": "Roundhouse", "venue_area": "Chalk Farm"}, {"venue_id": "royal-ballet-opera", "title": "Don Giovanni", "byline": "Don Giovanni seduces and deceives women with no remorse. What he wants, he takes.", "description": "What’s in his way, he destroys. But when one of his conquests leads to murder, Don Giovanni’s arrogance and manipulation begin to catch up with him, his string of reckless seductions culminating in a terrible reckoning.\n\nKasper Holten ’s beautiful production captures the debauchery of desire, while also illuminating the sharp emotional tension that cuts through Mozart ’s darkest opera. Acclaimed designer Es Devlin ’s spectacular visuals blur the boundaries between reality and the twisting interior world of the infamous Don.\n\nFollowing the popular premiere of Mozart’s previous opera, The Marriage of Figaro , in Prague, the theatre’s impresario sought to commission the composer for a new opera. Don Giovanni was the second collaboration with Mozart’s would-be longtime librettist Lorenzo Da Ponte , who decided to adapt an existing libretto on the subject of Don Juan, the notorious Spanish libertine of fiction. For Mozart, Don Giovanni was an unusually intense work, especially following the comedic fare of Figaro – still, the opera became another great success in Prague, remaining in repertory there for many years. For more on the Mozart - Da Ponte collaboration, visit our Mozart Essentials page .", "first_date": "2026-09-10", "last_date": "2026-10-15", "url": "https://www.rbo.org.uk/production/don-giovanni-kasper-holten", "tags": ["opera"], "price_min": 12.0, "price_max": 306.0, "id": "e133", "venue_name": "Royal Ballet and Opera", "venue_area": "Covent Garden"}, {"venue_id": "royal-vauxhall-tavern", "title": "DAVID HOYLE’S ALMANAC", "byline": "The Royal Vauxhall Tavern – where time, truth, and chaos collide!", "description": "Join David Hoyle for a series of monthly shows harvesting the year’s chaos, guided by the moon, tides, and the savage weather of human folly.\n\nExpect ruthless satire, grim forecasts, and the wild swings of the zodiac, as society’s storms and moral tides crash with darkly comic destruction.", "first_date": "2026-09-10", "last_date": "2026-10-08", "url": "https://www.vauxhalltavern.com/events/event/david-hoyles-almanac/?oid=6630", "tags": ["cabaret"], "price_min": 13.0, "price_max": 13.0, "id": "e134", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "shakespeares-globe", "title": "Much Ado About Nothing: Guided Tour", "byline": "Take our unique Much Ado About Nothing themed Guided Tour of the Globe Theatre and discover more about Shakespeare’s comedy of wit and wooing.", "description": "Inside the wooden ‘O’ itself, you’ll be introduced to the plot and characters of the play by our expert guides before delving into its history and themes.\n\nYou might even catch a glimpse of the Company preparing for the next performance of Much Ado About Nothing on stage!", "first_date": "2026-09-10", "last_date": "2026-10-22", "url": "https://www.shakespearesglobe.com/whats-on/much-ado-about-nothing-guided-tour/", "tags": ["talk"], "id": "e135", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "soho-theatre", "title": "Zoe Wohlfeld: DOG FUNERAL", "byline": "Zoe W (Gaulier trained American clown) is holding a funeral for her childhood dog, and you’re invited! Yay! Dressed in Victorian mourning garb and ready to cry on command, she’s here to teach you how to properly perform your grief.", "description": "All she wants is your sympathy, your tears, and a goddamn glass of Pinot Grigio (please!). Sadness is Zoe’s passion and this dog was Zoe’s best friend.\n\nIt’s gonna be a rough one, so join the solemn ceremony and pay your respects with the good boys (may they rest in peace)", "first_date": "2026-09-10", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/zoe-wohlfeld-dog-funeral-2/", "tags": ["theatre", "comedy"], "id": "e136", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "southwark-playhouse", "title": "Twenty Thousand Streets Under the Sky", "byline": "London, 1929. In the seedy Midnight Bell pub, barman Bob dreams of becoming a writer, while barmaid Ella dreams of being with Bob.", "description": "When Bob becomes obsessed with alluring prostitute Jenny Maple, he fritters his life’s savings on trying to rescue her. But there is more to the intriguing Jenny than meets the eye…\n\nAdapted from the classic novel by Patrick Hamilton, famed author of ‘Gaslight’, ‘Rope’ and ‘Hangover Square’, Twenty Thousand Streets Under the Sky is an epic tale of three lonely Londoners looking for connection in the sprawling streets of the metropolis. Both darkly humorous and devastating, it is a love letter to 1920s Jazz Age London in all its grimy glory. An acclaimed television adaptation was broadcast on BBC Four in 2005, starring Sally Hawkins.\n\nThis world premiere of Simon Reade’s sharp new stage play adaptation is directed by Off West End Award winner Matthew Iliffe (‘Bacon’) and features an ensemble cast in a stylish period production from the producer of Noël Coward’s ‘The Rat Trap’ and John Galsworthy’s ‘The Forsyte Saga Parts 1 and 2’ (Royal Shakespeare Company/Park Theatre).", "first_date": "2026-09-10", "last_date": "2026-10-17", "url": "https://southwarkplayhouse.co.uk/productions/twenty-thousand-streets/", "tags": ["theatre"], "id": "e137", "venue_name": "Southwark Playhouse", "venue_area": "Borough, SE1"}, {"venue_id": "southwark-playhouse", "title": "Night City", "byline": "Based on the writer’s own experiences, Night City is an epic new drama about the hilarious highs and devastating lows of London’s gig economy.", "description": "It follows a hedonistic taxi driver, a waitress with big dreams, and a carer with a big heart who makes a fatal error one night, plunging all their lives into chaos. And a political conspiracy that they will never forget.\n\nNight City is an epic tale of love, loss and laughter and how we might stand more united against corruption and a strange future.", "first_date": "2026-09-10", "last_date": "2026-10-03", "url": "https://southwarkplayhouse.co.uk/productions/night-city/", "tags": ["theatre"], "id": "e138", "venue_name": "Southwark Playhouse", "venue_area": "Borough, SE1"}, {"venue_id": "the-cockpit", "title": "Orpheus and Euridice", "byline": "Orpheus and Eurydice is a contemporary chamber opera and dark comedy inspired by the Greek myth.", "description": "Twenty years after descending into the underworld, Orpheus has forgotten why he is there. He and Eurydice live inside in their grave, as if it were a small apartment: they wake up every day, drink tea, read the news, water the plants, and sleep, repeating the same ritual day after day. But one evening Orpheus’ memory begins to return and this is changing everything.\n\nWith Bauhaus, and queer futuristic aesthetics, this new opera is a surreal descent into the folly of the underworld of love and loss in a complex political climate resembling the pre Second World War Era. A surreal opera about love and loss, the horrors of repetition and all things bizarre that the underworld can hold. An operatic ode to antimilitarism and an antidote to the growing fascism through the timelessness of love.\n\nhttps://www.tete-a-tete.org.uk/event/orpheus-and-euridice/", "first_date": "2026-09-10", "last_date": "2026-09-10", "url": "https://www.thecockpit.org.uk/show/orpheus_and_euridice", "tags": ["opera"], "id": "e139", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "theatre503", "title": "Chewing Gum Dreams", "byline": "Tracey Gordon is growing up fast, and you’ll want to come along for the ride.", "description": "Chewing Gum Dreams is Michaela Coel’s unforgettable debut. A fierce, funny, and big hearted journey through first love, last days of school, and the moments that shape who we become.\n\nTheatre503 celebrates this classic debut and vital part of our contemporary canon with a production that reminds us where some of our most powerful voices began.", "first_date": "2026-09-10", "
