at a university college reunion.", "description": "Alex Timbers and Michael Friedman have combined pop-rock bangers, outrageous gags, and plenty of nods to the original.", "first_date": "2026-09-15", "last_date": "2026-09-15", "url": "https://sbf.org.uk/whats-on/view/loves-labours-lost-2/", "tags": ["musical", "theatre"], "id": "e223", "venue_name": "Bridewell Theatre", "venue_area": "Blackfriars"}, {"venue_id": "brixton-house", "title": "Housemates 2026: Runner Girl", "byline": "Anu has just arrived back home from uni and is navigating a world of buried feelings that rise to the surface after one terrifying encounter with a stranger.", "description": "Runner Girl is a raw and relentless rhythmic story of a young woman who misses her Mum, a young woman whose been running from young, in more ways than one – but in this case, her routinely jog takes a terrifying turn triggering long-buried wounds she’s fought hard to keep hidden. This is a piece full of poems and prayers, rhymes and rhythms, and music and movement, following Anu on a path she was determined to not travel: visiting love lost, old wounds opened, and new truths given space to unfold.\n\nBook for two or more Housemates Festival shows and access your special offer.\n\nWriter, Music Producer and Actor Lara Grace Ilori Director Ewa Dina Associate Director Tia-zakura Camilleri Movement Director Selina Jones Producer Mwansa Phiri Runner Girl Engagement Programme Producer I L X I A H Runner Girl Engagement Programme Producer Visual Sauce Yorùbá Consultant Korede Ilori", "first_date": "2026-09-15", "last_date": "2026-09-19", "url": "https://brixtonhouse.co.uk/shows/housemates-2026-runner-girl/", "tags": ["theatre"], "id": "e224", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "brixton-house", "title": "Housemates 2026: Goodbye", "byline": "William Holloway has tried everything to end his life.", "description": "Now he’s at Goodbye — London’s first assisted suicide clinic — and all that stands between him and a dignified death is a receptionist called Vivi, a mountain of paperwork, and something neither of them expected.\n\nA darkly comic play exploring survival, love and despair in an encounter between a patient who can’t live, a receptionist who can’t die and an AI that can’t do either.\n\nFamily Emotional Wellbeing Project C. I. C join us for a post-show Q&A after Goodbye . As a non-profit organisation working to support the well-being and improvement of mental health in the Latin American community, this Q&A will feature key themes from the show.", "first_date": "2026-09-15", "last_date": "2026-09-19", "url": "https://brixtonhouse.co.uk/shows/housemates-2026-goodbye/", "tags": ["theatre", "comedy"], "id": "e225", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "brixton-house", "title": "Housemates 2026: Stomach", "byline": "Stomach follows three parallel lives, winding in and out of doctor’s appointments, exploring girlhood and hope.", "description": "Instinct and butterflies. Enzymes and acids. Guts tangled, and untangled.\n\nAriana Xeno dives into the personal and political landscape of women’s healthcare, in her debut play.", "first_date": "2026-09-15", "last_date": "2026-09-19", "url": "https://brixtonhouse.co.uk/shows/housemates-2026-stomach/", "tags": ["theatre"], "id": "e226", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "brockley-jack", "title": "Crime and Punishment", "byline": "Rocks piled high. A staircase. A man with a theory and an axe.", "description": "Raskolnikov is a student living on nothing, in a room barely wider than his arms, in a city that never goes quiet. He has a theory. He believes some people are extraordinary, and the rules do not apply to them. To test his belief, he picks up an axe.\n\nSonya, a girl with her own reasons for shame, refuses to look away from him. Porfiry, an investigator who never raises his voice, begins to circle. The city presses in. The theory begins to crack. What follows is not just a manhunt but a reckoning.", "first_date": "2026-09-15", "last_date": "2026-09-26", "url": "https://brockleyjack.co.uk/jackstudio-entry/crime-and-punishment-1/", "tags": ["theatre"], "id": "e227", "venue_name": "Brockley Jack Studio", "venue_area": "Crofton Park"}, {"venue_id": "cafe-oto", "title": "Phil Minton / Nick Neuberg / Theodora Laird / Theo Guttenplan (quartet) + Caius Williams & Ute Kanngiesser (duo) + Nick Neuberg (solo)", "byline": "GRAIN is a concert series, archive, and (occasional) label for experimental and improvised music, happening mostly in and around South Bermondsey since 2022.", "description": "The series is focussed on programming new and adventurous music and nurturing a growing community with cross-scene and cross-generational collaboration. The residency also documents music made in and around South Bermondsey, and gives occasional workshops aiming to widen access, interest, and explore processes for improvising and collective music-making.\n\nFor a long time now Phil Minton has been working as a improvising singer, solo and in groups and situations at various locations all over the place, deserts, quarries, concert halls, pubs, holes, dodgy clubs, containers, up trees, in prisons, on mountains, in churches, under bridges and cafe oto etc.", "first_date": "2026-09-15", "last_date": "2026-09-15", "url": "https://www.cafeoto.co.uk/events/grain-september-2026/", "tags": ["concert"], "id": "e228", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "etcetera", "title": "Little Lord Fondleroy: Amo, Amas, Amat & All That!", "byline": "Little Lord Fondleroy is a saccharine nightmare in velvet and lace, whose cherubic curls and perfect manners provide foolproof cover for his constant yearnings - primarily for poetry, pleasure, head boys and complete theatrical chaos.", "description": "In this riotous hour, whirl through a formative annus eroticus at Flippitts Darstardly Boarding School for Badly Behaved Boys, where forbidden desires flourish amidst a sadistic culture of cruelty cultivated by prefects and masters alike. Here, Fondleroy discovers that masculinity and Empire are stitched together by caning, cunning and carefully repressed desire.\n\nCan he retain his innocent charm and boyish over-generosity while the forces around him attempt to stamp all that soppy, frilly, froppy feeling out of him?", "first_date": "2026-09-15", "last_date": "2026-09-16", "url": "https://www.etceteratheatrecamden.com/events/little-lord-fondleroy-amo-amas-amat-all-that", "tags": ["theatre", "comedy"], "id": "e229", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "royal-court", "title": "First Words", "byline": "First Words is a group for writers in the first year of parenthood. In our September session, we will be joined by poet Erica Hesketh, reading from her collection on early parenthood In the Lily Room.", "description": "It is not a formal writers' group. It is also not a creche. It is a chance for writers with babies under the age of one to meet each other - to build community in what can be an isolating experience, and to be seen not just as parents, but as writers too. There will be free tea and coffee. There will be (basic) soft play. There will - we hope - be other people who have some shared understanding of what this stage of life is like. There will be no expectation to write a single word. First Words is not about writing - it's about recognising that you are a writer, even if you don't write anything, for months or years. The Royal Court's aim is to be a home for all writers - First Words is a home for writers' babies too.\n\n1-3pm on the first Tuesday of every month, starting Tuesday 3 February 2026. You are welcome to come to a one-off session or attend regularly, subject to availability.", "first_date": "2026-09-15", "last_date": "2026-09-15", "url": "https://royalcourttheatre.com/events/first-words", "tags": ["class", "talk"], "id": "e230", "venue_name": "Royal Court", "venue_area": "Sloane Square"}, {"venue_id": "sadlers-wells", "title": "Alvin Ailey American Dance Theater - New Works", "byline": "The New Works programme features fresh work by some of the most respected contemporary choreographers.", "description": "Blink of an Eye by Medhi Walerski (UK premiere) In an intriguing piece that probes the relationship between dance and music, Medhi Walerski lays bare the strength and vulnerability inherent in the creative process. The timeless beauty of J. S. Bach’s violin sonatas and partita anchors the athletic movement that is both precise and expansive.\n\nSong of the Anchorite by Jamar Roberts (UK premiere) Renowned choreographer Jamar Roberts gives a fresh take on the 1961 solo Hermit Songs , Alvin Ailey’s reaction to a set of medieval religious texts and the haunting song cycle by Samuel Barber that they inspired. The result is a powerful meditation on passion and devotion – both earthly and spiritual – danced to jazz trumpeter Avishai Cohen’s interpretation of a Maurice Ravel composition.", "first_date": "2026-09-15", "last_date": "2026-09-19", "url": "https://www.sadlerswells.com/whats-on/alvin-ailey-american-dance-theater-new-works/", "tags": ["dance"], "id": "e231", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "the-cockpit", "title": "Of Earth and Quill 2", "byline": "When one world burns and the sky forgets, whose stories survive and what becomes our inHERitance?", "description": "Inspired by the enduring power of stories and the human desire to remember, the work unfolds through a series of striking visual and sonic movements. As memory fragments and histories fade, a creator searches for meaning amongst the remnants of what has been left behind, grappling with questions of inheritance, authorship and belonging.\n\nAs a synaesthete, Helen experiences music as colour, texture and shape. This unique perspective informs a richly layered multisensory approach that combines live performance, visual art, creative captioning and audience interaction to create an immersive and thought-provoking experience.", "first_date": "2026-09-15", "last_date": "2026-09-15", "url": "https://www.thecockpit.org.uk/show/of_earth_and_quill_2", "tags": ["theatre"], "id": "e232", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "A Different Kind of Heartbreak", "byline": "Everyone goes through heartbreak in their 20s but what if you need surgery to fix it?", "description": "Composer-comedian Athanasia Kontou was enjoying life, partying with her friends and dating casually to avoid heartache, when she found out she already had two holes in her heart. In this one-woman comedy music show, she tells the personal story of her transformative heart surgery. Stories from Athanasia’s diary entries, songs about being in pain, and jokes about anxiety, coalesce into an authentic, hilarious, and dark hour about finding strength and resilience in vulnerability.\n\nThe show might remind you of Bo Burnham's \"Inside\", if he was a classically trained composer.", "first_date": "2026-09-15", "last_date": "2026-09-15", "url": "https://www.thecockpit.org.uk/show/a_different_kind_of_heartbreak", "tags": ["theatre", "comedy"], "id": "e233", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-place", "title": "Inside", "byline": "An intimate performance dissecting the hidden labour intrinsic in the apparently life-threatening art of sword swallowing.", "description": "Tom Cassani deconstructs this very rare act into intricate sequences of movements, learning, and understanding, to offer a considered reflection on artistic dedication, repetition, and transformation.\n\nInside is a meditation on the body’s potential, an exploration of private and public risk, and a reimagining of what it means to embody magic and danger in contemporary performance.", "first_date": "2026-09-15", "last_date": "2026-09-15", "url": "https://theplace.org.uk/events/autumn-winter-26-inside", "tags": ["theatre"], "id": "e234", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "the-space", "title": "Ek Saanjh with Manav Kaul", "byline": "And some feel a little more like sitting across from a writer with a cup of chai, talking about stories, theatre, life, and everything that happens between the lines.", "description": "On 15 September, Artawish invites you to an intimate evening with Manav Kaul.\n\nWe’ll talk about his journey as a writer and theatre-maker, the books and ideas that have shaped his work, his current theatrical journey with Traasdi, and the stories behind the stories.", "first_date": "2026-09-15", "last_date": "2026-09-15", "url": "https://space.org.uk/event/ek-saanjh-with-manav-kaul/", "tags": ["talk"], "id": "e235", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "underbelly-boulevard", "title": "Under Sketch Soho", "byline": "a special Fringe Fix edition in collaboration with Operotica – freshly back from their Edinburgh run!", "description": "Our model for the night will be serving the full fabulous costumes of this spectacular show by the UK’s premier kinky opera duo. Expect glamour, drama and a little bit of operatic mischief…\n\nGrab a drink, pick up a pencil, and settle in for a relaxed evening of drawing in our Bar.\n\nThis drawing night is open to everyone, from total beginners to working artists. No pressure, no experience needed – just timed poses, great music, and a creative, welcoming atmosphere. Basic materials are provided, but you’re welcome to bring your own favourites. Come to improve, unwind, or simply try something new!", "first_date": "2026-09-15", "last_date": "2026-09-15", "url": "https://underbellyboulevard.com/tickets/under-sketch-soho-2/", "tags": ["opera", "cabaret"], "id": "e236", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "union-theatre", "title": "PERICLES (kind of) : A New Musical", "byline": "Marking the debut show of ensemble theatre group Nevermind Company, this new production of Shakespeare’s classic will take audiences on a rampant, unrepentant, rollicking musical adventure.", "description": "PERICLES (kind of) is a rapid un-telling? re-telling? mis-telling? of Shakespeare’s stormy story.\n\nTraditionally, Pericles follows a wandering prince who flees an incestuous king. Survives storms and shipwrecks. Escapes assassins. Wins deadly jousts! Falls in and out of love. Endures another storm. Is bested by Pirates? All ending in a brothel? A tale of true virtue!", "first_date": "2026-09-15", "last_date": "2026-09-17", "url": "https://uniontheatre.biz/show/pericles-kind-of-a-new-musical/", "tags": ["musical", "theatre"], "id": "e237", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "upstairs-gatehouse", "title": "LOLA* Festival Pass", "byline": "Want to join the Theatre Lab workshops and see all shows that are part of LOLA Festival? Purchase a FESTIVAL PASS!", "description": "LOLA Festival is a five-day celebration of new American comedy, cabaret, and theatrical development, bringing some of Hollywood's most beloved performers to Highgate this September. London hosts Los Angeles for a week-long festival of works-in-progress, new writing, cabaret, and creative masterclasses.", "first_date": "2026-09-15", "last_date": "2026-09-15", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173676118", "tags": ["class", "comedy", "cabaret"], "id": "e238", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "cafe-oto", "title": "Another Sky presents NO HAY BANDA – two-day residency", "byline": "Another Sky is a London-based festival and artistic platform celebrating experimental music from the SWANA (South West Asia & North Africa) region and diaspora.", "description": "We present composed, improvised and electronic music; short films and moving-image works; new commissions; workshops and an independent label & publisher fair. We are delighted to host NO HAY BANDA – long-time collaborators, extraordinary creative thinkers, community leaders and performers – for their UK debut, in celebration of their receipt of the Ernst von Siemens Music Foundation Ensemble Prize 2026. Together we present a programme which includes three commissions which have been developed closely with the composers throughout 2026, by Dali de Saint Paul, Lucie Nezri and Sam Salem. https://anotherskyfestival.com\n\nNO HAY BANDA is a Montreal-based organization committed to the production and performance of music rooted in exploratory and avant-garde practices. NO HAY BANDA presents an annual concert series in Montreal that features a variety of local and visiting artists, and represents a flexible ensemble of musicians – a “house band” of sorts – that performs and tours original productions. Throughout these activities, NO HAY BANDA aims to provide a space for artists working on the fringes of established genres to realize projects that would not take place otherwise. Furthermore, NO HAY BANDA records and produces albums that are released on the in-house record label, No Hay Discos. nohaybanda.ca", "first_date": "2026-09-16", "last_date": "2026-09-17", "url": "https://www.cafeoto.co.uk/events/another-sky-presents-no-hay-banda/", "tags": ["concert"], "id": "e239", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "canal-cafe", "title": "Sufficient Merit", "byline": "When three struggling actors–a Pinter-loathing neurotic desperate to quit her day job, a bull-headed avant-gardist in the throes of a midlife crisis…", "description": "When three struggling actors–a Pinter-loathing neurotic desperate to quit her day job, a bull-headed avant-gardist in the throes of a midlife crisis, and a conflict-avoidant cult-hopper in recovery– learn that their beloved theatre venue is under dual threat from government funding cuts and a looming data centre developer, they must stage a show successful enough to convince their mercurial landlord that they have “sufficient merit” to remain in the building.\n\nUnaware of the slings, arrows, and cancel culture headed their way, the three actors set out to create The Perfect Show, force-feeding each other enthusiasm to keep the dream alive. Can three radically different artists agree on what constitutes a successful play (or worse: high art)? Can their sanity survive the labyrinthian world of theatrical rights, licensing, and lawyers? And can they save their theatre without sacrificing the very principles–or friendship–that made them start it in the first place?\n\nFeaturing failed auditions, career advice from a chihuahua, and debates over the creative rewards of “MAGA Miss Julie”, Sufficient Merit is an absurdly comic take on being an artist in late-stage capitalism, where the price is either your rent or your pride.", "first_date": "2026-09-16", "last_date": "2026-09-20", "url": "https://canalcafetheatre.com/our-shows/sufficient-merit/", "tags": ["theatre"], "id": "e240", "venue_name": "Canal Café Theatre", "venue_area": "Little Venice"}, {"venue_id": "greenwich-theatre", "title": "The Happy Minds Clinic", "byline": "Welcome to The Happy Minds Clinic – where appearances deceive and every mind has a price.", "description": "Writer and Director Beryl Flynn invites you into an exclusive private clinic, where the therapy for wealthy and famous clientele is driven by the hidden agendas of the greedy, delusional fantasists within. This thought-provoking drama will leave you questioning who can really be trusted.\n\nCast & Creatives: Written & Directed by Beryl Flynn\n\nMajella – Kay Boggett Fareed – Neer Vaja Lacey – Emma Louise Price Rachel – Tina Sharma Sammy – Paige Hann Suzy – Amanda Jiang Jude Lawn – Joshua Batsford", "first_date": "2026-09-16", "last_date": "2026-09-18", "url": "https://greenwichtheatre.org.uk/events/the-happy-minds-clinic/", "tags": ["theatre"], "id": "e241", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "greenwich-theatre", "title": "Buster", "byline": "Buster o Through cinematic mime and physical theatre, this high-octane performance follows silent film star Buster Keaton's journey from childhood through to his late career.", "description": "Focusing on Buster's own perspective on what it means to be a performer, the show explores his highs, his lows, the friends he made along the way, his struggle with", "first_date": "2026-09-16", "last_date": "2026-09-16", "url": "https://greenwichtheatre.org.uk/events/buster/", "tags": ["theatre"], "id": "e242", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hen-and-chickens", "title": "Abrasion", "byline": "Abrasion is a hilarious and vital one-woman show, written by and starring up-and-coming talent Meg-Rose Dixon, as our heroine reflects on her diagnosis journey on the anniversary of her surgery.", "description": "Abrasion is a side-splitting and eye-watering tour de force (and those aren’t just the symptoms) tackling the all-too-common tale of women’s struggles to be heard in the health sphere. With women’s health issues frequently ignored by doctors and health professionals, this is an urgent, funny look at the battle to be believed and to gain an insight into our bodies.\n\nA dark comedy filled with turbulent embarrassing moments, Abrasion is full of comical twists and turns. The show laughs in the face of pain while shedding light on a condition that affects 1.5 million people, but shockingly has an average diagnosis wait time of 7.5 years. The verbatim anecdotes highlight the importance of patient care, the terrible doctors, and a few genuine heroes.\n\nTickets booked online must be collected 15mins before showtime. Cash tickets are available for 30 mins at the box office. TICKETS ARE NON-REFUNDABLE*", "first_date": "2026-09-16", "last_date": "2026-09-16", "url": "https://www.unrestrictedview.co.uk/events/abrasion", "tags": ["theatre", "comedy"], "id": "e243", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "jacksons-lane", "title": "How a Spiral Works: Art for Rainy Days", "byline": "In this performance, the artists fight for time to care for themselves, care for each other, even under extreme circumstances. How hard is it to care under tension? In the middle of a whirlwind? At great heights? While feeling pain?", "description": "Renowned British circus director Jason Dupree returns to the UK, joining forces with choreographer Alise Bokaldere and aerialist Izabele Kuzelyte in a mesmerising blend of contemporary dance, hair-hanging, and aerial rope.\n\nDon’t miss this unique fusion of Baltic folk music and hypnotic movement in a deeply meditative performance from Latvia.", "first_date": "2026-09-16", "last_date": "2026-09-17", "url": "https://www.jacksonslane.org.uk/events/how-a-spiral-works-art-for-rainy-days/", "tags": ["circus", "dance"], "id": "e244", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "little-angel", "title": "Hands On: Puppet Construction (September)", "byline": "In this practical session, we’ll explore some basics of puppet construction, joints and rods.", "description": "Using recycling, junk and objects, participants will leave the session armed with all the basics needed to get started making their own puppets at home, out of whatever they can get their hands on!", "first_date": "2026-09-16", "last_date": "2026-09-16", "url": "https://www.littleangeltheatre.com/whats-on/hands-on-puppet-construction-3/", "tags": ["class", "puppetry"], "id": "e245", "venue_name": "Little Angel Theatre", "venue_area": "Islington"}, {"venue_id": "roundhouse", "title": "Curate an Exhibition: Music and Youth Culture", "byline": "Uncover your identity, master new creative skills, and make your mark on London’s iconic youth and music culture.", "description": "Rooted in the legendary creative heritage of Camden, this hands-on, 8-session programme blends archive exploration with real-world skill-building. You’ll work alongside industry professionals to reflect on your own story, craft your personal brand, and collaborate on a public exhibition set to open in Spring 2027.\n\nDelivered in partnership with the Museum of Youth Culture , sessions take place across two iconic venues: Roundhouse and the Museum of Youth Culture’s brand-new Camden space.", "first_date": "2026-09-16", "last_date": "2026-12-26", "url": "https://www.roundhouse.org.uk/whats-on/museum-of-youth-culture-au26/", "tags": ["class", "exhibition"], "id": "e246", "venue_name": "Roundhouse", "venue_area": "Chalk Farm"}, {"venue_id": "roundhouse", "title": "Self Made Live: Creative Industry Freelancers and Founders AMA", "byline": "Ready to get the inside track on building your business or navigating the freelance creative sector?", "description": "Drop into our unfiltered, open Ask Me Anything Q&A sessions featuring creative industry insiders who are ready to answer your burning questions, followed by relaxed networking with live DJ sets.\n\nWhat’s next for creative freelancing? This is your chance to ask industry insiders Mae Yip (ERIC) and Louise Clarke anything you want about the future of the creative freelance economy. From new technologies to changing client expectations, get the inside track in this open-floor Q&A.", "first_date": "2026-09-16", "last_date": "2026-09-26", "url": "https://www.roundhouse.org.uk/whats-on/sml-ask-me-anything-au26/", "tags": ["talk"], "id": "e247", "venue_name": "Roundhouse", "venue_area": "Chalk Farm"}, {"venue_id": "sadlers-wells", "title": "Alvin Ailey American Dance Theater - Legacy", "byline": "Night Creature (excerpts) by Alvin Ailey A bubbly champagne cocktail of a dance, Night Creature is a perfect fusion of Ailey’s buoyant choreography and Duke Ellington ’s sparkling music.", "description": "At once wistful and sassy, it beckons viewers into a nocturnal world populated by jazz babies and night owls.\n\nA Song for You by Alvin Ailey A Song for You is an excerpt from Alvin Ailey’s Love Songs. The male counterpart to Alvin Ailey’s Cry, this lyrical solo offers an emotional journey through love and longing.", "first_date": "2026-09-16", "last_date": "2026-09-19", "url": "https://www.sadlerswells.com/whats-on/alvin-ailey-american-dance-theater-legacy/", "tags": ["dance"], "id": "e248", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "shakespeares-globe", "title": "The Globe Talks: As You Like It", "byline": "In a panel discussion and Q&A, listen to members of the show’s creative team and ask them your questions, as we delve into the world of As You Like It and explore its key themes.", "description": "This event is part of The Globe Talks , a series of essential conversations exploring the work we do in relation to the world we live in.\n\nThis event takes place on-site at Shakespeare’s Globe", "first_date": "2026-09-16", "last_date": "2026-09-16", "url": "https://www.shakespearesglobe.com/whats-on/globe-talks-as-you-like-it/", "tags": ["talk"], "id": "e249", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "tabard", "title": "What We Know Now", "byline": "The Tabard Theatre welcomes Ann Cusack and Elizabeth McGovern in the special musical show What We Know Now , blending original songs with much-loved classics.", "description": "Bringing together two extraordinary performing careers, the show reflects on identity, experience and a life spent in the spotlight. Elizabeth McGovern is known worldwide for her acclaimed role in Downton Abbey , as well as her Golden Globe nominations and Academy Award nomination for Ragtime . Ann Cusack has enjoyed a distinguished career as both an actress and blues singer, with screen credits including A League of Their Own , Grosse Pointe Blank , Private Practice and Better Call Saul .\n\nDirected by the Tabard's Artistic Director, Simon Reilly, and featuring live music from The Hotheads , What We Know Now sees Ann and Elizabeth look back on their evolving identities as women working in show business through music, stories and song.", "first_date": "2026-09-16", "last_date": "2026-09-20", "url": "https://www.tabard.org.uk/production/what-we-know-now", "tags": ["musical", "concert"], "id": "e250", "venue_name": "Tabard Theatre", "venue_area": "Chiswick"}, {"venue_id": "the-cockpit", "title": "Arlodhes a Shalott", "byline": "Step into a hauntingly reimagined romantic world with Arlodhes a Shalott, a striking new composition by Matthew Thomason inspired by Alfred, Lord Tennyson’s The Lady of Shalott.", "description": "Set in a Cornish-language translation from Elizabeth Ellis of the original poem, this work offers a fresh cultural perspective on a timeless legend. Blending evocative textures with a deeply atmospheric narrative, Thomason’s music explores themes of isolation, longing, and the fragile boundary between reality and reflection.\n\nShimmering harmonies and moments of stillness give way to surging intensity, mirroring the Lady’s fateful journey. Both intimate and powerful, Arlodhes a Shalott invites audiences to experience a familiar story through a distinctive contemporary and linguistic lens.", "first_date": "2026-09-16", "last_date": "2026-09-16", "url": "https://www.thecockpit.org.uk/show/arlodhes_a_shalott", "tags": ["theatre", "concert"], "id": "e251", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "Dreva", "byline": "DREVA is an unusual theatre experience in which the audience is asked not to watch, but to close their eyes, and listen: a night-time story, followed by a lullaby. A lullaby for grown-ups.", "description": "Enter a journey to the roots of nature, and to the story of the creation of the world as preserved in the folk traditions of the Eastern Slavs. Sound baths have become popular recently, yet the ancient Slavs knew something similar long ago, in lullabies and the meditative sounds of folk tradition, now largely forgotten.\n\nIt is a full performance, but a sound performance. It begins with a spoken introduction, explaining what to expect and how to receive it, before the invitation into the meditative folk songs and sounds. Close your eyes, and travel to the very beginning of the world.", "first_date": "2026-09-16", "last_date": "2026-09-16", "url": "https://www.thecockpit.org.uk/show/dreva", "tags": ["theatre"], "id": "e252", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-glitch", "title": "Natal Attraction", "byline": "Natal Attraction – Lower Marsh Arts Club, Wed 16 Sep 2026 - Fresh from a sold-out Brighton Fringe run and winner of the 2026 Applause Bursary…", "description": "Natal Attraction – Lower Marsh Arts Club, Wed 16 Sep 2026 - Fresh from a sold-out Brighton Fringe run and winner of the 2026 Applause Bursary, Natal Attraction is a wickedly funny solo comedy-drama about the impossible performance of modern womanhood.By turns hilarious, heartfelt and quietly devastating, Katherine Kotz transforms into a kal...", "first_date": "2026-09-16", "last_date": "2026-09-16", "url": "https://www.tickettailor.com/events/vaultcreativearts/2342248", "tags": ["theatre"], "id": "e253", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "theatre503", "title": "Introduction to Producing with Adwoa-Alexsis Mintah: 5 Week Online Course", "byline": "Adwoa-Alesxis Mintah will take you through a step by step guide to producing your first full-length production.", "description": "From getting work programmed, through to script development, budgeting/fundraising and marketing – by the end of this course you should have laid the ground work for your first successful show!\n\nThanks to our Share The Drama scheme , we want to make sure those of you who are struggling in the current climate can still take part in our Writers Programme. If you would like to book a Share The Drama bursary for the Writer’s Programme, please call our box office on 02079787040 to enquire about payment and availability.\n\nWhat is producing? Getting a project off the ground/Line producing VS creative producing/partnerships", "first_date": "2026-09-16", "last_date": "2026-09-16", "url": "https://theatre503.com/whats-on/introduction-to-producing-with-adwoa-alexsis-mintah-5-week-online-course/", "tags": ["class"], "id": "e254", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "underbelly-boulevard", "title": "Bar Jams", "byline": "Join us at Bar Jams – a bi-weekly evening of live music in our Bar!", "description": "Each edition showcases a curated lineup of local artists sharing their original songs. Enjoy great drinks, great tunes, and the chance to connect with fellow music lovers in Soho’s vibrant heart. Free entry – just bring good vibes.\n\nInterested in performing at Bar Jams? Submit your details here .", "first_date": "2026-09-16", "last_date": "2026-10-27", "url": "https://underbellyboulevard.com/tickets/bar-jams/", "tags": ["concert"], "id": "e255", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "upstairs-gatehouse", "title": "Theatre Lab", "byline": "Fresh from Broadway (he just finished starring in DOG DAY AFTERNOON ), veteran US actor/writer/coach MICHAEL KOSTROFF makes his London debut!", "description": "Before his successful, decades-long performing career ranging from television ( THE WIRE ) to musical theatre ( THE PRODUCERS , LES MISERABLES ), Michael had real actor problems. To wit: he was the world’s worst auditioner. Discovering flaws in conventional wisdom (aka: “positive thinking” may be neither), Michael began to love auditions—and began booking them.\n\nHis massively popular and entertaining AUDITION PSYCH course brings his practical, myth-exploding techniques to working actors. That said, because this fear-conquering move from despair to curiosity has real world applications, Caltech Physics Alumna (and writer/performer) SANDRA TSING LOH widens Michael’s revolutionary lens to include performance training for non-actors.", "first_date": "2026-09-16", "last_date": "2026-09-16", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173676115", "tags": ["talk"], "id": "e256", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "bridge-house", "title": "High Street", "byline": "On a forgotten High Street, Pakistani newsagent Malik Khan is running his business into the ground.", "description": "His family are concerned. The food is out-of-date, packages are missing and he’s tired of staying competitive. An inventor at heart, the shop was never his true calling.\n\nHis only real friend is Terri, a homeless woman, endlessly shuffled between shelters and social workers. Longing to get clean, she finds refuge in light hearted banter with Malik at the shop. Despite having little in common, they are both victims of a system that has failed them. So, when Terri presents Malik with a new business idea, he jumps at the thought of getting rich quick, and encourages Terri to also find a way out of her predicament.\n\nBalancing humour with emotional depth, the story reveals the resilience of those contending with poverty, racism and survival in Britain today. It asks what it truly costs to find home, dignity, and purpose when the world has left you behind.", "first_date": "2026-09-17", "last_date": "2026-09-19", "url": "https://thebridgehousetheatre.co.uk/shows/high-street/", "tags": ["theatre"], "id": "e257", "venue_name": "The Bridge House Theatre", "venue_area": "Penge"}, {"venue_id": "coronet", "title": "Chen Yi Studio: Current/y", "byline": "Current/y is an immersive work by Taiwanese artist Chen Yi combining live performance, motion capture, game-engine technology, lasers, large-scale projection and an immersive spatial soundscape.", "description": "Equipped with XSENS motion capture sensors, a dancer controls her avatar in a real-time duet, interacting with a constantly shifting virtual world projected across a vast screen. Moving through the work as if scrolling through a social media feed, the performer enters a space governed by data and algorithms, where clicks, followers and attention become measures of human value – a kind of currency.\n\nPart of Chen Yi’s ongoing Current/y series, the work continues to explore the idea of value in an age of rapid technological change – from cryptocurrency and online communities to misinformation, digital authority, surveillance and the economies of attention.", "first_date": "2026-09-17", "last_date": "2026-09-19", "url": "https://www.thecoronettheatre.com/whats-on/chen-yi-current-y/", "tags": ["immersive", "dance"], "id": "e258", "venue_name": "The Coronet Theatre", "venue_area": "Notting Hill"}, {"venue_id": "etcetera", "title": "Whoever Has Ears To Hear", "byline": "Whoever Has Ears To Hear is a dramatic recital of the Gospel of Mark, performed entirely from memory by dynamic South London-based spoken word artist, storyteller and actor Errol McGlashan.", "description": "Many people know individual verses, parables and miracles from Mark, but few have heard the complete Gospel performed live from beginning to end.\n\nFresh from a 10-performance run at this years Edinburgh Fringe, Errol brings this powerful 90-minute solo performance to the Etcetera Theatre for one night only.", "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://www.etceteratheatrecamden.com/events/whoever-has-ears-to-hear", "tags": ["spoken-word"], "id": "e259", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "etcetera", "title": "3.2.1 Hold Me on Stage", "byline": "After its world premiere at the Edinburgh Festival Fringe 2026 , 3.2.1. Hold Me On Stage comes to London.", "description": "Daphne Bell is trapped inside a colourful claw machine, surrounded by stuffed toys and one impossible desire: to be chosen .\n\nBlending musical theatre, physical performance and dark humour, this 40-minute solo show transforms audition anxiety into a playful yet unsettling exploration of visibility, inadequacy and the exhausting need to prove that you deserve a place on stage.", "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://www.etceteratheatrecamden.com/events/321-hold-me-on-stage", "tags": ["musical"], "id": "e260", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "finborough", "title": "The Grocers' Evening", "byline": "In 1981, playwriting legend Arnold Wesker ( the Roots trilogy , Chips With Everything , The Kitchen ) wrote Annie Wobbler especially for his friend, Olivier Award winner Nichola McAuliffe.", "description": "Two years later, it was produced in Birmingham, on the London Fringe and transferred to the West End.\n\nAnd now 45 years later, Nichola McAuliffe returns with Annie Wobbler (Revisited) , a new version of the original play cycle for the 21st century.", "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://www.finboroughtheatre.co.uk/productions/the-grocers-evening", "tags": ["theatre"], "id": "e261", "venue_name": "Finborough Theatre", "venue_area": "Earl's Court"}, {"venue_id": "greenwich-theatre", "title": "Dom Joly – Trigger Happy TV Live: 25th Anniversary Tour", "byline": null, "description": null, "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://greenwichtheatre.org.uk/events/dom-joly-trigger-happy-tv-live-25th-anniversary-tour-2/", "tags": ["stand-up"], "id": "e262", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hope-theatre", "title": "Spontaneous Meets Are Not For The Weak", "byline": "He's nervous, inexperienced, and stranded after a graduation booking mistake. She's confident, guarded, and no stranger to taking risks.", "description": "When the two match online, they agree to meet for one simple reason: distraction. Neither expects the night to last very long. What begins as an impulsive decision quickly shifts into something neither of them planned for. As the night unfolds, awkward first impressions give way to unexpected honesty, humour, and vulnerability. Two strangers who initially set out to use each other as a distraction slowly begin to lower their defences. In the confined space of a hotel room, conversations deepen and assumptions are challenged. Both are forced to confront loneliness, expectation, and the versions of themselves they've worked hard to maintain — or want to break free from. Funny, heartfelt, and refreshingly honest, Spontaneous Meets Are Not For The Weak is a contemporary comedy-drama about modern dating, emotional openness, and the courage it takes to sit with uncertainty. It explores what happens when two people stop performing and start being seen, and how even the briefest encounter can leave a lasting mark.", "first_date": "2026-09-17", "last_date": "2026-09-19", "url": "https://www.thehopetheatre.com/spontaneous", "tags": ["theatre"], "id": "e263", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "ica", "title": "Destroyer (solo)", "byline": "Dan Bejar started Destroyer as a solo home-recording project in the early to mid-nineties.", "description": "Exploring and overturning genres such as glam, MIDI, yacht rock, and even underground Spanish independent artists, Bejar was proclaimed “Rock’s Exiled King” by The Fader.", "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://www.ica.art/live/destroyer", "tags": ["concert"], "id": "e264", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "kiln", "title": "TABLE 17", "byline": "Would you go to dinner with your ex? The one you were engaged to, but haven’t spoken to in years? You’re over them – right?!", "description": "Jada and Dallas are hashing things out in this sharp, hilarious new comedy. Can they leave 7 years of baggage at the door to give their love a second chance? Is the spark even still there? Or will the weight of their past pull them apart before the night ends?\n\nAlcohol Free Performance: 5 October, 7.30pm Post show Q&A and Supporters’ Evening: 1 October, 7.30pm Supporters’ Matinee: 7 October, 2.30pm", "first_date": "2026-09-17", "last_date": "2026-10-24", "url": "https://kilntheatre.com/whats-on/table-17/", "tags": ["theatre", "comedy"], "id": "e265", "venue_name": "Kiln Theatre", "venue_area": "Kilburn"}, {"venue_id": "park-theatre", "title": "Sarah Keyworth: Work in Progress", "byline": "Edinburgh Comedy Award nominee, Melbourne International Comedy Festival winner and acclaimed social media star Sarah Keyworth is back with a new work-in-progress show!", "description": "Known for their sharp wit, heartfelt storytelling, and exploration of gender identity, Sarah has appeared on television comedy shows such as Live At The Apollo, Mock the Week and 8 Out of 10 Cats Does Countdown .\n\nEntertainment Union Members Discounts are available Monday – Thursday. Read more\n\nGroups Buy 10 tickets and get the 11th ticket free. Discount automatically applies in the basket.", "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://parktheatre.co.uk/events/sarah-keyworth-work-in-progress/", "tags": ["stand-up"], "id": "e266", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "roundhouse", "title": "Apply for Centre 59 Company", "byline": "Love storytelling and theatre but never had the chance to get into professional training?", "description": "Whether you’ve never performed before, or you’ve dabbled in amateur script writing or taken A-level drama, Centre 59 Company offers you a space to discover your potential and learn new skills.\n\nCentre 59 Company is a six-month programme (end October – start April), where you’ll learn the fundamentals of theatre making and work with your peers and theatre professionals to devise, develop and rehearse work including a new theatre production that will be performed live at the Roundhouse in Spring 2027. The programme will give you an insight into what it’s like to create and perform in a professional setting and give you the foundation to tell your own stories.", "first_date": "2026-09-17", "last_date": "2026-10-26", "url": "https://www.roundhouse.org.uk/whats-on/apply-for-centre-59-company-au26/", "tags": ["class"], "id": "e267", "venue_name": "Roundhouse", "venue_area": "Chalk Farm"}, {"venue_id": "royal-vauxhall-tavern", "title": "TOM ASPAUL", "byline": "There will be DJs all night, dancing, merch, cake, vinyl signing and lots more.", "description": null, "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://www.vauxhalltavern.com/events/event/tom-aspaul/?oid=6473", "tags": ["concert"], "id": "e268", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "shakespeares-globe", "title": "Research in Action: Editing in Action", "byline": "Join us in the Sam Wanamaker Playhouse for a lively exploration of how performance can illuminate — and even reshape — the way we edit Shakespeare.", "description": "This event is part of our Research in Action series, where actors – with scripts in hand – perform scenes from early modern plays to explore a research question. This special Editing in Action workshop brings together theatre practitioners and the scholars of the New Variorum Shakespeare project (based at Texas A&M University), an ambitious long-term editorial initiative that gathers centuries of commentary, interpretation and stage history into one dynamic resource.\n\nTogether, we’ll ask: how can live performance illuminate and even influence editorial approaches to a play? What happens when actors, directors, and editors collaborate — and the text itself becomes a space of creative negotiation? Whether you’re a researcher, student, or curious theatregoer, join us in the candlelit Sam Wanamaker Playhouse for an evening of collaborative discovery.", "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://www.shakespearesglobe.com/whats-on/ria-editing-in-action/", "tags": ["class", "theatre"], "id": "e269", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "siobhan-davies", "title": "The Underscore for Global Majority Dancers IV", "byline": "Join us for the fourth edition of The Underscore for BPOC/Global Majority dancers co-led by Nathaniel Parchment and Annie Pui Ling Lok. This session is for dancers interested in exploring their practice in relation to Contact Improvisation.", "description": "The Underscore is a structure developed in the 90’s by Contact Improvisation founder Nancy Stark Smith.\n\nThe 20 phases of the Underscore are designed to provide a frame and a series of invitations for dancers to move through different states of arrival, connecting to yourself, connecting to others and sharing reflections at the end. Each phase has a name and an associated symbol called a ‘glyph’. You can learn more about the Underscore here .", "first_date": "2026-09-17", "last_date": "2027-09-06", "url": "https://www.siobhandavies.com/events/the-underscore-for-bpoc-global-majority-dancers-iv/", "tags": ["class", "dance"], "id": "e270", "venue_name": "Siobhan Davies Studios", "venue_area": "Elephant and Castle"}, {"venue_id": "soho-theatre", "title": "Don Toberman: Ping-Pong Champ", "byline": "It’s an absurd, sensitive, and totally unhinged satire of American sports culture. Grab a paddle & hold on tight! Featuring award-winning special guests.", "description": "Discounts may be available on top prices for students, seniors, unwaged.\n\nAccess tickets available by registering with us. Find out more on the Access page , or login if you are registered already.", "first_date": "2026-09-17", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/don-toberman-ping-pong-champ/", "tags": ["stand-up"], "id": "e271", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "the-cockpit", "title": "Emma or Emily", "byline": "One opera singer. One actor. An evening of drinking, debauchery, and deception.", "description": "Emily, a failed opera singer, lives a lonely yet outwardly idyllic life as a housewife. When her old friend Emma unexpectedly arrives, the reunion offers a welcome escape from her isolation. But as the two drink and dance into the night, the curated façade of Emily's life begins to unravel, and the music she has worked so hard to silence starts to find its way back in.\n\nCombining spoken theatre with live opera, Emma or Emily stars Emily Carmichael and Eva Stone-Barney, whose contrasting performances blur the line between reality and illusion.", "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://www.thecockpit.org.uk/show/emma_or_emily", "tags": ["theatre", "opera"], "id": "e272", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "Androida (or Robots have no Feelings)", "byline": "The Cohen Ensemble plays a new, complete and original score to accompany soprano Sian Sulke and evoke a unique, futuristic sound-scape.", "description": "A fembot called Androida is hired to help the recently bereaved Martin with household chores and looking after his two children. Androida prides herself on her immense competence and the fact that whilst she can give the children all the care and love they need, her impeccable efficiency is never impeded by the flaw of experiencing human feelings herself.\n\nHowever, it gradually becomes apparent to the audience that she has been endowed with human emotions after all.", "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://www.thecockpit.org.uk/show/androida_or_robots_have_no_feelings", "tags": ["theatre", "opera"], "id": "e273", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "upstairs-gatehouse", "title": "Storytime with Brooke & Tony", "byline": "At 28, BROOKE ADAMS , starring in Terence Malick’s DAYS OF HEAVEN, centered a cinematic—and actual—love triangle with Richard Gere and Sam Shepard.", "description": "In CUBA, she eschewed leading man Sean Connery for a dwarf. At 35, headlining THE HEIDI CHRONICLES on Broadway, she humoured the crush of Midwestern Lebanese character actor Tony Shalhoub.\n\nDecades later, Manhattan tourists stop her on the street and exclaim things like: “Brooke Shields, we so love your husband on MONK!”\n\nWith her signature outrageous wit and style, artist/actress Adams tells tales of Hollywood royalty, drunken behaviour (sometimes her own), and the heartbreak and joy of show business families.", "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173676111", "tags": ["cabaret"], "id": "e274", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "vfd", "title": "MOSHI RAVE", "byline": "LONDON’S VERY FIRST MOSHI RAVE PRESENTS- 17th September 2026 7pm - 12am @ VFDalston 66 Stoke Newington Road, London, N16 7XB Lineup ALTERUM IT DONT MATT. ER POWSTER6000 DJ NATALIE BRATZDOLLNEXTDOOR Featuring Music HAPPY HARDCOR", "description": null, "first_date": "2026-09-17", "last_date": "2026-09-17", "url": "https://www.vfdalston.com/our-events/2026/9/17/e14042bdpx9s9w8taj2ap8syomjydl", "tags": ["concert"], "id": "e275", "venue_name": "VFD", "venue_area": "Dalston"}, {"venue_id": "alexandra-palace", "title": "Monteverdi Choir – Rossini’s Petite Messe Solennelle", "byline": "Join us this autumn at Alexandra Palace Theatre as the Monteverdi Choir & Orchestras continue their groundbreaking exploration of Rossini on period instruments…", "description": "Join us this autumn at Alexandra Palace Theatre as the Monteverdi Choir & Orchestras continue their groundbreaking exploration of Rossini on period instruments, culminating in the crowning achievement of the composer’s final creative years: the Petite messe solennelle .\n\nThe Monteverdi Choir’s versatility from 17th-century sacred music to 19th-century opera make it the ideal vehicle for this choral showpiece, while the Orchestre Révolutionnaire et Romantique will draw on its deep experience of French Romantic repertoire to recreate the sound world of Rossini’s Paris. Together, with a cast of exceptional soloists and led by Rossini specialist Jakob Lehmann , they will illuminate a work poised between devotion and drama, liturgy and theatre.\n\nDescribed by the composer as “the last of my péchés de vieillesse ” (sins of old age), the Petite messe solennelle was originally scored for twelve singers, two pianos and harmonium. Rossini orchestrated the work the year before his death, but never heard this version in his lifetime; its Paris premiere by the Théâtre-Italien took place in 1869, just a few years before Alexandra Palace Theatre was completed in London.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://www.alexandrapalace.com/whats-on/monteverdi-choir-rossini/", "tags": ["concert", "opera"], "id": "e276", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "barons-court", "title": "Unofficial Roxelana by Ozen Yula", "byline": "Our goal is to bring Hürrem’s multilayered world to diverse cultures, to showcase the original storytelling style of Turkish theatre, and to draw audiences into this magical world.", "description": "This show will be performed in Turkish with English surtitles. Show lasts 60 minutes with no interval. This show is for all ages.﻿", "first_date": "2026-09-18", "last_date": "2026-09-19", "url": "https://www.baronscourttheatre.com/roxelana", "tags": ["theatre"], "id": "e277", "venue_name": "Barons Court Theatre", "venue_area": "Barons Court"}, {"venue_id": "cafe-oto", "title": "From the Lips to the Moon", "byline": "Voice collides with soundscapes, disordered text, misbehaving beats, spontaneous expressions and micro-stories, inviting audiences into a world of dark fantasy, fierce deliveries and a hypnotic sonic journey.", "description": "An electrifying long-form improvisation of music and words led by composer and live-electronic musician Pouya Ehsaei and performer-writer Tara Fatehi joined by a unique cast of guest artists: multi-instrumentalist Robert Stillman bringing his deeply intuitive, genre-bending approach to improvisation, cellist Abi Asisa , manipulating her classical cello to create immersive soundscapes alongside influential rapper and experimental musician GAIKA .\n\nFrom the Lips to the Moon blends live and electronic music, twisted beats, spoken word, and performance into an unruly, multi-sensory experience. It is a space for unexpected encounters, radical openness, and endless playfulness – an “ecstatic embrace of dissonance” (Nero Editions).", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://www.cafeoto.co.uk/events/from-the-lips-to-the-moon-sep-26/", "tags": ["theatre", "concert"], "id": "e278", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "chickenshed", "title": "Friday Night Funnies", "byline": "Chickenshed's comedy nights continue to light up with laughs, thanks to Resistance Comedy bringing in some of the finest comedy performers to grace our café performance space.", "description": "Grab your drinks from the bar, enjoy some tasty snacks and strap-in for a night of funnies at this month's Friday Night Funnies! Booking in advance is advised, as these shows are highly sought-after and often sell out.\n\nIf you're under 13, or if you don't know what this means, please ask a trusted adult for help.\n\nThere is a 15 minute interval at approximately 9pm", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://www.chickenshed.org.uk/events/friday-night-funnies-2", "tags": ["stand-up", "comedy"], "id": "e279", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "etcetera", "title": "Slideshow: In Color!", "byline": "L. A.'s underground hit has landed in London: Slideshow brings together storytellers, poets, comedians, musicians and more, all speaking their truth with their own slides up on the big screen to prove it.", "description": "\"Shockingly honest stories,\" cheers the Los Angeles Times, \"Downright magical, uncomfortable, and anarchic.\"", "first_date": "2026-09-18", "last_date": "2026-10-25", "url": "https://www.etceteratheatrecamden.com/events/slideshow-in-color2", "tags": ["spoken-word"], "id": "e280", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "etcetera", "title": "UNSHAMED - AN EROTIC DOCUMENTARY AND LIVE PERFORMANCE", "byline": "In this 90-minute show, Marc, a sex therapist turned porn producer, recounts how he helps clients heal through sexual fantasies.", "description": "But before telling their stories, he tells his own. When he first met Koldo, a brutish, dominant porn star, he felt compelled to be on screen too. To be seen. To be desired. To be bound.\n\nFrom there, the documentary unfolds through six client-inspired stories, exploring fantasies that will make our cancel culture cringe. Halfway through the show, willing participants can join Marc on stage, choose from a collection of toys and accessories, and explore their own fantasies in real time.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://www.etceteratheatrecamden.com/events/unshamed-an-erotic-documentary-and-live-performance", "tags": ["theatre"], "id": "e281", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "hackney-empire", "title": "Nish Kumar: Angry Humour From a Really Nice Guy", "byline": "Find out about getting here, access & support, plus food & drink", "description": null, "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://www.hackneyempire.co.uk/events/nish-kumar-angry-humour-from-a-really-nice-guy", "tags": ["stand-up"], "id": "e282", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "hampstead", "title": "THE URMETAZOAN", "byline": "Your sister’s problem was she got to see how big the universe was. But she thought that made all of us small.", "description": "Sisters are strange – a collision of opposites and alignments, pulling and pushing away from each other. Alice and Abigail are no different. Alice got their mother’s looks; Abigail got her sense of humour. Alice has a Nobel Prize for Medicine; Abigail likes to get stoned on the sofa. Abigail is a homebody; Alice is preparing to leave the earth forever on a one-way mission to deep space.\n\nWhen the sisters rediscover the joy of being in each other's orbit, the concept of a goodbye becomes much harder than either of them anticipated. But the countdown has already started…", "first_date": "2026-09-18", "last_date": "2026-10-24", "url": "https://www.hampsteadtheatre.com/whats-on/2026/the-urmetazoan/", "tags": ["theatre"], "id": "e283", "venue_name": "Hampstead Theatre", "venue_area": "Swiss Cottage"}, {"venue_id": "hen-and-chickens", "title": "RESSÓ", "byline": "In 1991, Maria cleans hotel rooms in Mallorca as the island transforms around her into one of Europe’s biggest tourist destinations.", "description": "In 2019, her daughter Carme is living in London when a late-night phone call forces her to make the journey home.\n\nMoving between generations, countries and memories, Ressó is an intimate exploration of motherhood, migration, class, and the invisible labour behind paradise — and of what happens when the place you call home becomes somewhere everyone else comes to escape.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://www.unrestrictedview.co.uk/events/ress", "tags": ["theatre"], "id": "e284", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "jacksons-lane", "title": "Mixed Doubles: Rosie Macari & Lila Naruse / Linden Dance Company", "byline": "Mixed Doubles brings together two performances in one night. Carefully paired, each programme showcases different artists, disciplines and perspectives.", "description": "_____________________________________________________________________________________________\n\nAetherbound: an aerial dance duet that combines contemporary movement with rope and harness work to explore themes of belonging, kinship, and connection between women. The duet hopes to promote a wider social conversation in how people view the capabilities of a woman’s body. Through air and ground Rosie Macari & Lila Naruse float and suspend in a dream like world that journeys from the beginnings of life to the end.\n\nUnboxed: Two performers. Two giant wooden cubes. One powerful journey beyond the boxes that divide us.", "first_date": "2026-09-18", "last_date": "2026-09-19", "url": "https://www.jacksonslane.org.uk/events/mixed-doubles-linden-dance-company-rosie-macari-lila-naruse/", "tags": ["dance", "circus"], "id": "e285", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "museum-of-comedy", "title": "Character Comedy Showcase", "byline": "Get ready to discover the next generation of alternative comedy talent at this one-night-only character comedy showcase.", "description": "Featuring 12 bold, brilliant and gloriously unpredictable acts, the show brings together alumni of Charlie Vero-Martin’s acclaimed Character Comedy Course. All of these character creations were created in just 6-weeks and have already made waves on the alt-comedy scene including Sketch Off, Soho Theatre and the Edinburgh Fringe. The showcase also marks an exciting new chapter for Charlie’s Character Comedy Course, which is about to launch at the Museum of Comedy. It offers performers of all levels and backgrounds the chance to develop their own unique characters in 8-weeks and showcase them in one of London’s most beloved comedy venues. So if you’re curious about signing up to the course and creating your own comedy characters, this is the best way to see what’s in store! Expect big laughs, strange characters and comedy that refuses to play by the rules. Find out more about Charlie’s Character Comedy Course starting at MoC in September here!", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://www.museumofcomedy.com/character-comedy-showcase/", "tags": ["comedy"], "id": "e286", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "playground-theatre", "title": "Careless Talk", "byline": "Based on a true story and adapted from the novel by James Friel, ‘Careless Talk’ charts the tale of Mabel Bancroft, an Isle of Wight landlady, charged with treason for spying in the Second World War.", "description": "Based on a true story, this tale opens a dialogue on the justice system in this country; who does it protect, how and why?\n\nAli Williams is an actor, storyteller, and improviser.", "first_date": "2026-09-18", "last_date": "2026-09-20", "url": "https://www.theplaygroundtheatre.org.uk/projects/carelesstalk", "tags": ["theatre"], "id": "e287", "venue_name": "The Playground Theatre", "venue_area": "North Kensington"}, {"venue_id": "polka", "title": "Big Dreams: Industry Day", "byline": "Scratches and presentations from our 2026 Catapult Artist. Available in Day Pass.", "description": "Arlo Wilson, Inna Cebotari, Minhee Yeo & Kassna, Little but Fierce, Jeanzia Guan, Izzy Jiang & Yunshu Jiang and Layla Madanat & Roann Hassani McCloskey Meet the Catapult Programme participants here .\n\nWorkshop – Reward your Inner Child with Chloe Stephens from Page One Theatre – 10 – 11.30am. Available in Workshop pass. A joyful workshop for adults to reconnect with your inner child through play, and expand your approach to creating theatre for early years with Chloe Stephens .\n\nQ&A – Available in Day pass, Workshop pass and Q&As pass.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://polkatheatre.com/event/big-dreams-industry-day/", "tags": ["class"], "id": "e288", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "regents-park", "title": "Theatre Dance Lab Showcase", "byline": "The Theatre Dance Lab is an exciting new artist development programme set up in 2025 to nurture and elevate the next generation of musical theatre choreographers.", "description": "The initiative supports two of the country’s finest emerging dance makers who specialise in work for musicals, through mentoring, creative access, industry connections and the opportunity to present a showcase of their work.\n\nThis public event will showcase three performance pieces from each choreographer following a two-week development period with a cohort of professional dancers, interspersed with moments of ‘in conversation’ with Artistic Director Drew McOnie .\n\nA unique opportunity for audiences, theatre practitioners and industry guests to meet each of these exceptional artists and experience their work in an authentic and stripped back environment.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://openairtheatre.com/production/theatre-dance-lab-showcase", "tags": ["dance", "musical"], "id": "e289", "venue_name": "Regent's Park Open Air Theatre", "venue_area": "Regent's Park"}, {"venue_id": "rich-mix", "title": "Immersion (Colin Newman & Malka Spigel)", "byline": "Immersion are Malka Spigel and Colin Newman best known for their work with Minimal Compact and Wire. The duo’s work as Immersion provides an outlet for their ongoing fascination in crafting enthralling, unique musical soundscapes.", "description": "The project emerged in the early 1990s and has always prided itself on a diversity in approach and an ability to be both self-contained and a vehicle for collaboration. 1999’s Low Impact & 2018’s Sleepless cover very different aesthetics.\n\nMore recent work has seen Immersion collaborating with the likes of Tarwater, Laetitia Sadier, Ulrich Schnauss, Scanner, Thor Harris, Cubzoa & now SUSS in their ongoing Nanocluster series of events & albums.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://dice.fm/event/yoarkv", "tags": ["concert"], "id": "e290", "venue_name": "Rich Mix", "venue_area": "Shoreditch"}, {"venue_id": "roundhouse", "title": "Saint Etienne", "byline": "You can access your ticket once purchased by logging in to your ticket wallet with your Roundhouse account login details. For more information, see our FAQs .", "description": "Can’t make it? Resell on Twickets . It’s free to list, and your ticket sells at face value.\n\nRead more about Twickets , our official resale partner.", "first_date": "2026-09-18", "last_date": "2026-09-26", "url": "https://www.roundhouse.org.uk/whats-on/st-etienne/", "tags": ["concert"], "id": "e291", "venue_name": "Roundhouse", "venue_area": "Chalk Farm"}, {"venue_id": "shoreditch-town-hall", "title": "Donald Shek Memory Objects: Etching the Spaces Between Us", "byline": "A creative workshop exploring connection, memory and belonging through tracing, dry-point etching and digital transformation with artist Donald Shek.", "description": "How do we form connections across cultures, communities and generations?\n\nJoin artist Donald Shek for a creative, hands-on workshop exploring how personal objects can hold memories of stepping beyond the familiar and encountering new people, places and communities.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://shoreditchtownhall.com/whats-on/donald-shek-memory-objects-etching-the-spaces-between-us", "tags": ["class"], "id": "e292", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "the-cockpit", "title": "Fort", "byline": "1am. An Iron Age hillfort in rural Dorset. Fifteen year old best friends, Viv and Daisy, are waiting for a ghost.", "description": "With so much beyond their control, Fort has always been their stomping ground, their escape, at the edge of the future and the past. But when the ghost turns up, the girls feel something start to shift…\n\nFort is a new opera adapted from the play of the same name by Tabitha Hayward, which was recently staged at Theatre503 and long-listed for the Bruntwood Prize 2022.\n\nThe Music Troupe was founded in 2014 by the composer Edward Lambert. Since then, they have performed across the country including London, Brighton, Manchester, Yorkshire, and Berkshire, and regular appearances at Tête à Tête.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://www.thecockpit.org.uk/show/fort", "tags": ["opera"], "id": "e293", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "Azovstal", "byline": "A Ukrainian composer responding to the powerful and urgent story of Azovstal. A presentation of the new opera Azovstal with some music highlights in a concert form, followed by a talk with the composer and librettist and a Q&A session.", "description": "Age range: 12+ Content advisories: https://www.tete-a-tete.org.uk/tete-a-tete-the-opera-festival-2026-conte...", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://www.thecockpit.org.uk/show/azovstal", "tags": ["opera", "concert"], "id": "e294", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-space", "title": "Comedy In (the) Space - Marty Gleeson", "byline": "Leah Davis is a radio presenter and comedian who broadcasts nationally on hip hop/R&B station Capital Xtra.", "description": "Her show runs on weekday evenings from 10pm-1pm and Saturday breakfast from 6-9am. She launched herself as a stand-up comedian in 2022 and had over 50 gigs on the London open mic circuit in her first year. She has received a number of accolades already including reaching the final of Funny Women ’22 as well as being a semi-finalist in British Comedian of the Year 2022. She was also a Beat the Blackout winner at Up The Creek comedy club in London. She has guest appeared on BBC Radio 4’s ‘A Good Read’, at the 2021 Cheltenham Literary Festival and hosted the 2021 ‘Headliners’ online festival which celebrates the hottest books for the summer. She hosted the 2021 student radio ‘Amplify Awards’ and is a regular contributor to lifestyle blog ‘Sistem Magazine’. https://www.instagram.com/reels/DNBRVrqMPMh/\n\nOPEN SPOT: Myu Mano is a London-based Sri Lankan Tamil comedian who spends his days working in finance and his nights on stage. Born in Sri Lanka before moving to the UK at the age of 13. Drawing on his experiences as an immigrant, his heritage and the realities of navigating corporate life as a self-described “corporate sheep”. Myu recently won the Beat the Blackout competition at Up the Creek, further establishing himself as a rising act on the UK comedy circuit. His material combines cultural observations, self-deprecating humour and stories from his own life, covering everything from his lisp and family background to the absurdities of everyday life.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://space.org.uk/event/comedy-in-the-space-marty-gleeson-september-26/", "tags": ["stand-up"], "id": "e295", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "underbelly-boulevard", "title": "CSI: Crime Scene Improvisation", "byline": "No one knows who the killer is, not even the cast! Following multiple five-star sell-out runs at the Edinburgh Fringe, CSI: Crime Scene Improvisation is a rip-roaring crime comedy made up entirely on the spot.", "description": "Who? What? How? The choice is yours in this fully-improvised, witty and absurd murder mystery where the audience creates the crime. Solving made up crimes for over 12 hilarious years! Winner of The Comedy Award at Colchester Fringe 2024 and the Best Improvisation Award at Leicester Comedy Festival 2023.\n\nThis show is part of Fringe Fix – a cracking handpicked selection of shows we think you’ll love from this year’s Edinburgh Festival Fringe.\n\nWHAT’S BETTER THAN SEEING ONE SHOW? SEEING TWO – OR THREE! Enjoy exclusive savings for booking more than one Fringe Fix show. Find out more.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://underbellyboulevard.com/tickets/csi-crime-scene-improvisation/", "tags": ["comedy"], "id": "e296", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "underbelly-boulevard", "title": "Bar Encore", "byline": "Bar Encore is an intimate musical theatre piano bar experience featuring songs from Broadway, the West End and beyond.", "description": "Expect showstopping classics, modern favourites, audience requests and plenty of opportunities to sing along as the venue transforms into a later night theatre hangout for performers, fans and music lovers alike.\n\nTickets are free but we strongly recommend you book in advance.\n\nTucked away on Level 1 of Underbelly Boulevard Soho, our bar is one of Soho’s best kept secrets. With a selection of well-crafted classic cocktails, wines, beer and cider, as well as delicious non-alcoholic and soft options, tea and coffee, there’s a drink for every occasion and every taste on the menu.", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://underbellyboulevard.com/tickets/bar-encore/", "tags": ["musical"], "id": "e297", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "union-theatre", "title": "The Eden Project", "byline": "A relationship told in fragments. Two people move between closeness and distance, desire and control — and the slow discovery that neither of them has been seeing the other quite as they are.", "description": "The Eden Project is a two-hander about projection, intimacy, and the quiet violence of being loved only partially — and too completely.", "first_date": "2026-09-18", "last_date": "2026-09-19", "url": "https://uniontheatre.biz/show/the-eden-project/", "tags": ["theatre"], "id": "e298", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "upstairs-gatehouse", "title": "Grief Bacon Pyjama Party", "byline": "Thanks be to the Germans for expressing a gloom state that feels surprisingly American. “Grief Bacon,” translated from “Kummerspeck,” literally—and embarrassingly—means “weight gain from emotional overeating.”", "description": "When Hillary Clinton lost the 2016 presidency to Donald Trump, emergency chocolate was our medication of choice, and 10 years later the fat still hasn’t come off.\n\nSo, what to do when the planet is burning, coral reefs are ailing, and all the Artificial Intelligence in Elon Musk’s mad ketamine-fuelled kingdom can’t help you remember your 4-digit bank passcode number?", "first_date": "2026-09-18", "last_date": "2026-09-18", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173676112", "tags": ["theatre"], "id": "e299", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "bethnal-green-wmc", "title": "LADY OLÉ", "byline": "LADY OLÉ – BETHNAL GREEN WORKING MENS CLUB, Sat 19 Sep 2026 - SATURDAY 17th JANUARY -  LADY OLÉ\nTIMES: 9PM - 2AMCOSTS - ADVANCE: £15 // PAY ON THE DOOR: £17-------------------------------Spanish and British queer cultures collide in…", "description": "LADY OLÉ – BETHNAL GREEN WORKING MENS CLUB, Sat 19 Sep 2026 - SATURDAY 17th JANUARY -  LADY OLÉ\nTIMES: 9PM - 2AMCOSTS - ADVANCE: £15 // PAY ON THE DOOR: £17-------------------------------Spanish and British queer cultures collide in a KITCHSY, CRAZY, COLOURFUL CLUBNIGHT!The SENSATIONAL SPAN...", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.tickettailor.com/events/workingmens-club/2404005", "tags": ["theatre"], "price_min": 15.0, "price_max": 17.0, "id": "e300", "venue_name": "Bethnal Green Working Men's Club", "venue_area": "Bethnal Green"}, {"venue_id": "chickenshed", "title": "Jo Collins & Friends", "byline": "One of Chickenshed's most-loved evenings — and one that always sells out.", "description": "Jo Collins, Chickenshed co-founder and musical force of nature, takes to the stage with a wonderful cast of friends for an evening of live music like no other. Expect eclectic covers, original songs, spontaneous moments and the kind of warmth that only Jo and her crew can create.\n\nTwo chances to catch it this autumn — 19 September and 1 November. Early booking is strongly recommended. Licensed bar and bar snacks available.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.chickenshed.org.uk/events/jo-collins-friends-sep-2026", "tags": ["concert"], "id": "e301", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "courtyard", "title": "Bubba Itb & Friends", "byline": null, "description": null, "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://thecourtyardtheatre.seetickets.com/event/bubba-itb-friends/the-courtyard-theatre/3697850", "tags": ["theatre"], "id": "e302", "venue_name": "The Courtyard Theatre", "venue_area": "Hoxton"}, {"venue_id": "etcetera", "title": "Wasted", "byline": "Three old friends in their mid-twenties. One remarkable day. For Ted, Danny and Charlotte, it's time to seize control. A day trip through the parks and raves and cafes of South London, where life is what you make it.", "description": "The rapid-fire words of renowned performance poet and playwright Kae Tempest paint a picture of lives less ordinary in his acclaimed play about life, love and losing your mind.", "first_date": "2026-09-19", "last_date": "2026-09-20", "url": "https://www.etceteratheatrecamden.com/events/wasted", "tags": ["theatre"], "id": "e303", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "greenwich-theatre", "title": "Magic & Marvels", "byline": "Step right up and prepare to be amazed by the one-man extravaganza, \"Magic & Marvels,\" presented by the extraordinary and multi-skilled performer, Michael Jordan!", "description": "Get ready to embark on a thrilling journey into the realm of wonder and enchantment as Michael showcases his incredible talents in magic and circus arts.\n\nDirect from the iconic Blackpool Tower Circus and the prestigious “International Festival de Magie,” Michael effortlessly blends mesmerizing magic with awe-inspiring feats of juggling and daring stunts. With his captivating showmanship, he will leave you on the edge of your seat, gasping with disbelief, and cheering for more.\n\nWhether you're a fan of mind-boggling illusions or heart-stopping circus acts, \"Magic & Marvels\" promises to be an unforgettable experience for audiences of all ages. So, come one, come all, and join us for an afternoon of pure enchantment as Michael Jordan takes centre stage to ignite your imagination.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://greenwichtheatre.org.uk/events/magic-and-marvels/", "tags": ["magic", "circus"], "id": "e304", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hackney-empire", "title": "The Jack & Ash Show LIVE", "byline": "The Jack and Ash Show is stepping out of the screen and onto the stage to celebrate its first birthday, and everyone’s invited.", "description": "Hosted by Jack Remmington and Ash Holme , expect all of your favourite MO-MENTS including bestie dictionary, bad advice and tavern hankering. Bring your mates, your nan, and a spare wig - what an AMAYZIN night.\n\nAsh and Jack are the hosts of weekly podcast, The Jack and Ash Show, filled with curated chaos, dalliances of debauchery, and bestie advice peppered with tomfoolery. Chat shows just don’t hit like they used to so Jack and Ash are here to fix that, helping listeners start their weekend right. The podcast launched in September last year and already has a reach of over 65 million views.\n\nLimited number of pre show Meet & Greet tickets available to book. More information will be sent ahead of the event. Ash socials: Tiktok Instagram Jack socials: Tiktok Instagram", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.hackneyempire.co.uk/events/the-jack-ash-show-live", "tags": ["the
