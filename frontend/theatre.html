ve music driving 32 dancers to an explosive conclusion. George Balanchine revolutionised ballet in the 20th century, combining speed and precision to create the neo-classical style. It’s fast, sharp, dynamic – and breathtaking to watch.\n\nA rhythm that spins poetry into motion. Step inside Auguries of Innocence (world premiere) a poetic meditation on our connection to the natural and spiritual worlds. For this new work, Jae Man Joo draws inspiration from the poetry of William Blake and the music of Peteris Vasks – both rich with anguish, yearning and lyricism. Hailing from Korea, Jae Man Joo has choreographed for Complexions Contemporary Ballet, Pittsburgh Ballet Theatre and more. His recent work Divine, for Gwangju City Ballet, received the 2024 Korea Dance Artwork of the Year prize.", "first_date": "2026-09-24", "last_date": "2026-10-03", "url": "https://www.sadlerswells.com/whats-on/english-national-ballet-rhythm-riot/", "tags": ["dance"], "id": "e395", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "sadlers-wells", "title": "National Dance Company Wales - Blue | Glas", "byline": "Let NDCWales guide you through a desperately beautiful evening of dance.", "description": "Presenting a breathtaking double bill, the Welsh contemporary company restages Theo Clinkard ’s much loved Ordinary Courage alongside a new work from the Olivier nominated Alesandra Seutin .\n\nWhen words fall short, movement and touch can ground us.", "first_date": "2026-09-24", "last_date": "2026-09-26", "url": "https://www.sadlerswells.com/whats-on/national-dance-company-wales-blue-glas/", "tags": ["dance"], "id": "e396", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "soho-theatre", "title": "David Elms Describes A Room", "byline": "Together with his audience, veteran improviser Elms ‘builds a comedy mind palace before your very eyes… and you’ll want to move in for good!’ (Phil Wang).", "description": "Discounts may be available on top prices for students, seniors, unwaged.\n\nAccess tickets available by registering with us. Find out more on the Access page , or login if you are registered already.", "first_date": "2026-09-24", "last_date": "2026-10-26", "url": "https://sohotheatre.com/events/david-elms-describes-a-room-3/", "tags": ["stand-up"], "id": "e397", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "the-cockpit", "title": "Peter and the Wolf", "byline": "Following the show, you are invited to stay and play with sensory props used during the performance, in a Peter & the Wolf themed session hosted by the cast.", "description": "10:45am - 11:25am: Performance of Peter & the Wolf 11:25am - 11:45am: Stay and play\n\nTales in Motion is a dance company specialising in sensory theatre experiences for early years audiences, created by professional dancers Clea Godsill and Lizzie Treece. We met performing in a dance production of Tom’s Midnight Garden (2021) and are united by our passion for telling stories and creating meaningful performances for young people. We make narrative-driven, community-focused work that brings magical experiences for family audiences to small theatre and community spaces.", "first_date": "2026-09-24", "last_date": "2026-09-24", "url": "https://www.thecockpit.org.uk/show/peter_and_the_wolf", "tags": ["dance"], "id": "e398", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-place", "title": "The Last Quartet", "byline": "In The Last Quartet, Seke Chimutengwende imagines a “last work” or a “last attempt” at choreography. It’s an opportunity to go back to the beginning - back to the core elements of dancing and music, to imagine them anew.", "description": "Four dancers enter and exit the stage through gaps in the audience. They are figuring everything out through movement - how to begin, how to connect, how to change, how to end - leaving fleeting traces of scenes, relationships, and characters for the audience to contemplate. They share the stage with composer Jamie McCarthy , whose elegiac, electro-acoustic score evokes the slow and sudden changes of weather systems and cloud formations.\n\nWith no fixed sequences of movement and no fixed order of events, The Last Quartet offers a glimpse of limitless possibilities and new beginnings in this current moment where hope is scarce and futures lie everywhere in ruins.", "first_date": "2026-09-24", "last_date": "2026-09-26", "url": "https://theplace.org.uk/events/autumn-winter-26-the-last-quartet", "tags": ["dance"], "id": "e399", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "underbelly-boulevard", "title": "Stefania Licari: I Can Make You Italian in 55 Minutes", "byline": "Expat, ex-medic, and proudly Italian, she’s been hailed as “Sicily’s answer to Sarah Millican” (FringeReview) and praised for her “star quality” (Latest TV).", "description": "This is your unique chance to become Italian in under an hour!\n\nThis show is part of Fringe Fix – a cracking handpicked selection of shows we think you’ll love from this year’s Edinburgh Festival Fringe.", "first_date": "2026-09-24", "last_date": "2026-09-24", "url": "https://underbellyboulevard.com/tickets/stefania-licari-i-can-make-you-italian-in-55-minutes/", "tags": ["stand-up"], "id": "e400", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "underbelly-boulevard", "title": "Bar Sounds", "byline": "Twice a month, our House Band slips into the spotlight for a free night of live music. Bring your favourite people, order the wine and let the music do the rest.", "description": "Tickets are free but we strongly recommend you book in advance.\n\nTucked away on Level 1 of Underbelly Boulevard Soho, our bar is one of Soho’s best kept secrets. With a selection of well-crafted classic cocktails, wines, beer and cider, as well as delicious non-alcoholic and soft options, tea and coffee, there’s a drink for every occasion and every taste on the menu.", "first_date": "2026-09-24", "last_date": "2026-10-22", "url": "https://underbellyboulevard.com/tickets/bar-sounds-2026/", "tags": ["concert"], "id": "e401", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "wiltons", "title": "FLOP! The Best Songs From The Worst Musicals", "byline": "The virtuosic Arthur Hull makes his London debut with an updated version of FLOP! the musical cabaret inspired by some of Broadway’s least loved musicals.", "description": "FLOP! features the best songs from the worst musicals – a motley assortment of the misunderstood, critically panned and financially catastrophic, including some obscure and forgotten gems. The show made its critically acclaimed debut at Adelaide Fringe in 2025 winning the Best Emerging Artist Award before playing Edinburgh Festival Fringe later the same year where it won Best Entertainment at the Dark Chat Awards.\n\nFunny, fast-paced and full of amazing facts, it’s a love letter to Broadway and the West End’s biggest musical theatre misfires!", "first_date": "2026-09-24", "last_date": "2026-09-26", "url": "https://wiltons.org.uk/whats-on/flop-the-best-songs-from-the-worst-musicals/", "tags": ["cabaret", "musical"], "id": "e402", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "alexandra-palace", "title": "Friday Night is Music Night with Joe Stilgoe", "byline": "Jazz sensation and entertainer extraordinaire, Joe Stilgoe joins Fiona Monbet and the BBC Concert Orchestra at Alexandra Palace Theatre for an all-swinging, all-singing edition of Friday Night is Music Night.", "description": "Singer, pianist, bandleader, Joe Stilgoe is a jazz musician with a magic touch, equally happy when topping the jazz charts or holding audiences spellbound with his very personal take on the Broadway classics. The Times raved over his ‘dazzling digits; but the man himself is disarmingly modest – “I suppose I’m only doing what my heroes did, like Cole Porter, Irving Berling and Frank Loesser”, he says. Expect an evening of just that, with his new all star trio, violinist/conductor Fiona Monbet and the BBC Concert Orchestra.\n\nThe BBC Concert Orchestra collaborated on a live show for Joe’s smash 2022 album THEATRE; now, they reunite to play tracks from his latest album Welcome to the Club , including The Man In The Moon , Nobody and Mr Peanuts .", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://www.alexandrapalace.com/whats-on/friday-night-is-music-night/", "tags": ["concert"], "id": "e403", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "bac", "title": "Police Cops The Musical: Workshop Presentation", "byline": "Now directed by Sean Foley ( Dr Strangelove, The Ladykillers ), the critically acclaimed ‘hilarious’, ‘bonkers’ and ‘dazzling’ POLICE COPS THE MUSICAL returns for a limited Work-in-Progress workshop presentation.", "description": "Expect scripts in hand, plenty of chaos and a rare opportunity to experience the show’s next evolution before anyone else.\n\nNew songs. New characters. New-dity? There’s only one way to find out. Join us for a sneak peek of what’s already been called ‘the funniest musical since The Book of Mormon’ ( Attitude Mag ).\n\nUSA, 1980. In an era of tight jeans, fast cars and uncompromising facial hair, a pair of mismatched police cops are on the case to bring down the baddest cat in America!", "first_date": "2026-09-25", "last_date": "2026-10-03", "url": "https://bac.org.uk/whats-on/police-cops-the-musical/", "tags": ["musical"], "id": "e404", "venue_name": "Battersea Arts Centre", "venue_area": "Battersea"}, {"venue_id": "brixton-house", "title": "Kindrd Jam", "byline": "An unforgettable live experience where discovery, collaboration and musical excellence take centre stage.", "description": null, "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://brixtonhouse.co.uk/shows/kindrd-jam/", "tags": ["concert"], "id": "e405", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "coronet", "title": "Poetry Club: Anthony Joseph & Rachel Long", "byline": "Poetry Club returns to The Coronet Theatre for an evening of readings and conversation with two celebrated poets whose work moves between the intimate and the expansive, finding music, history and emotional truth in language.", "description": "T. S. Eliot Prize winner Anthony Joseph and acclaimed poet and founder of the Octavia Poetry Collective Rachel Long read from their latest collections and discuss the inspirations, experiences and ideas that shape their writing.\n\nAnthony Joseph reads from Haunting the Black Air , his new collection of poems spanning London, New York, Trinidad and beyond. Blending poetry, history and Caribbean cosmology, the collection moves through grief and joy with musicality and formal invention, unifying life’s beautiful fragments through rhythms of jazz and speech.\n\nRachel Long’s luminous new collection Sparrow on the Rooftop explores love, desire, longing and heartbreak with tenderness, wit and startling emotional precision. By turns fierce, funny and deeply moving, these poems map the complexities of intimacy and recovery.", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://www.thecoronettheatre.com/whats-on/poetry-club-25-sep-26/", "tags": ["spoken-word"], "id": "e406", "venue_name": "The Coronet Theatre", "venue_area": "Notting Hill"}, {"venue_id": "etcetera", "title": "F You Claire", "byline": "Penelope is 24 years old. She spends most of her life in her tiny bedroom and fears pretty much everything.", "description": "As existential anxieties begin to mount, functioning as an adult human being starts to seem impossible – particularly with the introduction of her unwanted, fiendish new roommate: Claire.\n\nDealing with some heavy topics but in a fluffy, lighthearted way, this show offers the audience a collective sigh of relief in the mess of life that we hope will stick with you.", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://www.etceteratheatrecamden.com/events/f-you-claire", "tags": ["theatre"], "id": "e407", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "ica", "title": "CTM x ICA: Cyst (Iglooghost & daisy*) + Alpha Maid + Europa", "byline": "The second CTM x ICA 2026 night explores composition as a process of constant mutation, tracing parallel routes through experimental sound towards intricate and unsettled forms. Featuring Cyst (Iglooghost & daisy*), Alpha Maid, and Europa.", "description": null, "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://www.ica.art/live/ctmxica-2026-2", "tags": ["concert"], "id": "e408", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "jacksons-lane", "title": "Mixed Doubles: Joli Vyann / Mimbre", "byline": "Mixed Doubles brings together two performances in one night. Carefully paired, each programme showcases different artists, disciplines and perspectives.", "description": "_____________________________________________________________________________________________\n\nan innovative fusion of daring acrobatics and beautifully articulated, communicative dance, drawing in audiences through stories which fire the imagination. The work is athletic, technical, exciting, emotive and relevant.\n\nJoli Vyann’s incredible duet , Drop Me If You Dare, is about the connection between two people, exploring the elements of strength and submission, weakness and control within their relationship. An exciting mix of dance and partner acrobatics, this show has become a classic, enthralling audiences of all ages and touring all over the world.", "first_date": "2026-09-25", "last_date": "2026-09-26", "url": "https://www.jacksonslane.org.uk/events/mixed-doubles-mimbre-joli-vyann/", "tags": ["dance", "circus"], "id": "e409", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "orange-tree", "title": "The Fidelio Trio", "byline": "The ‘virtuosic Fidelio Trio’ (Sunday Times) are Darragh Morgan (violin), Tim Gill (cello) and Mary Dullea (piano).", "description": "Shortlisted for the 2016 Royal Philharmonic Society Music Awards, The Fidelio Trio broadcast regularly on BBC Radio 3, RTÉ Lyric FM, WQXR, and have been featured on a Sky Arts documentary.\n\nSince their debut at London’s Southbank Centre, they have regularly appeared at the Wigmore Hall and Kings Place, at festivals including Spitalfields, Cheltenham, St. Magnus and Huddersfield. In Ireland they regularly perform at National Concert Hall, Dublin, and internationally at Shanghai Oriental Arts Centre, Beijing Modern Music Festival, Hong Kong Chamber Music Society, Singapore, Bangkok, Porto, Paris, Venice, Florence, Johannesburg, Harare, New York City, San Francisco and Boston.", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://orangetreetheatre.co.uk/whats-on/the-fidelio-trio/", "tags": ["concert"], "id": "e410", "venue_name": "Orange Tree", "venue_area": "Richmond"}, {"venue_id": "playground-theatre", "title": "Look What Fell Out De Mango Tree", "byline": "Every family has secrets. Some are worth keeping. Some can change your life forever. What happens when the truth you've been searching for is the one thing your family has spent generations trying to hide?", "description": "In Look What Fell Out De Mango Tree, award-winning playwright and storyteller Debra Ehrhardt delivers her most intimate and emotionally powerful work to date. Inspired by extraordinary true events, this riveting new play spans continents, generations, and decades of buried family secrets, taking audiences on an unforgettable journey filled with laughter, heartbreak, revelation, and hope.\n\nSet between Jamaica and America, the story follows a woman determined to uncover the truth about her past. But as long-buried secrets begin to surface, she discovers that the stories we inherit can either imprison us—or become the very key to our freedom. To move forward, she must confront painful truths, break generations of silence, and find the courage to reclaim the story of her own life.", "first_date": "2026-09-25", "last_date": "2026-09-27", "url": "https://www.theplaygroundtheatre.org.uk/projects/lookwhatfelloutdemangotree", "tags": ["theatre"], "id": "e411", "venue_name": "The Playground Theatre", "venue_area": "North Kensington"}, {"venue_id": "regents-park", "title": "Doves", "byline": "Inspiration is seldom elusive and motivation rarely fades for Doves as the boundary-clearing alchemists of yearning, scenic alternative sound return with their sixth studio album…", "description": "Inspiration is seldom elusive and motivation rarely fades for Doves as the boundary-clearing alchemists of yearning, scenic alternative sound return with their sixth studio album, 25 years after they arrived with their Mercury Award-nominated debut.\n\nTested yet undiminished, the three members’ artistic impulses quietly raged on following 2020’s third No.1 album success of The Universal Want , getting to work almost immediately afterwards. Five years on, a baton passes to Constellations For The Lonely , ten new tracks of enkindled, future-facing, meticulous manipulation of mood.\n\nAuditorium Regent's Park Open Air Theatre London NW1 4NU", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://openairtheatre.com/production/doves", "tags": ["concert"], "id": "e412", "venue_name": "Regent's Park Open Air Theatre", "venue_area": "Regent's Park"}, {"venue_id": "rich-mix", "title": "Anarchist Book Fair Opening Party", "byline": "It is with great “sadness” that we announce the tragic passing of rainbow capitalism.", "description": "Since the last brick was thrown at the Stonewall inn, corporations have been trying to sell our community back to us and use our liberation to pinkwash their oppression. Who could have predicted that it would all end in tears? Now that the pigeons are finally coming to roost, join us to celebrate the life and, more importantly, the slow and painful death of **Rainbow Capitalism**.\n\nIn a collab that’s been too long coming, **Drag Down the Borders**, **Bledi** and **Lesbians and Gays Support the Migrants** are uniting for the opening night party of **Anarchist Book Fair**. We’re putting queer community, abolitionism and migrant solidarity at the heart of an evening of cabaret, DJs, speakers, and stalls. Join us for a night of joy, rage and solidarity!", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://dice.fm/event/ryo3ar", "tags": ["social"], "id": "e413", "venue_name": "Rich Mix", "venue_area": "Shoreditch"}, {"venue_id": "siobhan-davies", "title": "Autumn Moon Festival 2026", "byline": "In many communities this is a day of reunion and a chance to gather and mark the changing of the season with others.", "description": "Come alone, or with friends and (chosen) family – everyone is welcome! If you’ve not been to SDS before, this is a great moment to meet us and find out more about what we do.\n\n5.30pm | Craft Workshop: Flower, Memory & Gathering", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://www.siobhandavies.com/events/autumn-moon-festival-2026/", "tags": ["social", "class"], "id": "e414", "venue_name": "Siobhan Davies Studios", "venue_area": "Elephant and Castle"}, {"venue_id": "stone-nest", "title": "Ecstasy of the Virtues", "byline": "Step into a richly sensuous world inspired by the life, music and visions of 12th-century nun, mystic and polymath Hildegard von Bingen.", "description": "Blending singing, live instruments, electronic sounds, dance, light, water, scent and taste, this very modern opera creates a secular devotional space, in which audience and performers embark on a shared pilgrimage of self-love and transformation.\n\nAward-winning composer, director and librettist Nwando Ebizie reimagines Hildegard’s 1151 mystery play Ordo Virtutum through her lens as a neurodivergent Afrofabulist, drawing on influences as diverse as West African and Caribbean ceremonial music, medieval mystery plays, Downtown New York minimalism and Toni Morrison’s Beloved to create a total artwork where every element serves a transportive, multisensory experience.", "first_date": "2026-09-25", "last_date": "2026-09-27", "url": "https://www.stonenest.org/events/ecstasy-of-the-virtues", "tags": ["opera"], "id": "e415", "venue_name": "Stone Nest", "venue_area": "Soho"}, {"venue_id": "tabernacle", "title": "Doe Paoro", "byline": "Doe Paoro is a singer-songwriter and multidisciplinary artist from New York who creates immersive musical experiences rooted in ritual that invite audiences into deep reflection, remembrance and harmony.", "description": "In this concert, Doe and her band will share music from past albums as well as her most recent album, Living Through Collapse — a body of work that asks us to sit with the grief and sacred responsibility of living in a world in crisis. How might music help orient us in disorienting times? How can song awaken courage and a deeper sense of belonging to one another and the living world? How might this moment call each of us more fully into care and participation? Together we will find a way and this concert intends to be a gathering place where music becomes both refuge and invitation: a path to listen to the heart as a source of resilience, imagination, and repair. Tickets", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://www.thetabernaclew11.com/events/2026/9/25/doe-paoro-live-the-taberancle", "tags": ["concert"], "id": "e416", "venue_name": "The Tabernacle", "venue_area": "Notting Hill"}, {"venue_id": "the-albany", "title": "Block Power Music", "byline": "For beatmakers in or out of the box! An evening of live sequencing and new exclusive music from London's thriving beatmakers scene.", "description": "Producers/beat makers will go B2B for an evening of live sequenced music to create a live cipher of new and exclusive music.\n\nBPM is one of the most refreshing and exciting music events in London. It really feels like you are part of something special.", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://www.thealbany.org.uk/events/block-power-music-anniversary", "tags": ["concert"], "id": "e417", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "the-cockpit", "title": "Mirrors - When Silence Breaks, Hope Rises", "byline": "There comes a moment in life when each of us must look into the mirror and face our own reflection. But how ready are we to truly confront what we see? And what happens when the shadows of others blur the image before us?", "description": "Mirrors is a deeply human and profoundly timely play about the truth of existence - a lyrical yet powerful exploration of the essence of life.\n\nThree women, in three different cities: in New York, Linda Anderson, a bank employee; in Thessaloniki, Corinna Papadaki, an office worker; and in Rome, Malena Conti, a lyrical mezzo-soprano.", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://www.thecockpit.org.uk/show/mirrors_-_when_silence_breaks_hope_rises", "tags": ["theatre"], "id": "e418", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "underbelly-boulevard", "title": "Alfie Brown: The Entertainer", "byline": "A show so entertaining you can scarcely believe it. Written and performed (both!) by a man in crisis, desperate to find meaning in life.", "description": "As technology makes life easier, where do we find value? What is stand-up comedy for? Buy a ticket and find out, let me amuse you like you’ve never been amused before, I doubt you’ll ever need amusing again.\n\nChortle Best Show Award Winner 2022 & Edinburgh Comedy Award Nominee 2022.\n\nThis show is part of Fringe Fix – a cracking handpicked selection of shows we think you’ll love from this year’s Edinburgh Festival Fringe.", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://underbellyboulevard.com/tickets/alfie-brown-the-entertainer/", "tags": ["stand-up"], "id": "e419", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "underbelly-boulevard", "title": "Diana: The Untold and Untrue Story", "byline": "But do you know our story of Diana? We very much doubt it.", "description": "A loving celebration of Ar Di that is as hilarious as it is ridiculous.\n\nFrom Awkward Prods ; the duo behind Gwyneth Goes Skiing , Linus Karp Was Hit With An Umbrella and The Fit Prince (who gets switched on the square in the frosty castle the night before (insert public holiday here)) .", "first_date": "2026-09-25", "last_date": "2026-09-26", "url": "https://underbellyboulevard.com/tickets/diana-the-untold-and-untrue-story/", "tags": ["comedy", "theatre"], "id": "e420", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "union-theatre", "title": "SONGS FROM THE SOFA", "byline": "The good/dreadful news (delete as inappropriate) is that we’re at it again.", "description": "Over the past 12 years, Sam has managed to manoeuvre himself from aggressively singing at the wet tiles and emerging through the steam to the strains (and what a strain) of ‘Defying Gravity’… to the sofa. From shower to sofa. Probably still in his dressing gown. That’s…that’s the journey Sam believes people will still want to hear about. And pay for the privilege.", "first_date": "2026-09-25", "last_date": "2026-09-25", "url": "https://uniontheatre.biz/show/songs-from-the-sofa/", "tags": ["theatre", "comedy"], "id": "e421", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "brixton-house", "title": "There’s Something About Kelechi", "byline": "The irreverent host of Front Page Fxckery and the award-winning Say Your Mind podcast discusses the goings on in the world in a way only she can.", "description": "You might’ve come across Kelechi for her incisive cultural commentary, her literary accomplishments, or from one of her legendary twerking and pole dance classes, one thing people can (mostly) agree on is this: there’s something about Kelechi that makes it impossible to look away.\n\nSharp, hilarious, honest and deeply human, this live show invites the audience into Kelechi’s world as she reflects on the journey so far; the chaos, the wisdom, the contradictions, and the joy of becoming (no Michelle).", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://brixtonhouse.co.uk/shows/theres-something-about-kelechi/", "tags": ["stand-up"], "id": "e422", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "camden-peoples-theatre", "title": "Good Grief (WIP)", "byline": "When Marc dies unexpectedly, something arrives to help.", "description": "Joe suddenly finds himself navigating funeral arrangements, family feuds and a companion with an unwavering belief that he knows exactly what's best. As the weeks go by, it becomes clear that not all help is necessarily helpful.\n\nGood Grief is a surreal tragicomedy inspired by true events, about family, loss and the strange business of carrying on.", "first_date": "2026-09-26", "last_date": "2026-09-27", "url": "https://cptheatre.co.uk/whatson/Good-Grief", "tags": ["theatre"], "id": "e423", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "canal-cafe", "title": "Too Close for Comfort", "byline": "Fred is 25. An aspiring actor, eager to find his way in the industry. Without much support from his family, he’s been navigating his dream alone. When Fred finally lands an acting job in Leeds, he couldn’t be more excited!", "description": "Irene is 75. A retired teacher, with a big heart and a love of flapjacks. With her pension running dry, she’s been considering how to make some extra cash. Perhaps a lodger might be the solution?\n\nSearching for accommodation in Leeds, Fred makes a phone call to Irene. Neither of them could ever predict the events that are about to follow…", "first_date": "2026-09-26", "last_date": "2026-09-27", "url": "https://canalcafetheatre.com/our-shows/too-close-for-comfort/", "tags": ["theatre"], "id": "e424", "venue_name": "Canal Café Theatre", "venue_area": "Little Venice"}, {"venue_id": "greenwich-theatre", "title": "Vox Lumiere Metropolis", "byline": "Vox Lumiere shatters the boundaries between concert hall and cinema.", "description": "Award-winning Vox Lumiere transforms Fritz Lang’s iconic 1927 silent masterpiece METROPOLIS into an explosive live experience with live band, thrilling original new music and powerhouse vocals.\n\nVIP Tickets Available - Included with VIP Tickets:\n\nGroup Discount - Buy 8 Get an additional 2 for Free (Any Price Tier) - Select 10 tickets and discount will apply at checkout", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://greenwichtheatre.org.uk/events/metropolis/", "tags": ["concert", "theatre"], "id": "e425", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "half-moon", "title": "A Message for the Future", "byline": "Step into a magical future garden and meet a punk poet Dandelion, a rock ’n’ roll Minibeast and an operatic super Herb.", "description": "A Message for the Future is a multi-sensory art installation and gig theatre experience that subverts the early years genre through joyful rock’n’roll storytelling, celebrating nature, creativity and kindness. Through live music and surround sound, audiences are invited into a calm, immersive world that imagines a hopeful future and celebrates the wonders of the natural world.\n\nEngaging sight, sound, touch and smell, it’s an interactive musical experience, about fostering hope and nurturing joy in a time of growing environmental uncertainty.", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://www.halfmoon.org.uk/events/a-message-for-the-future/", "tags": ["immersive", "theatre"], "id": "e426", "venue_name": "Half Moon Theatre", "venue_area": "Limehouse"}, {"venue_id": "ica", "title": "Maddie Ashman", "byline": "Maddie Ashman is an avant-pop artist, producer and composer with a love for exploring microtonal music in uncanny, illusory yet addictive ways.", "description": null, "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://www.ica.art/live/maddie-ashman", "tags": ["concert"], "id": "e427", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "jacksons-lane", "title": "Esmeralda Colabone London Gala Show: From Andalus to Levant", "byline": "Step into an evening of timeless glamour, rich rhythms and expressive dance.", "description": "Join us on Saturday 26 September at 19:30 for a Gala Show celebrating the artistry, emotion and cultural depth of Oriental dance. Presented as part of Esmeralda Colabone’s London workshop weekend, this intimate performance brings together dancers from the UK and beyond, alongside beautiful guest stars and our fabulous international superstar, Esmeralda Colabone.\n\nAudiences will be taken on a journey through rhythm, melody and storytelling — from the elegance of the Andalus to the romance and richness of the Levant. Whether you are a lifelong lover of Oriental dance or discovering it for the first time, this showcase offers an inspiring evening of culture, technique, expression and passion.", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://www.jacksonslane.org.uk/events/esmeralda-colabone-london-gala-show-from-andalus-to-levant/", "tags": ["dance"], "id": "e428", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "lyric-hammersmith", "title": "The Big Bad Wolf", "byline": "Come on a madcap, rock 'n' roll musical journey of plotting and scheming with folklore's most notorious villain - The Big Bad Wolf.", "description": "Exiled to the Deep Dark Wood, he parties hard and rocks out every night with his cronies, far away from the goody-goody townspeople of Fairytaleville. But whatever happened to Little Red Riding Hood? Did the Three Little Pigs go on to have a successful career in techno music? Does his Fairy Godmother have what it takes to change the ways of a hardened carnivore?\n\nThe Plandits are back on the road with this original, high-energy show bursting with live music, punk attitude, and plenty of laughs.", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://lyric.co.uk/shows/the-big-bad-wolf/", "tags": ["musical"], "id": "e429", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "omnibus", "title": "LOST THE PLOT: AN IMPROVISED MUSICAL", "byline": "Get lost in a new musical every month. Give us a location and we’ll provide the rest. Expect glittering harmonies, hilarious characters and heart-wrenching drama…all made up entirely on the spot!", "description": "Follow Lost Improv on Instagram and TikTok @lostimprov\n\nTo connect this element to content from your collection, select the element and click Connect to Data.", "first_date": "2026-09-26", "last_date": "2026-11-28", "url": "https://www.omnibus-clapham.org/whatson/lost-the-plot", "tags": ["musical", "comedy"], "id": "e430", "venue_name": "Omnibus Theatre", "venue_area": "Clapham"}, {"venue_id": "regents-park", "title": "Café del Mar Classical", "byline": "Café del Mar Classical is the brand-new orchestral show from the iconic international dance music brand, and the undisputed home of chill-out music.", "description": "Performed by a spectacular 15-piece orchestra and special guest vocalists, fans can expect to hear the greatest hits of Café del Mar's history, featuring tracks by Groove Armada, Moby, Chicane, Zero7, Nightmares on Wax, Morcheeba and many more.\n\nBorn in Ibiza, shaped by 45 years of sunset culture and the global rise of chill-out music, Café del Mar has consistently translated atmosphere, place and emotion into sound.", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://openairtheatre.com/production/cafe-del-mar-classical", "tags": ["concert"], "id": "e431", "venue_name": "Regent's Park Open Air Theatre", "venue_area": "Regent's Park"}, {"venue_id": "rich-mix", "title": "Anarchist Bookfair After Party", "byline": "DICE protects fans and artists from touts. Tickets will be securely stored in the app.", "description": "This year's London Anarchist Bookfair after-party will feature an incredible line-up of radical artists, bringing you the best of underground DIY, feminist, queer, anarcho-punk, hip-hop, afrorave, hardcore and jungle.\n\nRich Mix is a step free building, this event will take place on the ground floor. Step free access via ramp at the main entrance on Bethnal Green Road. Accessible toilets on the ground, 1st, 2nd and 4th floors. There are hearing loops in the venue, most hearing aids can connect by switching to the ‘T’ position. Infrared hearing systems available, headsets provided on request. Disabled guests can bring a carer for free. Nearest step free station is Shoreditch High Street. The show will feature loud noise, bright lights but no strobe, there will be trigger warnings.", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://dice.fm/event/6dge53", "tags": ["concert"], "id": "e432", "venue_name": "Rich Mix", "venue_area": "Shoreditch"}, {"venue_id": "royal-vauxhall-tavern", "title": "DANDY", "byline": "Dandy makes its triumphant return to The RVT this September, bringing a little Northern chaos to Vauxhall.", "description": "Dandy is alternative queer clubbing for everybody and every body, for our community, our friends and allies, for the bears, chubs, cubs, femmes, freaks, Marthas, Arthurs, losers, bruisers, fruits, brutes, queens, queers, and anyone in between or beyond.\n\nThe drinks will be cold, the dancefloor will be hot, the crowd will be gorgeous, and the music will be positively sizzling as our resident DJs play the very best in alt.pop, indie bangers, hyperpop, disco faves, nu rave throwbacks, gay icons, queer noise… and anything else that gets you moving.", "first_date": "2026-09-26", "last_date": "2026-10-31", "url": "https://www.vauxhalltavern.com/events/event/dandy-4/?oid=6606", "tags": ["cabaret"], "id": "e433", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "sadlers-wells", "title": "Breakin’ Convention – Open Art Surgery – September 2026", "byline": "Open Art Surgery invites you to witness and influence the development of six brand-new works by exciting hip hop theatre artists.", "description": "This showcase marks the culmination of a one-week residency, where artists have explored, experimented, and refined their craft under the expert guidance of Breakin’ Convention ’s faculty of celebrated mentors. Facilitated by Artistic Director Jonzi D , the audience is encouraged to share their thoughts and reflections on the works in progress, offering valuable feedback to help shape the artists’ creative journeys.\n\nThis is your chance to play a role in the future of hip hop theatre – don’t miss out!", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://www.sadlerswells.com/whats-on/breakin-convention-open-art-surgery-september-2026/", "tags": ["theatre"], "id": "e434", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "shoreditch-town-hall", "title": "Debt, Colonialism & the Climate Crisis", "byline": "Many of the world’s most climate vulnerable states are spending five times more on debt than dealing with the climate emergency – even as these countries face floods and famines.", "description": "The debt crisis means that all around the world, from Senegal to Sri Lanka , Ethiopia to El Salvador , there are children who can’t go to school, hospitals that can’t offer people the treatment they need and homes that can’t be rebuilt when climate disaster strikes.\n\nThis is not an accident. For centuries, powerful governments, institutions and corporations have used debt to control and plunder the resources of countries in the global South for their own gain.", "first_date": "2026-09-26", "last_date": "2026-10-04", "url": "https://shoreditchtownhall.com/whats-on/debt-justice-debt-colonialism-and-the-climate-crisis", "tags": ["talk"], "id": "e435", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "the-glitch", "title": "Have Your It Way (WIP)", "byline": "Have Your It Way (WIP) – Lower Marsh Arts Club, Sat 26 Sep 2026 - \"In a world of standardization, inauthenticity and fakeness, we are a place where you can be exactly who you are\".", "description": "Guess whose brand guidelines that quote comes from...a wellness centre? a spooky tech company building a new metaverse? No. It's from Burger King. In their ...", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://www.tickettailor.com/events/vaultcreativearts/2339534", "tags": ["theatre"], "id": "e436", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "underbelly-boulevard", "title": "The Jolly Fisherman", "byline": "From the multi-award winning producers of London smash-hit Brixton Calling, comes a stunning new story. The story of Alan, Amir and England.", "description": "Inspired by true events in London’s East End, two boyhood best friends must hold tightly to their friendship as their worlds pull them further apart. This is a play about who we are now and the places we call home. Starring Alex Hill (global Fringe-phenomenon Why I Stuck A Flare Up My Arse For England) and Jonny Khan (Olivier-nominated The Shitheads).\n\nEvery year, one show rises from the chaos of the Fringe and demands to be seen. Wild Card holds a place in the Fringe Fix programme for a show – as yet undiscovered – to be selected in real time from the heart of the Edinburgh Festival Fringe.", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://underbellyboulevard.com/tickets/the-jolly-fisherman/", "tags": ["theatre"], "id": "e437", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "underbelly-boulevard", "title": "Abandoman: Afterglow", "byline": "Abandoman is back – and this year, it’s a party. Blending hip-hop with euphoric dance music, Rob Broderick ‘s award-winning improvised comedy show turns your suggestions into original bangers, live and unrepeatable for one night only.", "description": "Razor-sharp wit, genuine warmth and unstoppable audience interaction make this one of London’s most joyful, unpredictable nights out.\n\nThis show is part of Fringe Fix – a cracking handpicked selection of shows we think you’ll love from this year’s Edinburgh Festival Fringe.\n\nWHAT’S BETTER THAN SEEING ONE SHOW? SEEING TWO – OR THREE! Enjoy exclusive savings for booking more than one Fringe Fix show. Find out more.", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://underbellyboulevard.com/tickets/abandoman-afterglow/", "tags": ["comedy", "concert"], "id": "e438", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "unicorn", "title": "Pocket Money", "byline": "A wild ride into the world of finance where children make the decisions.", "description": "Featuring big ideas, an interactive voting system and a live DJ set, this world premiere for 7 to 12-year-olds explores financial literacy in the digital age, empowering children to think critically about money, their choices and their future. Created by experimental theatre-makers Nigel Barrett and Louise Mari in consultation with the Unicorn’s Creative Associates, a mischievous clown, a cutting-edge DJ and financial experts - this high-energy and revelatory show is packed full of surprises and anarchic fun!\n\nDeveloped in consultation with an Advisory Group of financial experts, led by Nizam Uddin OBE (Executive Consultant & Chair). The group includes: Aimée Allam (Executive Director, Financial Times Financial Literacy & Inclusion Campaign), Edward Blair (Head of Private Markets, Oberon Investments), Andrew Hebden (Head of Public and Stakeholder Engagement, Bank of England), Mehreen Khan (Economics Editor, The Times), Mathias Wikstrom (Founder and CEO, Doconomy), Alderman Alastair King (Chairman, Nesbitt King Group & 696th Lord Mayor of London), Neamul Mohsin (Chief Investment Officer, Oxford University Endowment), Claire Quigley (Deputy CEO, Money Ready), Rebekah Westphal (Dean of Admissions, Financial Aid & Communications, American School in London) and Louise Williams (Chief Financial Officer, Aberdeen Advisor).\n\nThis production explores financial literacy in a way that is appropriate to the age range. It uses an electronic voting system that allows children to interact with the show in a fun and playful way.", "first_date": "2026-09-26", "last_date": "2026-11-01", "url": "https://www.unicorntheatre.com/events/pocket-money", "tags": ["theatre"], "id": "e439", "venue_name": "Unicorn Theatre", "venue_area": "London Bridge"}, {"venue_id": "union-theatre", "title": "KEEPSAKE OF A KILLER", "byline": "Four months since The Ripper’s reign of terror, and Whitechapel’s peace is shattered once more by the discovery of a mutilated woman beneath Fenchurch Street Station.", "description": "To prevent widespread panic, the police convey the body to Toynbee Hall, the home of social reformer, Henrietta Barnett. There, with the help of you, her students, you must assist the police investigation in this fully interactive murder mystery play.\n\nExamine the victim’s belongings, study police reports, interview witnesses and much more, in this race against time to establish the facts of the poor woman’s life and death and find her justice.’", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://uniontheatre.biz/show/keepsake-of-a-killer/", "tags": ["theatre", "immersive"], "id": "e440", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "wiltons", "title": "History Tours", "byline": "Hear how a Victorian sailors’ pub went from music hall to Methodist Mission and was forgotten… before becoming the venue it is today.", "description": "These tours have been devised by a Wilton’s researcher and historian and last approximately one hour. Providing a glimpse into the life of the last surviving building of its kind, these tours are perfect for students, researchers and everyone who would like to learn more about this historic venue.", "first_date": "2026-09-26", "last_date": "2026-09-26", "url": "https://wiltons.org.uk/whats-on/guided-tours-september-2026/", "tags": ["talk"], "id": "e441", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "etcetera", "title": "Sweet Victory", "byline": "A new work of comedic historical fiction. The American Revolutionary war has been waging for several years with no end in sight.", "description": "Sweet Victory, follows an American and British soldier as they spend the last days of the American Revolutionary War in the forests of New York...tolerating each other. Although they share the same name, John Smith and John Thomas couldn't be more different, but right now they only have each other.\n\nthe brand comedy, Sweet Victory, written and directed by Elise Marra. The play stars Emma Wilkinson Wright ( The Last Days of Liz Truss ) and Mikkie-dené Le Roux ( Black Mirror ). Art Design by Lily Rose Marra, Stage Manager Jessie Diepeveen", "first_date": "2026-09-27", "last_date": "2026-09-28", "url": "https://www.etceteratheatrecamden.com/events/sweet-victory", "tags": ["comedy", "theatre"], "id": "e442", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "hen-and-chickens", "title": "I Pie With My Little Lie, Something Beginning With Murder", "byline": "How are they all connected to a pie shop called the Balaton?", "description": "This is Mark’s second solo show, the first one, The Eggman, completed a successful run for four weeks at The Edinburgh Fringe at Underbelly. This time round the theme is pie and murder and in no particular order. How are they linked? What recipes are used? Most importantly, whether it’s a savoury or sweet pie, something sinister is lurking under the crust, deception will always hold a story waiting to be chomped on. These tales are entwined and held together with lashings of accompanying condiments and there is always room for a second slice.\n\nMark is a founder member of The Hatchery and has managed the Hen and Chickens Theatre for a very long time. He is enjoying immensely the birth of the Hatchery and cracking all the eggs to help bake new ideas and stories.", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://www.unrestrictedview.co.uk/events/i-pie-with-my-little-lie-something-beginning-with-murder", "tags": ["stand-up"], "id": "e443", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "pleasance-islington", "title": "Student Skech Off: London", "byline": "For more information about our venues and performance spaces, please visit our access pages here .", "description": "Assistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://www.pleasance.co.uk/event/student-skech-london", "tags": ["comedy"], "id": "e444", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "regents-park", "title": "Nick Mulvey", "byline": "Nick Mulvey is a musician, composer and producer with his own label, Supernatural Records.", "description": "His work pushes boundaries in songwriting and sound, in music both traditional and experimental, acoustic and electronic. With a unique path to success, Nick spent his early days studying Ethnomusicology in London, before becoming a founding member of the award-winning collective Portico Quartet. He left in 2011 to concentrate on his own material, and once solo, released the Mercury Prize shortlisted debut album First Mind , Wake Up Now , New Mythology , along with a number of EPs. His latest releases include Dark Harvest (Pt. 1) and Dark Harvest (Pt. 2) . Nick is writing a new independent chapter in his story. For Dark Harvest, he reached out to some incredible collaborators to help him express his inner-most musings. Legendary producer Jimmy Hogarth (Amy Winehouse, Paolo Nutini), the boundary-pushing Leo Abrahams (Brian Eno, Jon Hopkins), and the globally renowned Parisi Brothers (Ed Sheeran, Fred Again), have all lent a hand in assisting Nick to actualise his intentions.\n\nMain Auditorium Regent's Park Open Air Theatre London NW1 4NU\n\nAnyone under the age of 16 must be accompanied by an adult 18 or over. It remains the responsibility of the parent/guardian in advance of purchase to make their own judgement as to the suitability of the show for their child. Children under the age of 4 will not be admitted to the venue.", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://openairtheatre.com/production/nick-mulvey", "tags": ["concert"], "id": "e445", "venue_name": "Regent's Park Open Air Theatre", "venue_area": "Regent's Park"}, {"venue_id": "royal-vauxhall-tavern", "title": "SUNDAY CABARET WITH MARTHA D’ARTHUR AND THE D.E. EXPERIENCE", "byline": "There’s nowhere quite like Sunday Cabaret at The Royal Vauxhall Tavern .", "description": "Today you get two outstanding cabaret stars, first up is the always hilarious and sometimes quite naughty, Martha D’Arthur , followed by the totally iconic, totally brilliant D. E. Experience … there’s no one quite like Edna, big laughs and huge songs.\n\nThe RVT is an LGBTQ+ venue, please respect our space. No hen/stag parties", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://www.vauxhalltavern.com/events/event/sunday-cabaret-with-martha-darthur-and-the-d-e-experience/?oid=6635", "tags": ["cabaret"], "price_min": 11.0, "price_max": 11.0, "id": "e446", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "tabard", "title": "Siân Phillips: The Greeks", "byline": "BAFTA award-winning Dame Siân Phillips returns to the Tabard Theatre in two captivating explorations of the drama, wit and wisdom of Ancient Greece.", "description": "In Women & Troy , she is joined by Rachel Donovan ( The Crown , Call the Midwife ) to tell the stories of the women of Troy. From Queen Hecuba and her daughter Cassandra to Helen, the most beautiful woman in the world, these timeless tales of love, loss, resilience and survival are brought vividly to life.\n\nIn It's All Greek , Phillips joins BAFTA nominee Robert Powell ( Jesus of Nazareth , Mahler ) to celebrate the enduring wisdom of the ancient world. Through stories of love, laughter, betrayal and human folly, the Greeks prove themselves as relevant, insightful and entertaining today as they were thousands of years ago.", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://www.tabard.org.uk/production/sian-phillips-the-greeks2", "tags": ["theatre"], "id": "e447", "venue_name": "Tabard Theatre", "venue_area": "Chiswick"}, {"venue_id": "tabernacle", "title": "NATHAN", "byline": "A phantasmagorical performance based on the novel by Arthur Solomonov Featuring Anatoly Bely and Mikhail Borzykin On stage are two remarkable artists: acclaimed actor Anatoly Bely and rock musician Mikhail Borzykin…", "description": "A phantasmagorical performance based on the novel by Arthur Solomonov Featuring Anatoly Bely and Mikhail Borzykin On stage are two remarkable artists: acclaimed actor Anatoly Bely and rock musician Mikhail Borzykin, frontman of the legendary band Televizor . Blending dramatic performance, literary narration and live music, Nathan creates a striking theatrical experience that is by turns absurd, darkly comic and unsettlingly relevant. Based on Arthur Solomonov’s novel, the story follows the adventures of Nathan and a talking raccoon named Tugrik. Written on the eve of Russia’s full-scale invasion of Ukraine, the novel proved eerily prophetic. Its characters seize power, reshape societies, start wars, make peace, and move through every imaginable political and ideological transformation, from pacifism to militarism, from liberalism to authoritarianism. As reality increasingly began to resemble fiction, the novel’s publication in Russia became impossible. It was eventually published in Austria by Danzig & Unfried. Through humour, satire and music, Nathan explores power, propaganda, moral choice and the absurdity of contemporary history. As Anatoly Bely says: “The most important thing for me is that audiences will laugh. Today, laughter is a form of therapy. Perhaps the most powerful thing we can do is laugh at evil. That is exactly what we do in Nathan.” Running time: 1 hour 25 minutes Books by Arthur Solomonov, published in Austria and Israel, will be available for purchase before the performance. Following the performance, Anatoly Bely, Mikhail Borzykin and Arthur Solomonov will take part in a Q&A with the audience. Please note: All tickets are non-refundable. Age guidance: 16+ * Please note this show will be performed in Russian TICKETS", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://www.thetabernaclew11.com/events/2026/6/18/nathan", "tags": ["theatre", "concert"], "id": "e448", "venue_name": "The Tabernacle", "venue_area": "Notting Hill"}, {"venue_id": "the-albany", "title": "Vietnamese Mid-Autumn Festival I Lễ Hội Trung Thu", "byline": "Come and celebrate with us at our annual Mid-Autumn Festival, filled with Vietnamese culture and traditions.", "description": "This is a free event - you don't need to book a ticket and can just turn up the day. If it's very busy, we will operate on a first come, first served basis.\n\nVietnamese Family Partnership (VFP) , or Gia Đình Việt in Vietnamese , is a grassroots charity based in London, dedicated to supporting the Vietnamese community and promoting a deeper understanding of Vietnamese culture. They are proud to be a trusted, culturally-rooted space where Vietnamese people of all ages can feel connected, supported, and empowered.", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://www.thealbany.org.uk/events/mid-autumn-festival-2026", "tags": ["social"], "id": "e449", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "the-space", "title": "Piano Space - September 27th", "byline": "A new regular event celebrating the world of contemporary piano music. Featuring live performances of original music from an exciting collection of neoclassical pianists and composers.", "description": "Beautiful modern piano in an intimate and informal setting.", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://space.org.uk/event/pianospace-september-27th/", "tags": ["concert"], "id": "e450", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "the-space", "title": "Piano Space", "byline": "A new regular event celebrating the world of contemporary piano music. Featuring live performances of original music from an exciting collection of neoclassical pianists and composers.", "description": "September 27th programme Matias Dal Pos Ô Lake Gwenno Morgan\n\nNovember 29th programme Matthew Mayer Ciana O’Muireadhaigh Benjamin Cook", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://space.org.uk/event/piano-space/", "tags": ["concert"], "id": "e451", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "underbelly-boulevard", "title": "Call To Stage Live Residency", "byline": "27 September – Desmonda Cathabel: West End star Desmonda Cathabel headlines the Call To Stange Live Residency at Underbelly Boulevard Soho, curated by Amber Davies.", "description": "Currently starring in the acclaimed Jesus Christ Superstar at the London Palladium, Desmonda has made a name for herself as one of the West End’s most exciting stars, having wowed audiences as Eurydice in Hadestown (West End) as well as Princess Jasmine in Aladdin (UK & Ireland Tour). She also starred on ITV’s Mamma Mia! I Have A Dream and was awarded the Stephen Sondheim Society ‘Student Performer of the Year’.\n\nJoin Desmonda for a special, intimate evening of live music and storytelling, all set in a venue where no seat is far away.", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://underbellyboulevard.com/tickets/call-to-stage-live-residency/", "tags": ["concert"], "id": "e452", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "young-vic", "title": "Art Cure", "byline": "Professor Daisy Fancourt , an award-winning scientist and world-leading expert who recently published Art Cure: The Science of How the Arts Transform Our Health…", "description": "Professor Daisy Fancourt , an award-winning scientist and world-leading expert who recently published Art Cure: The Science of How the Arts Transform Our Health , will discuss the life-enhancing power of the arts in an evening hosted by broadcaster, journalist and podcast host, Hannah MacInnes .\n\nIn Art Cure , Fancourt reveals how engaging with the arts can improve our health, make us happier and even help us live longer. Informed by the results of decades of scientific studies, Art Cure explains why the arts – alongside diet, sleep, exercise and nature – are the forgotten fifth pillar of health, and gives you the tools to write your own 'arts prescription'.\n\nJoining the panel will be actress Tamzin Outhwaite , actor Alfred Enoch and Young Vic's Artistic Director, Nadia Fall OBE .", "first_date": "2026-09-27", "last_date": "2026-09-27", "url": "https://www.youngvic.org/whats-on/art-cure/", "tags": ["talk"], "id": "e453", "venue_name": "Young Vic", "venue_area": "South Bank"}, {"venue_id": "brixton-house", "title": "Brixton House Community Choir", "byline": "Learn to sing different musical styles with Brixton House Community Choir, from fresh re-workings of soul, jazz, gospel, pop, folk, and reggae with opportunities for the choir to perform throughout the year.", "description": "Brixton House Community Choir is led by singer and songwriters, Rachel Huggins and Abdul Shyllon.\n\nThe choir requires a full ten-week term commitment where you will be working towards an end of term sharing therefore you will need to book a term pass.", "first_date": "2026-09-28", "last_date": "2026-10-05", "url": "https://brixtonhouse.co.uk/shows/brixton-house-community-choir-winter-26/", "tags": ["class"], "id": "e454", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "greenwich-theatre", "title": "The Makings of a Murderer – The Undercover Detective", "byline": null, "description": null, "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://greenwichtheatre.org.uk/events/the-makings-of-a-murderer-the-undercover-detective/", "tags": ["theatre"], "id": "e455", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hen-and-chickens", "title": "Chicken Dropping", "byline": "Yifei and Ming lead a meticulously ordered life in their Qingdao beachfront apartment, watching their neighbour’s chickens engage in a brutal, feathery feud from behind a spotless window.", "description": "To Ming, a school teacher, the violence is background noise to be ignored; to Yifei, a bank clerk, this war is a market to be exploited, as free-range eggs begin to arrive at their doorstep.\n\nAs the couple argue and scheme over this unexpected windfall, the boundary between outside and inside begins to collapse. Chickens invade their home, littering the living room with droppings.\n\nChicken Dropping is a biting absurdist comedy about those who treat tragedy as opportunity, until the blood and filth of what they’ve monetised crash through their own kitchen window.", "first_date": "2026-09-28", "last_date": "2026-09-30", "url": "https://www.unrestrictedview.co.uk/events/chicken-dropping", "tags": ["theatre"], "id": "e456", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "hoxton-hall", "title": "Waterstones: Penn Cole in conversation with Sophia Tuxford", "byline": "Join us for a very special evening at London’s Hoxton Hall with bestselling author Penn Cole, hosted by Sophia Tuxford, as we celebrate the release of the highly-anticipated final instalment in The Kindred’s Curse saga…", "description": "Join us for a very special evening at London’s Hoxton Hall with bestselling author Penn Cole, hosted by Sophia Tuxford, as we celebrate the release of the highly-anticipated final instalment in The Kindred’s Curse saga, Burn of the Everflame .\n\nThe Kindred's Curse saga comes to a pulsating conclusion as the Crowns find themselves caught between two deadly foes yet possessed of a secret that could change everything.\n\nPenn Cole is an internationally bestselling author of magical worlds, feisty women, and angsty romance. Her debut series, The Kindred’s Curse Saga, has been sold in sixteen languages to date. Before pursuing her lifelong dream of publishing, Penn had a prior career as an artist and attorney. Although she’s a Texas girl born and bred, she currently lives with her husband in France, where she can usually be found eating far too many pastries and trolling her readers on Discord. Penn Cole will be in conversation with Sophia Tuxford, content creator and co-host of The Girls Bathroom podcast. Sophia is book-obsessed and founder of Fully Booked, her digital, spoiler-free book club, which has over 68,000 members and continues to grow.", "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173690784", "tags": ["talk"], "id": "e457", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "museum-of-comedy", "title": "Charlie’s Character Comedy Course", "byline": "Create your own comedy characters and develop a 5-7 minute act in eight weeks with coaching from renowned character comedian, Charlie Vero-Martin.* Then perform it on the Museum of Comedy stage - home of Sketch Off…", "description": "Create your own comedy characters and develop a 5-7 minute act in eight weeks with coaching from renowned character comedian, Charlie Vero-Martin.* Then perform it on the Museum of Comedy stage - home of Sketch Off, the UK’s biggest sketch and character comedy competition! This course is open to new and experienced acts. Perfect for those looking to take their first steps into character comedy or wanting to find new approaches and creations. Through a range of techniques from improv, clowning, stand-up and theatre, Charlie will guide you in how to develop your act in a fun and supportive environment. You will also learn from other industry professionals. Previous special guests include Mark Silcox, Adam Larter, Alex Hardy and Su Mi. Participants have gone on to perform their acts regularly on the alt-comedy circuit, as part of award-winning shows, at the Edinburgh Fringe and compete in finals of comedy competitions. *Charlie is a comedian, actor, writer and improviser known for her four multi-character comedy shows. She was a Sketch Off and Funny Women Finalist with credits including BBC Scotland, Radio 4 and Hat Trick Productions. She has taught for Central School of Speech and Drama, Hoopla Impro and Soho Theatre. “Charlie delivered a masterclass on character comedy, providing a helpful range of tools and bespoke advice that helped each person on the course shine in their own way. Would recommend for anyone starting their character comedy journey” - Nadine Bailey, course alumni “Charlie uses a wealth of knowledge to create their own unique set of exercises drawn from multi disciplines like clowning, Laban, Lecoq, improvisation, voice and puppetry to access character and bring out the funny! It's a wonderful, safe space to be bold and imaginative.” - Barbara D’Alterio, course alumniCourse Dates: 28 Sept / 5, 12, 19, 26 Oct / 2, 9, 16 NovShowcase 17th November (tickets sold separately)", "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://www.museumofcomedy.com/charlies-character-comedy-course/", "tags": ["class"], "id": "e458", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "omnibus", "title": "ENGINE ROOM", "byline": "daring, new work in the first stages of development.", "description": "Engine Room puts you, the audience, at the heart of the creative process. Following the sharing you will be asked to complete a feedback form, with your comments directly influencing the next development of the pieces. Give feedback, offer ideas and discover the next generation of theatre before anyone else.\n\nArtists that have previously presented work include; Nouveau Riché , Vera Chok , The Queer House , Opia Collective , Cocoa Butter Club and Playing On .", "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://www.omnibus-clapham.org/whatson/engine-room", "tags": ["theatre"], "id": "e459", "venue_name": "Omnibus Theatre", "venue_area": "Clapham"}, {"venue_id": "oso-arts", "title": "OSO Actors' Studio Autumn 2026 - Acting Skills", "byline": "Your Instructor, Lucy Herring is a London-based actor, director and facilitator with a passion for comedy, immersive theatre and helping people discover confidence through performance.", "description": "A graduate from East 15 Acting School, Lucy works across theatre, education and large-scale immersive experiences, including Boomtown Festival, the International British Theatre School and has taught actor training for a wide range of community participants. Her workshops are energetic, playful and supportive, encouraging actors to take creative risks, connect truthfully with text and connect with the joy of performance.", "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173675849", "tags": ["class"], "price_min": 108.0, "price_max": 120.0, "id": "e460", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "oso-arts", "title": "OSO Actors' Studio Autumn 2026 - Scene Studies", "byline": "Your Instructor, Lucy Herring is a London-based actor, director and facilitator with a passion for comedy, immersive theatre and helping people discover confidence through performance.", "description": "A graduate from East 15 Acting School, Lucy works across theatre, education and large-scale immersive experiences, including Boomtown Festival, the International British Theatre School and has taught actor training for a wide range of community participants. Her workshops are energetic, playful and supportive, encouraging actors to take creative risks, connect truthfully with text and connect with the joy of performance.", "first_date": "2026-09-28", "last_date": "2026-09-30", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173675850", "tags": ["class"], "price_min": 108.0, "price_max": 120.0, "id": "e461", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "shakespeares-globe", "title": "Online CPD: Teaching Romeo and Juliet at KS4", "byline": "Join this Continuing Professional Development session to enhance your classroom teaching of Shakespeare’s epic tragedy Romeo and Juliet at Key Stage 4.", "description": "Aimed at Secondary English and Drama teachers, it will offer exciting techniques to engage with Shakespeare through active and creative approaches in the classroom. It provides teachers with a range of exciting activities to share with students to deepen their understanding of the play’s characters, context, themes and imagery, and develop their critical thinking skills.\n\nShakespeare’s words were written to be performed, so our CPDs focus on techniques that will help students approach and analyse his texts as plays for the stage. They are led by expert Globe Education Practitioners who specialise in teaching Shakespeare in performance.", "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://www.shakespearesglobe.com/whats-on/continuing-professional-development-teaching-romeo-and-juliet-at-ks4/", "tags": ["class"], "id": "e462", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "tabernacle", "title": "5x15: Live at The Tabernacle: September 2026", "byline": "5x15 returns to The Tabernacle in style with a stellar line-up of writers, thinkers and musicians, for an evening of captivating stories.", "description": "Join 5x15 as we kick off our autumn season in style, for an evening of storytelling with a stellar line-up of writers, thinkers and musicians, live at The Tabernacle. The 5x15 format is simple: 5 speakers, each with 15 minutes to change how we see the world. On September 28th, expect insightful stories about contemporary childhood and the power of asking questions; tales of love and family, poetry and pop music. Speakers Frank Cottrell-Boyce on childhood in contemporary Britain. Frank Cottrell-Boyce, Children's Laureate 2024–2026, is a multi award-winning children’s book author and screenwriter. Millions , his debut children's novel, won the prestigious CILIP Carnegie Medal. His books have been shortlisted for a multitude of prizes, including the Guardian Children’s Fiction Prize, the Whitbread Children’s Fiction Award, The Roald Dahl Funny Prize and the Blue Peter Book Award. His latest book, A British Childhood , tell the story of 21st century childhood in Britain, through real lives in homes, libraries, schools and streets across the country. Louise Doughty on love, family and a discovery made after losing her parents. Louise Doughty's novels include Platform Seven , recently filmed for ITV; Black Water , a New York Times Notable Book of the Year; the bestseller Apple Tree Yard , which was adapted for BBC One; and Whatever You Love , nominated for the Costa Novel Award and the Women's Prize for Fiction. She has been nominated for many other prizes including the Sunday Times Short Story Prize and the CWA Silver Dagger, along with creating and writing the hit BBC drama Crossfire . Her latest book, and first memoir, is On This Spot Fell One Tear of Love . Emma-Lee Moss on pop music and her quest to reconcile the Hong Konger and British sides of her inheritance. Emma-Lee Moss on is a writer and musician. As a writer, Emma-Lee has contributed to the Guardian, Vice, i-D, British GQ, Wired, the Good Journal and more. As a singer-songwriter performing under the name Emmy the Great, she released four studio albums, as well as several collaborations and soundtracks. She writes original songs for film, theatre, television, radio and community projects, and is interested in the way that songs interact with our everyday lives. Her first book, My Cantopop Nights: A Memoir in Songs , is a story of pop music, identity crisis and Hong Kong. Ben Okri on poetry, painting and storytelling. Sir Ben Okri OBE is a poet, novelist, and playwright. His novel, The Famished Road , won the Booker Prize in 1991. His works have been translated into 26 languages. He has been a Fellow Commoner in Creative Arts at Trinity College, Cambridge and is a Fellow of the Royal Society of Literature. Ben Okri's books have won numerous international prizes. His book Astonishing the Gods was chosen by the BBC as one of the most influential novels written over the last 300 years. His latest books are The True Artist Breaks Out of Jail and Waking the Warriors. Lani Watson on the power of asking questions. Lani Watson is a philosopher and Honorary Fellow at the University of Edinburgh and a world-leading expert in the philosophy of questions. She is fascinated by the art and science of asking questions and understanding how we can harness their power for good, as explored in her new book Q: The Hidden Power of Questions in a World that Wants Answers . Her research focuses on questioning in everyday life and she is passionate about applying her expertise to help everyone make the most of asking great questions, having worked with businesses and organisations around the world. Follow Lani on social media @thequestionsdr Tickets", "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://www.thetabernaclew11.com/events/2026/9/28/5x15-live-at-the-tabernacle-september-2026", "tags": ["spoken-word"], "id": "e463", "venue_name": "The Tabernacle", "venue_area": "Notting Hill"}, {"venue_id": "the-cockpit", "title": "Sam Glaser Quintet, Charlotte Keeffe + Sylvie Noble", "byline": "Sam Glaser Quintet Charlotte Keeffe (solo) Sylvie Noble [EMERGENCE]", "description": null, "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://www.thecockpit.org.uk/show/sam_glaser_quintet_charlotte_keeffe_sylvie_noble", "tags": ["concert"], "id": "e464", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "union-theatre", "title": "I, GOZILLA", "byline": "New Musical Theatre’, we invite you to come and watch I, Godzilla. I, Godzilla is a fantastic new musical from the mind of Alexander Morris.", "description": null, "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://uniontheatre.biz/show/i-gozilla/", "tags": ["musical"], "id": "e465", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "union-theatre", "title": "DECORUM", "byline": "New Musical Theatre’, we invite you to come and watch ‘Decorum’.", "description": null, "first_date": "2026-09-28", "last_date": "2026-09-28", "url": "https://uniontheatre.biz/show/decorum/", "tags": ["musical"], "id": "e466", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "wiltons", "title": "Tim Key: Loganberry", "byline": "Tim Key ( Alan Partridge, The Ballad of Wallis Island, Tim Key’s Late Night Poetry Programme ) again pops his suit on, plods about, in a brand-new show.", "description": "Bit gutted he’s old. Guzzling continental lager. Magnetic lol. Decent reviews for previous shows. Played a pigeon in Bong Joon Ho’s latest movie. Been on Richard Herring’s podcast. Book out: “L. A. Baby!”. Met Steffi Graf in 1998/9.\n\nThis show has poems in, and he’ll stamp and howl. Won the Perrier Award in 2009!", "first_date": "2026-09-28", "last_date": "2026-10-03", "url": "https://wiltons.org.uk/whats-on/tim-key-loganberry-2/", "tags": ["stand-up"], "id": "e467", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "barons-court", "title": "Animal Farm by George Orwell", "byline": "A revolution has come and gone. The animals are gone. Only Moses the Raven remains.", "description": "Through storytelling, physical theatre, live sound and a gallery of unforgettable characters, actor and writer Dov Citron reimagines George Orwell's timeless classic as a gripping one-man performance, told through the eyes of one of its most enigmatic figures.\n\nWitness the rise of hope, the corruption of power and the terrible cost of belief as Moses guides us through the events that changed Animal Farm forever. Darkly humorous, unsettling and deeply moving, this bold adaptation asks a question that feels more urgent than ever: When does a revolution stop serving the people and start serving itself?", "first_date": "2026-09-29", "last_date": "2026-10-03", "url": "https://www.baronscourttheatre.com/animalfarm", "tags": ["theatre"], "id": "e468", "venue_name": "Barons Court Theatre", "venue_area": "Barons Court"}, {"venue_id": "brockley-jack", "title": "Flock", "byline": "Robbie is 17. His sister Cel is 20. They’ve grown up in and out of the care system, different placements, different addresses, always finding their way back to each other.", "description": "Cel wants to go to university. Robbie wants them to finally live together in one place. Neither of those things seems too much to ask.\n\nWhat follows is Robbie’s journey back through every place he’s lived, every moment they shared, every argument and tender exchange, trying to understand how they got here, and whether any of it was his fault.\n\nLin Coghlan’s play is a portrait of grief, love and resilience told through the eyes of a young man who sees the world through the behaviour of birds: free, loyal, and pecking the shit out of each other. It is sad, funny, honest and, in the end, full of hope.", "first_date": "2026-09-29", "last_date": "2026-10-03", "url": "https://brockleyjack.co.uk/jackstudio-entry/flock/", "tags": ["theatre"], "id": "e469", "venue_name": "Brockley Jack Studio", "venue_area": "Crofton Park"}, {"venue_id": "drayton-arms", "title": "Squeak - A Rehearsed Reading", "byline": "Who falls down the stairs whilst carrying their hamster's cage? Lianne.", "description": "Lianne is angry that her boyfriend Dan is now spending more time with Squeak their hamster than her, mainly, because she is dead.\n\nFancy dinner and a show? Book at table at the Drayton Arms pub now and enjoy the pre-theatre menu before heading upstair", "first_date": "2026-09-29", "last_date": "2026-09-29", "url": "https://thedraytonarmstheatre.co.uk/squeak", "tags": ["theatre"], "id": "e470", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "etcetera", "title": "A Scattering: Scenes and Stories", "byline": "An hour of new work by emerging playwrights Isabel Margolis Brodsky, Eliana Hood, Faye Stainton, Jessica Steans-Gail, Solveig Nuin Stephens, and Izzy Van Houzen, with producer/dramaturg Erin Murray Quinlan.", "description": "16+, contains swearing and material concerning violence and disordered eating.", "first_date": "2026-09-29", "last_date": "2026-09-29", "url": "https://www.etceteratheatrecamden.com/events/a-scattering-scenes-and-stories", "tags": ["theatre"], "id": "e471", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "finborough", "title": "What The Animals Say", "byline": "Jimmy is a struggling actor chasing the break that never comes.", "description": "Eddie is a celebrity footballer who, despite being Protestant, is the captain of Celtic.\n\nAt first, they reconnect over football, Father Ted and the staunch Unionist culture they grew up in, but what begins as banter spirals into confrontation as buried resentments, betrayal and violence rise to the surface…", "first_date": "2026-09-29", "last_date": "2026-10-24", "url": "https://www.finboroughtheatre.co.uk/productions/what-the-animals-say", "tags": ["theatre"], "id": "e472", "venue_name": "Finborough Theatre", "venue_area": "Earl's Court"}, {"venue_id": "greenwich-theatre", "title": "My Name Is Rachel Corrie", "byline": "In March 2003, young American activist Rachel Corrie lost her life when she placed herself between an Israeli army bulldozer and a Palestinian home.", "description": "Composed from her own diaries and e-mails by Alan Rickman and Katherine Viner, this eloquent, moving and deeply personal play follows Rachel Corrie’s journey from teenage suburban life into the middle of the Israeli-Palestinian conflict. A collision of idealism, anger and wit, Rachel’s words are as relevant now as they have ever been.\n\nFor this major new production, Rachel Corrie will be played by Cassie Bradley (King Lear & Home, I’m Darling, National Theatre; Waterloo Road; Practical Magic 2).", "first_date": "2026-09-29", "last_date": "2026-10-17", "url": "https://greenwichtheatre.org.uk/events/my-name-is-rachel-corrie/", "tags": ["theatre"], "id": "e473", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "greenwich-theatre", "title": "The Ginger Giggle Club", "byline": "The Ginger Giggle Club The Ginger Giggle Club bringing comedy, community and laughter together, one giggle at a time!", "description": "The Ginger Giggle Club is super excited to bring our live comedy show to The Greenwich Theatre. With the best comics on the circuit, it is a night not to be missed. Lineup: Aurie Styla Dane", "first_date": "2026-09-29", "last_date": "2026-09-29", "url": "https://greenwichtheatre.org.uk/events/the-ginger-giggle-club/", "tags": ["stand-up", "comedy"], "id": "e474", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "pleasance-islington", "tit
