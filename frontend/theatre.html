last_date": "2026-10-10", "url": "https://theatre503.com/whats-on/chewing-gum-dreams/", "tags": ["theatre"], "id": "e140", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "underbelly-boulevard", "title": "WOODY SEZ HOOTENANNY", "byline": "Come, bring your instruments and sing and play along with the cast of WOODY SEZ !", "description": "Join us in the Bar immediately after the show on Thursday 10th & 17th of September . Free entry, no experience necessary; no experience is like it!\n\nFor a sneak peek at past Hootenanny’s and the show, check out the Woody Sez instagram here .", "first_date": "2026-09-10", "last_date": "2026-09-17", "url": "https://underbellyboulevard.com/tickets/woody-sez-hootenanny/", "tags": ["theatre", "concert"], "id": "e141", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "underbelly-boulevard", "title": "Mothman: A Romance Musical", "byline": "It’s 1943, and the Nazis are winning. Luckily, America has one last trick up its sleeve – a super soldier! But uh oh! A moth snuck into the machine! It’s mutating! It’s becoming a… mothman!?", "description": "Written and performed by Alex Franklin (as seen on Channel 4 and HBO Max) and Nikola McMurtrie ( Sketch Off 2025 third place, Funny Women shorts winner), with Alex Prescot (Musical Comedy Award Finalist) and Hudson Hughes (Double Sketch Off Finalist).\n\nPrepare for the ultimate romantic comedy musical that no one asked for: Mothman !", "first_date": "2026-09-10", "last_date": "2026-09-10", "url": "https://underbellyboulevard.com/tickets/mothman-a-romance-musical/", "tags": ["musical"], "id": "e142", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "arcola", "title": "The Turn of the Screw", "byline": "England. A remote country house. A young governess, hired to care for two children, begins what appears to be an idyllic new life – but something about the children hints at a darker presence.", "description": "Desperate to protect them from what she believes to be malevolent spirits, she finds herself descending into a world of ambiguity, leading to one far-reaching question: are the ghosts real… or are they a projection of something far more terrifying?\n\nA masterwork of psychological suspense and the inspiration for Susan Hill’s The Woman in Black , Henry James’ classic novella The Turn of the Screw is brought to life in this brand-new stage adaptation by Olivier Award-winning playwright Morgan Lloyd Malcolm ( Emilia ; The Wasp ).", "first_date": "2026-09-11", "last_date": "2026-10-10", "url": "https://www.arcolatheatre.com/event/the-turn-of-the-screw/", "tags": ["theatre"], "id": "e143", "venue_name": "Arcola Theatre", "venue_area": "Dalston, E8"}, {"venue_id": "bethnal-green-wmc", "title": "SEXQUISITE: SW PRIDE", "byline": "Sexquisite Events are an award winning performing arts company platforming the hottest sex worker artists, creating fierce, political and multi-disciplinary work.", "description": "This is our annual celebration of Sex Worker Pride, part of a collection of events in September to celebrate UK’s first official Sex Worker Pride, founded by Sexquisite and Riot Party. Join us as we come together to uplift sex workers and fight for our futures! <3\n\n✨ Variety of acts including pole, poetry, dance, drag, comedy, burlesque and more!", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://www.tickettailor.com/events/workingmens-club/2403672", "tags": ["cabaret"], "price_min": 13.0, "price_max": 16.0, "id": "e144", "venue_name": "Bethnal Green Working Men's Club", "venue_area": "Bethnal Green"}, {"venue_id": "bridge-house", "title": "White Light", "byline": "Jay is a fourteen-year-old Londoner, and his shit moustache is the only thing in his whole life he’s proud of. When a brand-new Lamborghini accelerates past his dad’s dingy flat, Jay asks himself, “why can’t I have that?”", "description": "Jay’s search for the truth will take him through a world of struggling teachers and wild conspiracy theories, accompanied by his best mate Param.\n\na new monologue by a Papatango and Off West End Award winning writer.", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://thebridgehousetheatre.co.uk/shows/white-light/", "tags": ["theatre"], "id": "e145", "venue_name": "The Bridge House Theatre", "venue_area": "Penge"}, {"venue_id": "brockley-jack", "title": "Sisterland", "byline": "Petra is selling her knickers, Lara is mid crisis and Michelle has gone so far off the rails it’s rural. During a girl’s night out, Lydia escapes to the toilet fearing the worst, whilst all Cassie wants is some toilet roll.", "description": "In the magical land of the club toilets, worlds collide. A revolving bathroom door invites us into the sanctuary of the loos, and the hours in which five women find themselves retreating there. As late-night turns to early morning, we bear witness to problems faced, appearances undone, and how female friendship can be built in moments of vulnerability.\n\nSisterland is a still life capture of women finding their place and becoming themselves in a room without expectations. Here, we embrace the blood, tears, sick, stains, expletives, howls, anthems, urges, confessions, ecstasies, miseries and complete wonderment of Womanhood, Girlhood, Sisterhood. Ready? Get ya glad rags on. Time to get liberated.", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://brockleyjack.co.uk/jackstudio-entry/sisterland/", "tags": ["theatre"], "id": "e146", "venue_name": "Brockley Jack Studio", "venue_area": "Crofton Park"}, {"venue_id": "cafe-oto", "title": "HEVLIGHT = A trio: Crystabel Efemena Riley / Nkisi / Seymour Wright", "byline": "High-Energy Visible (HEV) light penetrates deeper into the skin than UVA and UVB rays, reaching down into the lower layers of the dermis and hypodermis, inducing oxidative stress and breaking down structural protein.", "description": "During the late noughties Crystabel Efemena Riley toured Japan and Europe using drums, electronics and make-up in power-noise trio Maria and the Mirrors. This was the start of her interest in patterns on skins — human and drum. An interest in dimensional patterns existing on (and off) different skin surfaces, exploring the idea of 'care and uncare': layered skins, recycled drum skins, smetled sculptures, other metallics and electronics. Crystabel has been a long-term collaborator with Sue Lynch who welcomed her into the Horse Improvised Music Club and later played in the London Improvisers Orchestra. She is currently working on the multi-format duo project @xcrswx with Seymour Wright, together they created the sounds for Edward George’s Black Atlas film at the Warburg Institute.\n\nNkisi is the pseudonym of Melika Ngombe Kolongo, whose activities as a producer, live musician, DJ and curator are channels for an ongoing inquiry into sound as a tool of communication beyond the purely lingual.", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://www.cafeoto.co.uk/events/hevlight/", "tags": ["concert"], "id": "e147", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "chickenshed", "title": "Planet Play", "byline": "Planet Play is a warm, sensory experience designed especially for babies and toddlers aged 0–3.", "description": "Through soft sounds, gentle movement and immersive performance, we create a magical space where the youngest members of our community can explore, wonder and play.\n\nGrown-ups go free — just book a ticket for yourself and bring your little one along. The perfect weekly ritual or one-off treat.", "first_date": "2026-09-11", "last_date": "2026-10-16", "url": "https://www.chickenshed.org.uk/events/planet-play-autumn-2026", "tags": ["theatre", "immersive"], "id": "e148", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "etcetera", "title": "10A: The Fitting Room", "byline": "Based on my personal story, Liz defines herself as a raging feminist. Somewhere between fitting first bras and nursing bras, she ends up in an abusive relationship.", "description": "That was definitely not on her bingo list. The lingerie fitting room is an exclusively female space, and through meeting and helping other women, Liz redefines her iden-titty. It's feminist, and despite the heavy themes- a little cheeky. Come take a peek behind the curtain!", "first_date": "2026-09-11", "last_date": "2026-09-12", "url": "https://www.etceteratheatrecamden.com/events/10a-the-fitting-room", "tags": ["theatre"], "id": "e149", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "immersive-rumours", "title": "Jill's Tupperware Party", "byline": "You’re invited to Jill’s Tupperware Party. A perfect world where plastic lids click, smiles almost never falter and microwaves hum with divine purpose.", "description": "Jill’s Tupperware Party is an auspicious afternoon where sales-records, hearts and bones could all be broken.\n\nThis interactive comedy horror blends retro suburban camp with B-movie terror all sealed in a pastel fantasy. Think Stepford Wives meets Mars Attack.", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://underbellyboulevard.com/tickets/jills-tupperware-party/", "tags": ["immersive"], "id": "e150", "venue_name": "Immersive Rumours", "venue_area": "London"}, {"venue_id": "new-diorama", "title": "AMPLIFY", "byline": "Created from scratch over a two-week process, AMPLIFY is a creative collaboration between playwright Molly Taylor (Young Vic, Almeida Theatre) and Kestrel’s alumni acting company .", "description": "Kestrel alumni are men the Kestrel team met when they were in prison or at risk of entering it. A significant part of Kestrel’s work is centred on supporting alumni to build sustainable creative careers on the outside, which includes developing original, devised, productions that centre the creative voices and artistry of the men involved.\n\nDevised by a cast of Kestrel alumni in collaboration with playwright Molly Taylor .", "first_date": "2026-09-11", "last_date": "2026-09-12", "url": "https://newdiorama.com/whats-on/amplify", "tags": ["theatre"], "id": "e151", "venue_name": "New Diorama Theatre", "venue_area": "Regent's Place"}, {"venue_id": "omnibus", "title": "SO, THIS IS WHAT HAPPENED", "byline": "So, This Is What Happened is back! Our popular storytelling night returns.", "description": "Connection is more important than ever, so we invite you to laugh, cry and celebrate stories from the lives of real people.\n\nHe has made a bucket load of mistakes in life, which seem to have resulted in some entertaining stories - he is still trying to work out why people listen to him, but whilst unable to find an answer, he is eternally grateful!", "first_date": "2026-09-11", "last_date": "2026-12-11", "url": "https://www.omnibus-clapham.org/whatson/so%2C-this-is-what-happened", "tags": ["spoken-word"], "id": "e152", "venue_name": "Omnibus Theatre", "venue_area": "Clapham"}, {"venue_id": "riverside-studios", "title": "Prophets (An R&D at Riverside Sharing)", "byline": "PROPHETS is a contemporary British-Nigerian drama following two young people forced to re-examine their worldview in the wake of a sudden loss.", "description": "Propelled by conflicting philosophies, the story tracks the friction between a charismatic young man wrestling to find a purpose bigger than himself, and his fiercely brilliant confidante who must confront her own convictions to help them both survive. Creative Team:Daniel Abeshin - WriterGloria Akpoke - DirectorElysian Fields - ProducerJessica Fowler - ProducerGwent Odai - Assistant Producer Cast:Nathaniel Ekundayo as DaySophia Tosin-Talabi as LamiNicole Kilama as Bisi", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://riversidestudios.co.uk/whats-on/uqU-prophets-an-rd-at-riverside-sharing/", "tags": ["theatre"], "id": "e153", "venue_name": "Riverside Studios", "venue_area": "Hammersmith"}, {"venue_id": "royal-court", "title": "Book Club", "byline": "To celebrate our 70th Anniversary year, we’re reading a groundbreaking play from the Royal Court’s history every month – and then hosting a Book Club to chat about the play together.", "description": "We will have copies of each month’s script available in our Box Office to drop in and read in advance – just please don’t take the book away with you!\n\nThe play for Book Club in September is: Girls and Boys by Dennis Kelly", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://royalcourttheatre.com/events/book-club", "tags": ["theatre", "talk"], "id": "e154", "venue_name": "Royal Court", "venue_area": "Sloane Square"}, {"venue_id": "royal-vauxhall-tavern", "title": "FRIDAY CLUB NIGHT AT THE RVT", "byline": "If you want great music in a great venue, then this is the night for you… DJ Phil Marriott will be playing the best funky house music in town at the iconic Royal Vauxhall Tavern to give you a fantastic Friday night of clubbing.", "description": "Phil is one of the most popular DJs on the London scene, and a frequent guest here at The RVT.", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://www.vauxhalltavern.com/events/event/friday-club-night-2/?oid=6634", "tags": ["cabaret"], "price_min": 8.0, "price_max": 8.0, "id": "e155", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "sadlers-wells", "title": "Pre-show talk with Natalie Haynes", "byline": "Join us for a free talk with Natalie Haynes , broadcaster and critically acclaimed author of Pandora’s Jar: Women in the Greek Myths , named as one of Artistic Director Tamara Rojo’s influences for Mere Mortals by San Francisco Ballet.", "description": "Friday 11 September 6pm – 6:30pm Sadler’s Wells Theatre\n\nFree event to same performance ticket holders San Francisco Ballet – Mere Mortals", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://www.sadlerswells.com/whats-on/pre-show-talk-with-natalie-haynes/", "tags": ["dance", "talk"], "id": "e156", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "sadlers-wells", "title": "London Dance Collaborative and Grad Pro: A Selection of New Works", "byline": "The UK is home to one of the world’s most vibrant dance communities, where exceptional artists are given the space and support to develop, experiment and shape the future of the art form.", "description": "This season, London Dance Collaborative (LDC) and Grad Pro come together for two programmes celebrating the versatility, strength and artistry of a new generation of dance.\n\nThe two programmes feature innovative works by choreographers from LDC’s Collab Incubators alongside several new works by Aaron Thao , including the world premiere of Lady M . Spanning distinct choreographic voices and approaches, the programme dynamically showcases artists exploring new ideas and forging creative collaborations among freelance dancers in London.", "first_date": "2026-09-11", "last_date": "2026-09-12", "url": "https://www.sadlerswells.com/whats-on/london-dance-collaborative-and-grad-pro/", "tags": ["dance"], "id": "e157", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "shakespeares-globe", "title": "Shakespeare's True Crimes Walking Tour", "byline": "Explore the streets around Shakespeare’s Globe with our expert Guides on our new Shakespeare’s True Crimes Walking Tour and discover the intriguing criminal history of the Bankside area and its people , including Shakespeare himself.", "description": "As you wander along the Thames, you’ll learn why Shakespeare was summoned to appear in court no fewer than three times ; and why duels , violence and even murder between rival actors and playwrights, including the likes of Christopher Marlowe and Ben Jonson, were more common than you’d imagine in Early Modern England.\n\nTickets include entry to our exhibition , where visitors can discover the history and magic behind Shakespeare’s Globe.", "first_date": "2026-09-11", "last_date": "2027-01-30", "url": "https://www.shakespearesglobe.com/whats-on/shakespeares-true-crimes-walking-tour/", "tags": ["theatre", "talk"], "id": "e158", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "southbank-centre", "title": "Kate Crawford & Vladan Joler: Anatomy of an AI System", "byline": "Investigate the vast, intricate web of resources, labour and data behind an Amazon Echo speaker with a large-scale map visualising every detail.", "description": "This award-winning artwork casts a new light on the planetary scale of AI, exposing the huge, interconnected infrastructure that underpins artificial intelligence.\n\nThe richly detailed map and accompanying essay tell the story of the ‘birth, life and death’ of a single Amazon Echo unit, representing the impact of the creation, use and disposal of just one device.", "first_date": "2026-09-11", "last_date": "2026-09-13", "url": "https://www.southbankcentre.co.uk/whats-on/kate-crawford-vladan-joler-anatomy-of-an-ai-system/", "tags": ["theatre", "talk"], "id": "e159", "venue_name": "Southbank Centre", "venue_area": "South Bank"}, {"venue_id": "the-cockpit", "title": "The Dunwich Horror: An Opera", "byline": "A rural town. A dark summoning. A hunger that destroys all. Can you survive the Dunwich Horror?", "description": "Performed as an old fashioned picture show, The Dunwich Horror: An Opera is an immersion into life in an isolated village being terrorized by a force it doesn’t understand. Performed in music, soundcape, and song, Jen Hazel‘s original score will bring you into HP Lovecraft’s tale with a strong seasoning of American vernacular music and her native New England folk flavouring. Storyteller Laura Sampson and TL Wiswell return from the Dreamlands shadow puppet shows to bring this tale of cosmic horror to life. Do you dare enter a world of party line phones, dusty grimoires, and extradimensional beings with a thirst for blood? In the end, your voice may be needed to set Dunwich free.\n\nhttps://www.tete-a-tete.org.uk/event/the-dunwich-horror-an-opera/", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://www.thecockpit.org.uk/show/the_dunwich_horror_an_opera", "tags": ["opera", "immersive"], "id": "e160", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "The Rag Animals", "byline": "At a pub folk jam, a story is being told. It bends and shifts as audience and musicians alike stoke its fire.", "description": "The story is \"The Rag Animals\", an exploration of belonging in a time of extraction. \"The Rag Animals\" is a radical contemporary classical piece which explores folk traditions including British Morris, Gule Wamkulu (Malawian and Zambian Traditions), and the Anishinaabe Thanksgiving Address. Its central character, a mysterious beast called \"plastic head\", asks how these traditions maintain connection to land and community despite the extractive systems imposed by the \"rich man\". Audience participation becomes part of the work, continuing the folk tradition of music evolving as it is shared.\n\nThe piece comprises of notated music alongside facilitated audience participation, performed by a 5-piece multi-instrumentalist ensemble (Vocals; cello; piano/baritone saxophone/clarinet; flute/recorder; percussion/bass). The performance weaves composed material with stories, musical ideas and contributions offered by the audience, guided by the ensemble all of whom are experienced facilitators.", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://www.thecockpit.org.uk/show/the_rag_animals", "tags": ["theatre", "concert"], "id": "e161", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-glitch", "title": "Monstrous Comedy (11 Sept)", "byline": "Monstrous Comedy (11 Sept) – The Glitch, Fri 11 Sep 2026 - Noises From The Attic are thrilled to be hosting a night of fantabulous improv comedy…", "description": "Monstrous Comedy (11 Sept) – The Glitch, Fri 11 Sep 2026 - Noises From The Attic are thrilled to be hosting a night of fantabulous improv comedy, featuring top teams from across the London improv scene.So come on down and laugh at the legally required times. You won't (/are legally required not to) regret it.Follow us for more ...", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://www.tickettailor.com/events/vaultcreativearts/2403499", "tags": ["comedy"], "id": "e162", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "underbelly-boulevard", "title": "Jill’s Tupperware Party", "byline": "You’re invited to Jill’s Tupperware Party . A perfect world where plastic lids click, smiles almost never falter and microwaves hum with divine purpose.", "description": "Jill’s Tupperware Party is an auspicious afternoon where sales-records, hearts and bones could all be broken.\n\nThis interactive comedy horror blends retro suburban camp with B-movie terror all sealed in a pastel fantasy. Think Stepford Wives meets Mars Attack .\n\nThis show is part of Fringe Fix – a cracking handpicked selection of shows we think you’ll love from this year’s Edinburgh Festival Fringe.", "first_date": "2026-09-11", "last_date": "2026-09-11", "url": "https://underbellyboulevard.com/tickets/jills-tupperware-party/", "tags": ["theatre", "comedy"], "id": "e163", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "underbelly-boulevard", "title": "Bar Icons", "byline": "Join “ absolute tornado of a cabaret star ” Aidan Sadler accompanied by Soho piano virtuoso Natasha Panas injecting major icon vibes into our bar.", "description": "Expect bops, bangers and bathroom belters, and request any artist from any era. Singing along is highly encouraged!\n\nTickets are free but be sure to book to secure your place.", "first_date": "2026-09-11", "last_date": "2026-09-25", "url": "https://underbellyboulevard.com/tickets/bar-icons-2026/", "tags": ["cabaret"], "id": "e164", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "woolwich-works", "title": "The Comedy Store - Woolwich (Sept. 2026)", "byline": "Dave Fulton has a deceptively laid back stage manner that disguises a raw aggression.", "description": "This is unmissable comedy from one of the most dynamic and innovative comedians on the comedy circuit. His mother would never have thought it possible from someone who holds a Masters in Music Composition.\n\nMarkus Birdman is an original and highly talented stand up. He has written and performed thirteen Edinburgh Festival solo shows. He often incorporates visual artwork & animations in his comedy performances. After attending several art schools, Markus became a Graffiti Artist, Muralist, Performance Poet and Glastonbury Festival Poetry Slam Champion.\n\nLily is one of the most exciting up and coming voices in comedy in the UK and was BBC New Comedy Award Finalist 2021. She is a series regular on The Stand Up Sketch Show and her credits include Period Dramas (BBC3), The Joy Of Missing Out (All4), The Fake Podcast show (E4) and Comedy Central Live.", "first_date": "2026-09-11", "last_date": "2026-09-26", "url": "https://www.woolwich.works/events/the-comedy-store-sept-26", "tags": ["stand-up"], "id": "e165", "venue_name": "Woolwich Works", "venue_area": "Woolwich"}, {"venue_id": "bridge-house", "title": "Sisterland", "byline": "Petra is selling her knickers, Lara is mid crisis and Michelle has gone so far off the rails it’s rural.", "description": "During a girl’s night out, Lydia escapes to the toilet fearing the worst, whilst all Cassie wants is some toilet roll. In the magical land of the club toilets; worlds collide. A revolving bathroom door invites us into the sanctuary of the loos, and the hours in which five women find themselves retreating there. As late-night turns to early morning, we bear witness to problems faced, appearances undone, and how female friendship can be built in moments of vulnerability.\n\nBeginning as a performance art piece at Rose Bruford exploring the intersection of public bathrooms and confessional theatre, ‘Sisterland’ later debuted as a 10-minute short play as a part of The Union Shorts, before moving on to show at Greenwich Theatre with Off Mainstage. In 2026, ‘Sisterland’ joined the INK Festival programme as a rehearsed reading. As the piece continues to develop and grow it remains loyal to the real-life experience of women and their connection with one another.", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://thebridgehousetheatre.co.uk/shows/sisterland/", "tags": ["theatre"], "id": "e166", "venue_name": "The Bridge House Theatre", "venue_area": "Penge"}, {"venue_id": "brixton-house", "title": "Housemates 2026: House Parties", "byline": "A series of intimate, artist-curated after-hours gatherings hosted by some of the artists from this year’s festival.", "description": "Each party reflects the personalities, influences, and communities of its hosts—offering a chance to experience the festival from the inside out. No two nights are the same, but every one is designed for connection, discovery, and celebrating together long after the main programme ends.", "first_date": "2026-09-12", "last_date": "2026-09-19", "url": "https://brixtonhouse.co.uk/shows/housemates-2026-house-parties/", "tags": ["social"], "id": "e167", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "brockley-jack", "title": "White Light", "byline": "Jay is a fourteen-year-old Londoner, and his shit moustache is the only thing in his whole life he’s proud of. When a brand-new Lamborghini accelerates past his dad’s dingy flat, Jay asks himself, “why can’t I have that?”", "description": "Jay’s search for the truth will take him through a world of struggling teachers and wild conspiracy theories, accompanied by his best mate Param.\n\na new monologue by Papatango and Off West End Award winning writer Tom Powell.", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://brockleyjack.co.uk/jackstudio-entry/white-light/", "tags": ["theatre"], "id": "e168", "venue_name": "Brockley Jack Studio", "venue_area": "Crofton Park"}, {"venue_id": "cafe-oto", "title": "Gleaming World Unit", "byline": "Belfast-based drummer and improvisor Stephen Davis is one of the most sought-after musicians and collaborators working today.", "description": "He is a member of Anthony Braxton’s ‘The New Standard’ and the Alexander Hawkins Trio, and has worked with Marc Ribot, Evan Parker, Kris Davis, Paul Dunmall, Django Bates, and Van Morrison to name but a few. Davis made his name in the improvising trio Bourne, Davis, Kane, whose debut album Lost Something (Edition Records, 2008) prompted The Guardian's John Fordham to acknowledge the trio's \"world class status.\"\n\nHis new project arrived in the form of ‘Gleaming World Unit’ , marking a new chapter for Davis, and a first international label release (577 Records, New York City). With a title drawing on sentiments from a letter written by Seamus Heaney, he was inspired by time spent in the Wicklow mountains, being submerged in forests for often hours at a time.\n\nBeing surrounded by offerings of the compositional power of the landscape led to a brand-new approach to tune-writing, where improvisation and composition are purposefully blurred, inviting the listener to make their own assessment. Ghosts, forests, old photographs and conversations with elders all fed into a novel sound blending elements of free jazz, punk, contemporary classical, electronics, and art-music.", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://www.cafeoto.co.uk/events/gleaming-world-unit/", "tags": ["concert"], "id": "e169", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "chickenshed", "title": "Tales from the Shed", "byline": "Tales from the Shed is Chickenshed's beloved Saturday morning show for babies, toddlers and young children. Each week, our brilliant performers bring a brand new story to life — full of music, movement, silliness and warmth.", "description": "With two shows every Saturday (10am and 11:30am), it's the perfect start to the weekend for little ones and grown-ups alike. No experience needed — just come along, settle in and let the story begin.\n\nEach carefully crafted Tales from the Shed show is packed with educational songs, movement , and language games , designed to support brain development and early learning in young children. We celebrate diversity and inclusion in everything we do, creating a space where all children - no matter their background or ability can take part and feel the magic of theatre.", "first_date": "2026-09-12", "last_date": "2026-10-24", "url": "https://www.chickenshed.org.uk/events/tales-from-the-shed-autumn-2026", "tags": ["theatre"], "id": "e170", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "etcetera", "title": "Wish", "byline": "As seen at Edinburgh Fringe, award-winning magic show Wish returns to Etcetera Theatre!", "description": "The show delivers everything you expect from world-class magic: mind-reading, impossible objects, and highly interactive illusions; while introducing unique magical eﬀects from ancient Chinese, never seen outside of China.\n\nA feel-good and captivating show, the show oﬀers an evening of laughter, storytelling, and unforgettable magic audiences won’t have seen before and anywhere else.", "first_date": "2026-09-12", "last_date": "2026-09-24", "url": "https://www.etceteratheatrecamden.com/events/wish2", "tags": ["magic"], "id": "e171", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "jacksons-lane", "title": "Open House", "byline": "Drop in to explore our unique history through tours, exhibitions and more.", "description": "Oral History Listening Station: Hear the Stories that shaped us (Mezzanine) Our Oral Histories project brought together voices from across the decades, from founders and performers to staff, volunteers and community members, all sharing the memories that shaped who we are today. These recordings offer a rare glimpse into our past. Listen and discover the heart, humour and history that have defined Jacksons Lane for 50 years.\n\nTours will be available at these times – Sat 19 Sep – 3pm-4pm Sun 20 Sep – 1pm-2pm\n\nNo need to book just pop along and have a look around.", "first_date": "2026-09-12", "last_date": "2026-09-20", "url": "https://www.jacksonslane.org.uk/events/open-house/", "tags": ["exhibition", "talk"], "id": "e172", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "little-angel", "title": "The Pied Piper: A Rat's Tale", "byline": "You think know the story of the Pied Piper of Hamelin ?— But do you?", "description": "Here’s the tale of Horatio, the brave little rat behind the legend. When Horatio escapes the dull life of an ordinary river rat for the sights, sounds and smells of Hamelin, he soon finds himself caught up in a whirlwind of adventure.\n\nHis imprisonment sparks a rat invasion, the arrival of the mysterious Pied Piper, and a heroic tale waiting to be told. With puppetry, storytelling and original music, The Pied Piper : A Rat’s Tale is a funny and imaginative family show that reveals the story behind the story.", "first_date": "2026-09-12", "last_date": "2026-11-07", "url": "https://www.littleangeltheatre.com/whats-on/the-pied-piper-a-rats-tale/", "tags": ["puppetry", "theatre"], "id": "e173", "venue_name": "Little Angel Theatre", "venue_area": "Islington"}, {"venue_id": "lyric-hammersmith", "title": "On Your Bike Baffo", "byline": "Get ready for big laughs as the lovable, bumbling Baffo returns in a riotous, cycle-themed clown show.", "description": "Wondering how to blow up a tyre or ride a bike? Baffo’s got you covered… sort of. Expect wild stunts, ridiculous feats and plenty of belly laughs, all set to live music. It’s pure fun from the starting line to the finish.\n\nFor all our productions, we offer one complimentary carer/companion seat for every full price access ticket booked.", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://lyric.co.uk/shows/on-your-bike-baffo/", "tags": ["circus"], "id": "e174", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "lyric-hammersmith", "title": "Little Lyric", "byline": "Our Little Lyric programme features some of the very best children's shows from family-beloved theatre companies, with new shows on Saturdays and half term residencies.", "description": null, "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://lyric.co.uk/seasons/little-lyric/", "tags": ["theatre"], "id": "e175", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "oso-arts", "title": "Summer Sounds Party", "byline": "Join us for a stylish evening of live music, dancing, and celebration as we unveil the OSO’s stunning newly laid theatre floor.", "description": "Beginning with a welcome drink, and elegant canapés generously provided by Rick Stein Barnes, guests will enjoy an exciting evening featuring live music from four bands, with DJ sets between performances to keep the dance floor alive throughout the night.\n\nThe line-up includes traditional Irish music from Ri Rua, and songs from the musicals by Sofia Kirwan-Baez. Plus, playing back to back bangers, Camille Robinson & the Barnes Gold, and The Hairy South.\n\nThis special evening is an important fundraiser for the OSO following our essential August closure to replace the theatre floor, work that was urgently needed but resulted in a significant loss of income for our charity. By joining us, guests will not only enjoy a wonderful evening of entertainment and community spirit, but also directly support the future of the OSO and help keep our theatre thriving.", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173674355", "tags": ["concert"], "price_min": 31.5, "price_max": 240.0, "id": "e176", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "park-theatre", "title": "Shostakovich in Seven Parts", "byline": "Across fifteen quartets written over nearly four decades, Shostakovich created one of the most remarkable bodies of chamber music of the 20th century…", "description": "Across fifteen quartets written over nearly four decades, Shostakovich created one of the most remarkable bodies of chamber music of the 20th century — music that can be playful and grotesque, tender and lyrical, fiercely energetic and profoundly tragic.\n\nShostakovich in Seven Parts brings together seven moments from across the quartets, offering a vivid portrait of the composer and the many faces of his music. From youthful exuberance and biting satire to haunting introspection and the devastating intensity of his late works, each part reveals a different aspect of Shostakovich’s unique musical voice.\n\nPerformed by the Carducci Quartet, whose long association with Shostakovich includes their acclaimed complete cycle of the fifteen quartets, this is an invitation to experience some of the composer’s most powerful, surprising and unforgettable music in a single 45-minute programme.", "first_date": "2026-09-12", "last_date": "2026-09-25", "url": "https://parktheatre.co.uk/events/shostakovich-in-seven-parts/", "tags": ["concert"], "id": "e177", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "roundhouse", "title": "Bellaire + Dublon + Jeremy Underground", "byline": "You can access your ticket once purchased by logging in to your ticket wallet with your Roundhouse account login details. For more information, see our FAQs .", "description": "*The restoration levy supports all of the Roundhouse’s charitable objectives, for example work with artists, young people, and the wider community. It helps us preserve our historic venue, deliver bold creative programmes, and invest in a sustainable, innovative future. This support allows us to direct funds where they have the greatest impact.", "first_date": "2026-09-12", "last_date": "2026-09-26", "url": "https://www.roundhouse.org.uk/whats-on/bellaire/", "tags": ["concert"], "id": "e178", "venue_name": "Roundhouse", "venue_area": "Chalk Farm"}, {"venue_id": "royal-ballet-opera", "title": "I would be here if I could: The Mirrorbox", "byline": "An interactive installation at the Royal Opera House sharing messages from people with ME and Long Covid who can no longer visit places they love.", "description": "Listen, reflect and leave a postcard in response. A free, interactive experience exploring connection, absence and accessibility.\n\nOpen to the public between 12pm and 6pm. The exhibition will open early at 11am on Sunday 13th September for visitors with access needs.\n\nThe Mirrorbox messages recall special times and places often inaccessible to the sender. The installation is not suitable for children under 12 or for those who are emotionally vulnerable.", "first_date": "2026-09-12", "last_date": "2026-09-13", "url": "https://www.rbo.org.uk/production/i-would-be-here-if-i-could-the-mirrorbox", "tags": ["dance"], "id": "e179", "venue_name": "Royal Ballet and Opera", "venue_area": "Covent Garden"}, {"venue_id": "royal-ballet-opera", "title": "Holding Light", "byline": "Award-winning company Fallen Angels Dance Theatre, which supports those recovering from addiction or mental health adversity, brings new works to the Clore Studio.", "description": "Fallen Angels Dance Theatre (FADT) returns to the Royal Opera House with a new creation in September, following the sell-out success of 2023’s Traces through Time .\n\nHolding Light , three distinct perspectives rooted in personal narratives, where light becomes a metaphor for recovery, awakening an embodied sense of growth and hope.", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://www.rbo.org.uk/production/holding-light-fallen-angels-dance-theatre", "tags": ["dance"], "id": "e180", "venue_name": "Royal Ballet and Opera", "venue_area": "Covent Garden"}, {"venue_id": "royal-vauxhall-tavern", "title": "CHEER UP!", "byline": "As 30 years ago Spice Girls released their debut single “Wannabe” which would go on to sell millions across the globe with the single topping the charts in over 20 countries including the UK & USA.", "description": "The world stood still as we welcomed Ginger, Scary, Sporty, Baby & Posh.\n\nTo celebrate this monumental moment in music join us as we “Spice Up Your Life” on Saturday 12th September with a “Cheer Up Party” playing all your Spice Girls favourites, the singles, album track highlights as well as solo Spice classic from Geri, Mel B, Mel C, Emma and Victoria. It’s a night of “Girl Power” so as well as Spice Girls tracks expect to hear all your other artist faves including Kylie, Madonna, Lady Gaga, Britney, Girls Aloud, Sugababes, Cher, All Saints plus more. You won’t want to miss this with early bird tickets OUT NOW.", "first_date": "2026-09-12", "last_date": "2026-10-10", "url": "https://www.vauxhalltavern.com/events/event/cheer-up-9/?oid=6517", "tags": ["cabaret"], "id": "e181", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "sadlers-wells", "title": "The Dance Floor is Black: Black to the Future Weekend", "byline": "As part of The Music is Black Festival , we’re throwing open our doors for you to come dance with us and soak in the vibes with The Dance Floor is Black .", "description": "Each weekend of the festival an incredible choreographer curates a club night responding to different genres of Black British music.\n\nBlack to the Future is rooted in ideas of futurism and possibility, celebrating musicians and creatives that are expanding what contemporary Black music and culture can sound and feel like.", "first_date": "2026-09-12", "last_date": "2026-09-13", "url": "https://www.sadlerswells.com/whats-on/the-dance-floor-is-black-black-to-the-future-weekend/", "tags": ["dance"], "id": "e182", "venue_name": "Sadler's Wells", "venue_area": "Angel"}, {"venue_id": "shakespeares-globe", "title": "Macbeth: GCSE Revision Boost", "byline": "Supercharge your revision of Shakespeare’s bloody tragedy Macbeth in this practical GCSE Boost day designed for ages 14-16, who have already studied the play.", "description": "Start your day with a peek inside the Globe Theatre and hear about the history of Shakespeare’s London and the theatrical world he created.\n\nThen, in one of our rehearsal studios, jump into an interactive workshop led by a highly experienced education practitioner and explore the play’s language, characters and themes using a range of acting techniques and drama activities. You’ll develop an in-depth understanding of the play and leave a practical toolkit that you can carry forward into your study and exams.", "first_date": "2026-09-12", "last_date": "2027-03-06", "url": "https://www.shakespearesglobe.com/whats-on/macbeth-gcse-revision-boost/", "tags": ["theatre", "class"], "id": "e183", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "the-cockpit", "title": "The Trial of the Four", "byline": "Building on three acclaimed previous productions at Tête à Tête — Buddha and the Monkey King (2020), The Monk of the River (2021), and The Monster of Gao Village (2023) — we are proud to present the new opera \"The Trial of the Four\".", "description": "The Trial of the Four is a contemporary opera adapted from the classic Chinese novel Journey to the West. It follows Tang Sanzang (Xuanzang) and his three disciples as they encounter temptation midway through their westward pilgrimage. Each of the four travellers, with their distinct personalities and abilities, faces the test of their sincerity and commitment in different ways.\n\nThe work masterfully fuses Eastern and Western musical traditions, blending traditional Chinese instruments and musical styles with Western orchestral elements and compositional techniques. Featuring beautiful traditional Chinese costumes, rich vocal ensembles, and symbolic hand props, this is a visually and musically captivating production.", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://www.thecockpit.org.uk/show/the_trial_of_the_four", "tags": ["opera"], "id": "e184", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-glitch", "title": "The Confessions of a Mediocrely Bad Woman", "byline": "Lonely? Depressed? Worried you're fundamentally unloveable? Join Mary, famed middle class failure and allegedly the worst lesbian on earth, to confess your sins. We promise you she's worse.", "description": "Mary is jobless (sort of), friendless (sort of) has an insufferable mother and a girlfriend who’s not actually her girlfriend. Join her on a self-loathing mission to be the funniest person in the room (and maybe lose a bit of weight in the process) as she confesses her deepest darkest sins to you, the audience. The debut play by Phoebe Ivinson is one woman’s journey to discover what she truly can’t live without. Performed earlier this year by Lily af Sandeberg at Theatre503 and Playhouse East, ‘The Confessions of a Mediocrely Bad Woman’ returns in a new, longer (you’re welcome) version directed by India McNicholas.\n\nDirected by: India McNicholas Performed by: Lily af Sandeberg Written by: Phoebe Ivinson Produced by: Lily af Sandeberg Assistant Producer: Caroline Gough Poster Designer: Kirstie Pope", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://www.tickettailor.com/events/vaultcreativearts/2359229", "tags": ["stand-up"], "id": "e185", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "the-space", "title": "DKW: Space Slam", "byline": null, "description": null, "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://space.org.uk/event/dkw-space-slam/", "tags": ["spoken-word"], "id": "e186", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "the-space", "title": "Tango E14 at the Roof Garden", "byline": "Tango E14 is endorsed by La Asociación de Maestros, Bailarines y Coreografos de Tango Argentino (Association of Teachers, Dancers and Choreographers of Argentine Tango) Tango E14 is a member of The UK Argentine Tango Association", "description": null, "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://space.org.uk/event/tango-e14-at-the-roof-garden/", "tags": ["dance"], "id": "e187", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "underbelly-boulevard", "title": "Ted Hill: PowerPoindexter", "byline": "Ted Hill invites you inside his strange and chaotic mind. Expect high-energy jokes, ridiculous visual effects and (funny) graphs.", "description": "Ted’s always been weird, but now he has a new puzzle to solve: what kind of weird does he want to be? You’ll never see a sillier slideshow…\n\nBGT Golden Buzzer & Finalist 2026, ISH Edinburgh Comedy Award for Best Show nominee 2024, British Comedy Guide Recommended Show 2022, 2024, 2025.\n\nThis show is part of Fringe Fix – a cracking handpicked selection of shows we think you’ll love from this year’s Edinburgh Festival Fringe.", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://underbellyboulevard.com/tickets/ted-hill-powerpoindexter/", "tags": ["stand-up"], "id": "e188", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "woolwich-works", "title": "Woolwich Carnival 2026", "byline": "This year, under the powerful theme \"Our Voices, Our Future,\" we are bringing together the absolute best of Woolwich’s vibrant culture.", "description": "It is a day dedicated to celebrating our community's rich diversity, while empowering our younger generation to lead the carnival spirit into the future.\n\nExpect a sensational day filled with live music, energetic dance, delicious food, and our spectacular community carnival parade. Even better, we have mapped out a brand-new parade route that finishes with a massive celebration right in the heart of the Woolwich Works Courtyard.\n\nOur outdoor stage at Woolwich Works will burst into life at 3:00 PM to welcome the parade with a high-energy reception. From there, the party keeps going until 8:00 PM with an incredible lineup of local musicians, dancers, and community performers.", "first_date": "2026-09-12", "last_date": "2026-09-12", "url": "https://www.woolwich.works/events/woolwich-carnival-2026", "tags": ["concert", "dance"], "id": "e189", "venue_name": "Woolwich Works", "venue_area": "Woolwich"}, {"venue_id": "cafe-oto", "title": "\"Ritual for John Coltrane\" – Trance Map (Evan Parker + Matt Wright) + Filipe Gomes + Mark Sanders Percussion Quartet", "byline": "a very special matinee residency from the great Evan Parker!", "description": "Evan has been a hugely important part of OTO since we started, through countless incredible performances here over the years, as well as his releases and reissues on our inhouse Otoroku label. He has been a consistently innovative presence in British free music since the 1960s and his undeniable influence is evident across our programme. This matinee series brings together some of the key strands of Evan's creative output, with collaborations alongside Pat Thomas, Thurston Moore, John Coxon, Ashley Wales, Matt Wright and more.\n\nParker played with John Stevens in the Spontaneous Music Ensemble, experimenting with new kinds of group improvisation and held a long-standing partnership with guitarist Derek Bailey. The two formed the Music Improvisation Company and later Incus Records. He also has tight associations with European free improvisations - playing on Peter Brötzmann's legendary 'Machine Gun' session (1968), with Alexander Von Schlippenbach and Paul Lovens, Globe Unity Orchestra, Chris McGregor's Brotherhood of Breath, and Barry Guy's London Jazz Composers Orchestra (LJCO).\n\nThough he has worked extensively in both large and small ensembles, Parker is perhaps best known for his solo soprano saxophone music, a singular body of work that in recent years has centred around his continuing exploration of techniques such as circular breathing, split tonguing, overblowing, multiphonics and cross-pattern fingering. These are technical devices, yet Parker's use of them is, he says, less analytical than intuitive; he has likened performing his solo work to entering a kind of trance-state. The resulting music is certainly hypnotic, an uninterrupted flow of snaky, densely-textured sound that Parker has described as \"the illusion of polyphony\". Many listeners have indeed found it hard to credit that one man can create such intricate, complex music in real time.", "first_date": "2026-09-13", "last_date": "2027-09-02", "url": "https://www.cafeoto.co.uk/events/evan-parker-matinee-residency-1/", "tags": ["concert"], "id": "e190", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "cafe-oto", "title": "John Hegley + Rishi Dastidar + Sarah Sparkes + Harmeet Rahal + Letrix + Peregrine Kelly + Martin Williams + Dee Sada + Massimo Braghieri + Jackson Burton", "byline": "For the Lost is a Resonance FM platform spanning weekly radio broadcasts and live events that champions underrepresented voices across music, literature and the arts.", "description": "Produced and presented by Dee Sada, this is the second edition of the series' live events, which will also be broadcast on Resonance FM.\n\nMyth, Memory & Hauntology explores the stories we inherit, the memories we preserve and how identity continues to shape our lives. Bringing together poetry, sonic experimentation, improvised performance, the evening examines folklore, nostalgia and imagined futures.\n\nThe evening also premieres Kayfabe Memories, a new live radio play featuring Letrix, Peregrine Kelly, Massimo Braghieri, Rishi Dastidar, Dee Sada and Martin Williams.", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://www.cafeoto.co.uk/events/for-the-lost-vol-ii/", "tags": ["spoken-word"], "id": "e191", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "canal-cafe", "title": "Willkommen to the Cabaret", "byline": "An intimate afternoon of powerhouse musical theatre vocals, smokey jazz and classical cabaret charm.", "description": "A celebration of some of musical theatre’s most infectious jazz, powerhouse vocals and unforgettable characters. Expect a lively afternoon packed with big voices, cheeky charm, toe-tapping numbers and plenty of theatrical flair, with songs from Cabaret, Thoroughly Modern Millie, The Wild Party and more.\n\nFrom smoky jazz standards to dazzling showstoppers, this is musical theatre at its most playful, passionate and unapologetic. Whether you’re a lifelong musical theatre lover or simply looking for a fun afternoon out, come along, grab a drink and settle in for an intimate cabaret experience that promises plenty of laughs, drama and songs you’ll want to sing along to.", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://canalcafetheatre.com/our-shows/willkommen/", "tags": ["cabaret", "musical"], "id": "e192", "venue_name": "Canal Café Theatre", "venue_area": "Little Venice"}, {"venue_id": "chickenshed", "title": "Little Spark!", "byline": "Every week is a new adventure! These stand-alone workshops are built around a different theme each session, weaving together elements of drama, dance, music, art, and a magical visit from our Storyteller.", "description": "Led by Chickenshed’s brilliant team, each workshop is designed to spark imagination, build confidence, and explore creativity through play and performance.\n\nNo experience needed - just come along and join in the fun!", "first_date": "2026-09-13", "last_date": "2026-10-25", "url": "https://www.chickenshed.org.uk/events/sunday-shed-little-spark-autumn-2026", "tags": ["class"], "id": "e193", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "chickenshed", "title": "Adult Acting Workshops", "byline": "Through drama games, improvisation and character work, you’ll build confidence, develop new skills and connect with others - all without pressure.", "description": "Whether you’re completely new to acting or returning after a break, this is a space to have a go, have fun and see where it takes you.\n\nIf you have never attended a Sunday Shed workshop your first session is free with promo code SUNTRIAL", "first_date": "2026-09-13", "last_date": "2026-10-25", "url": "https://www.chickenshed.org.uk/events/adult-acting-workshop-5", "tags": ["class"], "id": "e194", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "chickenshed", "title": "Children's Performance Project", "byline": "You can join in on a weekly basis, but do note that spaces are limited. To secure your spot, we highly recommend booking in advance.", "description": "If you have never attended a Sunday Shed workshop your first session is free with promo code SUNTRIAL\n\nYou can book individual sessions or join us every week - booking is highly recommended as places fill up quickly.", "first_date": "2026-09-13", "last_date": "2026-10-25", "url": "https://www.chickenshed.org.uk/events/sunday-shed-childrens-performance-project-autumn-2026", "tags": ["theatre"], "id": "e195", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "chickenshed", "title": "Adult Musical Theatre Workshop", "byline": "Work together to learn songs from well-loved West End and Broadway musicals in a lively, supportive group setting.", "description": "Whether you love musical theatre or just want to try something new, this is your chance to get involved and enjoy performing.\n\nIf you have never attended a Sunday Shed workshop your first session is free with promo code SUNTRIAL", "first_date": "2026-09-13", "last_date": "2026-10-25", "url": "https://www.chickenshed.org.uk/events/adult-musical-theatre-workshop-autumn-2026", "tags": ["class", "musical"], "id": "e196", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "chickenshed", "title": "Young People's Performance Project", "byline": "Led by Chickenshed’s experienced practitioners, the Youth Performance Project offers a chance to develop your performance practice, explore new ideas, and work as part of a supportive ensemble.", "description": "Each term ends with a short performance in the Rayne Theatre - a chance to share your journey and creativity with family and friends.\n\nIf you have never attended a Sunday Shed workshop your first session is free with promo code SUNTRIAL\n\nAnyone aged 11–18 with a love of performing - or just a curiosity to try something new. Whether you’ve got loads of experience or it’s your first time on stage, you’ll be welcomed and encouraged to take part.", "first_date": "2026-09-13", "last_date": "2026-10-25", "url": "https://www.chickenshed.org.uk/events/young-peoples-performance-project-3", "tags": ["theatre", "class"], "id": "e197", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "hen-and-chickens", "title": "UVFF Funding Lab: Blowing Up", "byline": "Starring Gemma Fray, Rosie Holt, Phil Ellis and Frankie Boyle.", "description": "14-year-old band geek Erin is off on tour and needs her parents to get her to the coach call on time. Yet her parents, Clive and Sandra, are distracted by their own crumbling marriage... Tensions boil over at dinner, when Sandra, determined to get a rise out of her husband invites a wildly inappropriate guest to dinner, a s3x doll called Michael (voiced by Frankie Boyle.)\n\nBuy a ghost ticket to attend our exclusive W. I. P screening on the 13th of September at the Hens and Chickens Theatre, London, where we will be joined by some of the cast and crew to talk about the film and the filmmaking experience to date. This is a chance to support getting the film over its last hump.", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://www.unrestrictedview.co.uk/events/uvff-funding-lab-blowing-up", "tags": ["theatre", "comedy"], "id": "e198", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "hoxton-hall", "title": "Sounds Impossible: Casefile 13", "byline": "A gripping new play about magic, music and other invisible forces by Neil Kelso.", "description": "There’s an agency that doesn’t officially exist. It’s responsible for all those small impossible things that keep the world running roughly on schedule - the near-misses, the strange coincidences, the just-in-times. Somewhere in there, a file has gone missing, and one agent, working off the books, has just one evening to put it right before everything unravels.\n\nFrom the writer and director of \"Dead on Time” (shortlisted for Broadway World's Best Immersive Show of 2025), the Edinburgh Fringe hit Sounds Impossible returns in an all-new production: part detective story, part fever dream, told through live music and magic.", "first_date": "2026-09-13", "last_date": "2027-09-08", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173690975", "tags": ["theatre"], "id": "e199", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "jacksons-lane", "title": "SPLAT!", "byline": "★★★★ \"SPLAT! is a triumph\" — Ovation Radio  ★★★★ “Be prepared to laugh until your face hurts!” — Everything Theatre Step inside a vibrant artist’s studio where two very different painters attempt to create their next masterpiece.", "description": "One is neat, precise and serious; the other is messy, playful and full of mischief. As their worlds collide, they take audiences on a colourful journey through the history of art. Created for children aged 3–7 and their grown-ups, SPLAT! is a joyful, wordless theatre show packed with physical comedy, clowning, movement and music. Developed in collaboration with award-winning deaf artist Brian Duffy, the show is accessible to deaf audiences, non-English speakers and young children alike. A celebration of creativity, collaboration and play, this show turns the blank canvas into a glorious explosion of colour, imagination and fun. https://youtu.be/4ARzGIzIV20 More about OftheJackel Age recommendation: 3-7 and their grown-ups | Running time: 55 mins", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://www.jacksonslane.org.uk/events/splat/", "tags": ["theatre"], "id": "e200", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "piehouse", "title": "Threadwork Zine Launch", "byline": "Join us to celebrate the launch of our first community zine ‘Acts of Care’, platforming contributors’ art, writing, film and photography.", "description": "The day includes a full lineup of workshops, vendors, readings, screenings, live music and dancing which also marks Threadwork's one year anniversary... even more reason to get down and celebrate", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://www.eventbrite.com/e/threadwork-zine-launch-tickets-1998195700129?msockid=39f50c71e54168192eb019dfe4a1694a", "tags": ["social"], "id": "e201", "venue_name": "Piehouse Co-op", "venue_area": "Deptford"}, {"venue_id": "regents-park", "title": "Andrew Logan's Alternative Miss World 2026: Gaia", "byline": "The world's most gloriously unruly pageant returns and this time, it's going back to nature.", "description": "Andrew Logan's Alternative Miss World arrives at Regent's Park Open Air Theatre for its 16th earthly incarnation, Gaia , a spectacular, one-night-only celebration of the planet we call home. A nod to the late chemist James Lovelock’s famous hypothesis, Gaia celebrates the world as a living organism where planet and passengers are interconnected and interdependent. With all the ecological bad news darkening our horizons and flickering across our phones, it promises a fabulously fitting and much needed night of festivity. And what better way to pay homage to this beautifully complex system we call Earth than with the organised chaos of the Alternative Miss World?\n\nContestants take to the stage in creative interpretations of the theme across three rounds, daywear, swimwear and evening wear, each judged, à la Crufts, on poise, personality and originality by a distinguished panel of judges. Born in artist Andrew Logan's Hackney studio in 1972, the Alternative Miss World has graced stages ranging from Olympia to Clapham Common, the Camden Roundhouse to Shakespeare's Globe. Past participants read like a glittering roll-call of British culture: Divine, Jarvis Cocker, Grayson Perry, David Hockney, Derek Jarman, Julian Clary, Janet Street-Porter and Simon Callow among them.", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://openairtheatre.com/production/alternative-miss-world-2026", "tags": ["theatre"], "id": "e202", "venue_name": "Regent's Park Open Air Theatre", "venue_area": "Regent's Park"}, {"venue_id": "royal-ballet-opera", "title": "Sip and Sketch: Costume Design Tour", "byline": "Peek inside our costume workroom and witness where designs come to life. Then, relax with a Bellini in our bar while trying your hand at sketching your own designs.", "description": "From concept to creation, explore the craftsmanship that transforms some of the most iconic costumes in stage history from concept to creation.\n\nLooking to have this tour all to yourself as private experience for you and your group? Or perhaps you need this tour run in a different language? We can offer bespoke private tours. Send your requirements to tours@roh.org.uk .", "first_date": "2026-09-13", "last_date": "2026-09-19", "url": "https://www.rbo.org.uk/tickets-and-events/costume-design-tour-details", "tags": ["class"], "id": "e203", "venue_name": "Royal Ballet and Opera", "venue_area": "Covent Garden"}, {"venue_id": "royal-ballet-opera", "title": "Insights: Fallen Angels Dance Theatre", "byline": "Join cast and creatives from Fallen Angels Dance Theatre, as they discuss their work supporting those recovering from addiction and their new creation Holding Light , which comes to the Clore Studio this Autumn.", "description": "Join cast and creatives from the award-winning company Fallen Angels Dance Theatre, which supports those recovering from addiction or mental health adversity, in conversation as they prepare to bring a new work, Holding Light , to the Clore Studio.\n\nDiscover more about Royal Ballet and Opera productions through a variety of talks, workshops and exclusive rehearsals, showcasing the world-class casts and creatives working on stage and behind the scenes.", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://www.rbo.org.uk/production/insights-fallen-angels-dance-theatre", "tags": ["talk", "dance"], "id": "e204", "venue_name": "Royal Ballet and Opera", "venue_area": "Covent Garden"}, {"venue_id": "royal-vauxhall-tavern", "title": "SUNDAY CABARET WITH THE D.E. EXPERIENCE", "byline": "Today you get 100% Edna at Sunday Cabaret at the iconic Royal Vauxhall Tavern … The D.", "description": "E. Experience , a cabaret legend, with jaw-dropping stories and that amazing voice, she’s undiluted and unfiltered on the stage that is her spiritual home!\n\nThe RVT is an LGBTQ+ venue, please respect our space. No hen/stag parties.", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://www.vauxhalltavern.com/events/event/sunday-cabaret-with-the-d-e-experience-2/?oid=6628", "tags": ["cabaret"], "price_min": 11.0, "price_max": 11.0, "id": "e205", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "shakespeares-globe", "title": "Sword Fighting Demonstration", "byline": "Join a Sword Fighting Demonstration and watch our expert Globe Fight Team battle it out. Includes a photo opportunity for you to handle the weapons yourself!", "description": "What’s the difference between a rapier and a smallsword?\n\nHow often would you have seen a weapon in Shakespeare’s London?", "first_date": "2026-09-13", "last_date": "2026-10-29", "url": "https://www.shakespearesglobe.com/whats-on/sword-fighting-demonstration/", "tags": ["theatre"], "id": "e206", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "the-cockpit", "title": "Making Europe Audible", "byline": "Making Europe Audible is a concert that the Eunoia Trio created in collaboration with composers Catherine Kontz (LUX) and Henri Växby (FIN/SWE). The performances centre on interviews with extraordinary figures from contemporary history.", "description": "Meng Sprooch, Deng Sprooch, Seng Sprooch (“my language, your language, his/her language”) by Catherine Kontz engages with the strong links between language and cultural belonging. Multilingualism is a natural condition in Luxembourg, helping to dissolve borders and lower barriers between cultures The rose signifies peace as a living, affirmative condition rather than the silence that follows conflict.\n\nhttps://www.tete-a-tete.org.uk/event/making-europe-audible/", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://www.thecockpit.org.uk/show/making_europe_audible", "tags": ["concert"], "id": "e207", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "From The Edda", "byline": "From the texts that inspired Wagner's Ring cycle and Tolkien's Middle-earth, this song cycle \"From the Edda\" brings 10th-century Old Norse poetry to life.", "description": "At its centre is the prophetess Völva, who tells us the gory details of how the world was created, as well as how it will be destroyed and born anew. Is the new world a beacon of hope, or a veiled warning?\n\nMoving between ethereal stillness and violent disintegration, the soprano shifts between English, Old Norse, and — in the climax of the cycle — language itself collapses into chaos. Receiving its world premiere at Tête à Tête: The Opera Festival 2026, this 25-minute cycle is performed by Kathleen Ferrier Award-winning soprano Eyra Norman and pianist Alexander Wigglesworth.", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://www.thecockpit.org.uk/show/from_the_edda", "tags": ["concert", "opera"], "id": "e208", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-glitch", "title": "CVNTCLAVE x ATTENTION SEEKERS PRESENTS: The Hyperfixation Presentations, Fandom Edition!", "byline": "Attention Seekers has teamed up with Arden Fitzroy and the show CVNTCLAVE to deliver a special edition of The Hyperfixation Presentations: the Fandom Edition!", "description": "The scene: the first ever Hyperfixation Presentations in August 2025. A Cardinal cvntily struts onto the stage and spills all the tea about the Meanest Girls of the Vatican (and their Ao3 history). CVNTCLAVE could not have asked for a more fitting chapter in its origin story. To celebrate that deeply chaotic presentation's development into a full show a year on, Attention Seekers is putting together a night of presentations honouring fandoms, fanfic and online subcultures. Expect unabashed neurodivergent passion and silliness! Make an unhinged evening of it and see CVNTCLAVE beforehand with a special discount code when you buy a ticket to The Hyperfixation Presentations.", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://www.tickettailor.com/events/vaultcreativearts/2331572", "tags": ["theatre"], "id": "e209", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "the-space", "title": "Recitals at the Space - September '26", "byline": "I Flow my tears – Dowland Una donna a quindici anni – Mozart The sky above the roof – Vaughan Williams The edge of time (piano solo) – Andrew Campling Three Shakespeare songs – Amy Beach Queen Marie of Romania, suite for piano (solo)…", "description": "I Flow my tears – Dowland Una donna a quindici anni – Mozart The sky above the roof – Vaughan Williams The edge of time (piano solo) – Andrew Campling Three Shakespeare songs – Amy Beach Queen Marie of Romania, suite for piano (solo) – Andrew Campling Hey Troly loly lo – Warlock\n\nJoin us for complimentary post performance tea & coffee and a fundraising bake sale.\n\nAndrew Campling – piano Andrew is a member of the Ivors Academy, which represents composers and songwriters in the UK.", "first_date": "2026-09-13", "last_date": "2026-09-13", "url": "https://space.org.uk/event/recitals-at-the-space-september-26/", "tags": ["concert"], "id": "e210", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "the-space", "title": "Recitals at the Space", "byline": "To book for each recital, please click on the link of the date you are interested in.", "description": "Sunday 13th September – A joint recital with Matilda Dawes and Revolting Women!\n\nSunday 22nd November – ‘1938’ , a programme of words and music dedicated to the work of Vitezslava Kapralova, devised by Theia Charles with music directed by Andrew Campling – 6pm start", "first_date": "2026-09-13", "last_date": "2026-11-22", "url": "https://space.org.uk/event/recitals-at-the-space/", "tags": ["concert", "theatre"], "id": "e211", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "bush", "title": "ALT B: Talking People", "byline": "An outstanding ensemble of actors will create entirely original stories from scratch, giving you, the audience, the chance to help shape the characters’ lives, situations, and the worlds they inhabit.", "description": "Whether that be a family dealing with a violent child. A job interview from hell. The lasting impact of childhood bullying. Or reverberations felt by an “ordinary” family when one of its members creates one of the greatest inventions known to humankind.\n\nTogether, you’ll build and witness complex lives collide, unravel and transform in ways that no one – not even the cast – can predict. Every performance is unique, shaped by the people in the room that night.\n\nFive nights. Four stories. Countless lives and worlds to discover. Anything can happen.", "first_date": "2026-09-14", "last_date": "2026-09-19", "url": "https://www.bushtheatre.co.uk/event/alt-b-talking-people-2026/", "tags": ["theatre"], "id": "e212", "venue_name": "Bush Theatre", "venue_area": "Shepherd's Bush"}, {"venue_id": "cafe-oto", "title": "Gintė Preisaitė presents \"Instruments of forgetting and the singing bone\" + Percussomnia", "byline": "Gintė Preisaitė, a Lithuanian artist and graduate of Copenhagen’s Rhythmic Music Conservatory, reveals her first solo release under her own name…", "description": "Gintė Preisaitė, a Lithuanian artist and graduate of Copenhagen’s Rhythmic Music Conservatory, reveals her first solo release under her own name, following a collaborative effort with Toshimaru Nakamura in 2025 and a number of cassettes as “Baraboro”. The deliberately genre-blurring sound Preisaitė deploys works with composed pop vignettes, sustained drones, FX manipulations and guttural bursts of noise. Sparse piano movements, sample-laden psychedelia and moments of big beat/trip-hop rhythms gel with crowd noise, close mic’d intimacy and experimental percussion with a focus on instrumental timbres and extended techniques.\n\nWith a background in composing for large ensembles, Preisaitė's multi-instrumental approach is evident across the eight tracks, moments of dense concrète-style sound collages anchored by the human voice never being far away. She laments on fantasy, absurdity and relationships as a cast of players contribute string, brass, accordion, and guitar parts. Passages move from delicate acoustic folk motifs through to wide-eyed, cut-and-paste glitch electronics and spectral melodic riffs, making the album an unorthodox and welcome addition to Denmark's current world-class music scene.\n\nPercussomnia is a long-form electroacoustic exploration of abstract polyrhythms, creating a seamless blend of pitched and percussive sounds, where individual contributions merge into a cohesive musical flow. Originally formed as a duo of prepared piano and percussion, creating intuitive rhythmical flux made out of dozens of percussive and multi-pitched sound events, the format is now extended to a quartet with cello and electronics blending in and expanding the format with textures, sub-bass, and merging drones. Gintė Preisaitė: prepared piano and objects Emily Wittbrodt: cello Rémy Gouffault: digitakt Jan Philipp: drums and percussion.", "first_date": "2026-09-14", "last_date": "2026-09-14", "url": "https://www.cafeoto.co.uk/events/ginte-preisaite-percussomnia/", "tags": ["concert"], "id": "e213", "venue_name": "Café OTO", "venue_area": "Dalston"}, {"venue_id": "etcetera", "title": "Bags by Semwanga", "byline": "Bags is a live music performance by Alternative Hip-Hop/R&B artist Semwanga.", "description": "Semwanga has performed across the country including The Purple Turtle, the O2 Forum and The Ned but this headline show will be exploring new songs and sounds in a stripped back performance that asks the simple question… what’s in your bag?", "first_date": "2026-09-14", "last_date": "2026-09-14", "url": "https://www.etceteratheatrecamden.com/events/bags-by-semwanga", "tags": ["concert"], "id": "e214", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "hen-and-chickens", "title": "Let Her Liv*", "byline": "14th & 15th September 7.30pm £12\nLet Her Liv*, a UK-premiere play, features an ensemble cast of characters reflecting on their memories of an individual who touched their lives in different ways.", "description": "Liv - a trans woman who has died suddenly of natural causes - leaves behind unfinished conversations, love with nowhere to go, and most importantly, hope for a brighter future.", "first_date": "2026-09-14", "last_date": "2026-09-15", "url": "https://www.unrestrictedview.co.uk/events/let-her-liv", "tags": ["theatre"], "id": "e215", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "hope-theatre", "title": "Eater Of Filth", "byline": "It gets hungry. It has sex. It bleeds. Sometimes it grows something you do not want.", "description": "Sometimes it doesn’t. Over six years, it takes a woman four abortions to realise she’s not infertile. Babies appear in dreams, at work, in politics, in other people’s lives, but, somehow, she just can’t get the hint. Eater of Filth is a one-woman show about abortion, sex, work, shame, responsibility and the strange things we ask women to make sense of. Funny, filthy and occasionally haunting, it asks what happens when something you were told should be the most important thing in the world is, for you, simply not what you wanted.", "first_date": "2026-09-14", "last_date": "2026-09-16", "url": "https://www.thehopetheatre.com/eateroffilth", "tags": ["theatre", "comedy"], "id": "e216", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "museum-of-comedy", "title": "Logan Murray’s Stand Up Course (Mondays)", "byline": "Logan has taught Greg Davies, Rhod Gilbert, Josh Widdecombe, Andi Osho, Luisa Omielan, Diane Morgan, Joe Wilkinson, Laura Smith, Kavan Novak, Ed Petrie, Ed Aczel, Kirsten O’Brien, Rik Edwards, Paco Erhard, Anna Crilley, Hollie Walsh…", "description": "Logan has taught Greg Davies, Rhod Gilbert, Josh Widdecombe, Andi Osho, Luisa Omielan, Diane Morgan, Joe Wilkinson, Laura Smith, Kavan Novak, Ed Petrie, Ed Aczel, Kirsten O’Brien, Rik Edwards, Paco Erhard, Anna Crilley, Hollie Walsh, Miriam Elia, Tom Wrigglesworth, Jessica Knappett, and thousands more.\n\nPast participants have gone on to win every major comedy award.\n\nPerhaps that’s why it is one of the most highly regarded comedy workshops in Europe. Logan takes a special pride in helping you unlock your own unique comic voice. He will encourage you to be the best comedian you can possibly be.", "first_date": "2026-09-14", "last_date": "2026-09-14", "url": "https://www.museumofcomedy.com/logan-murrays-stand-up-course-mondays/", "tags": ["class"], "id": "e217", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "roundhouse", "title": "How to use Roundhouse Creative Studios", "byline": "Step into our professional spaces and learn how to use industry-standard gear to bring your ideas to life.", "description": "This session is a relaxed, hands-on walkthrough designed to give you the technical confidence to record, rehearse, and edit independently across all artforms.\n\nWhether you’re thinking about a Creative Studios Membership , or you’re already a member and want a refresher, join us and get comfortable in our spaces.", "first_date": "2026-09-14", "last_date": "2026-12-26", "url": "https://www.roundhouse.org.uk/whats-on/how-to-use-roundhouse-creative-studios-au26/", "tags": ["class"], "id": "e218", "venue_name": "Roundhouse", "venue_area": "Chalk Farm"}, {"venue_id": "royal-ballet-opera", "title": "Tea Dance", "byline": "Come dancing and cha-cha-cha along to the Royal Opera House Dance Band, in beautiful surroundings that combine grandeur and elegance.", "description": null, "first_date": "2026-09-14", "last_date": "2026-12-21", "url": "https://www.rbo.org.uk/tickets-and-events/tea-dance-dates", "tags": ["dance"], "id": "e219", "venue_name": "Royal Ballet and Opera", "venue_area": "Covent Garden"}, {"venue_id": "royal-court", "title": "Open Submissions Festival 2026", "byline": "The Royal Court receives and reads thousands of new plays every year, with every one considered for development or programming.", "description": "Twice a year, our Open Submissions Festival brings together the most exciting new scripts we've read for a week-long programme of staged readings - offering theatre-makers and audiences a first look at the future of contemporary theatre.\n\nIt's 1985. Ratti and her best friend Bachi are proud members of the Zoroastrian Ladies Committee for Socialist Justice. After a bruising election defeat, Ratti drags Bachi from Leytonstone to the USSR to scatter her late husband's ashes.", "first_date": "2026-09-14", "last_date": "2026-09-18", "url": "https://royalcourttheatre.com/events/open-submissions-festival-2026", "tags": ["theatre"], "id": "e220", "venue_name": "Royal Court", "venue_area": "Sloane Square"}, {"venue_id": "soho-theatre", "title": "Kate Dehnert: Echo", "byline": "We’re talking: relationship; career; income; opportunities; visa; losing almost all of her possessions; what country she lived in; she almost died; and for some incredibly annoying reason she now has a way-too-overactive gag reflex.", "description": "Like, she could stand in front of you and if you told her to vomit, she could. What the hell?\n\nGo out to dinner, drink some cocktails and meet Kate in the club – it’s going to get raw.\n\nDiscounts may be available on top prices for students, seniors, unwaged.", "first_date": "2026-09-14", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/kate-dehnert-echo/", "tags": ["stand-up"], "id": "e221", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "soho-theatre", "title": "Katie Norris: Mother Succubus", "byline": "Last year’s Best Show Nominee is back and ready to enter a new era. A stand-up and musical comedy show about maturing adorably from the self-appointed Godmother to the Nation.", "description": "As seen and heard on 8 Out of 10 Cats Does Countdown (C4).\n\nDiscounts may be available on top prices for students, seniors, unwaged.", "first_date": "2026-09-14", "last_date": "2026-09-26", "url": "https://sohotheatre.com/events/katie-norris-mother-succubus/", "tags": ["stand-up", "musical"], "id": "e222", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "bridewell", "title": "Love’s Labour’s Lost", "byline": "Love’s Labour’s Lost is a sun-drenched musical that reimagines Shakespeare’s comedy as a bittersweet rock musical set
