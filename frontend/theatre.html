rs to have a hidden motive.", "description": "What begins as a fragile connection slowly becomes something darker and more consuming, pulling Leilani deeper into the unforgiving nature of the island. Written and directed by Tamara James-Dickson , Wicked Fridays is an atmospheric horror-thriller and tense two-hander about entrapment, obsession and the dangers of ownership. Blending psychological and supernatural horror, the play asks: who is Ariel, why has he chosen Leilani, and will she find peace or lose herself to the unknown? Wicked Fridays premiered at the Etcetera Theatre in September 2025 before transferring to Theatre Deli in October 2025, where it received rave audience reviews.\n\nPresented by Noc Theatre in association with Drayton Arms Theatre\n\nPart of GrimFest 2026 , Produced and Curated by Medium Rare Productions & Pither Productions", "first_date": "2026-10-13", "last_date": "2026-10-17", "url": "https://thedraytonarmstheatre.co.uk/wicked-fridays", "tags": ["theatre"], "id": "e632", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "greenwich-theatre", "title": "The Seafarer", "byline": "It's Christmas Eve and Sharky has returned to Dublin to look after his blind brother, Richard.", "description": "As the two men rattle around their old house, they are joined by local layabouts Ivan and Nicky – and a stranger, new to town, the mysterious Mr Lockhart. Over a night fuelled by alcohol and resentment, a game of cards is on the table. But the cost of losing may be higher than anyone imagines…\n\nA blackly funny, haunting tale of family and friendship, steeped in whiskey and stirred by regret, from Ireland’s greatest storyteller.\n\nCast & Creatives: Written by Conor McPherson Directed by Ian Higham", "first_date": "2026-10-13", "last_date": "2026-10-24", "url": "https://greenwichtheatre.org.uk/events/the-seafarer/", "tags": ["theatre"], "id": "e633", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hackney-empire", "title": "Talawa Iconic: 40th Anniversary Showcase", "byline": "Talawa , the UK’s leading Black British theatre company, invites you to celebrate four decades of cultural impact in a one-night-only collaboration with the award-winning 125 year old…", "description": "Talawa , the UK’s leading Black British theatre company, invites you to celebrate four decades of cultural impact in a one-night-only collaboration with the award-winning 125 year old, Grade II listed Hackney Empire - \"the most beautiful theatre in London.\" Join us on the Black carpet on Tue 13 Oct 2026 for an evening celebrating Black excellence, featuring a curated programme of live spectacle including theatre, music, dance and poetry.\n\nThe audience will be treated to excerpts from some of our most sensational works, including:\n\nSpecial guests will include: Josette Bushell-Mingo OBE ( The Lion King , Olivier award nominee), T ameka Empson ( Eastenders , Hackney Empire Pantomime since 2004), Ben Thomas , Theresa Ikoko , David Webber , Laurence Ubong Williams ( The Motive and the Cue , National Theatre) and Doña Croll ( Antony & Cleopatra , All My Sons )", "first_date": "2026-10-13", "last_date": "2026-10-13", "url": "https://www.hackneyempire.co.uk/events/talawa-anniversary", "tags": ["theatre"], "id": "e634", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "hen-and-chickens", "title": "What Are We Going To Do When All This Is Over?", "byline": "Helen and Alexander have been creating theatre together for a number of years, but as Helen's memory begins to fail and they realise this is something worse than just brain fog…", "description": "Helen and Alexander have been creating theatre together for a number of years, but as Helen's memory begins to fail and they realise this is something worse than just brain fog, Alexander begins to discover things Helen has been hiding from him for years.\n\nTickets booked online must be collected 15mins before showtime. Cash tickets are available for 30 mins at the box office. TICKETS ARE NON-REFUNDABLE*", "first_date": "2026-10-13", "last_date": "2026-10-17", "url": "https://www.unrestrictedview.co.uk/events/what-are-we-going-to-do-when-all-this-is-over", "tags": ["theatre"], "id": "e635", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "hope-theatre", "title": "Speak Of The Devil", "byline": null, "description": null, "first_date": "2026-10-13", "last_date": "2026-10-24", "url": "https://www.thehopetheatre.com/speakofthedevil", "tags": ["theatre"], "id": "e636", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "hoxton-hall", "title": "Pixie McCann", "byline": "Pixie McCann makes ethereal “weird music for weird girls,” pairing haunting vocals with intricate live-looped performances that have built a deeply engaged online following and millions of likes across her socials.", "description": "She started busking when she was just 11 years old and her immersive live shows have quickly translated online momentum into real-world demand, earning her a support slot with Erin LeCount on her UK tour alongside slots at The Great Escape, Truck, Latitude and Boardmasters this year.\n\nA devoted fanbase drawn to her otherworldly sound and intimate, whimsical world-building congregates in ‘Pixie Hollow’, a Discord community of over 840 superfans who join regular Zoom and in-person meetups and even share in her creative process through a collaborative Pinterest board.", "first_date": "2026-10-13", "last_date": "2026-10-13", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173686951", "tags": ["concert"], "id": "e637", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "ica", "title": "In the Round: Zukovstheworld + Crystal Murray + Amil Raja (DJ)", "byline": "an evening moving between experimental pop, rap and leftfield club music. Headlined by Zukovstheworld, and featuring Crystal Murray and Amil Raja (DJ), the show will form part of the ICA's In the Round series.", "description": null, "first_date": "2026-10-13", "last_date": "2026-10-13", "url": "https://www.ica.art/live/zukovstheworld", "tags": ["concert"], "id": "e638", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "new-diorama", "title": "STUFFED", "byline": "This is about the bad stuff. This is an emergency. This is a clowning show.", "description": "a blazing inferno of physicality, electronica, and uncompromising personal testimony from the frontlines of the UK’s food banks. As phones ring, guts spill, and sparks ignite faster than they can be extinguished, five clowns search for hope and community in the face of helplessness. Created in association with Liverpool’s Unity Theatre, STUFFED is a roaring call to action amidst the wreckage of a desecrated system.\n\nEvery performance is accompanied by The Good Stuff : a programme of shared meals, practical action, and conversations that continue long after the house lights come up.", "first_date": "2026-10-13", "last_date": "2026-10-24", "url": "https://newdiorama.com/whats-on/stuffed", "tags": ["theatre", "circus"], "id": "e639", "venue_name": "New Diorama Theatre", "venue_area": "Regent's Place"}, {"venue_id": "pleasance-islington", "title": "Siblings and Family Friends", "byline": "For more information about our venues and performance spaces, please visit our access pages here .", "description": "Assistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-10-13", "last_date": "2026-10-13", "url": "https://www.pleasance.co.uk/event/siblings-and-family-friends", "tags": ["theatre"], "id": "e640", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "stratford-east", "title": "Application 39", "byline": "A sharply satirical, future‑facing drama by Palestinian writer Ahmed M...", "description": null, "first_date": "2026-10-13", "last_date": "2026-10-14", "url": "https://stratfordeast.com/whats-on/all-shows/application-39", "tags": ["theatre"], "id": "e641", "venue_name": "Theatre Royal Stratford East", "venue_area": "Stratford"}, {"venue_id": "the-place", "title": "not for glory", "byline": "A restless, relentless unravelling of traditional dance and music.", "description": "Jack Anderson and Charlotte Mclean , in collaboration with composer Malin Lewi s , bring together Highland dance, Irish dance and live piping in a dance-theatre gig that is as thrillingly physical as it is emotionally charged.\n\nThe performers revisit the traditions they grew up in – and the result is virtuosic, visceral and uncompromising. They dissect their heritage while dancing solidarity, balancing pride with shame and vulnerability with breathtaking skill. It’s bodies, bagpipes and brutality. It’s kilts, queerness and ceremonial violence. Back beats collide with high cuts, striking in to a battering, flinging skirl.", "first_date": "2026-10-13", "last_date": "2026-10-14", "url": "https://theplace.org.uk/events/autumn-27-not-for-glory", "tags": ["dance", "theatre"], "id": "e642", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "theatre503", "title": "Introduction To Playwriting with James McDermott: 5 Week Online Course", "byline": "Theatre503’s interactive online course exploring the tools and techniques to help you generate ideas, explore time and form, create characters and write dialogue.", "description": "Thanks to our Share The Drama scheme , we want to make sure those of you who are struggling in the current climate can still take part in our Writers Programme. If you would like to book a Share The Drama bursary for the Writer’s Programme, please call our box office on 02079787040 to enquire about payment and availability.\n\nThis course consists of five weekly sessions. Through a series of writing exercises and group discussions, you will generate ideas for dramatic stories; create active complex characters; explore space, place and time in your work; write dialogue; structure scripts; and find the right theatrical form for your play. There will be opportunities to share your developing work and receive informal peer and tutor feedback. You will also receive tips on starting and sustaining a career as a freelance scriptwriter.", "first_date": "2026-10-13", "last_date": "2026-10-13", "url": "https://theatre503.com/whats-on/introduction-to-playwriting-with-james-mcdermott-5-week-online-course/", "tags": ["class"], "id": "e643", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "upstairs-gatehouse", "title": "Dracula's Guest", "byline": "An ancient creature, embittered by the burden of immortality and the intolerance of those who would decry him monster.", "description": "Alone in his keep, but for the memories of centuries past. A living death that only a vampire could understand. Or perhaps a special guest or two. Providing they can live long enough to survive their host's unique hospitality and his deliberate attempts to drive them insane.\n\nBased on the bone-chilling works of Bram Stoker, \"Dracula's Guest\" takes you into the dark heart of Victorian horror to reveal the very meaning of terror and the consequences of collective evil and personal spite.\n\nWINNER: THE HAMILTON DEANE AWARD (The Dracula Society, 2022)", "first_date": "2026-10-13", "last_date": "2026-10-13", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173675560", "tags": ["theatre"], "id": "e644", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "camden-peoples-theatre", "title": "Pretty Ugly", "byline": "Pretty Ugly is about what happens when Theo decides enough is enough. Blending song and story, this intimate, conversational solo show tackles those pesky inner-demons we all encounter: the ones that tell us we’re not attractive enough.", "description": "Expect an eclectic array of your favourite musical theatre songs reinterpreted (dare we say, queered?!), plenty of laughs (and potentially tears) as Theo charts his adolescence in Singapore and his adventures around the world - including as an immigrant in the UK.", "first_date": "2026-10-14", "last_date": "2026-10-16", "url": "https://cptheatre.co.uk/whatson/Pretty-Ugly", "tags": ["musical"], "id": "e645", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "coronet", "title": "Movana Chen: Questioning the Line", "byline": "The latest live performance in artist Movana Chen’ s ongoing Body Containers series.", "description": "In Questioning the Line , Movana Chen and a group of dancers subvert human divisions through performance. Within Chen’s Body Containers – interconnected wearable sculptures – the dancers form living statues periodically emerging into stillness and coordinated movement to explore relationships with one another and with the audience.\n\nPresented for the first time in London, the work cultivates shared experience that transcends geopolitical borders. The piece draws on maps, not as background, but as material: shredded cartographic imagery is reshaped into Chen’s Body Containers , embedding questions of territory directly into the body itself.\n\nAt its core, the work treats the body as a vessel for stories, histories, and languages, tracing the visible and invisible boundaries that shape how we understand bodies, land, and identity. In a world increasingly shaped by division, displacement, and ecological uncertainty, Questioning the Line invites us to reconsider the lines we draw and to imagine a more interconnected way of being. It is an act of remembering our shared belonging to the earth and our responsibility to care for it.", "first_date": "2026-10-14", "last_date": "2026-10-17", "url": "https://www.thecoronettheatre.com/whats-on/movana-chen-questioning-the-line/", "tags": ["dance", "theatre"], "id": "e646", "venue_name": "The Coronet Theatre", "venue_area": "Notting Hill"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: GAY The Musical", "byline": "Meet the playwright who inspired generations of theatre makers but somehow slipped through the history books.", "description": "Guided by the wonderfully eccentric Mrs Animation, GAY The Musical is an original musical comedy packed with unforgettable songs, ghosts, satire, scandal and heart. Blending history with modern humour, the show follows John Gay as he fights to reclaim his place in British theatre, proving that some stories deserve to be told again.\n\nWhether you're a musical theatre lover, a history enthusiast, or simply looking for something fresh and original, GAY The Musical offers a joyful, uplifting evening that shines a spotlight on a remarkable life with warmth, wit and imagination.", "first_date": "2026-10-14", "last_date": "2026-10-15", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-gay-the-musical", "tags": ["musical"], "id": "e647", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: A Faithful Shepherdess", "byline": "Devon, 1602. Meet Clorin: healer, hermit... definitely not a witch.", "description": "At summer solstice, Clorin’s instant connection with a young priest collides with her best friend’s betrothal. As both women risk the treacherous waters of love in a game loaded against them, their lives, and the script itself, splinter into chaos.\n\nDiscover a forgotten Elizabethan tragicomedy by (not Shakespeare, or the other guy) John Fletcher. This witty, unsettling, and radical reimagining grapples with what women must sacrifice to step beyond the roles they are forced to play.", "first_date": "2026-10-14", "last_date": "2026-10-15", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-a-faithful-shepherdess", "tags": ["theatre"], "id": "e648", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hackney-empire", "title": "The Drifters", "byline": "The legendary group have been inducted into the Rock & Roll Hall of Fame, performed for the President of the United States and listed among the Greatest Artists of All Time by Rolling Stone magazine.", "description": "Under the guidance of Tina Treadwell (daughter of the group’s original founders, George & Faye Treadwell ) The Drifters have enjoyed a remarkable resurgence in recent years with multiple successful UK tours including headline shows in major arenas and, most notably, the world famous Royal Albert Hall in London for the first ever time in the group’s glittering career.\n\nFind out about getting here, access & support, plus food & drink", "first_date": "2026-10-14", "last_date": "2026-10-14", "url": "https://www.hackneyempire.co.uk/events/the-drifters", "tags": ["concert"], "id": "e649", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "ica", "title": "In the Round: L'Rain", "byline": "L’Rain is the musical project of multi-instrumentalist, composer, producer and curator Taja Cheek.", "description": "Operating between the worlds of art and music, and outwards into film, fashion and cultural discourse, Cheek is forging a unique path that transcends disciplines to become one of the most vital and adventurous voices for this warped contemporary moment.", "first_date": "2026-10-14", "last_date": "2026-10-14", "url": "https://www.ica.art/live/lrain", "tags": ["concert"], "id": "e650", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "pleasance-islington", "title": "Boyhood", "byline": "Jay is sat alone on a playground swing. It’s a big night. Time to grow the hell up?", "description": "In this explosive new play, set to a pulsing live-looped soundtrack created by multi-award-winning hip-hop theatre maker Conrad Murray , enter the world of Jay, standing on the edge of adulthood as he navigates mates, music, masculinity … and unexpected fatherhood.\n\nBoyhood is an unfiltered rollercoaster through grief, loyalty, friendship and working out what growing up actually means. From park swings and pints to playgrounds and parenthood, this new play from Conor Hunt is funny, brutally honest and heartbreakingly poetic.", "first_date": "2026-10-14", "last_date": "2026-10-31", "url": "https://www.pleasance.co.uk/event/boyhood", "tags": ["theatre"], "id": "e651", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "rich-mix", "title": "Ramzi - Soul Without Borders", "byline": "DICE protects fans and artists from touts. Tickets will be securely stored in the app.", "description": "Featuring the live debut of his brand-new EP and first-ever vinyl. For this special headline night, we highlight Ramzi’s soulful R&B core, enriched by the influences of his multicultural journey. This night is a one-of-a-kind experience where soul meets th...\n\nDiscover the best nights out in your city, with tailored recommendations synced to your music library.", "first_date": "2026-10-14", "last_date": "2026-10-14", "url": "https://dice.fm/event/wwd3mn", "tags": ["concert"], "id": "e652", "venue_name": "Rich Mix", "venue_area": "Shoreditch"}, {"venue_id": "southwark-playhouse", "title": "Dog Mom", "byline": "Fresh from a divorce and newly crammed into a tiny Brooklyn flat, Sarita is trying to rebuild her life. She may not have all the answers, but she knows one thing: she is definitely not a dog person.", "description": "Then a scruffy stray appears on her doorstep and refuses to take the hint. Suddenly Sarita is navigating dog parks, meddling dog owners, and a canine companion who seems convinced they’re soulmates.\n\nAs her carefully ordered life descends into comic chaos, Sarita discovers that sometimes the family you end up with is better than the one you planned.", "first_date": "2026-10-14", "last_date": "2026-11-07", "url": "https://southwarkplayhouse.co.uk/productions/dog-mom/", "tags": ["theatre"], "id": "e653", "venue_name": "Southwark Playhouse", "venue_area": "Borough, SE1"}, {"venue_id": "tabard", "title": "Who Put the Bomp?", "byline": "Who Put The Bomp? , a brand-new in-house musical from Keith Strachan, director of the West End hits Dreamboats and Petticoats and Dancing in the Streets .", "description": "When shy, music-obsessed Billy Johnson starts singing the records his grandfather loved, he never expects it to change his life. But with the help of his friends and no-nonsense music teacher Miss McTavish, a group of London teenagers form The Doo Woppers — an unlikely vocal group with an even more unlikely chance of success.\n\nAs their popularity grows, friendships are tested, secrets emerge and each of them must discover what it means to stand together when the spotlight gets brighter.", "first_date": "2026-10-14", "last_date": "2026-11-07", "url": "https://www.tabard.org.uk/production/who-put-the-bomp", "tags": ["musical"], "id": "e654", "venue_name": "Tabard Theatre", "venue_area": "Chiswick"}, {"venue_id": "the-space", "title": "Health is a Privilege", "byline": "This question swirls around Simonetta’s one-woman show, Health is a Privilege. In a world where certainty is currency, how do you survive when you have no answers?", "description": "A play for anyone who has not been believed—who has argued their case in the courtroom of a doctor’s office; who has had to prove their reality to those they thought would always care. How do we cope with pain we cannot name, only numb?\n\nFrom the kaleidoscope of these questions emerges Health is a Privilege—a stark, funny and deeply visceral one-woman counterattack to “Keep Calm and Carry On.”", "first_date": "2026-10-14", "last_date": "2026-10-16", "url": "https://space.org.uk/event/health-is-a-privilege/", "tags": ["theatre"], "id": "e655", "venue_name": "The Space", "venue_area": "Isle of Dogs"}, {"venue_id": "underbelly-boulevard", "title": "ESP Live From Soho", "byline": "Join Empire Street Productions for a regular monthly series of creative conversations live from Soho, featuring some of our favourite artists.", "description": "Hosted by James Bierman , each evening offers a conversation with leading voices from theatre, music and film.\n\n2 Sept : playwright and screenwriter Beth Steel and her twin sister contemporary artist and painter Amy Steel .\n\nIf a customer requires the assistance of a personal assistant or a carer to attend, the companion is eligible for a complimentary personal assistant ticket. Free companion tickets can be booked in person, by email or over the phone.", "first_date": "2026-10-14", "last_date": "2026-12-02", "url": "https://underbellyboulevard.com/tickets/esp-live-from-soho/", "tags": ["talk"], "id": "e656", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "young-vic", "title": "The Brown Sugar RAP Party", "byline": "realities? What could be the soundtrack to our day-to-day lives? Come chill and find out at Inua Ellams ' Rhythm And Poetry Party , a nostalgic, no-clutter, no-fuss, night of live literature and moving music.", "description": "To mark the first anniversary of D'Angelo ’s passing on October 14th, 2026, The RAP Party invites you to Brown Sugar , at the Young Vic.\n\nThis special R. A. P Party gathers 10 incredible contemporary poets to create and share new verse in response to D’Angelo ’s first album, Brown Sugar . Join us for fresh perspectives on the timeless journeys, questions and reflections raised by D’Angelo , plus music from DJ Sid Mercutio .", "first_date": "2026-10-14", "last_date": "2026-10-14", "url": "https://www.youngvic.org/whats-on/the-brown-sugar-rap-party/", "tags": ["spoken-word", "concert"], "id": "e657", "venue_name": "Young Vic", "venue_area": "South Bank"}, {"venue_id": "etcetera", "title": "Our Ghost Drinks Matcha", "byline": "Meet Adam and Steve. A perfect gay couple. They love each other, love their new house and love voting for Reform UK.", "description": "While painting and decorating their just-bought paradise, they notice something's off. Loud noises, screams and oat milk cartons popping up. Moving through parrot paintings, Farage-themed Ouija Boards and protest slogans they realise they’re not alone.\n\nSomething has been woken up and is ready to spread its woke agenda.\n\nOur Ghost Drinks Matcha is a dark comedy that handles the themes of performative politics, codependency and comfortability within marginalized communities.", "first_date": "2026-10-15", "last_date": "2026-10-17", "url": "https://www.etceteratheatrecamden.com/events/our-ghost-drinks-matcha", "tags": ["theatre"], "id": "e658", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "immersive-rumours", "title": "Wake The Tiger's Absurd City", "byline": "Absurd City is a parallel world where the lines between art and storytelling blur.", "description": "This immersive experience invites you to travel through the portal, explore a vividly charged cityscape filled with surreal installations, hidden corners, and mind-bending visuals.\n\nThis immersive experience invites you to step through a portal to a parallel world and find Absurd City, a living and breathing metropolis filled with surreal installations, hidden corners, and mind-bending visuals.\n\nThis non-linear, self-guided experience is designed to spark imagination regardless of age, ability or persuasion. There’s no wrong way to play – you can get involved in the story, explore interactions, or just enjoy your out-of-this-world day trip.", "first_date": "2026-10-15", "last_date": "2026-10-15", "url": "https://london.wakethetiger.com/", "tags": ["immersive"], "id": "e659", "venue_name": "Immersive Rumours", "venue_area": "London"}, {"venue_id": "kings-head", "title": "Double Bill: tell me straight & aggy", "byline": "Following a critically acclaimed run at the Park Theatre , Paul Bradshaw returns to the Kings Head with a double bill of tell me straight and aggy , with design by Olivier-nominated Damien Stanton, lighting by OFFIE-winner Cheng Keng…", "description": "Following a critically acclaimed run at the Park Theatre , Paul Bradshaw returns to the Kings Head with a double bill of tell me straight and aggy , with design by Olivier-nominated Damien Stanton, lighting by OFFIE-winner Cheng Keng, sound by BBTA_winner Eamonn O’Dwyer & video by Stage Award shortlisted Matt Powell.\n\ntell me straight is a fast-paced, semi-autobiographical, coming-of-adulthood play that's a glorious, witty, and provocative exploration of what it means to navigate and embrace our sexuality.\n\nHim’s long line of hookups have one thing in common; they’re all straight. Best friend Dani thinks he needs to fix up and finally find ‘a gay man who actually likes gay men!’ But straight guys are like buses… A 30-day detox is just what Him needs - no booze, no fast food and no men! Buuuuut will distractions in the form of wide-eyed Lee, fuck boy Ryan and oldest friend Matt prove to be derailing? Or will Him finally change his ways and see what is right in front of him?", "first_date": "2026-10-15", "last_date": "2026-11-14", "url": "https://kingsheadtheatre.com/whats-on/double-bill-tell-me-straight-and-aggy-t8hc", "tags": ["theatre"], "id": "e660", "venue_name": "King's Head Theatre", "venue_area": "Islington"}, {"venue_id": "park-theatre", "title": "The Pianist", "byline": "Based on Wladyslaw Szpilman ‘s extraordinary internationally bestselling memoir, this landmark new production, adapted and directed by the acclaimed Thom Southerland ( Titanic the Musical )…", "description": "Based on Wladyslaw Szpilman ‘s extraordinary internationally bestselling memoir, this landmark new production, adapted and directed by the acclaimed Thom Southerland ( Titanic the Musical ), brings one of the twentieth century’s most remarkable true stories to the stage featuring Szpilman’s own music for the very first time.\n\nOriginal compositions from the so-called ‘Polish Gershwin’ score his story: popular songs that had Warsaw humming, compositions that made him a star, all given rich new life in orchestrations by Simon Lee, Andrew Lloyd Webber’s long-time musical director. A cast of virtuoso actor-musicians conjures the golden age of Jewish Warsaw in all its warmth and wit: the packed concert halls, the candlelit cafés, the irrepressible spirit of a city that loved music above all else.\n\nAt its heart, this is a love letter to culture, to the artists and dreamers who carried it, and to the extraordinary power of creativity to outlast even the most turbulent chapters of history. Szpilman’s music doesn’t merely accompany this story; it breathes life into it, binding past to present and reminding us that some things, once made, can never truly be silenced.", "first_date": "2026-10-15", "last_date": "2026-11-28", "url": "https://parktheatre.co.uk/events/the-pianist/", "tags": ["theatre", "concert"], "id": "e661", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "pleasance-islington", "title": "SEHNSUCHT: Work In Progress", "byline": "For more information about our venues and performance spaces, please visit our access pages here .", "description": "Assistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-10-15", "last_date": "2026-10-16", "url": "https://www.pleasance.co.uk/event/sehnsucht-work-progress", "tags": ["theatre"], "id": "e662", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "royal-vauxhall-tavern", "title": "Solve-Along A Murder She Wrote", "byline": "Cult hit event Solve-Along-A-Murder-She-Wrote continues its residency at The Royal Vauxhall Tavern with an interactive screening of the classic Murder, She Wrote episode “Armed Response”.", "description": "Jessica Fletcher is holed up in hospital in Texas, but still has time to solve a murder featuring feuding doctors, frazzled nurses and conniving lawyers.\n\nSolve-Along-A-Murder-She-Wrote returns following riotous presentations of “A Fashionable Way to Die”, “Paint Me a Murder”, “Sing a Song of Murder” and many more, since it began at the RVT in 2018.\n\nSolve-Along-A-Murder-She-Wrote is a unique and hilarious night featuring games, prizes and audience participation, with special permission from NBC Universal Television. See the show Time Out rated one of 2021 & 2019’s 50 Great Nights Out in London that has played to sell-out audiences across the UK, Ireland, the USA and Australia, as well as the Edinburgh Festival Fringe 2023-2025, Adelaide Fringe 2025 and the Murder, She Wrote Festival 2025 (California).", "first_date": "2026-10-15", "last_date": "2026-10-15", "url": "https://www.vauxhalltavern.com/events/event/solve-along-a-murder-she-wrote-4/?oid=6605", "tags": ["comedy"], "id": "e663", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "stratford-east", "title": "The Ballad of John and Paul", "byline": "The highs, the lows, the stories and the music of the greatest songwri...", "description": null, "first_date": "2026-10-15", "last_date": "2026-10-15", "url": "https://stratfordeast.com/whats-on/all-shows/the-ballad-of-john-and-paul", "tags": ["musical"], "id": "e664", "venue_name": "Theatre Royal Stratford East", "venue_area": "Stratford"}, {"venue_id": "tabernacle", "title": "Clara Sophia in Concert", "byline": "Clara Sophia is a music duo creating immersive, heart-centered music that has resonated with audiences around the world.", "description": "Blending ethereal vocals, handpan, guitar, and atmospheric textures, their songs invite listeners into presence, reflection, and emotional release. Their live performances are dynamic and ceremonial, guiding audiences through shared intention, gentle movement, and moments of stillness. Clara Sophia sings in light language, channeling angelic, ethereal spheres and the spirit of nature, while Yuval’s grounding instrumentals and gentle rhythms create a sense of safety, embodiment, and depth. Inspired by years of living close to nature, the duo continues to cultivate music as a bridge between intuition, healing, and human connection. Their music has supported people from different cultures across the world – calming anxiety, releasing stress, relaxing the nervous system, and slowing the heartbeat in a fast-moving world. People navigating trauma find moments of peace, and busy minds discover space to slow down and breathe. With countless real-life stories of listeners feeling soothed and deeply held, Clara Sophia’s music offers a gentle pathway back to inner harmony – reconnecting people with the natural rhythm within themselves and the wider harmony of life. Doors open 7.15pm Tickets", "first_date": "2026-10-15", "last_date": "2026-10-15", "url": "https://www.thetabernaclew11.com/events/2026/10/15/clara-sophia-in-concert", "tags": ["concert"], "id": "e665", "venue_name": "The Tabernacle", "venue_area": "Notting Hill"}, {"venue_id": "underbelly-boulevard", "title": "Drag Queens vs Zombies", "byline": "The original, award-winning drag horror comedy show rises from the grave!", "description": "Award-winning drag stars Kate Butch ( RuPaul’s Drag Race UK )and Crudi Dench have their star-studded cabaret show crashed by brain-hungry zombies. The feuding pair must reconcile their differences to save the audience from a gruesome death in this camp comedy horror.\n\nFeaturing musical performances, hysterical interactive audience moments and at least one demon child of a famous celebrity.", "first_date": "2026-10-15", "last_date": "2026-10-22", "url": "https://underbellyboulevard.com/tickets/drag-queens-vs-zombies-2026/", "tags": ["cabaret"], "id": "e666", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "wiltons", "title": "Shakespeare’s Romeo & Juliet", "byline": "Shakespeare’s Romeo & Juliet , a bold reimagining of the iconic tragedy directed by Joseph Pitcher .", "description": "Pitcher’s acclaimed credits include Gypsy (UK Theatre Award for Best Musical Production) and My Fair Lady at The Mill at Sonning, and Macbeth at the Salomons Theatre, Tunbridge tle": "Lambeth Fringe: NAMASTE!", "byline": "When a young influencer is tasked with saving a once top London yoga studio, she must win over staff, teachers and clients with her wacky ideas, despite knowing nothing about yoga.", "description": "From a studio owner who secretly demolishes a Gregg's, to a topless teacher who doesn't need tantra to make it rain, join Gina as she navigates the ever changing world of yoga, along with its hypocrisies, heart and handstands. Will Gina be able to master yoga before any jobsworth exposes her AI generated yoga content? And will she create conflict or community as she attempts to bridge the gap between generations. In a world where yoga is meant to be for everyone, what will come out on top - tradition or TikTok?\n\nThis hilarious work-in-progress comedy draws upon Bea and Ben's real life experiences working at a top London yoga studio. There's rap yoga. There's sheep yoga. There's 'scream and weep' yoga. Faced with a usurper set to sabotage, and a rival studio ready to play dirty, will Gina be able to pull everyone together in time, or will it be too late for their beloved yoga studio to nama-stay?", "first_date": "2026-10-16", "last_date": "2026-10-17", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-namaste", "tags": ["comedy"], "id": "e672", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: Borscht", "byline": "You'd think going through heartbreak at the same time as your best friend would be comforting, right?", "description": "Meet David and Kel, both heartbroken souls trying to figure out how to get over someone, when to get under someone and navigating all the messiness that comes with it.\n\nWith fast pace comedy and genuine heartwarming moments, David and Kel are the Harry and Sally for the millennial generation.\n\nCast: Francesca Baker - Kel Jonny Davidson - David", "first_date": "2026-10-16", "last_date": "2026-10-17", "url": "https://www.goldengoosetheatre.co.uk/whatson/borscht-2", "tags": ["comedy"], "id": "e673", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hackney-empire", "title": "Gluck: Orpheus and Eurydice", "byline": "When the Gods offer him a glimmer of hope, he ventures into the Underworld. But what begins as a journey to bring her back becomes a descent into the architecture of his own mind.", "description": "In this new version of the myth, Orpheus ’ search becomes a strange and shifting world where memory and reality collide.\n\nComposer Leo Grant conveys this musically through new instrumental and electronic re-arrangements and re-compositions of Gluck’s material. These are woven into the original, blurring the boundaries between old and new.", "first_date": "2026-10-16", "last_date": "2026-10-16", "url": "https://www.hackneyempire.co.uk/events/gluck-orpheus-and-eurydice", "tags": ["opera"], "id": "e674", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "hoxton-hall", "title": "panicbaby", "byline": "For Fans of: Tom Odell, The Neighbourhood, Luvcat, Conan Gray, girl in red, Julia Wolf", "description": null, "first_date": "2026-10-16", "last_date": "2026-10-16", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173686844", "tags": ["concert"], "id": "e675", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "ica", "title": "In the Round: Alabaster DePlume – Both Sides", "byline": "London-based saxophonist, singer, composer and poet Alabaster DePlume brings a special residency to the ICA, with a fresh band each night.", "description": null, "first_date": "2026-10-16", "last_date": "2026-10-17", "url": "https://www.ica.art/live/alabaster-deplume", "tags": ["concert"], "id": "e676", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "immersive-rumours", "title": "Room 13", "byline": "In the days following the devastating fire in Battersea Arts Centre on Friday 13th March 2015, a team of builders uncovered a sealed chamber in the original stone structure.", "description": "When they opened the chamber, what they found was so disturbing that the renovation came to an immediate halt. 1\n\n1 years later, the door is unsealed once again. The door to Room 13…\n\nCreated by experiential theatre company Immersive Octopus, this spine-chilling production blurs the lines between local history and imagined unreality, inviting groups into Room 13 for a theatrical experience that will shock, thrill and leave you breathless. With a combination of live performers, special effects and immersive design offering jump scares aplenty, Halloween at BAC has never been more terrifying.", "first_date": "2026-10-16", "last_date": "2026-11-01", "url": "https://bac.org.uk/whats-on/room-13", "tags": ["immersive"], "id": "e677", "venue_name": "Immersive Rumours", "venue_area": "London"}, {"venue_id": "london-coliseum", "title": "Angel's Bone", "byline": "Angel’s Bone is a Pulitzer prize-winning opera – theatre work composed by Du Yun and librettist Royce Vavrek.", "description": null, "first_date": "2026-10-16", "last_date": "2026-10-31", "url": "https://londoncoliseum.org/events/angels-bone/", "tags": ["opera"], "id": "e678", "venue_name": "London Coliseum", "venue_area": "St Martin's Lane"}, {"venue_id": "lyric-hammersmith", "title": "For the Culture: Theatre503 Masterclass - Oladipo Agboluaje", "byline": "A story is a vehicle through which a writer expresses an idea or a concern, which is why we say a story is about something.", "description": "Theme influences other story elements such as character and plot, and grounds the characters in universal values such as love, envy, ambition, etc. In this workshop, participants will work through the themes of their stories to see how they actively advance a story and help the writer sustain a full-length play.\n\nOladipo Agboluaje’s most recent play, Crown of Blood, was produced by Utopia Theatre and ran at the Sheffield Crucible and The Belgrade in Coventry. His other plays include Early Morning, The Christ of Coldharbour Lane, The Estate and Iyale . Oladipo is course director of the Black British Theatre and Performance programme at the British American Drama Academy (BADA)\n\nTheatre503 is the national theatre for debut playwrights and the artists who bring their words to life. We play a vital role in the theatre ecology by helping diverse new voices reach the first rung on the artistic career ladder. We are experts in developing, launching and transforming the next generation of leading writers across stage and screen.", "first_date": "2026-10-16", "last_date": "2026-10-16", "url": "https://lyric.co.uk/shows/for-the-culture-theatre503-masterclass-oladipo-agboluaje/", "tags": ["class"], "id": "e679", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "museum-of-comedy", "title": "Richard Ashcroft Revived My Libido WIP", "byline": "Lockdown ended. The cat died. And suddenly... men were not so paused.", "description": "a rambunctious new show from the brilliant Mel Hudson (KNOWING ME KNOWING YOU WITH ALAN PARTRIDGE, THE CATHERINE TATE SHOW, HUDSON AND PEPPERDINE) - an inspirational story of a sexual reawakening just metres from a 'Forever Home for One’ - at Crystal Palace Park Bowl.\n\nMel had accepted her fate as a celibate cat lady who had \"raw dogged menopause\" without the hormones. But one momentously revitalising musical event changed everything. Part memoir, part desperate attempt to get Richard Ashcroft’s attention in some way, this show is a must-see for all middle-aged women, their partners, their grown-up kids, and everyone who wants to hear about Mel’s libido.", "first_date": "2026-10-16", "last_date": "2026-10-16", "url": "https://www.museumofcomedy.com/richard-ashcroft-revived-my-libido-wip/", "tags": ["stand-up", "comedy"], "id": "e680", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "museum-of-comedy", "title": "Adam Larter: Who Remembers The 90S?", "byline": "A weird, colourful, musical rollercoaster through a weird colourful decade.&nbsp;Who Remembers the 90s is an arthouse update on the traditional nostalgia show from everyone&rsquo;s favourite weirdo Adam Larter.&ldquo;You&rsquo;ll laugh…", "description": "A weird, colourful, musical rollercoaster through a weird colourful decade.&nbsp;Who Remembers the 90s is an arthouse update on the traditional nostalgia show from everyone&rsquo;s favourite weirdo Adam Larter.&ldquo;You&rsquo;ll laugh, you&rsquo;ll gasp, you&rsquo;ll perhaps wallow a little in the lurid, technicolour nostalgia of it all, and then you&rsquo;ll sing and dance like the weirdo you always want to be.&rdquo; \n***** ToDoList London&nbsp;&ldquo;A really uplifting hour of silliness from Adam Larter, and enormous fun whether you remember the 90s or not!&rdquo;\nBritish Comedy Guide", "first_date": "2026-10-16", "last_date": "2026-10-16", "url": "https://www.museumofcomedy.com/adam-larter-who-remembers-the-90s/", "tags": ["stand-up", "musical"], "id": "e681", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "pleasance-islington", "title": "Ray Jissues: Work in Progress", "byline": "Ray Jissues is a world renowned artist, whose mother says he’s a genius. What he lacks in self awareness, he makes up for in self confidence.", "description": "He’d make any woman happy, as long as he could have her opinions for her. That’s how much of a feminist he is. Ray has been shortlisted for the Prestigious Turnip Art Prize, and while he awaits the outcome, he welcomes an audience into his creative space to share the man behind the art. His professional success doesn’t seem to be leading to the intimacy he craves. If he gets the prize, will he get the girl?\n\nFor more information about our venues and performance spaces, please visit our access pages here .\n\nAssistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-10-16", "last_date": "2026-10-17", "url": "https://www.pleasance.co.uk/event/ray-jissues-work-progress", "tags": ["comedy", "theatre"], "id": "e682", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "shakespeares-globe", "title": "Symposium: Contested Futures", "byline": "Join us for a two-day symposium on the theme of ‘Contested Futures’.", "description": "Across two days, leading scholars and new voices in the field consider how we imagine the future in a time of deepening global conflict and displacement.\n\nTalks explore the futures Shakespeare’s plays open up—and the ones they close down—and how we might challenge inherited ideas about race, power and belonging.", "first_date": "2026-10-16", "last_date": "2026-10-17", "url": "https://www.shakespearesglobe.com/whats-on/symposium-contested-futures/", "tags": ["talk"], "id": "e683", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "stratford-east", "title": "Vittorio Angelone: you can’t Say Nothing any more", "byline": "Vittorio performs two very final London date of yo...", "description": null, "first_date": "2026-10-16", "last_date": "2026-10-16", "url": "https://stratfordeast.com/whats-on/all-shows/vittorio-angelone-you-cant-say-nothing-any-more", "tags": ["stand-up"], "id": "e684", "venue_name": "Theatre Royal Stratford East", "venue_area": "Stratford"}, {"venue_id": "the-glitch", "title": "Monstrous Comedy (16 Oct)", "byline": "Monstrous Comedy (16 Oct) – The Glitch, Fri 16 Oct 2026 - Noises From The Attic are thrilled to be hosting a night of fantabulous improv comedy…", "description": "Monstrous Comedy (16 Oct) – The Glitch, Fri 16 Oct 2026 - Noises From The Attic are thrilled to be hosting a night of fantabulous improv comedy, featuring top teams from across the London improv scene.So come on down and laugh at the legally required times. You won't (/are legally required not to) regret it.Follow us for more ...", "first_date": "2026-10-16", "last_date": "2026-10-16", "url": "https://www.tickettailor.com/events/vaultcreativearts/2403500", "tags": ["comedy"], "id": "e685", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "the-place", "title": "Afro Dance Xplosion 2026: Transcen-dance", "byline": "The Afro Dance Xplosion festival celebrates dance forms from Africa and its Diaspora, bringing together the best of dance, with both homegrown and international artists.", "description": "Afro Dance Xplosion 2026: Transcen-dance features companies including: Ballet National de Cote d'Ivoire - Directeur General Georges Momboye , Roots and More, BlakeArts, Artistry Youth Dance and Impact Dance , alongside a short film: Ndono, from Bakalama in Senegal.\n\nFeel the Rhythm Productions promotes music, dance and culture from African and the African diaspora throughout the United Kingdom and beyond.", "first_date": "2026-10-16", "last_date": "2026-10-16", "url": "https://theplace.org.uk/events/autumn-winter-26-transcen-danse", "tags": ["dance"], "id": "e686", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "underbelly-boulevard", "title": "Drag Queens vs Vampires", "byline": "Kate Butch ( RuPaul’s Drag Race UK ) and Crudi Dench jet off to Transylvania as UK finalists for SKET (Song Kompetition of European Talents).", "description": "The trip becomes a bloody nightmare when their Airbnb host Dracula drives a wedge between the pair, threatening their lives, and more importantly, chances of stardom.\n\nFeaturing Haus of Dench ‘s infectious brand of camp humour, audience interaction and fabulous musical numbers.\n\nTop 20 Best Reviewed Comedy Shows of EdFringe 2023.", "first_date": "2026-10-16", "last_date": "2026-10-23", "url": "https://underbellyboulevard.com/tickets/drag-queens-vs-vampires-2026/", "tags": ["cabaret", "musical"], "id": "e687", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "upstairs-gatehouse", "title": "Night Terrors", "byline": "Night Terrors is a spine-tingling evening of three tales of the supernatural from E.", "description": "F. Benson’s brilliant collection of ghost stories. Masterful storytelling from the award-winning actor Gerard Logan will transport you to a dark, sinister world of the unexpected and the unexplainable. The three stories ( The Dance , In The Tube , and The Confession of Charles Linkworth ), are dramatic, haunting and hugely memorable.\n\nGerard Logan won The Stage “Best Solo Performer of the 2011 Edinburgh Festival Award” for his acclaimed performance in Gareth Armstrong’s production of Shakespeare’s The Rape of Lucrece . He won the \"Best Actor\" award at the 2014 Buxton Fringe Festival and was nominated for the Michael MacLiammoir Award for “Best Male Performance” at the 2016 International Dublin Gay Theatre Festival for his performance in Wilde Without the Boy . Gareth Armstrong has developed and directed many successful solo shows, including his own award-winning Shylock .\n\nNight Terrors is underscored by a beautiful, original, and specially commissioned score by the award-winning RSC composer, Simon Slater.", "first_date": "2026-10-16", "last_date": "2026-10-16", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173675561", "tags": ["theatre", "spoken-word"], "id": "e688", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "hackney-empire", "title": "Elena Langer: Ariadne & Purcell: Dido & Aeneas", "byline": "You left for dead. I love you. Ariadne wakes on the shore and finds Theseus gone.", "description": "She helped him escape Crete, leaving her home, her family, and the life she once knew behind. Now she has been abandoned. King Minos' daughter writes to the lover who has abandoned her in a poignant one-act drama which explores how absence is defined by love. A powerful and intimate retelling of the myth of Ariadne, Elena Langer sets Glyn Maxwell ’s Poem Ariadne to Theseus for the first half of English Touring Opera ’s Autumn Double Bill.\n\nQueen Dido of Carthage prepares to wed the Trojan hero, Aeneas. But the rejected King Iarbas plans his revenge, threatening to drive the lovers apart. Based on Virgil’s epic poem The Aeneid , Purcell’s Dido and Aeneas recalls the tragedy of the Queen of Carthage in a masterpiece of Baroque music, theatricality and despair.\n\nThis performance features violence, self harm, suicide and depiction of grief", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://www.hackneyempire.co.uk/events/elena-langer-ariadne-purcell-dido-aeneas", "tags": ["opera", "theatre"], "id": "e689", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "half-moon", "title": "The Quest for Planet P", "byline": "Follow Ozmo and Orbi, two brave little aliens, as they set off on an amazing journey to find the perfect planet.", "description": "When cracks start appearing and chaos hits their world, the grown-up aliens can’t agree on how to fix things. So, it’s up to Ozmo and Orbi to lead the way and find a new, perfect planet to live on. Along the way, they discover that the solution might be closer to home than they think.\n\nUsing projection, dance and storytelling, children interact with the performers throughout the show and take part in an engaging workshop exploring belonging, friendship and our world. It is a heartfelt and inspiring interactive story about fighting for the planet and showing how even the smallest voices can have a BIG impact.", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://www.halfmoon.org.uk/events/the-quest-for-planet-p/", "tags": ["theatre", "dance"], "id": "e690", "venue_name": "Half Moon Theatre", "venue_area": "Limehouse"}, {"venue_id": "lyric-hammersmith", "title": "The Misadventures of Thor", "byline": "Like the day his mighty hammer almost didn’t get made because of a mischievous fly.", "description": "Or when he had to be saved from the King of the Giants by his 3-day old son. Embarrassing!\n\nThese ancient Nordic tales are brought to you by Ulf and Odd, two skalds, or storytellers, in a comedic romp through the life and times of the Viking gods.", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://lyric.co.uk/shows/the-misadventures-of-thor/", "tags": ["theatre", "comedy"], "id": "e691", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "lyric-hammersmith", "title": "For the Culture: The Black Defiance RAP Party", "byline": "Inua Ellams' hosts a special edition of his Rhythm And Poetry/Prose Party at Lyric Hammersmith Theatre, as part of their For the Culture: Celebrations of Blackness Festival.", "description": "Founded by award-winning poet and playwright (The Barbershop Chronicles, The Actual, Doctor Who) Inua Ellams , The Rhythm And Poetry/Prose Party is a no-clutter no-fuss night of live literature and moving music. The format is super simple: 10 writers share a piece of work and after each, the DJ will play two songs of their choosing linked to the text.\n\nThis special Black Defiance edition invites audiences and writers to respond to songs that speak to breaking systems, perceptions, and rules, and highlighting the staying power of Black British voices in music.", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://lyric.co.uk/shows/for-the-culture-the-black-defiance-rap-party/", "tags": ["spoken-word", "theatre"], "id": "e692", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "museum-of-comedy", "title": "Emer Maguire: Perfectly Chaotic", "byline": "EXTRA SHOW ADDED 4.00pm!With Emer&rsquo;s brand new stand up tour show PERFECTLY CHAOTIC selling out\nBelfast&rsquo;s Waterfront Hall, more tour dates have just been added due to incredible\ndemand!&nbsp;Known for her powerful storytelling…", "description": "EXTRA SHOW ADDED 4.00pm!With Emer&rsquo;s brand new stand up tour show PERFECTLY CHAOTIC selling out\nBelfast&rsquo;s Waterfront Hall, more tour dates have just been added due to incredible\ndemand!&nbsp;Known for her powerful storytelling, lightning-fast wit, and hilariously irreverent\nmusical interludes, Emer has cemented herself as one of Ireland&rsquo;s most exciting\ncomedic voices. She has sold out landmark venues including the Ulster Hall,\nMandela Hall, and The MAC Belfast to rave reviews and roaring audiences.\nRecently named one of the top 10 new comic talents in the UK by Channel 4,\nEmer&rsquo;s star continues to ascend sharply. She has also recently been commissioned\nby Channel 4 to write and star in sitcom Socially Awkward - a hilarious, heartfelt\nsitcom about her life as an autistic adult.&nbsp;Perfectly Chaotic sees Emer dive into the beautiful mess of modern life &mdash; from\nquestionable decisions to personal revelations, from daily disasters to the\nunexpected moments that shape us. Delivered with Emer&rsquo;s trademark honesty,\nmusical brilliance, and no-holds-barred humour, this show promises belly laughs,\nemotional whiplash, and more than a few moments of &ldquo;I probably shouldn&rsquo;t relate\nto this&hellip; but I absolutely do.&rdquo;", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://www.museumofcomedy.com/emer-maguire-perfectly-chaotic/", "tags": ["stand-up"], "id": "e693", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "piehouse", "title": "Bar Wotever - London's Legacy Queer Cabaret: Black History Month", "byline": "Continuing our long-running tradition, we're spotlighting and celebrating queer black performers for Black History Month!", "description": "For over two decades, Bar Wotever has been a space for drag, music, poetry, dance, burlesque and everything in between. A platform for emerging artists, a home for seasoned performers, and a night for queers who want something different. Political, punk, messy, moving, it's always been about showing up and seeing what happens, wotever happens.", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://www.outsavvy.com/event/38803/bar-wotever-londons-legacy-queer-cabaret-black-history-month", "tags": ["cabaret"], "id": "e694", "venue_name": "Piehouse Co-op", "venue_area": "Deptford"}, {"venue_id": "puppet-barge", "title": "Anansi & The Lost Sun (LITTLE VENICE)", "byline": "Anansi and the Lost Sun is a West African Tale told with puppetry, spoken word & traditional West African music.", "description": "This show is performed by Swallow’s Wings Puppetry who are a London-based grassroots puppet company who aim to empower people of all ages with a love and reverence for African-Caribbean culture and history. They have collaborated with cultural organisations including Tate Britain, Manchester Royal Exchange, Eden Project, Somerset House, and the V&A.\n\nThe \"Anansi\" stories are humorous, lively, and community-led stories that traveled with enslaved African people to the Caribbean and then to the UK with the Windrush generation. They are part of our multicultural British heritage and have a universal appeal to all people.", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://www.puppetbarge.com/anansi-the-lost-sun-little-venice", "tags": ["puppetry", "spoken-word"], "id": "e695", "venue_name": "Puppet Theatre Barge", "venue_area": "Little Venice"}, {"venue_id": "rich-mix", "title": "K-Music Festival: Chudayhe Chagis", "byline": "Driven by a striking voice, Chu Dahye returns with psychedelic shamanic funk.", "description": "Chu Dahye, the magnetic voice behind the electrifying RAVE that transformed the Southbank Centre into a pulsating club night, returns to London with a bold new sonic vision.\n\na psychedelic shamanic funk rooted in traditional Korean chants (Muga), where voice becomes both instrument and storyteller. Their distinctive sound blends ancient Muga from the Pyeongan, Jeju, and Hwanghae Provinces with elements of reggae, jazz, hip-hop, funk, dance, and rock, creating a powerful and immersive sonic landscape.", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://dice.fm/event/k69l6p", "tags": ["concert"], "id": "e696", "venue_name": "Rich Mix", "venue_area": "Shoreditch"}, {"venue_id": "shakespeares-globe", "title": "Othello: A Level Boost", "byline": "Bring your study of Shakespeare’s searing tragedy Othello to life with this A Level Boost , designed for those aged 16-18.", "description": "Jump into an interactive workshop led by an expert practitioner and explore how to actively approach Shakespeare, using an anti-racist lens. Through a range of techniques and drama activities, you’ll develop key skills and a practical toolkit that you can carry forward into your studies, essays and exams.\n\nThis A Level Boost is best suited to A Level students who already have knowledge of the text and assessment objectives, whether at final exam or mock exam level. You will leave the session with an in-depth understanding of the play as a performed text.", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://www.shakespearesglobe.com/whats-on/othello-a-level-boost/", "tags": ["class", "theatre"], "id": "e697", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "siobhan-davies", "title": "LPFE Celebration", "byline": "Come gather with artists and performers from each of our annual community performance projects LANGUAGE (2022), POWER (2023), FEAR (2024), and EMOTION (2025).", "description": "We will be screening films of all four performances throughout the building and amazing artists from across each of the series will lead workshops that allow us to re-live or experience for the first-time iconic movement moments from the LANGUAGE/POWER/FEAR/EMOTION (LPFE) shows.\n\nLANGUAGE / POWER / FEAR / EMOTION is a four-year intergenerational performance project that ran from 2022-2025. Each project explores a universal theme and brings together those with strong connections to Elephant and Castle to perform. Participants ranging from professional dance artists create alongside those with little or no dance or performance experience in up to 8 sessions spanning two and a half weeks – all leading up to one incredible one-off final performance. Learn more here .", "first_date": "2026-10-17", "last_date": "2027-10-02", "url": "https://www.siobhandavies.com/events/lpfe-celebration/", "tags": ["dance"], "id": "e698", "venue_name": "Siobhan Davies Studios", "venue_area": "Elephant and Castle"}, {"venue_id": "stratford-east", "title": "An Evening of Stratford East Singers 2026", "byline": "Our very own community choir’s annual concert, led...", "description": null, "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://stratfordeast.com/whats-on/all-shows/an-evening-of-stratford-east-singers-2026", "tags": ["concert"], "id": "e699", "venue_name": "Theatre Royal Stratford East", "venue_area": "Stratford"}, {"venue_id": "the-albany", "title": "Bingo Saturdays", "byline": "Join us for a lively series of bingo afternoons packed with laughter, songs, and great vibes!", "description": "Come on down to the Albany and join us for a lively series of bingo afternoons packed with laughter, songs, and great vibes.\n\nHosted by a hilarious line-up of drag artists, you’ll be singing along, laughing out loud, and keeping your eyes peeled for that winning line. Our cafe will be open selling hot and cold drinks and delicious lunches to keep you fuelled for all that energetic counting.", "first_date": "2026-10-17", "last_date": "2027-02-06", "url": "https://www.thealbany.org.uk/events/bingo-saturdays", "tags": ["cabaret"], "id": "e700", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "the-cockpit", "title": "Family Shakespeare: Pyramus & Thisbe - October", "byline": "The Rude Mechanicals have been asked to perform a play at the Duke's wedding. Trouble is, they've forgotten to write it! Can you help???", "description": "Do you remember Pyramus & Thisbe? The romantic tragedy that Bottom & The Rude Mechanicals were asked to perform for the Duke in A MIDSUMMER NIGHT’S DREAM?\n\nIn this interactive theatre experience, the audience put their heads together to add the finishing touches to the Rude Mechanicals’ play, helping to create a completely original version!", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://www.thecockpit.org.uk/show/family_shakespeare_pyramus_thisbe_-_october", "tags": ["theatre", "immersive"], "id": "e701", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "Hansel and Gretel", "byline": "Step into the dark woods this October for a deliciously chilling 60-minute production of Engelbert Humperdinck’s classic opera, Hansel and Gretel, sung in English.", "description": "Lost in a mysterious forest, two brave siblings must outsmart a sinister Witch to find their way home. Packed with eerie enchantment, lush harmonies, and dramatic twists, this spooky, family-friendly opera brings a timeless fairytale to life for audiences of all ages.\n\nDirected by William Byram , this adaptation features a stellar cast alongside talented students from BWA Performing Arts . Rozanna Madylus (Regents Opera, ENO) stars as the adventurous Hansel, paired with Anna Gregg (Royal Opera, Longhope) as his clever sister Gretel. Mae Heydorn (Glyndebourne, Regents Opera) takes on the remarkable triple role as the Mother, the soothing Sandman, and the terrifying Witch.", "first_date": "2026-10-17", "last_date": "2026-10-18", "url": "https://www.thecockpit.org.uk/show/hansel_and_gretel", "tags": ["opera"], "id": "e702", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "underbelly-boulevard", "title": "A Dinner with the SL*TS", "byline": "A Dinner with the SL*TS brings together two of the UK comedy circuit’s tastiest talents , Laura Moss and Amelia Fritz . Join the irresistible duo for a delectable hour of stand up comedy.", "description": "Due to the restrictions of the building, unfortunately this performance space is not accessible by lift. The space is only accessible by two flights of stairs. Regrettably, we currently are unable to provide any extra support to customers with impaired mobility.\n\nTucked away on Level 1 of Underbelly Boulevard Soho, our bar is one of Soho’s best kept secrets. With a selection of well-crafted classic cocktails, wines, beer and cider, as well as delicious non-alcoholic and soft options, tea and coffee, there’s a drink for every occasion and every taste on the menu.", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://underbellyboulevard.com/tickets/a-dinner-with-the-slts/", "tags": ["stand-up"], "id": "e703", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "upstairs-gatehouse", "title": "Burn Baby Burn: LA Inferno", "byline": "LA is burning. When two old Angelenos lose everything, they must navigate overwhelming grief, toxic ash and paperwork purgatory, surrounded by clueless celebs, posturing politicians and frazzled firefighters.", "description": "6000 miles away, their (very) anxious daughter clings to composure.\n\nAward nominated Burn Baby Burn is a searing tragicomedy exploring the human cost of climate change and the humans fanning the flames. A sharp-witted blend of storytelling, songs and comic characterization. It asks questions nobody wants to answer like: Why was LA’s biggest reservoir empty? What the hell is a ‘firenado’? And how did 80s film star Steve Guttenberg become a low-key hero?\n\nWith a childhood shaped by wildfires and her parents home destroyed in January 2025's blaze, Hunter's done what any good performer would do...transformed personal tragedy into hilarious and heartbreaking theatre. Following her acclaimed debut solo show, in partnership with Slackline Productions, champion of women 35+.", "first_date": "2026-10-17", "last_date": "2026-10-17", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173675844", "tags": ["theatre"], "id": "e704", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "alexandra-palace", "title": "Friday Night Is Music Night – Sound of Sleep", "byline": "Friday Night is Music Night hosts an enchanting exploration of the music of sleep, live from Alexandra Palace Theatre.", "description": "To sleep, perchance to dream – and you don’t even have to close your eyes, as Friday Night is Music Night takes a long day’s journey into night.\n\nHopes, nightmares, deep relaxation and fantasies beyond the imagination: they’re all part of the cycle of sleep and tonight the BBC Concert Orchestra , conductor Edwin Outwater and Mishka Momen (a dream of a pianist) immerse you in a specially conceived sequence of music inspired by sleep.\n\nAmbient lighting gets you in the mood and magical sounds by Ravel, Mussorgsky, Max Richter and Missy Mazzoli trace our nightly journey, from the moment the eyelids begin to droop, to the joy of sunrise and awakening. And then, like any dream, it’s gone. You might want to set your alarm clock for this one…", "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://www.alexandrapalace.com/whats-on/friday-night-is-music-night-sound-of-sleep/", "tags": ["concert"], "id": "e705", "venue_name": "Alexandra Palace Theatre", "venue_area": "Wood Green"}, {"venue_id": "etcetera", "title": "IT FELT EMPTY", "byline": "We are taken into Dijana world of intolerable suffering, resilience, and unwavering hope as she strives to find her place in life.", "description": "Forced to navigate circumstances that continually test her strength (and/or sanity), Dijana discovers what it means to survive when going after your dreams leads to your demise.\n\nRaw, moving and deeply human - this startling play explores the masks we wear, the battles others cannot see, and the courage it takes to keep going when life refuses to make things easy.\n\nStep into Dijana’s world and experience a story of survival, identity and hope that asks: how much of ourselves do we perform just to survive?", "first_date": "2026-10-18", "last_date": "2026-10-19", "url": "https://www.etceteratheatrecamden.com/events/it-felt-empty", "tags": ["theatre"], "id": "e706", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "etcetera", "title": "Women in the Storm", "byline": "Inspired by documented cases of domestic violence, Women in the Storm is a feminist solo performance exploring the hidden barriers that can make escaping an abusive relationship so difficult.", "description": "Through a fictional woman's story shaped by real cases and testimonies, the performance traces her journey from love to control, from violence to resistance, and from seeking help to fighting for a way out. As she tries to leave, she finds herself caught between family expectations, social pressure, financial dependence, barriers to divorce, the struggle to prove abuse, and a legal system she desperately needs to protect her.\n\nBlending monologue, physical theatre and documentary material, Women in the Storm asks us to look beyond the question, “when the storm comes, where is the way out?” and instead confront what can stand in the way when someone tries to leave safely.", "first_date": "2026-10-18", "last_date": "2026-10-25", "url": "https://www.etceteratheatrecamden.com/events/women-in-the-storm", "tags": ["theatre"], "id": "e707", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: The Third Coming of Jesus Christ", "byline": "The world has ended. But not for everyone. There is still one man left. Cain is stuck adrift at sea and he has to change his fate, in three visits from Jesus Christ. But the devil has other plans for him.", "description": "Karol Stanisz's absurdist play combines laughter together with the immediately recognisable characters is a perfect storm for Lambeth Festival. Directed by Gabrielle Hofmann and with music by Ciara Cogley, it's bound to be a wild ride that will move you, make you laugh and prompt you to re-evaluate your spiritual landscape.", "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-the-third-coming-of-jesus-christ", "tags": ["theatre"], "id": "e708", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: Have I Returned?", "byline": "For a blind man, darkness has never been something to fear—it is the only world he has ever known.", "description": "Believing that sight will finally give him the sense of belonging he has always longed for, he embarks on an unwavering pursuit of light. But when his wish is finally granted, he discovers a world that is as unsettling as it is beautiful. As the boundaries between reality and illusion begin to dissolve, he is left questioning whether the world he fought so hard to see was ever truly meant for him.\n\nBlending expressionist theatre, physical performance and dark humour, this original production explores perception, identity and the universal search for belonging. Rather than asking whether light is better than darkness, it challenges audiences to reconsider what it truly means to see. Is happiness found in seeing more, or in finding a place where we feel we belong? Through striking visual imagery and an emotionally charged journey, the play invites audiences to reflect on the worlds we chase—and whether they were ever ours to begin with.\n\nThis Production is using a third-party ticketing provider.", "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-have-i-returned", "tags": ["theatre"], "id": "e709", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hen-and-chickens", "title": "Liminal Tales: Spooktacular", "byline": "18th October 5pm £11.50\nCome one come all! See with your eyes and your mind terrifically terrifying short stories are read to a live audience!", "description": "Witness Hollywood celebrities explode! Tremble at The Great Abomination! See demons leap from the stage and run amuck! Make sure to come in your Halloween costumes, lest the monsters think you’re an easy target!", "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://www.unrestrictedview.co.uk/events/liminal-tales-spooktacular", "tags": ["spoken-word", "theatre"], "id": "e710", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "hope-theatre", "title": "Small Fry", "byline": "What do you do when everyone else seems to know who they are, and you’re still trying to figure it out?", "description": "Small Fry follows an aspiring actor who’s convinced his big break is just around the corner. The only problem is every audition ends in disaster, every opportunity goes to someone else, and his confidence is hanging on by a thread. Between impossible casting calls, awkward encounters, flatmate drama and a growing obsession with proving himself, things start to unravel. It’s funny, chaotic and painfully relatable, but underneath all the laughs is a story about male mental health, self-worth and the pressure to constantly perform. Not just on stage, but in everyday life. At a time when so many young men are struggling to talk honestly about loneliness, rejection and feeling like they’re falling behind, Small Fry asks what happens when nobody teaches you how to fail, or how to believe you’re enough. Expect cringe-worthy auditions, Greek mythology, nepo babies, emotional meltdowns and a lot of heart. If you’ve ever felt overlooked, compared yourself to everyone else, or wondered why life seems to come so easily to other people, Small Fry might hit a little closer to home than you’d expect.", "first_date": "2026-10-18", "last_date": "2026-10-19", "url": "https://www.thehopetheatre.com/smallfry", "tags": ["theatre"], "id": "e711", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "ica", "title": "Throbbing Gristle: TG50", "byline": "Chris Carter and Cosey Fanni Tutti reflect on the early days of Throbbing Gristle, their experience of London at the time, and the ways in which they forged new forms of music and art amid the city’s cultural underground.", "description": null, "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://www.ica.art/live/tg50", "tags": ["talk"], "id": "e712", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "ica", "title": "Chris Carter and Cosey Fanni Tutti of Throbbing Gristle in conversation with Luke Turner", "byline": "Chris Carter and Cosey Fanni Tutti of Throbbing Gristle in conversation with Luke Turner, editor of The Quietus.", "description": null, "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://www.ica.art/live/tg50-talk", "tags": ["talk"], "id": "e713", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "tabard", "title": "Johnny Ball: Laughs, Maths and Stories that Must Be Told", "byline": "Best known for creating and presenting more than 20 television series, including Think of a Number and Think Again , Johnny has spent a lifetime making maths and science exciting, accessible and fun for generations of viewers.", "description": "Now he brings that same infectious enthusiasm to children, grandchildren and grown-ups alike, uncovering the surprising, fascinating and often overlooked stories behind the history of mathematics.\n\nJohnny will also share memorable stories from his autobiographies, looking back on a remarkable career in television filled with laughter and adventure.", "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://www.tabard.org.uk/production/johnny-ball-laughs-maths", "tags": ["talk"], "id": "e714", "venue_name": "Tabard Theatre", "venue_area": "Chiswick"}, {"venue_id": "the-cockpit", "title": "Re-Enchant: October", "byline": "The world changes: we make new poetry to vandalise literary forms or retrieve those we need to renew. We make new poetry to hybridise new species of understanding and reframe consciousness.", "description": "Readings, recitations, incantations and events from established and upstart poets, word artists, ranters, spell-casters, rappers......and you if you want.", "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://www.thecockpit.org.uk/show/re-enchant_october_0", "tags": ["spoken-word"], "id": "e715", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-glitch", "title": "Climate Theatre Workshops (18 Oct)", "byline": "Join our fun, friendly climate theatre workshops at The Glitch. Sessions are once a month on Sundays, 2pm to 4pm.", "description": "They’re fun, friendly and interesting, and all levels of experience and interest are welcome. Here are some nice things people have said about previous workshops: “a wonderful creative vibe permeated the afternoon\" \"\"A really nourishing, supportive, playful and welcoming atmosphere\"", "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://www.tickettailor.com/events/vaultcreativearts/2165543", "tags": ["class"], "id": "e716", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "theatre503", "title": "Rapid Write Response: Chewing Gum Dreams", "byline": "Six writers, six directors, six short responses to Michaela Coel’s, Chewing Gum Dreams.", "description": "Pre-Theatre Dining: Audience members can get a 33% discount on food bought at The Latchmere pub between 6pm – 7pm, Monday – Friday! Just show a staff member your ticket confirmation email or e-ticket. Book in advance to avoid disappointment and we hope to see you soon!\n\nPrevious participants include Andrew Thompson, the winner of our 2016 Playwriting Award ( In Event of Moone Disaster ), Anna Jordan ( Yen , Royal Exchange Manchester, Royal Court & Broadway), Stuart Slade ( BU21 , Theatre503 & West End), Chris Urch ( Land of Our Fathers, Theatre503, West End & 2 national tours), Niall McCarthy ( Derry Boys , Theatre503) & Vinay Patel (writer of the BAFTA award winning Murdered by My Father ).", "first_date": "2026-10-18", "last_date": "2026-10-19", "url": "https://theatre503.com/whats-on/rapid-write-response-chewing-gum-dreams/", "tags": ["theatre"], "id": "e717", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "upstairs-gatehouse", "title": "Emmeline Pankhurst", "byline": "EMMELINE PANKHURST ANGEL or ANARCHIST? A powerful onewoman show, starring acclaimed actress Liz Grand, brings to life the extraordinary story of Emmeline Pankhurst, one of the most influential and iconic British women in history.", "description": "A tireless champion of women’s rights, Pankhurst led the fight for women to gain the vote, enduring multiple imprisonments and undertaking numerous hunger strikes in the name of equality.\n\nAfter nearly thirty years of being ignored by Parliament, she famously turned to Direct Action. Under her leadership, the Suffragettes escalated their campaignthrowing stones at politicians, setting fire to letter boxes, damaging property, and chaining themselves to railings - to make their voices impossible to ignore.", "first_date": "2026-10-18", "last_date": "2026-10-18", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173675467", "tags": ["theatre"], "id": "e718", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: The Ballad of Cailleach", "byline": "This all new original Irish-folk musical is set in 1920's Roscommon, in a time of famine, hardship and folklore.", "description": "It is a spiritual and uplifting story following young Aíne as she seeks answers and knowledge from the fae, and the village wisewoman Fiadh, in order to understand the uncertainty around her. It is a mostly light-hearted tale surrounding
