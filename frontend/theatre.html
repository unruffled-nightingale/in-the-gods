ndu, 2001. Inspired by Nepal’s Royal Massacre. The landlocked nation’s civil war is escalating.", "description": "Two feuding households: The Maoist underground bourgeoisie (Montagues) and the Royal establishment (Capulets) are forced to heighten their conflict due to our two famous lovers.\n\nThis adaptation of Romeo and Juliet (through the lens of both Shakespeare and David Garrick) transplants this well known play, into a real and recent conflict, using an unashamedly Brechtian approach: state-controlled news broadcasts interrupt the stage action throughout, projected for the audience alone, so we watch official narrative get built in real time even as we watch it fail the people living through it.\n\nDate & Time: Tuesday 6th October @8:30pm - Golden Goose Theatre.", "first_date": "2026-10-06", "last_date": "2026-10-06", "url": "https://www.goldengoosetheatre.co.uk/whatson/romeaoandjulietinkathmandu", "tags": ["theatre"], "id": "e556", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: Rooftop Revolution", "byline": "Two men retreat to a rooftop and isolate themselves from the world. Hidden away above the city, they spend their days avoiding reality and living within their own small world.", "description": "One day, a teenage girl suddenly bursts onto the rooftop. And they come up with an absurd plan: to hijack a helicopter and escape to a place where they can finally live the ideal lives.\n\nBlending absurd humour with heartfelt storytelling, Rooftop Revolution follows three unlikely companions who dream of escaping the pressures of a world that demands constant success. Originally created in Seoul and reimagined for London, the production explores themes of urban isolation, belonging, and hope that resonate across both cities. Equal parts funny and moving, it celebrates the resilience, imagination, and quiet rebellion of young people searching for a place where they can truly belong.\n\nDate & Time: Tuesday 6th & Wednesday 7th October @7pm", "first_date": "2026-10-06", "last_date": "2026-10-07", "url": "https://www.goldengoosetheatre.co.uk/whatson/rooftoprevolution", "tags": ["theatre"], "id": "e557", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "kings-head", "title": "The Hound of the Baskervilles", "byline": "Arthur Conan Doyle’s classic Sherlock Holmes tale, in a wildly enjoyable, fun-filled comedy mystery.", "description": "When Sir Charles Baskerville is found dead in the grounds of Baskerville Hall, his family estate on Dartmoor, with a look of terror carved on his face and the paw prints of a gigantic hound beside his body, the great detective, Sherlock Holmes , is summoned from Baker Street. With loyal Dr Watson in tow, the legendary sleuths must unravel the mystery, and crack the ancient curse of the Hound of the Baskervilles.\n\nAfter a sell-out run at Bristol’s ‘Tobacco Factory Theatre’, The Hound of the Baskervilles is brought vividly to life at the King’s Head, produced & directed by award-winning director Steven Clarke and written by Olivier Award nominees Steven Canny and J ohn Nicholson.", "first_date": "2026-10-06", "last_date": "2026-10-10", "url": "https://kingsheadtheatre.com/whats-on/the-hound-of-the-baskervilles-y45l", "tags": ["theatre", "comedy"], "id": "e558", "venue_name": "King's Head Theatre", "venue_area": "Islington"}, {"venue_id": "lyric-hammersmith", "title": "August Wilson's Fences", "byline": "Troy is a former baseball player who could’ve gone pro. He spends his days collecting garbage and his evenings spinning stories for family and friends.", "description": "He is funny, charismatic and fiercely proud. He’s also a man with flaws, shaped by a lifetime battling a world that denies his dreams. And the scars run deep.\n\nHis wife, Rose, sees America changing. She dares to believe life can be different and dreams that their son, Cory, will have the freedom that Troy never did. But as she works to break the cycles holding her family back, Troy’s frustration and bitterness threatens to tear them apart.\n\nAlive with rhythms of blues and jazz, humour and heartbreak, Fences is August Wilson ’s Pulitzer prize-winning masterpiece. Set in the 1950’s, it is a timeless and deeply human portrait of grief, love and what it means to be a family in post-war Black America. One of the defining plays of the 20th century, it returns to the UK for the first time in over a decade in a vital new production directed by award-winning director Daniel Bailey ( Red Pitch , West End).", "first_date": "2026-10-06", "last_date": "2026-10-31", "url": "https://lyric.co.uk/shows/august-wilsons-fences/", "tags": ["theatre"], "id": "e559", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "museum-of-comedy", "title": "Fingers on Buzzers", "byline": "The almost award-winning quiz themed podcast, Fingers on Buzzers is BACK!", "description": "Hosts, Jenny Ryan (aka The Chase’s very own Vixen) and her co-partner in quiz, Lucy Porter, are getting back to quizness, as they record more live episodes of their well-loved pod. Whether you’re a Pointless armchair aficionado, nostalgic for the days of Going for Gold, or a bona fide Mastermind, this show is for you, as our hosts welcome celebrity guests to relive their life in quiz and right some past wrongs. There’s also interactive quizzing with the audience and prizes to be won, plus, you'll see TWO episodes recorded before your very eyes. Past guests include; Michael Sheen, Richard Osman, Ben Shephard, Henry Kelly, Les Dennis, Kate Thornton, Annika Rice, Biggins and Tim Vine to name only a few. So, what are you going to do? Will you .... a) Stay at home full of regret b) Leave it too late and miss out on getting a ticket, or will it be c) Secure your ticket NOW and have the time of your quizzing life? The correct answer is of course, C, so see you there!", "first_date": "2026-10-06", "last_date": "2026-11-03", "url": "https://www.museumofcomedy.com/fingers-on-buzzers/", "tags": ["talk"], "id": "e560", "venue_name": "Museum of Comedy", "venue_area": "Bloomsbury"}, {"venue_id": "shakespeares-globe", "title": "Online CPD: Teaching Anti-Racist Shakespeare", "byline": "Learn new skills to build an anti-racist approach to teaching Shakespeare in the classroom in this practical Continuing Professional Development workshop, designed for Secondary English and Drama teachers.", "description": "You’ll examine a selection of extracts through the lens of anti-racism and look at how we can identify parallel occurrences in contemporary society. Led by an experienced Education Practitioner, this session will give you the opportunity to discuss techniques with other teachers and will equip you with a practical toolkit for working with your students.\n\nShakespeare’s Globe is committed to understanding historic bias and racism within our organisation and bringing about lasting change. As part of this conversation our programme includes regular CPDs for teachers and our series of Anti-Racist Shakespeare webinars.", "first_date": "2026-10-06", "last_date": "2027-02-09", "url": "https://www.shakespearesglobe.com/whats-on/anti-racist-shakespeare-cpd/", "tags": ["class"], "id": "e561", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "the-place", "title": "The Seas Between Us", "byline": "A choreographic duet by Dresden-based Taiwanese choreographer Lo Fang-Yun , created in collaboration with Taiwanese dancer Chou Shu-Yi and Berlin-based Singaporean dancer Lee Mun Wai .", "description": "Inspired by the unresolved conflict between China and Taiwan, The Seas Between Us explores how political systems and cultural influences shape personal identity, behaviour and human relationships. Drawing from their distinct dance backgrounds and lived experiences, the performers navigate moments of difference, connection and tension through movement. The work approaches these questions through the language of the body – and opens up a multi-layered space for reflection, encounter and exchange.\n\nLo Fang-Yun is a Taiwanese dancer, choreographer and director based in Germany. After studying dance in Taipei and choreography at the Folkwang University of the Arts in Essen, she founded the label Polymer DMT in 2011 for her own artistic work. The Seas Between Us brings together Lo with Taiwanese dancer, choreographer and curator Chou Shu-Yi , one of Taiwan’s leading contemporary dance artists, and Singaporean performer Lee Mun Wai , who is currently based in Germany and has worked with artists including Claudia Bosse and Xavier Le Roy . Together, they explore questions of identity, politics and cultural exchange through movement and performance.", "first_date": "2026-10-06", "last_date": "2026-10-07", "url": "https://theplace.org.uk/events/autumn-winter-26-the-seas-between-us", "tags": ["dance"], "id": "e562", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "theatre503", "title": "Exploring Directing for Writers & Directors with Katie Mitchell: 3-Week Online Course", "byline": "Email boxoffice@theatre503.com to be added to the waitlist for returns.", "description": "Are you a Writer or Director looking to further your creativity and looking to develop your skills? In this 3 week course, celebrated Director Katie Mitchell will share a plethora of ways to unlock a script and rehearsal process, taken from 40 years experience directing over 100 productions.\n\nTuesday 6 October 2026, Session One: Introducing the skills for theatre directing + pathways for skill development Tuesday 13 October 2026, Session Two: Analysing the timeline of making a production from the director’s point of view + deepening the understanding of each stage Tuesday 20 October 2026, Session Three: Exploring text analysis + introducing a simple six layer analytical system", "first_date": "2026-10-06", "last_date": "2026-10-06", "url": "https://theatre503.com/whats-on/exploring-directing-for-writers-directors-with-katie-mitchell-3-week-online-course/", "tags": ["class"], "id": "e563", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "theatre503", "title": "To the Second Draft….and Beyond: Finding the Play with Safaa Benson-Effiom: Online Masterclass", "byline": "Writing a first draft isn’t easy but you’ve done it! What was once just a collection of thoughts is now words on a page.", "description": "Now those pages need to become a play. But how? In this one-off online masterclass, celebrated playwright Safaa Benson-Effiom will share her wealth of experience to guide you through the next stage of the playmaking process. You’ll explore the key components that make a successful play; asking the big questions to unlock your story so you can approach your redraft with ease.\n\nThanks to our Share The Drama scheme , we want to make sure those of you who are struggling in the current climate can still take part in our Writers Programme. If you would like to book a Share The Drama bursary for the Writer’s Programme, please call our box office on 02079787040 to enquire about payment and availability.\n\nFor further details of the 503Studio’s Accessibility, please visit the Access page of our website.", "first_date": "2026-10-06", "last_date": "2026-10-06", "url": "https://theatre503.com/whats-on/to-the-second-draft-and-beyond-finding-the-play-with-safaa-benson-effiom/", "tags": ["class"], "id": "e564", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "white-bear", "title": "The Girl in the Mask", "byline": "Her mother couldn't accept she was different, and then she went no contact . In the aftermath of her father’s death Amy (19) has taken to wearing a mask.", "description": "It is time for the world and especially her mother, Celia, to see that she is different. But when her mother refuses to acknowledge there’s a problem, Amy and her mother resort to extreme tactics to get what they want from each other.", "first_date": "2026-10-06", "last_date": "2026-10-06", "url": "https://www.whitebeartheatre.co.uk/whatson/the-girl-in-the-mask", "tags": ["theatre"], "id": "e565", "venue_name": "White Bear Theatre", "venue_area": "Kennington"}, {"venue_id": "wiltons", "title": "The Cabinet of Dr Caligari (1920) with live score", "byline": "Step into the twisted fairground of the night, where shadows sharpen like knives and the mind plays its most dangerous tricks.", "description": "The Cabinet of Dr. Caligari (1920) unfolds like a nightmare: jagged streets tilt against impossible skies, doors gape like mouths, and every angle threatens a secret. At its heart lurks the enigmatic Dr. Caligari and his sleepwalking pawn, Cesare—an ominous duo whose presence stains the town with dread. What is performance, and what is control?\n\nThis landmark of German Expressionism still crackles with menace and wonder, and is brought to life with a brand new piano score from Tom Marlow of The Lucky Dog Picturehouse .\n\nThe Musicians of The Lucky Dog Picturehouse are dedicated to recreating the original cinema experience; bringing together classic silent films and live, period specific music. They have performed and lectured at BFI Southbank, LoCo Film Festival, London Transport Museum and numerous other venues across the UK.", "first_date": "2026-10-06", "last_date": "2026-10-06", "url": "https://wiltons.org.uk/whats-on/the-cabinet-of-dr-caligari-1920-with-live-score/", "tags": ["theatre", "concert"], "id": "e566", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "camden-peoples-theatre", "title": "How to Create a Life (WIP)", "byline": "Warm, irreverent, and occasionally unhinged, How to Create a Life, is a verbatim work-in-progress with a big heart, that asks the big questions in life.", "description": "Featuring real interviews with people from all walks of life, Francesca navigates themes of fertility, expectation, grief, and uncertainty, while acknowledging the possibility that maybe ‘creating a life’ starts with the one you’re already living.\n\nFollowing its hugely successful debut as part of CPT’s prestigious Starting Blocks scheme earlier this year, How to Create a Life returns with a bang as it takes its next steps into the world.", "first_date": "2026-10-07", "last_date": "2026-10-07", "url": "https://cptheatre.co.uk/whatson/How-to-Create-a-Life-WIP", "tags": ["theatre"], "id": "e567", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "camden-peoples-theatre", "title": "We Talk About Death In The Swimming Pool (WIP)", "byline": "We Talk About Death In The Swimming Pool explores the personal and political intersection of the Terminally Ill Adults End of Life Bill, health equity…", "description": "We Talk About Death In The Swimming Pool explores the personal and political intersection of the Terminally Ill Adults End of Life Bill, health equity, death admin and anticipatory grief - as well as the joy of living life alongside grief and illness. Told through interwoven stories, new writing, physical performance, and projection, WTADITSP asks questions about death, grief, and health inequality.\n\nAssisted dying is already a legal end-of-life option for 100 million+ people worldwide, but access to quality palliative care, mental health provision and social support in the UK remains unequal. The Terminally Ill Adults (End of Life) Bill is currently in the House of Commons awaiting its Second Reading. The bill previously ran out of time in the House of Lords and failed to pass before the end of the 2024–26 parliamentary session.\n\nThis Work In Progress follows development through Complicite’s Mudlarks & Lighthouse Poole’s Sanctuary Artist Development Programme.", "first_date": "2026-10-07", "last_date": "2026-10-07", "url": "https://cptheatre.co.uk/whatson/We-Talk-About-Death-In-The-Swimming-Pool-WIP", "tags": ["theatre"], "id": "e568", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: Chop-Chop!", "byline": null, "description": null, "first_date": "2026-10-07", "last_date": "2026-10-07", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth%20fringe%3A%20chop-chop!", "tags": ["theatre"], "id": "e569", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "greenwich-theatre", "title": "A Trio of Tennessee Williams", "byline": "Tennessee Williams’ trio invites audiences to awaken from passivity and step into three vivid, unsettling worlds where longing, despair and fragile hope collide.", "description": "In The Fat Man’s Wife, Vera returns from a glittering Broadway party only to face a deeper internal conflict, drawn toward a young playwright who urges her to leave New York and “steer by the stars.” Talk to Me Like the Rain and Let Me Listen shifts to a couple trapped in economic depression, circling through deprivation, drunkenness and unreachable dreams of escape. 27 Wagons Full of Cotton exposes the darker side of survival when a cotton gin mysteriously burns and a dysfunctional marriage reveals the cost of desperation. Together, these plays illuminate the quiet storms within ordinary lives and the choices people make when cornered by circumstance.", "first_date": "2026-10-07", "last_date": "2026-10-09", "url": "https://greenwichtheatre.org.uk/events/a-trio-of-tennessee-williams/", "tags": ["theatre"], "id": "e570", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hoxton-hall", "title": "DAUNTLESS – Grace O’Malley, Pirate Queen", "byline": null, "description": null, "first_date": "2026-10-07", "last_date": "2026-10-07", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173687164", "tags": ["theatre"], "id": "e571", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "national-theatre", "title": "Some Woman", "byline": "Julie Robson is used to being overlooked. At work, at home, everywhere in between.", "description": "But when an encounter on a station platform goes wrong and all eyes are suddenly on Julie, something shifts within her and she feels compelled to make a stand.\n\nWhat happens when an ordinary woman pits herself against the forces that shape the world? What happens when she refuses to be quiet?", "first_date": "2026-10-07", "last_date": "2026-11-21", "url": "https://www.nationaltheatre.org.uk/productions/some-woman/", "tags": ["theatre"], "id": "e572", "venue_name": "National Theatre", "venue_area": "South Bank"}, {"venue_id": "shakespeares-globe", "title": "Research in Action: Global Early Modern Stage", "byline": "Join this special workshop in the Sam Wanamaker Playhouse which invites us to reconsider the global nature of early modern English drama.", "description": "Reshape your understanding of how playwrights engaged with cross-cultural encounters and identities, discovering how Shakespeare and other early modern dramatists represented the world, and people, beyond England’s borders.\n\nJoin Professor Matthew Dimmock (University of Sussex) and Dr Sarah Dustagheer (University of Kent) who are leading a major new digital project to identify every non-Christian and non-European dramatic character on the Renaissance stage.", "first_date": "2026-10-07", "last_date": "2026-10-07", "url": "https://www.shakespearesglobe.com/whats-on/research-in-action-global-early-modern-stage/", "tags": ["class"], "id": "e573", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "the-cockpit", "title": "The Addams Family", "byline": "Wednesday Addams, the ultimate princess of darkness, has grown up and fallen in love with a sweet, smart young man from a respectable family.", "description": "She confides in her father and begs him not to tell her mother. Now, Gomez Addams must do something he’s never done before – keep a secret from his wife. What could possibly go wrong? Everything will change on the fateful night the Addams family hosts a dinner for Wednesday’s “normal” boyfriend and his parents.\n\nA delightfully dark musical comedy that's funny, heartfelt, and unmistakably Addams. Don’t miss your chance to see that show that never dies on stage at The Cockpit this October.\n\nBased on Characters Created by Charles Addams Originally produced on Broadway by Stuart Oken, Roy Furman, Michael Leavitt, Five Cent Productions, Stephen Schuler, Decca Theatricals, Scott M. Delman, Stuart Ditsky, Terry Allen Kramer, Stephanie P. McClelland, James L. Nederlander, Eva Price, Jam Theatricals/Mary LuRoffe, Pittsburgh CLO/GuttermanSwinsky, Vivek Tiwary/Gary Kaplan, The Weinstein Company/Clarence, LLC, Adam Zotovich/Tribe Theatricals", "first_date": "2026-10-07", "last_date": "2026-10-10", "url": "https://www.thecockpit.org.uk/show/the_addams_family_", "tags": ["musical"], "id": "e574", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "wiltons", "title": "INCENDIARY – Samuel Pepys in Words and Music", "byline": "Pepys’s immortal account of ordinary life in extraordinary times, brought to life by Edward Bennett (RSC Associate, Bridgerton, SAS Rogue Heroes ) and leading Baroque soprano, Grace Davidson ( Max Richter’s Sleep, Tenebrae…", "description": "Pepys’s immortal account of ordinary life in extraordinary times, brought to life by Edward Bennett (RSC Associate, Bridgerton, SAS Rogue Heroes ) and leading Baroque soprano, Grace Davidson ( Max Richter’s Sleep, Tenebrae, Wolf Hall Live and film/TV, including Hamnet, Frankenstein, The Mirror and the Light ), accompanied by acclaimed lutenist, Daniel Murphy .\n\nCombining Pepys’s inimitable words with the ethereal Baroque and the earthy Broadside Ballads of London’s streets, Hambletts productions ( Red Sky at Sunrise, A Beautiful Thread, By A Lady ) are “mighty glad” to return to Wilton’s with this explosive production.\n\nAdapted by: Deirdre Shields Samuel Pepys: Edward Bennett Elizabeth Pepys: Grace Davidson Lute: Daniel Murphy", "first_date": "2026-10-07", "last_date": "2026-10-08", "url": "https://wiltons.org.uk/whats-on/incendiary-samuel-pepys-in-words-and-music/", "tags": ["theatre", "concert"], "id": "e575", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "arcola", "title": "The Banality of Evil: Hannah Arendt, France, 1940", "byline": "In May 1940, three German Jewish women are arrested in France – Hannah Arendt, who would become one of the 20th century’s most influential political theorists, the artist Charlotte Salomon, and the Communist schoolgirl Eva Daube.", "description": "Branded “Undesirables” and transported to Camp Gurs, they find themselves among thousands of prisoners held by the state that once promised them refuge. As German forces advance, each woman must confront an impossible choice: stay and hope for liberation, or risk her life to escape into a dangerous and unknown future.\n\nBlending satire, physical theatre and cabaret, The Banality of Evil draws on archival research and testimony to reveal forgotten histories of women caught between exile, imprisonment and survival. At its centre is a pivotal moment in the life of 33 year-old Hannah Arendt that would later inform her writing on power and human rights.", "first_date": "2026-10-08", "last_date": "2026-11-07", "url": "https://www.arcolatheatre.com/event/the-banality-of-evil/", "tags": ["theatre"], "id": "e576", "venue_name": "Arcola Theatre", "venue_area": "Dalston, E8"}, {"venue_id": "brixton-house", "title": "Baby", "byline": "Baby’s bright and beautiful. Baby’s trouble. Baby can do things nobody else can and why not? Britain’s got talent, hasn’t it?", "description": "Baby’s had it tough and she wants to keep Bliss. That’s all she wants. But something terrible stands in her way.\n\nNow Baby has to solve a problem….and you’re part of her solution. Because you’re proper people. You must be, to be reading this. Plus, there’s nobody else she can ask…", "first_date": "2026-10-08", "last_date": "2026-10-31", "url": "https://brixtonhouse.co.uk/shows/baby/", "tags": ["theatre"], "id": "e577", "venue_name": "Brixton House", "venue_area": "Brixton"}, {"venue_id": "camden-peoples-theatre", "title": "Trans People Are Awful", "byline": "Armed with a camera, a vivid imagination, and an axe he bought on Facebook marketplace; Boy is explaining to you his quest to complete the perfect transition.", "description": "His method, (killing cis men and stealing their body parts), may be unconventional, but it does bypass NHS waiting times.\n\nWhen a routine kill goes wrong and Boy encounters something he didn't prepare for, his meticulous plan begins to unravel. Forced to confront the reality of his actions, Boy must decide how far he is truly willing to go to become himself.\n\nTrue crime cut up with dark comedy, 'Trans People are Awful' dissects identity, morality and the effects of extreme loneliness.", "first_date": "2026-10-08", "last_date": "2026-10-17", "url": "https://cptheatre.co.uk/whatson/Trans-People-Are-Awful-26", "tags": ["theatre"], "id": "e578", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "camden-peoples-theatre", "title": "I AM JOHNNY", "byline": "Attempting to embrace openness while navigating the pressures of his troubled masculinity, thirty something northern white male Johnny has found the spoken word scene.", "description": "He's watched the poet lads on Instagram and TikTok, reckons he's got the gist, and now he's ready to express his complex feelings. But in a world where vulnerability has become a performance, is the audience ready for the truth?\n\na gripping and intimate exploration of masculinity, emotional exposure, and the quiet expectations that sit beneath honesty.\n\nParr commented “With I AM JOHNNY my intention is to bring a nuanced perspective to this topic—one shaped and held by a female voice. The show seeks to hold up a mirror to reality, offering both confrontation and liberation”", "first_date": "2026-10-08", "last_date": "2026-10-09", "url": "https://cptheatre.co.uk/whatson/I-AM-JOHNNY", "tags": ["spoken-word"], "id": "e579", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: Perennial Patterns", "byline": "Perennial Patterns is an exciting new kind of theatre show: a Non-Fiction Musical.", "description": "Blending musical theatre with academic seminar, this genre-bending performance combines original music, artwork, and live visuals in a colourful, humorous, thought-provoking theatrical experience.\n\nExploring the connections between ancient myth and modern psychology, Perennial Patterns invites audiences into a playful yet insightful conversation about the voices in our heads and the patterns that shape our lives.\n\nThis Production is using a third-party ticketing provider.", "first_date": "2026-10-08", "last_date": "2026-10-08", "url": "https://www.goldengoosetheatre.co.uk/whatson/perennialpatterns", "tags": ["theatre", "musical"], "id": "e580", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hackney-empire", "title": "The Nature of Forgetting", "byline": "Following more than 200 performances worldwide, Theatre Re brings its explosive, powerful and joyous piece about what is left when memory is gone back to London for its landmark 10th Anniversary Season.", "description": "Developed with Neuroscience Professor Kate Jeffery and the Alzheimer’s Society, The Nature of Forgetting is a life-affirming journey into a weakening mind, where fragmented does not have to mean defeated.\n\nAs one of the UK’s leading visual theatre companies, Theatre Re combines original live music with striking visual performance to create deeply moving, non-verbal theatre about universal human challenges and the fragility of life.", "first_date": "2026-10-08", "last_date": "2026-10-08", "url": "https://www.hackneyempire.co.uk/events/the-nature-of-forgetting", "tags": ["theatre", "concert"], "id": "e581", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "hope-theatre", "title": "F--K ME, I'M GRIEVING", "byline": "F--K ME, I’M GRIEVING is a dark comedy that explores the connection between grief and desire, and what happens when we try to ignore those feelings.", "description": "In the beige forgotten basement of a free counseling center, a particularly horny bereavement group and their cold-hearted counselor hold weekly sessions. When a newcomer admits to having an increased sex drive- the others slowly confess similar feelings. Drawing together Hope, a nonbinary teen whose grief is paused by their desire to try butt-plugs. Nida, a grandmother in her sixties who obsesses over Billy Crystal movies to feel something, and Ric, a happy-go-lucky guy in his late twenties who can't stop fantasizing about May, their counselor. May is in disbelief, as she tries to stay professional without revealing her grief fetish, or the fact that there’s a sudden gap in her memory that Nida seems to know more about than she lets on. Through a non-linear narrative that mirrors the roller-coaster of grief, F--K ME, I’M GRIEVING pushes-back against this idea that there is a right way to grieve, destigmatizing the shame surrounded by sex and death. It’s funny, heart-breaking, absurd, disturbing and horny; just as sex is, as grief can be.", "first_date": "2026-10-08", "last_date": "2026-10-10", "url": "https://www.thehopetheatre.com/imgrieving", "tags": ["theatre"], "id": "e582", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "ica", "title": "In the Round: Gilla Band (SOLD OUT)", "byline": "For over ten years now, the Dublin quartet have been redefining what you could loosely call “rock music” in the 21st century, influencing a wide swath of similarly forward-thinking guitar acts along the way.", "description": null, "first_date": "2026-10-08", "last_date": "2026-10-08", "url": "https://www.ica.art/live/gilla-band", "tags": ["concert"], "id": "e583", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "jermyn-street", "title": "Ghosts", "byline": "Norway, 1881. Years ago, Helene sent her beloved son away from the family home. Today, Oswald returns.", "description": "His arrival coincides with the grand opening of an orphanage to commemorate the tenth anniversary of his father’s death. But as mother and son reunite, long-buried secrets emerge – setting off a chain reaction that threatens to consume them both.", "first_date": "2026-10-08", "last_date": "2026-11-14", "url": "https://www.jermynstreettheatre.co.uk/show/ghosts/", "tags": ["theatre"], "id": "e584", "venue_name": "Jermyn Street Theatre", "venue_area": "St James's"}, {"venue_id": "pleasance-islington", "title": "LATE NIGHT FAKEAWAY", "byline": "Welcome to Holly & Brooke's 'Late Night Fakeaway'... they've nicked Ant & Dec's jobs and are now hosting the new silliest comedy night in town. Silly sketches, guest stars and a whole pizza box of laughs - feed your laughter craving x", "description": "For more information about our venues and performance spaces, please visit our access pages here .\n\nAssistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-10-08", "last_date": "2026-10-08", "url": "https://www.pleasance.co.uk/event/late-night-fakeaway", "tags": ["comedy"], "id": "e585", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "stone-nest", "title": "MOURN", "byline": "MOURN unfolds through a series of poetic scenes, moving between concert, theatre and ritual, asking how we come to terms with death, and how we say farewell to those we love most.", "description": "At the heart of the performance is the funeral lament. In Renaissance Italy, composers looked to Ancient Greek tragedy to create a new style poised between speech and song. Lament became one of early opera’s defining forms, its influence spreading across Europe, reaching Henry Purcell’s Dido & Aeneas 1000 miles away in England. Across the Adriatic, however, the mourning traditions which had been preserved in Greek tragedy had never disappeared. Throughout the Balkans, lament remained part of everyday life: sung not for the stage, but outward to a community of the living, the dead and the divine. MOURN places these parallel traditions side by side - the imagined antiquity of Western European music and the living inheritance of the Balkans. Traditional polyphonies from Albania, Epirus, and Thrace meet works by Claudio Monteverdi, Barbara Strozzi, and Carlo Gesualdo, constructing a ritual of grief that reaches across geography and time.\n\nHistorically informed performance ensemble FIGURE has been praised in The Times for its “high-risk, high-reward” projects, and in The Guardian as musically “unequivocally impressive, its sound invigorating, its commitment absolute”. Alkanna Graeca is a vocal trio blending raw folk traditions from the Balkans, Mediterranean, and Black Sea with free improvisation, whose “spine-tingling harmonies and dissonances have reinvented ancient polyphony for a contemporary audience”.", "first_date": "2026-10-08", "last_date": "2026-10-10", "url": "https://www.stonenest.org/events/mourn-oct-2026", "tags": ["theatre", "concert"], "id": "e586", "venue_name": "Stone Nest", "venue_area": "Soho"}, {"venue_id": "the-albany", "title": "Power in Play", "byline": "Explore game stations featuring ludo, dominoes, ampe, tinko, and more - each with the stories and traditions that make them part of African and Caribbean heritage.", "description": "Test your knowledge in a lively quiz, laugh through hand-clapping and movement games, and finish with a high-energy Tinko tournament that has everyone cheering.\n\nCreated by FTBK (For The Big Kids), this event celebrates community, culture, and the wellbeing benefits of play. Reconnect with old favourites, discover new games, and leave reminded that play is not just for kids - it’s a powerful way to connect, relax, and have fun as adults. Join us for a joyful, intergenerational night of games, stories, and pure fun.", "first_date": "2026-10-08", "last_date": "2026-10-08", "url": "https://www.thealbany.org.uk/events/power-in-play-2026", "tags": ["social"], "id": "e587", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "etcetera", "title": "HAMLET: A HALF-HOUR COMEDY", "byline": "Is it a tragedy? Is it a comedy? Three Italians tackle Shakespeare's most known tragedy filling it with humour and explosiveness. Flips, tap dance, singing, raving... 45 minutes of pure entrainment. One night only.", "description": null, "first_date": "2026-10-09", "last_date": "2026-10-09", "url": "https://www.etceteratheatrecamden.com/events/hamlet-a-half-hour-comedy", "tags": ["theatre", "comedy"], "id": "e588", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: Alternatives To Love", "byline": "ATL is a partially devised piece focusing on the bastardisation of human connection and how we often forget to form truly intimate relationships of any kind— familial, romantic, platonic, or even our interactions with strangers.", "description": "It began as a conversation about psychosis onset by AI romantic partners but has developed into a broader conversation on the diminishing of human connection- I mean, when was the last time you complimented a stranger, or asked a random person on the street for directions? By blending script, physical theatre, and chorus, with an episodic structure, we explore various pitfalls in today's inter-personal relationships whilst also highlighting multiple moments of hope. This array of approaches mimics the various ways we as humans connect and create, building a microcosm of our society to challenge what it means to connect in a genuine way in our 21st century amidst rising technology and other ginormous world issues.\n\nThis Production is using a third-party ticketing provider.", "first_date": "2026-10-09", "last_date": "2026-10-09", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-alternatives-to-love", "tags": ["theatre"], "id": "e589", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hackney-empire", "title": "Simon Amstell: I Love It Here", "byline": "I Love It Here is the latest creation from the internationally acclaimed comedian and filmmaker behind the Netflix stand-up special Set Free and the feature films Benjamin and Carnage .", "description": "At a friend’s beach house just outside Los Angeles, Simon finally finds peace: he is in love, free, released from the need to perform. But when an invitation arrives from the man who first ignited his teenage desire, that fragile calm is thrown into chaos. What follows is a desperate, hilarious attempt at surrender, during a night of overwhelming stimulation - the raw material for this extraordinary new show.\n\nFind out about getting here, access & support, plus food & drink", "first_date": "2026-10-09", "last_date": "2026-10-09", "url": "https://www.hackneyempire.co.uk/events/simon-amstell-i-love-it-here", "tags": ["stand-up"], "id": "e590", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "hen-and-chickens", "title": "Mara (world premiere)", "byline": "Cast and Creative Team Performer Angela Peters Writers Robin King and Eirini Konstantinidou", "description": null, "first_date": "2026-10-09", "last_date": "2026-10-11", "url": "https://www.unrestrictedview.co.uk/events/mara", "tags": ["theatre"], "id": "e591", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "immersive-rumours", "title": "The Nightmare Realm", "byline": "For more than sixteen years, The Nightmare Realm has built original worlds, unforgettable characters and award-winning Halloween experiences in Ireland. This October marks a new chapter.", "description": "For the first time, The Nightmare Realm crosses the Irish Sea, bringing its unique brand of cinematic horror to London. But we didn’t come to recreate what you’ve seen before. We’ve come to tell a brand new story.\n\nInside Avery Hill Mansion, A Nightmare From Overseas unfolds through two headline immersive horror attractions, Halloween Town and hidden experiences woven throughout the Realm. Every environment, every character and every encounter has been created exclusively for this chapter.", "first_date": "2026-10-09", "last_date": "2026-11-01", "url": "https://thenightmarerealm.com/", "tags": ["immersive"], "id": "e592", "venue_name": "Immersive Rumours", "venue_area": "London"}, {"venue_id": "playground-theatre", "title": "Spit Verse & DUB", "byline": "Spit Verse & DUB is more than a performance—it's a celebration of Caribbean voice, rhythm, and storytelling.", "description": "Uniting the extraordinary talents of acclaimed Jamaican spoken word artist Judith Falloon-Reid and internationally celebrated dub poet Malachi Smith, this captivating production blends spoken word, poetry, storytelling, and dub poetry into a rich tapestry of culture, identity, resilience, love, social justice, and hope. Powerful, authentic, and deeply engaging, Spit Verse & DUB entertains, inspires, and challenges audiences, leaving them moved long after the final verse. Incorporating reggae rhythms and jazz in a style she calls jazzetry, Judith’s poetry can be hard hitting, tackling social and controversial issues while not neglecting her softer, more nostalgic side with love poems and odes to Jamaica. Drawing from a rich and expansive body of work, Malachi commands the stage with compelling dub poetry that challenges social and political injustice with the same passion and artistry that he honors love, celebrates Caribbean identity, and pays tribute to the region's legendary icons.\n\nJudith Falloon-Reid is an internationally acclaimed Jamaican poet, spoken word artist, author, filmmaker, and inspirational speaker whose performances have captivated audiences across the Caribbean, North America, Central America, Europe, and beyond. Blending poetry, storytelling, rhythm, and social commentary, her work explores themes of identity, faith, justice, resilience, and the shared human experience through a distinctly Jamaican voice. She is the creator of the acclaimed poetry collection I Am No Poet and is a featured performer at literary festivals, theatres, schools, and cultural events around the world. Beyond the stage, Judith is an award-winning filmmaker, broadcaster, and author of numerous novels, children’s books, and inspirational works, including books inspired by her journey as the first Jamaican woman to visit Antarctica. With more than 40 years in the creative arts, she was recognized by the City of Los Angeles in 2022 for her lifetime contribution to the creative arts. Based in Panama, she continues to inspire audiences worldwide through the transformative power of poetry, spoken word, and storytelling.\n\nMalachi Smith is an internationally acclaimed Jamaican dub poet, educator, performer and cultural ambassador. Known for his powerful command of language, rhythm and social consciousness, he has performed throughout the Caribbean, North America, Europe and Africa. His work explores themes of identity, justice, history and empowerment, delivered through the rich tradition of Jamaican dub poetry. Malachi's performances are celebrated for their authenticity, energy and ability to connect audiences across cultures and generations.", "first_date": "2026-10-09", "last_date": "2026-10-09", "url": "https://www.theplaygroundtheatre.org.uk/projects/spit-verse-and-dub", "tags": ["spoken-word"], "id": "e593", "venue_name": "The Playground Theatre", "venue_area": "North Kensington"}, {"venue_id": "shoreditch-town-hall", "title": "16 Acts", "byline": "Shoreditch Town Hall has always had a taste for variety, having been granted a license in the 1880s to become a music hall - 160 years after we opened, we’re keeping the tradition alive in our building.", "description": "And, in 160 years, we’ve seen some things.\n\n16 Acts is where experimental art meets light entertainment. Expect cabaret, drag, music, dance, comedy, surprises, social commentary, and whatever else we can fit into the mix.\n\nLine-up includes: The Cocoa Butter Club , Emma Frankland , Fabio Lezonli , Fanny Bleach , Frankie Thompson , Lavinia Co-op , Operotica , Riss Obolensky , Pecs Drag Kings ' Shardeazy Afrodesiak , Sigi Moonlight , Daddy Pecs and John Travulva , and lots more to be announced – hosted by your favourite cult cabaret legends Bourgeois & Maurice . Check back soon for the full line-up.", "first_date": "2026-10-09", "last_date": "2026-10-09", "url": "https://shoreditchtownhall.com/whats-on/16-acts", "tags": ["cabaret"], "id": "e594", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "tabernacle", "title": "Reinhardt Buhr in Concert", "byline": "Reinhardt Buhr is a live-looping artist who started out playing the guitar and then added various instruments to his live set including electric cello, didgeridoo, piano, drums, hang drum, shofar, electric saxophone and more.", "description": "But his rise in the music scene was accompanied by a descent into a dark period of substance abuse, leaving him disconnected from his true self and from his surroundings. It was only after reaching a profound low that Reinhardt turned to God for help. In 2016, Reinhardt and his wife experienced a life-changing spiritual awakening that marked the beginning of their healing and salvation journey. This transformation not only restored Reinhardt’s life but also redefined his purpose as a musician. Following this new direction, he has accumulated over 2 million social media fans who are captivated by the authenticity and spiritual depth of his performances. Doors open 7.15pm *Main area in the theatre is STANDING ONLY. Some unreserved seats are available on the balcony. Tickets", "first_date": "2026-10-09", "last_date": "2026-10-09", "url": "https://www.thetabernaclew11.com/events/2026/10/9/reinhardt-buhr-in-concert", "tags": ["concert"], "id": "e595", "venue_name": "The Tabernacle", "venue_area": "Notting Hill"}, {"venue_id": "the-place", "title": "A Place to Dance", "byline": "Brazilian choreographer Poliana Lima and British flamenco dance artist Yinka Esi Graves draw on their multiple cultural heritages to create an encounter that places the body at the centre of transformation, connection and community.", "description": "Performed in-the-round, A Place to Dance dissolves the boundaries between audience and performer, inviting everyone into a shared space where watching becomes an act of presence and dancing an invitation to belong. Featuring music from DJ Oumoukala , this immersive experience celebrates the body as communal, porous and thrillingly alive.\n\nYinka Esi Graves (she/her) is a British choreographer and dancer based in Spain. Her work explores connections between flamenco and contemporary performance through an Afro-diasporic lens, positioning the body as a site of memory, dialogue and transformation. Working across stage productions, live composition and collaborative projects, she has developed a distinctive choreographic voice that bridges cultures and traditions. Her acclaimed solo work, The Disappearing Act (2023), premiered at the Nîmes Flamenco Festival and has since been presented at leading international festivals including El Grec, Tanz im August and the Avignon Festival , establishing her as one of the most distinctive voices working across contemporary dance and flamenco today.\n\nPoliana Lima (she/her) is a Brazilian choreographer, dancer and teacher whose work combines her background in sociology and dance to explore the body as a site of expression, research and encounter. Interested in creating stage works that communicate with audiences in both simple and profound ways, she has developed a distinctive choreographic practice over the past 15 years. Lima has created eight full-length works alongside numerous shorter pieces and projects and was an associate artist at Condeduque Madrid from 2018–2020. Her work has been supported by leading international organisations and festivals including Teatros del Canal, CND Pantin, Festival Dias da Dança and Aerowaves .", "first_date": "2026-10-09", "last_date": "2026-10-10", "url": "https://theplace.org.uk/events/autumn-winter-26-a-place-to-dance", "tags": ["dance"], "id": "e596", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "the-place", "title": "Femina", "byline": "The highly anticipated new work from award-winning choreographic duo Ekleido ( Hannah Ekholm and Faye Stoeser ); Femina questions how femininity is perceived, embodied and valued through time.", "description": "Enter a mesmerising world characterised by Ekleido’s signature fusion of contemporary and club styles, where six dancers commune and transcend through an electronic musical landscape. Set to an original score by world-renowned musicians Floating Points (Mercury Prize nominee), Ela Minus and Stella Mozgawa , Femina looks at the spectrum of femininity in a layered, electrifying performance.\n\nEkleido is a choreographic duo formed by Hannah Ekholm and Faye Stoeser , recognised for creating mesmerising and dynamic work across live performance and film. Their artistic practice embraces multidisciplinary collaboration, working closely with leading figures in the electronic music scene. Ekleido’s distinctive choreographic voice combine’s a unique blend of contemporary dance with underground club dance influences.", "first_date": "2026-10-09", "last_date": "2026-11-07", "url": "https://theplace.org.uk/events/femina", "tags": ["dance"], "id": "e597", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "wiltons", "title": "Harold Lloyd’s Safety Last! (1923) with live score", "byline": "Celebrate over a century of harebrained schemes and vertigo-inducing scenes with the lovable Harold Lloyd !", "description": "A publicity stunt gets out of hand and leads to a death-defying police chase as our hapless hero attempts to simultaneously impress his girlfriend and save his job.\n\nSafety Last! features one of the most iconic set-piece scenes in film history and cemented Lloyd as one of the bravest comedians in Hollywood, continuing to perform all his own death-defying stunts – despite having already lost a thumb and finger doing the same.", "first_date": "2026-10-09", "last_date": "2026-10-09", "url": "https://wiltons.org.uk/whats-on/harold-lloyds-safety-last-1923/", "tags": ["concert", "theatre"], "id": "e598", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "camden-peoples-theatre", "title": "Queer Revolutionary Singalong", "byline": "The Black Smock Band's legendary LGBTQ+ singalongs have been building communities and solidarity since 2010 From living rooms and pubs to May Day celebrations and community spaces…", "description": "The Black Smock Band's legendary LGBTQ+ singalongs have been building communities and solidarity since 2010 From living rooms and pubs to May Day celebrations and community spaces, the band unapologetically puts the woke into folk and invites everyone to join in. Expect a warm-up set from the band, followed by a mass singalong of resistance classics, from 'Bread and Roses' to 'Solidarity Forever'. Song sheets will be provided. There will also be a limited number of floor spots. If you have a song that fits the vibe, and you'd like to share it, get in touch with the band via https://bit.ly/BSBFloorSpots.", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://cptheatre.co.uk/whatson/Queer-Revolutionary-Singalong-26", "tags": ["concert"], "id": "e599", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "donmar", "title": "Ilford Boy", "byline": "Mixed-race teenager Ted Martin is growing up in 90s East London in a house full of chaos, laughter and tough love.", "description": "Illustration by Justin Teodoro. We also wish to acknowledge and thank Talivaldis Stubis, who illustrated the now-iconic poster for the Broadway and theatrical productions of “Funny Girl.” Stubis was a prolific graphic artist who designed and illustrated hundreds of celebrated movie and theatre posters as well as some two dozen popular and beloved children’s books.\n\nWe would also like to thank our Production Supporters, Mo Fisher & Claude Keith, and Crawford & Mary Harris", "first_date": "2026-10-10", "last_date": "2026-11-28", "url": "https://www.donmarwarehouse.com/events/ilford-boy#content-dates-and-times", "tags": ["theatre"], "id": "e600", "venue_name": "Donmar Warehouse", "venue_area": "Covent Garden"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: The Big Cheese", "byline": "A brand new comedy original created by Bylli Gomez and brought to the stage by a fantastic ensemble cast of actors. ‘The Big Cheese’ is a chaotic, raw and fiercely funny comedy-drama following the life of a woman who plays by her own rules.", "description": "Bee is a failed artist in her 30s who is broke and living at home with her overbearing mother. Between her perfect best friend and her perpetually-unimpressed boyfriend, Bee feels the pressure to get her life on track. Determined to get a job at any cost, she claws her way into a trial shift at a posh cheese shop.\n\nVictory! How hard can it be to sell a bit of cheese and land the job?", "first_date": "2026-10-10", "last_date": "2026-10-11", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth-fringe-the-big-cheese", "tags": ["theatre", "comedy"], "id": "e601", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hackney-empire", "title": "Adam Rowe: Fashionism", "byline": "A show about trying to see everyone’s point of view, especially those you hate. And some other dead funny stuff too.", "description": "Find out about getting here, access & support, plus food & drink", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://www.hackneyempire.co.uk/events/adam-rowe-fashionism", "tags": ["stand-up"], "id": "e602", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "half-moon", "title": "Rabbit and Rey and the Lost Things", "byline": "A joyful adventure for families with curious minds and big hearts, and for anyone who has ever felt a little out of step.", "description": "Ever felt like the world is playing hide and seek with your stuff? One moment it’s there… the next, pooff! Your toy, your glasses, your book, your sock… even your ideas, gone.\n\nThen come and meet Rey, an imagination expert and glorious misplacer of things, and Rabbit, a wise and loyal bunny who is always there when the world feels too much. Together they set off on a quest to find what’s been lost, only to discover they’re not alone.", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://www.halfmoon.org.uk/events/rabbit-and-rey-and-the-lost-things/", "tags": ["theatre"], "id": "e603", "venue_name": "Half Moon Theatre", "venue_area": "Limehouse"}, {"venue_id": "hen-and-chickens", "title": "Not Everything is Significant", "byline": "Either way, his life is going to take some strange turns, via diabetic Mariachi bands, yawntalkers, and the 4000 rules of exaggeration.", "description": "But whatever he discovers along the way, surely not everything is significant.\n\nA work-in-progress revival of the 2008 Edinburgh Fringe hit, this is a rare chance to see a piece not performed in nearly 20 years.", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://www.unrestrictedview.co.uk/events/not-everything-is-significant", "tags": ["stand-up"], "id": "e604", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "hoxton-hall", "title": "Jazz Sabbath", "byline": null, "description": null, "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://tickets-hoxtonhall.hoxtonhall.co.uk/ticketbooth/shows/1173650597", "tags": ["concert"], "id": "e605", "venue_name": "Hoxton Hall", "venue_area": "Hoxton"}, {"venue_id": "ica", "title": "In the Round: Issy Wood", "byline": "A very rare performance from acclaimed artist Issy Wood, who lives and works in London.", "description": "Her music explores the states of her inner and outer emotional world in a vulnerable yet playful manner, laid out through confessional lyrics encapsulated within lo-fi pop and synthesizers. Support from Keeper.", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://www.ica.art/live/issy-wood", "tags": ["concert"], "id": "e606", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "little-angel", "title": "Relaxed Performance - The Pied Piper: A Rat's Tale", "byline": "You think know the story of the Pied Piper of Hamelin ?— But do you?", "description": "Here’s the tale of Horatio, the brave little rat behind the legend. When Horatio escapes the dull life of an ordinary river rat for the sights, sounds and smells of Hamelin, he soon finds himself caught up in a whirlwind of adventure.\n\nHis imprisonment sparks a rat invasion, the arrival of the mysterious Pied Piper, and a heroic tale waiting to be told. With puppetry, storytelling and original music, The Pied Piper : A Rat’s Tale is a funny and imaginative family show that reveals the story behind the story.", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://www.littleangeltheatre.com/whats-on/relaxed-performance-the-pied-piper-a-rats-tale/", "tags": ["theatre", "puppetry"], "id": "e607", "venue_name": "Little Angel Theatre", "venue_area": "Islington"}, {"venue_id": "lyric-hammersmith", "title": "Snip Snap! Rapunzel Retold", "byline": "Join us for the iconic story of impossibly long hair, ties that bind and the desire to belong, of cutting loose and new beginnings.", "description": "Full of humour, magic and surprising costume transformations, Snip Snap! reimagines the familiar with enchanting original imagery and playful glove puppets.", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://lyric.co.uk/shows/snip-snap-rapunzel-retold/", "tags": ["theatre", "puppetry"], "id": "e608", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "orange-tree", "title": "Saturday Seminar: a small and quiet light", "byline": "Our Saturday Seminars offer audiences the chance to go beyond the stage.", "description": "Taking place on selected Saturdays during the season, these engaging talks invite leading academics, authors, and cultural commentators to explore the world behind our productions.\n\nFrom unpicking historical detail to examining social and political themes, each seminar is designed to deepen your understanding of the play and enrich your theatre experience.\n\nPrevious speakers have included renowned broadcaster Jonathan Dimbleby , Martin Fitzpatrick , Head of Music at English National Opera, and Dr Will Tosh of Shakespeare’s Globe.", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://orangetreetheatre.co.uk/whats-on/saturday-seminar-a-small-and-quiet-light/", "tags": ["talk"], "id": "e609", "venue_name": "Orange Tree", "venue_area": "Richmond"}, {"venue_id": "polka", "title": "Toto", "byline": "Toto is a young donkey full of dreams and aspirations. They don’t want to settle for the life the world thinks a donkey should live.", "description": "Lugging boxes for the man? No thanks! Toto wants to be an astronaut.\n\nWith sights set on a big dream, Toto heads to the big city, determined not to let anything stand in their way… if only it was that easy.", "first_date": "2026-10-10", "last_date": "2026-11-01", "url": "https://polkatheatre.com/event/toto/", "tags": ["theatre"], "id": "e610", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "shakespeares-globe", "title": "Globe Young Company 2026: Pineapple", "byline": "The Globe Young Company returns for 2026 with brand-new play Pineapple by writer and Globe Associate Artist Anne Odeke ( Princess Essex; A Midsummer Night’s Dream, Shakespeare’s Globe).", "description": "The Globe Young Company is a collective of young artists who train at the Globe on an intensive three-month programme.\n\nAnne Odeke returns after her writing debut in the Globe Theatre Princess Essex , which won Best New Play (WhatsOnStage Awards 2025) and Best Playwright (Black British Theatre Awards 2025). Director and facilitator Mumba Dodwell joins the Globe team following her work at the National Theatre and Noël Coward Theatre.", "first_date": "2026-10-10", "last_date": "2026-10-11", "url": "https://www.shakespearesglobe.com/whats-on/young-company-pineapple/", "tags": ["theatre"], "id": "e611", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "the-albany", "title": "STATION", "byline": "Shaped around the idea of a radio tuning between different \"stations in life\" – childhood, adolescence, pregnancy, motherhood, and the experience of being mothered…", "description": "Shaped around the idea of a radio tuning between different \"stations in life\" – childhood, adolescence, pregnancy, motherhood, and the experience of being mothered – STATION is developed in collaboration with local women, and combines text, live sound score, movement and installation to create an intimate domestic environment.\n\nPart performance, part gathering space, this evolving work-in-progress celebrates female resilience, strength and collective power. Developed in close collaboration with choreographer Vidiya Patel and composer and sound-designer Fran Lobo .\n\nFor over 30 years, they have championed groundbreaking stories that challenge perceptions and reshape the theatrical landscape. Kali Theatre are based at the Albany.", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://www.thealbany.org.uk/events/station-2026", "tags": ["theatre", "dance"], "id": "e612", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "theatre503", "title": "Fundraising for your Show with Emily Carewe: 1 Day Intensive", "byline": "Theatre503’s Executive Director is no stranger to a funding application! In this one day intensive, Emily will take you through the triumphs and pitfalls of a funding application and how to make the most of your word limit.", "description": "You will learn how to build the best funding narrative to support your show’s USP, coming away with the skills to identify suitable funding opportunities from individuals to crowd funding and trusts and foundations. Participants will work through an ACE project grant, learning to interpret guidance and priorities across funders. This in-person intensive will give you the building blocks and confidence to start you on your funding journey through to making larger asks over time.\n\nSaturday 10 October 2026, 10am – 6pm at The 503Studio in Nine Elms (including a one hour break for lunch).", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://theatre503.com/whats-on/fundraising-for-your-show-with-emily-carewe-1-day-in-person-intensive/", "tags": ["class"], "id": "e613", "venue_name": "Theatre503", "venue_area": "Battersea"}, {"venue_id": "wiltons", "title": "Phil Ellis – Bath Mat", "byline": "Multi-award winning ‘comic genius’ (The Scotsman) and the breakout star of Taskmaster S20 (Ch4), Phil Ellis is going on his first full national stand-up tour.", "description": "Jam packed with laugh-out-loud profound silliness, superbly crafted gags and constant surprises, Phil is bringing his Bath Mat to a city near you.", "first_date": "2026-10-10", "last_date": "2026-10-10", "url": "https://wiltons.org.uk/whats-on/phil-ellis-bath-mat/", "tags": ["stand-up"], "id": "e614", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "drayton-arms", "title": "Sorry, Isobel - A Musical", "byline": "Heather has always been told she is descended from the legendary Scottish witch, Isobel Gowdie.", "description": "However, her understanding of the story is challenged when Isobel herself appears from beyond the grave, armed with numerous corrections and one apocalyptic warning. As Isobel recounts her true story, Heather begins to realise just how distorted the folklore surrounding the witch trials has become.\n\nSorry, Isobel is a Scottish folk musical inspired by the story of Isobel Gowdie, often referred to in Folk Lore as the Last Witch of Scotland. The musical explores how her story may be more closely connected to the future of womankind than we might expect.", "first_date": "2026-10-11", "last_date": "2026-10-12", "url": "https://thedraytonarmstheatre.co.uk/sorry-isobel", "tags": ["musical"], "id": "e615", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: words, songs & soul with fabian m thomas", "byline": null, "description": null, "first_date": "2026-10-11", "last_date": "2026-10-11", "url": "https://www.goldengoosetheatre.co.uk/whatson/lambeth%20fringe%3A%20words%2C%20songs", "tags": ["spoken-word"], "id": "e616", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hackney-empire", "title": "The Worst Poets Club", "byline": "After a decade of headlines, articles, comments and occasional strangers in person have claimed them as the worst poets, most terrible, mediocre, not even a poet poets…", "description": "After a decade of headlines, articles, comments and occasional strangers in person have claimed them as the worst poets, most terrible, mediocre, not even a poet poets, individually and collectively to blame for the downfall of modern poetry, Hollie McNish , Nikita Gill , Donna Ashworth and Len Pennie have come together to form The Worst Poets Club. For two nights only, in London and Edinburgh, please come and join four of the UK's bestselling but worst poets together on stage to read from their latest and most-cherished collections, to chat and to celebrate being rubbish at what they love. 50% of the artist fees will be donated to the National Literacy Trust, in the hope that the future generations of young, budding writers will not be as bad as them. We can't wait to see you there.\n\nFind out about getting here, access & support, plus food & drink", "first_date": "2026-10-11", "last_date": "2026-10-11", "url": "https://www.hackneyempire.co.uk/events/the-worst-poets-club", "tags": ["spoken-word"], "id": "e617", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "lyric-hammersmith", "title": "For The Culture: Celebrations of Blackness Festival", "byline": "For the Culture: Celebrations of Blackness Festival is more than a festival; it’s an act of resistance, a space for joy, reflection, and conversation, a place to champion and celebrate Black British artists, activists…", "description": "For the Culture: Celebrations of Blackness Festival is more than a festival; it’s an act of resistance, a space for joy, reflection, and conversation, a place to champion and celebrate Black British artists, activists, and thinkers with our community.\n\nThe Lyric Hammersmith Theatre will be the beating heart of West London this October with a bold programme of performances, gigs, and special events celebrating Black talent, joy, creativity, and culture.", "first_date": "2026-10-11", "last_date": "2026-10-11", "url": "https://lyric.co.uk/seasons/for-the-culture-celebrations-of-blackness-festival/", "tags": ["concert"], "id": "e618", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "orange-tree", "title": "Impressions: From Debussy to Coltrane", "byline": "Moving seamlessly from the vibrant harmonies of Claude Debussy and Maurice Ravel to the improvisatory worlds of John Coltrane and Bill Evans , the programme weaves together reimagined masterworks…", "description": "Moving seamlessly from the vibrant harmonies of Claude Debussy and Maurice Ravel to the improvisatory worlds of John Coltrane and Bill Evans , the programme weaves together reimagined masterworks, seminal jazz tunes and the American Songbook. The concert brings together luminaries from contrasting traditions to create a fluid, genre-defying sound world—where modal chant meets modern harmony, impressionist colour dissolves into swing, and composition merges with improvisation in real time.\n\nTo celebrate our new musical partnership, we’re offering you the chance to save* when you book multiple concerts before the end of September 2026! Experience world‑class music for less in the year ahead.\n\nThe church is located on Church Walk, Richmond, TW9 1SN , and offers level access through wide glass doors and parking very close to the church with easy drop-off.", "first_date": "2026-10-11", "last_date": "2026-10-11", "url": "https://orangetreetheatre.co.uk/whats-on/impressions-from-debussy-to-coltrane/", "tags": ["concert"], "id": "e619", "venue_name": "Orange Tree", "venue_area": "Richmond"}, {"venue_id": "shakespeares-globe", "title": "Pineapple: Post-Show Talk", "byline": "Join us in the Sam Wanamaker Playhouse as we venture further into Pineapple , a new play written for and performed by the Globe Young Company .", "description": "Delve deeper into the play’s world with this post-show panel discussion and Q&A. The speakers will reveal rehearsal room discoveries, explore how character experiences might resonate with audiences today and discuss the journey towards equitable access into theatre.\n\nThis event is part of the Shakespeare and Race Festival 2026 .", "first_date": "2026-10-11", "last_date": "2026-10-11", "url": "https://www.shakespearesglobe.com/whats-on/pineapple-club-talk/", "tags": ["theatre", "talk"], "id": "e620", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "the-glitch", "title": "Haggis Pakora (with Dhol drum)", "byline": "Dhol drum complements Haggis Pakora: a Scottish-Pakistani Muslim musical comedian with mushy HeartSeekh kebab filling and a crusty eczema coat.", "description": "The filling rips the coat when family rejects his exes, and arranged dates reject his Halal:Haram ratio. After 7 years of trial and terror, this harami salami is no closer to marriage than divorcing from his prescription creams.\n\nAccompanying him on this three-course food fusion menu are keema’n’aloo (mince ’n’ tatties with spicy skin) and brown pudding (black pudding with diabetes). This well-balanced meal covers five stages of identity grief: Denial that he can have his halal cake and top it with Parmigiano Reggiano; Anger at double-life disasters; Bargaining with barbers and matchmakers; Depression from home and dating dampness; and Acceptance that, like Brexit did with UK borders, he can take back control of his parental boundaries with a Good Friday Jummah prayer routine. Looks like beats back on the menu, Bhai! West End New Act 2025 audience award winner, and Musical Comedy Awards 2026 shortlist. Split bills at Camden Fringe 2024 (Thirty Shades of Brown) and Glasgow International Comedy Festival 2025 (De(ar)ranged Dating). This show is the full meal, fresh from his Edinburgh Fringe 2026 run.", "first_date": "2026-10-11", "last_date": "2026-10-11", "url": "https://www.tickettailor.com/events/vaultcreativearts/2389655", "tags": ["concert"], "id": "e621", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "white-bear", "title": "The Awkward Guide to Friendship", "byline": "House of Figs share their powerful one-act piece navigating the choppy waters of friendship, from platonic meet-cutes to courageous conversations…", "description": "and beyond. Join poet Beth Calverley and musician Beth Roberts on a voyage through deep friendship feelings, safely afloat in an otherworldly choir of spoken and sung voices.\n\nHouse of Figs is a collaboration between Beth Calverley (The Poetry Machine) and Beth Roberts\n\n(Hands of the Heron / Hedera / Tryani Collective). Beth Roberts conjures soundscapes with her voice and electronic effects, creating an otherworldly choir around Beth Calverley’s tenderly powerful poetry. As collaboration & improvisation specialists, they take care to create a held space for audience members.", "first_date": "2026-10-11", "last_date": "2026-10-11", "url": "https://www.whitebeartheatre.co.uk/whatson/the-awkward-guide-to-friendship", "tags": ["theatre", "spoken-word"], "id": "e622", "venue_name": "White Bear Theatre", "venue_area": "Kennington"}, {"venue_id": "white-bear", "title": "We'll Always Have Paris", "byline": "We'll Always Have Paris is a rebellious romcom about love, loss, and starting over in your forties.", "description": "Haunted by the happy ending she never had, cinema usher and aspiring screenwriter Ginny must confront heartbreak—and Hollywood—as she tries to rebuild her life following the death of her fiancé.\n\nDescribed as a \"romcom with a broken heart,\" Paul Kalburgi’s latest work is a witty, tender, and quietly devastating look at what happens when the credits roll on the love story you thought was yours — and you’re forced to write a new ending.", "first_date": "2026-10-11", "last_date": "2026-10-11", "url": "https://www.whitebeartheatre.co.uk/whatson/we'll-always-have-paris", "tags": ["theatre"], "id": "e623", "venue_name": "White Bear Theatre", "venue_area": "Kennington"}, {"venue_id": "golden-goose", "title": "Lambeth Fringe: The Final Exam: Gao Kao", "byline": "A student witnesses a classmate's suicide. The next day, lessons continue as though nothing has happened.", "description": "As China's National College Entrance Examination approaches, the classroom begins to fracture. Teachers become invigilators and enemies. Exam papers become battlefields. Standard answers become weapons. Haunted by the memory of the girl she could not save, one student is forced to confront not only the examination before her, but the beliefs she has been taught her entire life.\n\nBlending physical theatre, stylised stage combat, projection, and surreal imagery, *Bound by the Wind* transforms the pressure of education into a visceral theatrical experience. Inspired by real stories, the production explores academic pressure, grief, mental health, gender, and the cost of conformity, while asking a simple but urgent question: if education teaches us how to think, what happens when we're no longer allowed to?", "first_date": "2026-10-12", "last_date": "2026-10-13", "url": "https://www.goldengoosetheatre.co.uk/whatson/finalexam", "tags": ["theatre"], "id": "e624", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hen-and-chickens", "title": "Renée Rossi: God Bomb", "byline": "Lately, Renée’s been feeling a bit like Ghandi. (Thin? She wishes.) No; she ‘likes your Christ, but does not like your Christians for they are so unlike your Christ.’ Actually, she’s not all that sure about Jesus even.", "description": "(Can you truly respect a man who does magic?) Amidst holy wars in the Middle East (again. ugh) and the rise of the nominally Christian right, Renée explores how human mundanity (the weekly shop, recycling) intersects with the sacred and on-high. She’s mainly interested in making you laugh, but if there’s time, she might make you wonder: What miracles might humans achieve if we stopped waiting on god and embraced our own holiness? Why do we outsource our divinity to dudes on clouds instead of finding.", "first_date": "2026-10-12", "last_date": "2026-10-12", "url": "https://www.unrestrictedview.co.uk/events/rene-rossi-god-bomb", "tags": ["stand-up"], "id": "e625", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "orange-tree", "title": "T.S. Eliot’s Murder in the Cathedral", "byline": "1170. A nation divided. Once the best of friends, King Henry II and his Archbishop, Thomas Becket, are now mortal enemies.", "description": "Ignoring his allies’ fears, Becket, the ‘turbulent priest’, returns to Canterbury, tempting the monarch’s wrath. As the women of Canterbury seek shelter in the sacred space of the cathedral, four knights ride out on a deadly mission. The only question: who will blink first?\n\nT. S. Eliot ’s 1936 verse drama is one of his crowning achievements. In it, he explores questions that haunt his writing: of worldly and spiritual authority; faith and doubt; temptation and martyrdom.\n\nDavid Suchet returns to theatre to play Thomas Becket. Besides his iconic role as Hercule Poirot, the Emmy Award-winning Suchet’s five-decade stage career includes Amadeus, Oleanna , and All My Sons . OT Artistic and Community Directors Tom Littler and Francesca Ellis stage a sweeping, atmospheric drama blending dazzling poetry with live choral music, in Richmond’s striking St John the Divine church.", "first_date": "2026-10-12", "last_date": "2026-11-07", "url": "https://orangetreetheatre.co.uk/whats-on/murder-cathedral/", "tags": ["theatre"], "id": "e626", "venue_name": "Orange Tree", "venue_area": "Richmond"}, {"venue_id": "the-cockpit", "title": "The Lure of... : October", "byline": "Join the team behind the independent investigative news outlet Byline Times for an entertaining evening of challenging discussion to help us understand the unprecedented times we are living in – and why they are happening…", "description": "Join the team behind the independent investigative news outlet Byline Times for an entertaining evening of challenging discussion to help us understand the unprecedented times we are living in – and why they are happening – with those with an inside track.", "first_date": "2026-10-12", "last_date": "2026-10-12", "url": "https://www.thecockpit.org.uk/show/the_lure_of_october", "tags": ["talk"], "id": "e627", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "wiltons", "title": "A Brief Case of Crazy", "byline": "Inspired by the timeless genius of Mr Bean, Charlie Chaplin and Buster Keaton, A Brief Case of Crazy is a heart-warming and hilarious physical comedy told through slick choreography, mime, clowning and puppetry.", "description": "Meet Thomas, an awkward, introverted office worker with a quiet crush on his equally shy colleague, Daisy. His quest for love must contend with a boisterous boss named Simon and a rather bothersome briefcase that drags an awkward introvert into extraordinary events.\n\nWill his quest for love fail? Or will he discover it’s what’s on the inside that counts?", "first_date": "2026-10-12", "last_date": "2026-10-14", "url": "https://wiltons.org.uk/whats-on/a-brief-case-of-crazy/", "tags": ["theatre", "puppetry"], "id": "e628", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "barons-court", "title": "The Cannoneer by Silvia Manazzone", "byline": "You probably already know everything about the three Italian Wars of Independence, about the Unification of Italy in 1860, about the Borboni, the Royal family from Spain who ruled over Sicily and Naples for over 120 years…", "description": "You probably already know everything about the three Italian Wars of Independence, about the Unification of Italy in 1860, about the Borboni, the Royal family from Spain who ruled over Sicily and Naples for over 120 years, about General Garibaldi and his thousand volunteers.\n\nAnd of course you already know everything about Peppa, the orphan from Catania, who dropped the skirt, no, not to live naked, but to acquire male attire for the rest of her life. Who went from being despised by society to single-handedly defeating the cavalry of the Borboni and thus saving the lives of her companions.\n\nOf course you already know all of it, right?... Right?? YOU DON'T?!...", "first_date": "2026-10-13", "last_date": "2026-10-17", "url": "https://www.baronscourttheatre.com/canonneer", "tags": ["theatre"], "id": "e629", "venue_name": "Barons Court Theatre", "venue_area": "Barons Court"}, {"venue_id": "camden-peoples-theatre", "title": "Default (WIP)", "byline": "You know who this person is. We are this person. And the moments that feel ours, are not ours alone.", "description": "We all have these questions. You are not special for having them. Have you lost yourself in an attempt to become likeable? No one likes you, because you are not anyone anymore. Be disliked, have an opinion, cause a stir. They can't do anything to you. They don't know who they are.", "first_date": "2026-10-13", "last_date": "2026-10-13", "url": "https://cptheatre.co.uk/whatson/Default-WIP", "tags": ["theatre"], "id": "e630", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "camden-peoples-theatre", "title": "Eat Me (WIP)", "byline": "Welcome to the new Home Office Visa Application System, where cooking is at the heart of finding home!", "description": "​​ To apply, you need to distill your entire existence - identity, home, experiences and aspirations - into one delicious dish for the King. The Royal Tastebuds™ will then determine your right to remain in the country... What will YOU cook?\n\nIn a world with ever taller walls, ANTS Theatre has interviewed 13 immigrants from across the world, talking the hard talk while cooking up a feast. Over the sounds of bubbling mole and the smells of crisping scallions, we ask: when you apply to live elsewhere, will your recipes need to be adapted to be included on the menu? Will they make it into The British Cook Book? Do they need to?", "first_date": "2026-10-13", "last_date": "2026-10-13", "url": "https://cptheatre.co.uk/whatson/Eat-Me-WIP", "tags": ["theatre"], "id": "e631", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "drayton-arms", "title": "Wicked Fridays", "byline": "Leilani, a lone traveller, seeks sanctuary on a distant Caribbean island. Things take an unexpected turn when she encounters Ariel, the island’s enigmatic sole resident, who appea
