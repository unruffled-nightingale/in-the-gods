atre"], "id": "e305", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "half-moon", "title": "Eshu at the Crossroads", "byline": "An enchanting tale of choice, trickery and adventure.", "description": "At a mysterious crossroads a traveller must decide which path to follow. But standing guard is a magical rooster, while nearby waits Eshu – the playful and unpredictable trickster spirit who delights in mischief, surprises and unexpected possibilities.\n\nWhat happens when every choice can change your path? As the journey unfolds, the traveller encounters challenges, moments of joy and new ways of seeing the world around them.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.halfmoon.org.uk/events/eshu-at-the-crossroads/", "tags": ["theatre"], "id": "e306", "venue_name": "Half Moon Theatre", "venue_area": "Limehouse"}, {"venue_id": "jacksons-lane", "title": "The Devil, The Tsar & Three Dry Biscuits: Ben Haggarty", "byline": "The Tsar’s winter palace has a demon problem, and there’s only one man with the wit, the will, and the nerve to solve it.", "description": "Join master storyteller Ben Haggarty for a thrilling retelling of a classic Russian fairytale, bursting with magical sacks, devilish bargains, wild encounters, clever tricks, and comedic quests. Collected by celebrated author (and spy) Arthur Ransome, this is a rumbustious tale of outwitting and trickery.\n\nBen Haggarty’s wholehearted, romper-stomper performances have earned him an international reputation for captivating audiences. His shows are energetic, playful, sometimes deliciously dark, and always full of wonder.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.jacksonslane.org.uk/events/the-devil-the-tsar-three-dry-biscuits-with-ben-haggarty/", "tags": ["theatre"], "id": "e307", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "little-angel", "title": "Pip and Posy Live on Stage", "byline": "Inspired by actory.com/tickets/tru/", "tags": ["theatre"], "id": "e310", "venue_name": "Menier Chocolate Factory", "venue_area": "Southwark"}, {"venue_id": "national-theatre", "title": "Catarina and the Beauty of Killing Fascists", "byline": "South Portugal, 2028. Catarina is about to kill her first fascist. It is a rite of passage, steeped in tradition and family lore. A day of celebration, of beauty and death.", "description": "But when Catarina refuses to kill the hostage, her decision drives a wedge between the family. As ghosts of the past arise, unresolved questions emerge – what is the price of democracy? Is there room for violence in the fight for a better world?", "first_date": "2026-09-19", "last_date": "2026-09-26", "url": "https://www.nationaltheatre.org.uk/productions/catarina-and-the-beauty-of-killing-fascists/", "tags": ["theatre"], "id": "e311", "venue_name": "National Theatre", "venue_area": "South Bank"}, {"venue_id": "omnibus", "title": "PRETEND NIGHT", "byline": "Each month The Pretend Company bring together three of the funniest, most theatrical improvised shows in the UK for a night of unscripted theatre.", "description": "With no scripts, and no pre-planning, the actors will create scenes and shows based on what you – the audience – want to see!\n\nThe Pretend Company are a London-based theatre company specialising in unscripted and improvised work.", "first_date": "2026-09-19", "last_date": "2026-12-18", "url": "https://www.omnibus-clapham.org/whatson/pretend-night", "tags": ["theatre"], "id": "e312", "venue_name": "Omnibus Theatre", "venue_area": "Clapham"}, {"venue_id": "park-theatre", "title": "Olga Koch: Fat Tom Cruise.", "byline": "Olga Koch has one good story. Only it’s not really her story. Do you wanna hear it? In Fat Tom Cruise , see the Melbourne and Edinburgh Comedy Award-nominated star comb through recent history in an immersive and genre-defying new show.", "description": "Contains haze, discussion of suicide and mental health.\n\nLive in an N postcode? Discounts are available for our local N postcode residents on Tuesday performances. Read more", "first_date": "2026-09-19", "last_date": "2026-09-26", "url": "https://parktheatre.co.uk/events/olga-koch-fat-tom-cruise/", "tags": ["stand-up"], "id": "e313", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "polka", "title": "Big Dreams: Multicolore", "byline": "A bag puppet show exploring the theme of difference through colour, with live music and a soundscape to illustrate the story.", "description": "This is part of our Big Dreams Festival. Explore the full offering here\n\nA story of friendship against a colourful backdrop.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://polkatheatre.com/event/big-dreams-multicolore/", "tags": ["puppetry"], "id": "e314", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "polka", "title": "Big Dreams: MC Grammar", "byline": "From the page to the stage, it’s time to read and rap with MC Grammar!", "description": "This is part of our Big Dreams Festival. Explore the full offering here\n\nJoin the World Book Day Ambassador, bestselling author and viral social media sensation for a fun-filled action-packed live show that celebrates books, beats and the power of words.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://polkatheatre.com/event/big-dreams-mc-grammar/", "tags": ["theatre"], "id": "e315", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "polka", "title": "Big Dreams: The Tale of the Loneliest Whale", "byline": "Whale sings his heart out into the deep blue sea… but nobody sings back. Is he the only one like him in the whole ocean?", "description": "Just when he’s about to give up, a mysterious voice echoes through the waves. Determined to find the singer, Whale embarks on an unforgettable adventure – diving through glowing coral caves, dodging wibbly jellyfish and facing wild-eyed sea monsters! But will he ever find a friend who hears his song?\n\nAt its heart, this is a story about neurodiversity, about how being different can be lonely, but also beautiful. The play was developed through workshops and conversations with children, including those with experience of autism, ADHD and other forms of neurodivergence. Their insights shaped everything from the characters, music and story structure to the sensory elements and pacing of the show.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://polkatheatre.com/event/big-dreams-the-tale-of-the-loneliest-whale/", "tags": ["theatre"], "id": "e316", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "royal-vauxhall-tavern", "title": "BeefMince", "byline": "Since 2016, BEEFMINCE has been attracting hundreds of bears, cubs and everything in between, all year round at The Royal Vauxhall Tavern and has fast become one of The RVT’s biggest and most loved club nights.", "description": "Expect a welcoming crowd full of hotties, beards, cubs, bears, chubs and ALL lovers of a good party, regardless of age, gender and sexuality! BEEFMINCE champions an ‘everyone welcome’ policy as part of our Mince Mission that creates our attitude-free atmosphere.", "first_date": "2026-09-19", "last_date": "2026-10-17", "url": "https://www.vauxhalltavern.com/events/event/beefmince-3/?oid=6621", "tags": ["cabaret"], "id": "e317", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "shakespeares-globe", "title": "Ghosts & Ghouls Family Tour", "byline": "Join us for a Ghosts & Ghouls Family Tour , a special family-friendly spooky guided tour of the Globe Theatre which brings to life the ghosts, spirits and scary happenings of Shakespeare’s most chilling plays.", "description": "From the Three Witches’ spells in Macbeth , to the appearance of Hamlet’s father’s ghost, you’ll learn about Shakespeare’s love for all things supernatural as well as hearing the grisly details of medical practices in his time; folktales of London’s mysterious creatures like the Thames River Monster; and fascinating traditional ways to protect yourself against evil spirits.\n\nTickets include entry to our exhibition , where visitors can discover the history and magic behind Shakespeare’s Globe.", "first_date": "2026-09-19", "last_date": "2027-01-30", "url": "https://www.shakespearesglobe.com/whats-on/ghosts-and-ghouls-family-tour/", "tags": ["theatre"], "id": "e318", "venue_name": "Shakespeare's Globe", "venue_area": "Bankside"}, {"venue_id": "the-cockpit", "title": "Family Shakespeare: Pyramus & Thisbe - September", "byline": "The Rude Mechanicals have been asked to perform a play at the Duke's wedding. Trouble is, they've forgotten to write it! Can you help???", "description": "Do you remember Pyramus & Thisbe? The romantic tragedy that Bottom & The Rude Mechanicals were asked to perform for the Duke in A MIDSUMMER NIGHT’S DREAM?\n\nIn this interactive theatre experience, the audience put their heads together to add the finishing touches to the Rude Mechanicals’ play, helping to create a completely original version!", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.thecockpit.org.uk/show/family_shakespeare_pyramus_thisbe_-_september", "tags": ["theatre"], "id": "e319", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "Broken Ivy/Fence Off", "byline": "Broken Ivy & Fence Off are a pair of chamber operas created by emerging composers from the Royal Academy of Music.", "description": "The evening brings two worlds onto one stage: a vivid, fast-moving programme where different musical languages, cultural perspectives and theatrical styles collide.\n\nIn \"Broken Ivy\", English folklore becomes ecological myth: nature is not the backdrop, but the protagonist, telling a story of human overreach and its natural nemesis.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.thecockpit.org.uk/show/broken_ivyfence_off", "tags": ["opera"], "id": "e320", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "Sing4 Nok6/Meet the Philips", "byline": "Sing4 Nok6, and other broken things and Meet The Philips are a pair of chamber operas created by emerging composers from the Royal Academy of Music.", "description": "The evening brings two worlds onto one stage: a vivid, fast-moving programme where different musical languages, cultural perspectives and theatrical styles collide.\n\nIn \"Sing4 Nok6, and other broken things\", cultural erasure becomes a live struggle between imposed and remembered, where singing itself becomes resistance.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.thecockpit.org.uk/show/sing4_nok6meet_the_philips", "tags": ["opera"], "id": "e321", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-glitch", "title": "James Coward is Your Uncle (WIP)", "byline": "Your Uncle delves deep inside of himself, and not just physically this time.", "description": "Your Uncle has taken many forms: amateur musician, professional landlord, husband, dog dad, dog husband, convict, ex-convict, dog husband again, convict. Now, he's retired and he has no idea what to do with himself. So he's putting on a show! After all, he's booked the space out till 6:30pm and how long does it really take to eulogise some old lady? Expect 45 mins-ish (and I mean ish) of character comedy, followed by a Q&A/missing persons press conference. **** - The Guardian **** - The Stage **** - The Financial Times\n\nJames Coward - writer/performer Millie Foy - director Dolores Carbonari - designer", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.tickettailor.com/events/vaultcreativearts/2403785", "tags": ["stand-up"], "id": "e322", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "upstairs-gatehouse", "title": "As Man Is To God", "byline": "Some summers ago, while his TV writing partner took up a lunchtime gym regimen, Andrew Nicholls decided to write a long, strict-meter poem.", "description": "The challenge: find a subject particularly resistant to tight dactylic tetrameter—a literary stunt in itself. Candidates included The Warren Commission Report, A Mathematician’s Apology, and Microsoft’s 1986 DOS Manual.\n\nThen came Werner Herzog’s Fitzcarraldo, the modern archetype of doing something nobly ridiculous. Les Blank’s documentary Burden of Dreams, chronicling Herzog’s struggle to haul a 320-ton steamship over a mountain, suggested a third layer of Quixotic endeavor: turn the entire ordeal into verse.\n\nNicholls spent a year working from Blank, Maureen Gosling and Michael Goodwin’s continuity script and assorted sources. English, German, Spanish—and some operatic Italian—helped with the rhymes. Some days produced only part of one verse.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173676178", "tags": ["spoken-word"], "id": "e323", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "upstairs-gatehouse", "title": "LOLA: Live!", "byline": "A celebratory final Theatre Lab, LOLA Live! will star a fun mix of London and Los Angeles performers, from celebrities to newbies. Expect comic cold readings, theatrical demonstrations, surprise performances, and audience participation.", "description": "Want to join the Theatre Lab workshops and see all shows that are part of LOLA Festival? Purchase a FESTIVAL PASS!", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173676113", "tags": ["theatre"], "id": "e324", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "woolwich-works", "title": "The Passenger", "byline": "One man. A hundred voices. A journey into the heart of a city built on dreams.", "description": "Martin has never left his small town. He runs a struggling record shop and lives a quiet life surrounded by music, memories and the ghosts of the past.\n\nThen, one day, he does something completely out of character.", "first_date": "2026-09-19", "last_date": "2026-09-19", "url": "https://www.woolwich.works/events/the-passenger", "tags": ["theatre"], "id": "e325", "venue_name": "Woolwich Works", "venue_area": "Woolwich"}, {"venue_id": "young-vic", "title": "Shedinburgh Festival", "byline": "This autumn, Shedinburgh is bringing the very best of the Edinburgh Festival Fringe to the Young Vic.", "description": "From Fringe legends and cult hits to rising stars and world premieres. All runs are strictly limited - blink and you’ll miss them. Expect a mix of old and new, with theatre, comedy, music, and everything in between.\n\nStep inside the Shed and experience the Young Vic as you’ve never seen it before: unplugged, up close, and unforgettable.", "first_date": "2026-09-19", "last_date": "2026-10-10", "url": "https://www.youngvic.org/shedinburgh/", "tags": ["theatre"], "id": "e326", "venue_name": "Young Vic", "venue_area": "South Bank"}, {"venue_id": "barons-court", "title": "Honesty by Matthew Moore", "byline": "Honesty is a new play about family, lies, and trust.", "description": null, "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.baronscourttheatre.com/honesty", "tags": ["theatre"], "id": "e327", "venue_name": "Barons Court Theatre", "venue_area": "Barons Court"}, {"venue_id": "chickenshed", "title": "Hedda Gabler", "byline": "Hedda returns from her honeymoon with new husband George Tesman. Struggling with her marriage and life devoid of excitement, Hedda strives to find a way to fulfil her desires by manipulating those around her.", "description": "You can find all info on access at Chickenshed here .\n\nWe aim to offer a warm welcome to everyone, and to ensure that all our activities are as accessible as possible to the widest number of people.", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.chickenshed.org.uk/events/hedda-gabler", "tags": ["theatre"], "id": "e328", "venue_name": "Chickenshed", "venue_area": "Southgate"}, {"venue_id": "etcetera", "title": "The Old Strumpet Poet Of Brighton", "byline": "I'm the Old Strumpet Poet of Brighton. My show is about being old, being sassy and giggly.", "description": "Older people can do anything - age is freedom. My poems will make you dribble all over with laughter. One piece is called My Vag is an Erupting Volcano. If you like the sound of that, come and see me on the 24th August at 1pm at the Etcetera Theatre.", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.etceteratheatrecamden.com/events/the-old-strumpet-poet-of-brighton", "tags": ["spoken-word"], "id": "e329", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "hen-and-chickens", "title": "A Shattered Mosaic", "byline": "A young(ish) woman collects shards of memories from different poems, each offering a glimpse of formative life experiences.", "description": "From sweating freshers’ week nightclubs to the beaches of Koh Phangan – by way of dodgy boyfriends and jobs in stretched social care systems – this dizzying, lyrical journey explores the complexity of growing up in recent years. Fusing personal history with the shifting political climate of 2015-2025, A Shattered Mosaic stands as a love letter to poetry, art and the human ability to change direction when life doesn’t go as planned.\n\nFrom a mess of broken shards, can a decade where nothing feels linear still be made into something whole?\n\nA must-watch for anyone who has ever questioned societal norms, had a bit of a breakdown, found a home in creativity, or chatted shit at 5 am after a line too many.", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.unrestrictedview.co.uk/events/a-shattered-mosaic", "tags": ["theatre", "spoken-word"], "id": "e330", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "jacksons-lane", "title": "Hay!", "byline": "‘Hay!' like the stuffing in Geenie’s scarecrow, ‘Hay!’ like the sound she makes when he comes to life and ‘Hay!’ his first word when he sees all the wonders of the natural world for the first time.", "description": "Only one word but so many meanings in a show about growing up in the heart of the countryside and discovering that you don’t have to stay stuck in the mud – you can live your dreams, spread your wings and fly like the birds. https://youtu.be/xpMIcRlc4Rw More about Lyngo Theatre Recommended age: 3+ | Running time: 50 mins", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.jacksonslane.org.uk/events/hay/", "tags": ["theatre"], "id": "e331", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "park-theatre", "title": "Comedy Club 4 Kids", "byline": "Since 2005, the Comedy Club 4 Kids has been getting the best stand-ups, sketch acts and cabaret stars from the international circuit to do their thing for an audience of children (aged 6+) and their families…", "description": "but without the rude bits! Almost 20 years later, the company has expanded from one London residency to being countrywide, running shows and workshops all over the UK from Peebles to Portsmouth, even producing a book on how to write and perform stand-up, and hosting our own Radio Nonsense podcast to bring the sillies to families all over the world.\n\nThe show is family friendly, but without any patronising idiocy. In fact, it’s just like a normal comedy club, but it’s on in the day, kids are allowed in, and thus there is a higher than usual chance of the entire audience claiming to be called Bob.\n\nAdults to sit with children in their party (and help explain anything they get stuck on).", "first_date": "2026-09-20", "last_date": "2026-10-25", "url": "https://parktheatre.co.uk/events/comedy-club-4-kids/", "tags": ["stand-up", "comedy"], "id": "e332", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "polka", "title": "Big Dreams: Family Rave", "byline": "Our award-winning events have been selling out at legendary London venues for over five years, gathering five-star reviews and introducing a new generation to clubbing culture.", "description": "We have also taken our show to a number of major UK festivals such as Truck Festival, Big Feastival, and Gone Wild.\n\nThe show sees resident DJ Joy Alarm spinning classic dance hits and remixes that the parents know and love, MCing and whipping up the crowd with a set full of big moments and audience participation. His Tiny Dancers sets are centred around nostalgic themes, ranging from 90s vs 00s to House and Drum & Bass. Having headlined shows across Europe and the UK, Joy Alarm brings an infectious spirit and sense of occasion to the stage, breathing new life into the tunes we all raved to back when sleepless nights meant “bottled beer” rather than “bottle feed.”\n\nPlus, we have a huge range of activities to entertain the kids, including crafts, face painting, bubbles, confetti cannons, and balloons.", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://polkatheatre.com/event/big-dreams-family-rave/", "tags": ["dance", "concert"], "id": "e333", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "polka", "title": "Big Dreams: Dancing with Colours", "byline": "Dancing with Colours is an interactive performance for young people and their grown-ups. It’s about seeing art everywhere, and in everyone. It says art can be transformative, and can help our minds when we feel worried.", "description": "This is part of our Big Dreams Festival. Explore the full offering here\n\nCo-created with learning-disabled people and their families in Bradford, Dancing with Colours is a participatory performance that blends movement, music, and most importantly, colour!", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://polkatheatre.com/event/big-dreams-dancing-with-colours/", "tags": ["dance", "theatre"], "id": "e334", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "polka", "title": "Big Dreams: Nick Sharratt – Once Upon a Drawalong", "byline": "He’ll be sharing his favourite books, introducing you to brand new ones and showing you how to draw lots of exciting characters and create your own ones too! With tips and games along the way.", "description": "Nick has illustrated around 300 books including the much-loved ‘You Choose’, ‘Shark in the Park’ and ‘Pants’ series.\n\nHe’s worked with authors including Julia Donaldson , Michael Rosen and Kes Gray , and he’s illustrated lots of Dame Jacqueline Wilson’s phenomenally popular children’s novels. Nick’s also been awarded a gold Blue Peter badge!", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://polkatheatre.com/event/big-dreams-nick-sharratt-once-upon-a-drawalong/", "tags": ["class", "theatre"], "id": "e335", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "polka", "title": "Big Dreams: After Party", "byline": "The arrival of a new baby is the beginning of a long, beautiful and messy journey.", "description": "Join us at the After Party , a place of joy, rest, solidarity and festivity as we support and celebrate each other through the long and transformative journey of parenthood.\n\nThis is part of our Big Dreams Festival. Explore the full offering here\n\nCombining the beautiful and uplifting vocal music of the HurlyBurly ensemble with a playful and immersive multi-sensory world, this experience offers new families time and space to relax together whilst the interactive performance ebbs and flows around them.", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://polkatheatre.com/event/big-dreams-after-party/", "tags": ["theatre", "immersive"], "id": "e336", "venue_name": "Polka Theatre", "venue_area": "Wimbledon"}, {"venue_id": "royal-vauxhall-tavern", "title": "Sunday Cabaret at the RVT", "byline": null, "description": null, "first_date": "2026-09-20", "last_date": "2026-11-01", "url": "https://www.vauxhalltavern.com/events/event/sunday-cabaret-at-the-rvt-2/?oid=6290", "tags": ["cabaret"], "id": "e337", "venue_name": "Royal Vauxhall Tavern", "venue_area": "Vauxhall"}, {"venue_id": "the-albany", "title": "The Tale of the Loneliest Whale", "byline": "Whale sings his heart out, but nobody sings back. Is he the only one like him in the whole ocean? Just as he’s about to give up, a mysterious voice echoes through the waves, spurring him on a determined search.", "description": "Join Whale as he dives through glowing coral, dodges wibbly jellyfish, and faces wild-eyed sea monsters in an unforgettable quest for connection. Will he ever find a friend who hears his song?\n\nPacked with beautiful puppets, original songs, and hilarious sea creatures, The Tale of the Loneliest Whale is a celebration of friendship, difference, and the beauty of being yourself. Developed with children's insights into neurodiversity, this is a truly unique and heartfelt show for ages 4+.", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.thealbany.org.uk/events/the-tale-of-the-loneliest-whale", "tags": ["puppetry", "theatre"], "id": "e338", "venue_name": "The Albany", "venue_area": "Deptford"}, {"venue_id": "the-cockpit", "title": "What's Past Is Prologue", "byline": "Tête â Tête, Aukoko and CN Lester invite you to share tea, cake and thinking about not what opera was or is but what it could be - visions for and pathways to the future.", "description": "Richard Branson described the financial crisis of 2008 as a “correction”, not a crisis. Brutal though this is, opera is without a doubt really hitting a pivot point right now. A whole community of artists, meanwhile, has grown out of Tête à Tête passionately committed to the art form, and to reinvigorating our art form through bold new work.\n\nWe invite you to join our young, inclusive, visionary community to enjoy some cake, a smattering of performance, some provocations and a call to action. Fuelled by both what we bring and discussion on the day, we will jointly envision where to move on from this pivot point and how we can make a future for the art form that holds us so in its thrall.", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.thecockpit.org.uk/show/whats_past_is_prologue", "tags": ["opera", "talk"], "id": "e339", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-cockpit", "title": "Re-Enchant: September", "byline": "Please be aware that this month, Re-enchant will be up in Studio 1. This is accessible via a spiral staircase only. There are also less seats, so make sure you grab a ticket.", "description": "Martina Evans will be reading from her new book Drunken Driving (Carcanet 2026.) Martina is an Irish poet, novelist and teacher. She is the author of twelve books of prose and poetry. Martina has been Royal Literary Fund Fellow at Queen Mary, University of London from 2003-2007 and again in 2011-2012. She has run workshops in Ireland, UK, Switzerland and the U. S. and seminars at London Metropolitan University, The National Film & Television School and Goldsmiths. She has been an associate lecturer in Creative Writing at Birkbeck University and University of East London and a Creative Writing tutor at the City Literary Institute, Covent Garden, London for many years. Currently she is a Royal Literary Fund Advisory Fellow and Books Critic for the Irish Times.\n\nLucie Ailsa Hall will be performing poetry, spoken word, and excerpts from her upcoming works: Letters, a short novella written around the experience of a silent retreat, and Capricorn Baby , her new poetry collection.", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.thecockpit.org.uk/show/re-enchant_september_0", "tags": ["spoken-word", "talk"], "id": "e340", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-glitch", "title": "Climate Theatre Workshops (20 Sep)", "byline": "Join our fun, friendly climate theatre workshops at The Glitch. Sessions are once a month on Sundays, 2pm to 4pm.", "description": "They’re fun, friendly and interesting, and all levels of experience and interest are welcome. Here are some nice things people have said about previous workshops: “a wonderful creative vibe permeated the afternoon\" \"\"A really nourishing, supportive, playful and welcoming atmosphere\"", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.tickettailor.com/events/vaultcreativearts/2165542", "tags": ["class", "theatre"], "id": "e341", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "the-glitch", "title": "boobytrapped", "byline": "Trans Bodyswap Trouble erupts when Simon, a trans man, and Kevin, a cis man, meet in a gay club and are instantly drawn to each other.", "description": "Their hookup derails when Kevin realises Simon is trans, but before things turn ugly, a magical twist traps them in each other’s bodies. Forced to navigate insecurities and prejudice, they must work together to reverse the swap - whether they understand each other or not. A romcom-drama from the creators of Fckboy - winner of the Binge Fringe Queer Award and The Stagey Place Best LGBTQ+ Production.\n\nFreddie Haberfellner (he/him) - writer and performer Romeo Lau (they/ them) - director Ermis Makides (he/ she/ they) - performer Oli Fuller (they/ he) - design & tech Isobel Jacob (she/ her) - assistant director Ella Bowsher (she/ her) - producer Ro Winchester (they/ them) - intimacy coordinator Callie O’Brien (she/ her) – sound designer", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.tickettailor.com/events/vaultcreativearts/2404155", "tags": ["theatre"], "id": "e342", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "the-glitch", "title": "A Job Interview", "byline": "Like anyone, all he wants is a steady job. A wage three percent above national median, rising with the rate of inflation.", "description": "A forty hour working week. Occasional overtime opportunities. Three weeks annual paid holiday. But standing between him and the opportunity of his dreams is the job interview of his nightmares. . . A Job Interview is a surreal take on the absurdity of the labour market. KPI, SEO, CEO, GBH and PTSD — all will play a role in this witty, kafkaesque two-hander, guaranteed to leave you thinking about your HR department a little differently. How far would you go to break the cycle of unemployment? How can you make yourself stand out from the crowd? And what even is the job, anyway? This is the latest production by the ensemble responsible most recently for Q. E. D. (‘witty, often riotous’ - View from the Gods) at the Drayton Arms Theatre.\n\nWritten by James Turner Directed by Sebastião Marques Lopes Performed by Aidan Parsons and Huw Landauer", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.tickettailor.com/events/vaultcreativearts/2304861", "tags": ["theatre"], "id": "e343", "venue_name": "The Glitch", "venue_area": "Waterloo"}, {"venue_id": "upstairs-gatehouse", "title": "Madwomen of the West", "byline": "MADWOMEN OF THE WEST, Sandra Tsing Loh’s outrageous comedy about a women’s brunch that goes hilariously wrong, has delighted and provoked audiences from LA to New York to London over its rip-roaring maiden 15-month tour.", "description": "This first ever “cocktail concert” version welcomes the audience to attend with beverages in hand, while beloved divas at music stands dramatically read the 18-point script they also enjoy.\n\nStage and screen legend STOCKARD CHANNING (SIX DEGREES OF SEPARATION, GREASE) joins BROOKE ADAMS and MELANIE MAYRON .", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://upstairsatthegatehouse.ticketsolve.com/ticketbooth/shows/1173676114", "tags": ["comedy", "cabaret"], "id": "e344", "venue_name": "Upstairs at the Gatehouse", "venue_area": "Highgate"}, {"venue_id": "white-bear", "title": "Three Shots", "byline": "Sometimes you just have to communicate. Let them know you’re here.", "description": "Darren has left everything behind to go live in the woods. Just off the A46 near Coventry, he weathers the elements, hunts for local prey, and argues with a mysterious creature that’s stolen his bottle opener. Until his brother arrives, and the life he was trying to escape forces its way back in.\n\nThis new black comedy by John Marquez explores masculinity, isolation and the desire to get away from it all.", "first_date": "2026-09-20", "last_date": "2026-09-20", "url": "https://www.whitebeartheatre.co.uk/whatson/three-shots", "tags": ["theatre"], "id": "e345", "venue_name": "White Bear Theatre", "venue_area": "Kennington"}, {"venue_id": "drayton-arms", "title": "Farewell, But Until Then – Concert", "byline": "Farewell, But Until Then marks the launch of EMSTA’s second album — a live show about saying goodbye to the people, relationships and chapters we no longer need, while celebrating everything that happens before we finally let them go.", "description": "Blending original music from the new album with carefully selected covers, EMSTA moves between pop, dance-pop, jazz and musical theatre, creating a concert that refuses to stay within a single genre.\n\nJoined by four dancers, the show brings the album to the stage through live music, choreography and performance, moving between intimate moments and high-energy numbers.", "first_date": "2026-09-21", "last_date": "2026-09-21", "url": "https://thedraytonarmstheatre.co.uk/farewell-but-until-then", "tags": ["concert", "dance"], "id": "e346", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "hackney-empire", "title": "Laughter to the Rafters", "byline": "After a hugely successful first year at Hackney Empire, Laughter to the Rafters returns to this iconic venue for its second year…", "description": "After a hugely successful first year at Hackney Empire, Laughter to the Rafters returns to this iconic venue for its second year, bringing even more people together for a night of outstanding comedy in support of The Passage’s vital work to end homelessness in London.\n\nHeadlining the night is the brilliant Dara Ó Briain - one of the UK and Ireland’s most loved stand-up comedians and television presenters. Best known for hosting Mock The Week, Dara’s trademark wit and lightning-fast delivery are guaranteed to have the whole theatre in stitches. The evening will be hosted by the incredible Leslie Gold, keeping the laughs coming throughout the night. Every penny raised supports The Passage’s work with people who are homeless or at risk of homelessness across London.\n\nFind out about getting here, access & support, plus food & drink", "first_date": "2026-09-21", "last_date": "2026-09-21", "url": "https://www.hackneyempire.co.uk/events/laughter-to-the-rafters", "tags": ["stand-up", "comedy"], "id": "e347", "venue_name": "Hackney Empire", "venue_area": "Hackney"}, {"venue_id": "hen-and-chickens", "title": "Samsonite Funeral", "byline": "21st, 22nd & 23rd September 7.30pm £15/10\nAfter a decade of reliable service, Maria’s dutiful travel companion falls apart on the last leg of her flight home, breaking her heart but forced to move forward.", "description": "Maria’s monologue is paired with a movement ensemble who move in a stylized choreography to the rhythm of the airport. “Samsonite Funeral” explores loss in a place of perpetual departure that closes the gate whether you’re ready or not. A tragi-comedy about the chaos of travel and the painful reminder of the politics involved in migration.", "first_date": "2026-09-21", "last_date": "2026-09-23", "url": "https://www.unrestrictedview.co.uk/events/samsonite-funeral", "tags": ["theatre", "dance"], "id": "e348", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "orange-tree", "title": "a small and quiet light", "byline": "The current lifespan of an operator is six weeks. That’s the most we can hope for your time out there.", "description": "October 1943. In a small office on the Avenue Foch in Paris, a Gestapo interrogator is questioning a young woman who has been known by many different names: Babuli, Jeanne-Marie, Nora, Madeleine.\n\nAs one of the secret agents of Britain’s Special Operations Executive – and the first female radio operator to be sent undercover into France – she has evaded capture far longer than most. But now she has been betrayed.", "first_date": "2026-09-21", "last_date": "2026-10-24", "url": "https://orangetreetheatre.co.uk/whats-on/a-small-and-quiet-light/", "tags": ["theatre"], "id": "e349", "venue_name": "Orange Tree", "venue_area": "Richmond"}, {"venue_id": "oso-arts", "title": "OSO Writers' Studio | Autumn 2026", "byline": null, "description": null, "first_date": "2026-09-21", "last_date": "2026-09-21", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173675142", "tags": ["class"], "price_min": 200.0, "price_max": 225.0, "id": "e350", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "pleasance-islington", "title": "Drunk Women Solving Crime", "byline": "Hit comedy podcast Drunk Women Solving Crime is back in London for their Autumn residency!", "description": "After past sell out runs across the UK and the Edinburgh Fringe, hosts Hannah George and Taylor Glenn are at The Pleasance in September, October AND November.\n\nTickets are available NOW and each show is a double record, so you'll hear about TWO cases, see TWO celebrity guests and have TWO opportunities to tell your own crime stories for some Drunk Women Solving Crime coasters. Past guests include: Katherine Ryan, Romesh Ranganathan, Rosie Jones and James Acaster.", "first_date": "2026-09-21", "last_date": "2026-11-13", "url": "https://www.pleasance.co.uk/event/drunk-women-solving-crime", "tags": ["stand-up", "comedy"], "id": "e351", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "soho-theatre", "title": "Catherine Bohart: Borrowing Trouble", "byline": "As seen and heard on Live at the Apollo, QI, The Last Leg, A League of Their Own , Mock the Week , The Mash Report , The News Quiz , Last One Laughing Ireland , and her Amazon Prime special Immaculate . Host of hit podcast Trusty Hogs .", "description": "The Edinburgh Comedy Award nominee is touring with a brand new show in 2026, and you should be there!\n\nDiscounts may be available on top prices for students, seniors, unwaged.", "first_date": "2026-09-21", "last_date": "2026-10-26", "url": "https://sohotheatre.com/events/catherine-bohart-borrowing-trouble/", "tags": ["stand-up"], "id": "e352", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "soho-theatre", "title": "Freddie Meredith: Need a Light?", "byline": "A self-appointed thought leader holds court in the smoking area of a club, unpacking masculinity, fame and the algorithm while soft launching himself to strangers.", "description": "The critically acclaimed debut hour from character comedian Freddie Meredith. There’ll be confusion at the bar, grace on the dance floor, honesty by the bins. No filter, no followers. The wrong strategy for the right night.\n\nRoyal Television Society Comedy Award nominee. NextUp Biggest Award in Comedy nominee. Picks of EdFest 2026 – Times Top Stage Picks – Guardian", "first_date": "2026-09-21", "last_date": "2026-10-26", "url": "https://sohotheatre.com/events/freddie-meredith-need-a-light/", "tags": ["stand-up"], "id": "e353", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "soho-theatre", "title": "Pierre Novellie", "byline": "Following the success of last year’s show, You Sit There, I’ll Stand Here, Pierre is back with a brand-new show, Okay, One More Then Bedtime , that touches on a wide range of topics…", "description": "Following the success of last year’s show, You Sit There, I’ll Stand Here, Pierre is back with a brand-new show, Okay, One More Then Bedtime , that touches on a wide range of topics, from his unique takes on food to a deep existential crisis.\n\nCome and see – it might be years before he wakes up!\n\nDiscounts may be available on top prices for students, seniors, unwaged.", "first_date": "2026-09-21", "last_date": "2026-10-26", "url": "https://sohotheatre.com/events/pierre-novellie-okay-one-more-then-bedtime/", "tags": ["stand-up"], "id": "e354", "venue_name": "Soho Theatre", "venue_area": "Soho"}, {"venue_id": "sohoplace", "title": "Who’s Afraid of Virginia Woolf?", "byline": "A new powerhouse production of Edward Albee’s Who’s Afraid of Virginia Woolf? comes to the West End this September.", "description": "Starring Emmy and Golden Globe winner Gillian Anderson ( The Crown, Sex Education, A Streetcar Named Desire ) and Emmy and Tony Award winner Billy Crudup ( Almost Famous, The Morning Show, Elephant Man ).\n\nSet in the round and directed by Tony and Olivier Award winner Marianne Elliott ( War Horse, Angels in America, Company ), this fierce new production draws every spectator right into the eye of the storm…\n\nIn the early hours of the morning on the campus of an American college, Martha, much to her husband George’s displeasure, has invited the new professor Nick and his wife Honey to their home for some after-party drinks. As the alcohol flows and dawn approaches, the young couple are drawn into George and Martha’s toxic games until the evening reaches its climax in a moment of devastating truth-telling.", "first_date": "2026-09-21", "last_date": "2026-12-19", "url": "https://sohoplace.org/shows/whos-afraid-of-virginia-woolf-2026/", "tags": ["theatre"], "id": "e355", "venue_name": "@sohoplace", "venue_area": "Soho"}, {"venue_id": "tabard", "title": "Rob Newman's Survival Guide to the 21st Century", "byline": "From record-breaking arena tours with Newman and Baddiel to bestselling books and acclaimed solo shows, Rob Newman has spent more than three decades establishing himself as one of Britain's most original and insightful comic voices.", "description": "Hot on the heels of his new novel, Intelligence , Rob Newman returns to offer a Survival Guide to the 21st Century.\n\nHow do we defend ourselves from oil shocks, chatbots and billionaire Tech Bros inciting civil war? Or stop AI stealing half our water, and stop water companies poisoning the rest? From retrofitting our towns and cities for the climate of the future to proposing a national maximum wage, Newman explores what clues history offers us for when the rich and powerful go ape.", "first_date": "2026-09-21", "last_date": "2027-09-13", "url": "https://www.tabard.org.uk/production/rob-newmans-survival-guide-to-the-21st-century", "tags": ["stand-up"], "id": "e356", "venue_name": "Tabard Theatre", "venue_area": "Chiswick"}, {"venue_id": "the-cockpit", "title": "Theatre in The Pound: September", "byline": "A not-for-profit scratch night, designed for individuals or groups of performers to try out 10-15 minutes of new work at The Cockpit.", "description": "Our legendary scratch nights are an accessible, affordable way for artists to try out new work on stage with full support from our backstage and tech crew.\n\nFor audiences, they're a cheap and fun night out, with the chance to see new work and share your thoughts directly with the performers!", "first_date": "2026-09-21", "last_date": "2026-09-21", "url": "https://www.thecockpit.org.uk/show/theatre_in_the_pound_september_0", "tags": ["theatre"], "id": "e357", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "union-theatre", "title": "GETTING REKT (The Evening Star)", "byline": "Rek has big dreams, big chat, and absolutely no idea what he’s doing.", "description": "He’s 25, “pretty much from Croydon bruv,” and fully committed to the image: grime producer, party boy, ladies’ man, future legend. The reality? He works in a care home, can’t get booked for an open mic, and is starting to suspect the persona might be wearing thinner than his tracksuit.\n\nCheeky, sharp, and living with dementia, Zofia is the only person who sees straight through Rek’s act.", "first_date": "2026-09-21", "last_date": "2026-09-24", "url": "https://uniontheatre.biz/show/getting-rekt/", "tags": ["theatre"], "id": "e358", "venue_name": "Union Theatre", "venue_area": "Southwark"}, {"venue_id": "wiltons", "title": "Michael Morpurgo’s Private Peaceful", "byline": "After captivating audiences worldwide, Private Peaceful returns to the stage with fresh energy and timeless power.", "description": "From Michael Morpurgo —beloved author of War Horse —comes the unforgettable story of Tommo Peaceful. On the eve of battle, Tommo looks back over the events that shaped his life: the warmth of family, the innocence of first love, and the deep bond with his brother that carries him through the horrors of war.\n\nIn this acclaimed one-person tour de force, adapted and directed by Simon Reade , a single actor conjures an entire world of characters, landscapes, and emotions. At once heartwarming and heartbreaking, Private Peaceful is both a moving family drama and a powerful reminder of the human cost of war.", "first_date": "2026-09-21", "last_date": "2026-09-23", "url": "https://wiltons.org.uk/whats-on/michael-morpurgos-private-peaceful/", "tags": ["theatre"], "id": "e359", "venue_name": "Wilton's Music Hall", "venue_area": "Shadwell, E1"}, {"venue_id": "barons-court", "title": "What's Next? by Sophia Korman", "byline": null, "description": null, "first_date": "2026-09-22", "last_date": "2026-09-26", "url": "https://www.baronscourttheatre.com/next", "tags": ["theatre"], "id": "e360", "venue_name": "Barons Court Theatre", "venue_area": "Barons Court"}, {"venue_id": "bridge-house", "title": "Amanda – The Night Before Me", "byline": "In the sacred hours before a surgery that will forever rewrite her body and her future, Amanda prepares to step fully into her authentic self.", "description": "What unfolds is a theatrical tour de force: an intimate yet epic musical monologue told through fourteen distinct characters – mothers, lovers, friends, inner voices – all brought to dazzling life by Divina de Campo (Hedwig and the Angry Inch, Ru Paul’s Drag Race) . With unflinching honesty, profound humour and a soaring original score by Rory Six with English lyrics by Charles Hart (Phantom of the Opera, Bend It Like Beckham) , Amanda – The Night Before Me explores the cost of silence, the power of hidden dreams and the radiant joy of finally claiming your truth. Divina delivers a once-in-a-lifetime performance of courage, vulnerability and divine stage presence – the kind of solo show that feels both deeply personal and universally resonant. Crafted to the highest professional standard and built to create waves like a true West End or Broadway event, this production is designed to fill houses and leave audiences transformed.", "first_date": "2026-09-22", "last_date": "2026-10-10", "url": "https://thebridgehousetheatre.co.uk/shows/amanda-the-night-before-me/", "tags": ["musical"], "id": "e361", "venue_name": "The Bridge House Theatre", "venue_area": "Penge"}, {"venue_id": "canal-cafe", "title": "Sláine: The Horned God", "byline": "Join professional storyteller Jason Buck for a tale of ancient Celtic heroes and villains, monsters and magic, dragons and demons, and goddesses and gods.", "description": "Set in a “time which is not a time” when Britain was rife with magic and mischief, this show brings together epic heroic exploits and divine transformations of the one who would be High King of the Tribes of the Earth Goddess, reimagining ancient mythologies, adapted and brought to life through traditional storytelling, for modern audiences.\n\nIn partnership with 2000 AD and Rebellion Publishing, created by Pat Mills ‘the godfather of British comics’ and Angie Kincaid, Sláine has captured the imagination of comics readers for generations.", "first_date": "2026-09-22", "last_date": "2026-09-22", "url": "https://canalcafetheatre.com/our-shows/slaine/", "tags": ["spoken-word"], "id": "e362", "venue_name": "Canal Café Theatre", "venue_area": "Little Venice"}, {"venue_id": "golden-goose", "title": "DAD", "byline": "The world premiere of DAD by David Solomon, starring Ivan Kaye ( Vikings, Gunpowder Milkshake, The Borgias, Layer Cake ) and Nigel Betts ( Dr Who , Killing Eve, Toast of Tinseltown, Boy Meets Girl ) comes to The Golden Goose this September!", "description": "Nathan reaches out to his two brothers Aaron and Karl to help him find their father who has been missing for two days. In an afternoon full of surprises and revelations, the family begin to come to terms with the terrible trauma that their father has visited on all of them. Beyond Nathan and his brothers, Dad's malign influence has broken the lives of Nathan's ex wife Leila and their son Daniel. DAD is about the ripple effects of control and the persistence of past trauma. A shocking resolution suggests there is only one way to truly escape.\n\nCast Ivan Kaye as Aaron David Solomon as Nathan Nigel Betts as Karl Paul Kelvin as Daniel Joanne Arber as Leila Jerry Ezekiel as Alistair Creative Written by David Solomon Directed by Brittany Rex Lighting and Sound Design by James Denny Fight Direction by Nora Iso-Kungas\n\nThis Production is using a third-party ticketing provider.", "first_date": "2026-09-22", "last_date": "2026-10-03", "url": "https://www.goldengoosetheatre.co.uk/whatson/dad", "tags": ["theatre"], "id": "e363", "venue_name": "Golden Goose Theatre", "venue_area": "Camberwell"}, {"venue_id": "hope-theatre", "title": "G R I E F C A S E", "byline": "G R I E F C A S E is The Hope Theatres first ever co-production in 15 years.", "description": "It offers a space for people to connect and share a common feeling that is often shied away from. At its core, G R I E F C A S E is a show all about the nature of Grief.\n\nIt follows a central character G who returns to his late mothers flat to clean it after the council has already rented back out to a new family. The house becomes a liminal space: no longer theirs, yet still full of traces of who they were and who their mother once hoped they’d become. It explores how memories mutate, how belongings hold emotional weight, and how grief complicates the act of letting go. G R I E F C A S E creates a space for these experiences to be seen and shared, helping to build empathy and connection between communities. The project embodies Tailwind Physical Theatre’s mission to make brave, risk-taking work that amplifies underrepresented voices.", "first_date": "2026-09-22", "last_date": "2026-10-03", "url": "https://www.thehopetheatre.com/griefcase", "tags": ["theatre"], "id": "e364", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "new-diorama", "title": "The First Year (of the Gaza Genocide in the Media)", "byline": "The show you are about to watch is one you’ve been told could never happen again.", "description": "a blistering multimedia investigation into the relationship between mainstream media, public opinion, and state crime. Created in collaboration with globally renowned researchers Shadow World Investigations and the International State Crime Initiative, and rooted in direct testimony from Palestinians in Gaza, The First Year (of the Gaza Genocide in the Media) is a wildly theatrical interrogation of the widening gulf between what we're told, what we witness, and what we choose to believe.\n\nFeaturing original music and an all-Palestinian and Palestinian heritage ensemble, this visually striking and visceral world premiere confronts the nature of truth in reporting, dismantling the machinery used to construct and distort public perception and illuminating the human cost behind journalistic choices.", "first_date": "2026-09-22", "last_date": "2026-10-10", "url": "https://newdiorama.com/whats-on/the-first-year", "tags": ["theatre"], "id": "e365", "venue_name": "New Diorama Theatre", "venue_area": "Regent's Place"}, {"venue_id": "oso-arts", "title": "Barnes Philosophy Club 2026: How Descartes Messed Up Philosophy and Science - Paul Johnston", "byline": "Paul will try to show how Descartes’ attempt to free science from theology created a set of confusions about the mind and about consciousness that all of us remain bogged down in…", "description": "Paul will try to show how Descartes’ attempt to free science from theology created a set of confusions about the mind and about consciousness that all of us remain bogged down in, especially modern neuroscientists and contemporary luminaries on the philosophy of the mind - but all of us insofar as we agree with them that our lives are essentially a series of conscious experiences.\n\nPaul Johnston studied philosophy at Oxford University, where he developed a fascination with the Austrian philosopher, Ludwig Wittgenstein. After completing his undergraduate studies, he spent a year in Paris, attending lectures by, among others, Michel Foucault, Gilles Deleuze and Julia Kristeva. He returned to Oxford to complete a D. Phil entitled Wittgenstein and Moral Philosophy, which was published as a book by Routledge in 1989. By then, he had left academia, but he went on to publish two further books with Routledge: Wittgenstein: Re-thinking the Inner in 1993 and The Contradictions of Modern Moral Philosophy in 1999. He has recently returned to philosophical writing and is due to publish a new book, Why Freud Matters, with Bloomsbury Press in autumn 2027.", "first_date": "2026-09-22", "last_date": "2026-09-22", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173676222", "tags": ["talk"], "price_min": 0.0, "price_max": 5.0, "id": "e366", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "park-theatre", "title": "Jodie Mitchell:  Finds Their Father (But Only to Get an Irish Passport) [Work in Progress]", "byline": "Award-winning comedian Jodie Mitchell is on a mission to find their biological father, but ONLY to get an Irish Passport.", "description": "Join them on a quest to track down a man they have almost no information on and very little interest in knowing more about. They just LOVE human rights! They’re cooky like that.\n\nJodie has appeared on Comedy Central Live , Channel 4’s Jokes Only a Lesbian Can Tell , Rosie Jones’ Disability Extravaganza and BBC Radio 4’s multi-award-winning Time Of The Week , which they also wrote for. They have a viral Ted Talk called Why You Think Women Aren’t Funny , wrote on Netflix’s Sex Education and have co-created and starred as their macho, Glaswegian alter-ego John Travulva in numerous hit shows with their OFFIE Award-winning drag king troupe ‘Pecs’.\n\nEntertainment Union Members Discounts are available Monday – Thursday. Read more", "first_date": "2026-09-22", "last_date": "2026-09-22", "url": "https://parktheatre.co.uk/events/jodie-mitchell-finds-their-father-but-only-to-get-an-irish-passport-work-in-progress/", "tags": ["stand-up"], "id": "e367", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "park-theatre", "title": "Park Theatre Young Company", "byline": "Applications for the 2026-27 Young Company are now closed.", "description": "Working together with our skilled team of professional theatre makers, the young company will develop their skills in theatre and performance. Over the course of the programme they will create and perform in their own show, which will be performed in one of Park Theatre’s auditoriums in 2026.\n\nFees are important for this programme, as they help Park Theatre to cover the cost of running the Young Company, however we do not want fees to be a barrier to accessing this course. Because of this, the cost of this course varies depending on participants’ circumstances.", "first_date": "2026-09-22", "last_date": "2027-03-30", "url": "https://parktheatre.co.uk/programme/young-company/", "tags": ["class"], "id": "e368", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "pleasance-islington", "title": "Cut Price Comedy", "byline": "Babies (infants under 2 years old) do not require a ticket for this show.", "description": "For more information about our venues and performance spaces, please visit our access pages here .\n\nAssistance Meeting Point: Box Office in the main foyer.", "first_date": "2026-09-22", "last_date": "2026-12-15", "url": "https://www.pleasance.co.uk/event/cut-price-comedy-jan-2026", "tags": ["stand-up"], "id": "e369", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "regents-park", "title": "Echo & The Bunnymen", "byline": "Pioneers of post-punk, Echo & The Bunnymen have been a major influence for many iconic groups such as, Coldplay, The Killers, Garbage, The Flaming Lips, Hole and many more with their seminal albums Crocodiles , Heaven Up Here…", "description": "Pioneers of post-punk, Echo & The Bunnymen have been a major influence for many iconic groups such as, Coldplay, The Killers, Garbage, The Flaming Lips, Hole and many more with their seminal albums Crocodiles , Heaven Up Here , Porcupine and Ocean Rain .\n\nTheir later albums Evergreen , What Are You Going to Do with Your Life? , Flowers , Siberia , The Fountain and Meteorites continue to demonstrate the truly exceptional body of work the band have created. Their last studio album The Stars, The Oceans & The Moon was released in Autumn 2018 with Q Magazine calling it ‘Magical’. Now, this tour celebrates it all at its very best!\n\nAuditorium Regent's Park Open Air Theatre London NW1 4NU", "first_date": "2026-09-22", "last_date": "2026-09-23", "url": "https://openairtheatre.com/production/echo-the-bunnymen", "tags": ["concert"], "id": "e370", "venue_name": "Regent's Park Open Air Theatre", "venue_area": "Regent's Park"}, {"venue_id": "shoreditch-town-hall", "title": "unfortunately", "byline": "Following the success of dressed. (2019) and A Little Inquest Into What We Are All Doing Here (2025), m ulti award winning Shoreditch Town Hall Associate Company ThisEgg return with brand new performance, unfortunately.", "description": "Through costume, movement and text, this part fashion show, part theatre show explores our relationship to money. What it tells us about ourselves, and about each other.\n\nThe Scotsman Fringe First Award Winner 2018 & 2024", "first_date": "2026-09-22", "last_date": "2026-09-26", "url": "https://shoreditchtownhall.com/whats-on/unfortunately", "tags": ["theatre"], "id": "e371", "venue_name": "Shoreditch Town Hall", "venue_area": "Shoreditch"}, {"venue_id": "the-cockpit", "title": "History Has No Safe Word", "byline": "Professor Nathan Zangari is fading away. Once voted the sexiest professor on BBC2’s Open University, his highly celebrated archeo-linguistics paper on “Graffiti, Women and the Walls of Pompeii” is now but a distant memory.", "description": "Now, he can’t sleep, he can’t get published, and… he can’t get laid. At the sleep-study clinic that he’s enrolled at, they observe him talking in his sleep, seemingly an intermediary for a long-forgotten Pompeian girl.\n\nWhen overambitious student, Callie, offers to capture his mumblings, they both find themselves sucked into the very real lives of those on the edge of destruction, some 2000 years ago.\n\nBrown clearly knows his history, and the way he brings Pompeii to life is nothing short of astonishing. There is a gripping action scene in the second half that had my wife reaching out her arms to intervene, so immersed was she in the story.", "first_date": "2026-09-22", "last_date": "2026-09-22", "url": "https://www.thecockpit.org.uk/show/history_has_no_safe_word", "tags": ["theatre"], "id": "e372", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "the-place", "title": "IHOPEIWILL", "byline": "What do we hope for—not only for ourselves, but for the generations to come?", "description": "Amid a global atmosphere marked by fear and uncertainty, IHOPEIWILL offers a space for reflection, expectation and hope. Inspired by conversations about family, intergenerational relationships and the personal perspectives that shape how we imagine the future, the piece asks what kind of world we wish to leave behind and what responsibility we have in shaping it.\n\nCombining physical performance, sound design and visual installation, IHOPEIWILL is an artistic reflection on the direction of contemporary society and our collective responsibility to future generations, from interdisciplinary female collective threeiscompany .", "first_date": "2026-09-22", "last_date": "2026-09-22", "url": "https://theplace.org.uk/events/autumn-winter-26-ihopeiwill", "tags": ["dance"], "id": "e373", "venue_name": "The Place", "venue_area": "Euston"}, {"venue_id": "underbelly-boulevard", "title": "Operotica: Lovers in Every Lifetime", "byline": "Operotica : The UK’s premier kinky opera duo. Classically trained, fetish-approved and, as of yesterday, dead.", "description": "Their bodies are cold, but their spirits are restless. Join psychic extraordinaire Séayoncé for a journey through Operotica’s many past lives.\n\nFrom star-crossed nuns to 18th-century ladies-in-waiting, these theatrical reincarnations reveal the true purpose of history’s horniest souls. Will their story of love after death be the greatest (and sexiest) ever told? Witness a haunting that will tear down the opera house and transport you through time.\n\nThis show is part of Fringe Fix – a cracking handpicked selection of shows we think you’ll love from this year’s Edinburgh Festival Fringe.", "first_date": "2026-09-22", "last_date": "2026-09-23", "url": "https://underbellyboulevard.com/tickets/operotica-lovers-in-every-lifetime/", "tags": ["opera", "cabaret"], "id": "e374", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "bridewell", "title": "Critical Moment", "byline": "A celebration of older choreographers.", "description": "Following from previous years’ performances at the Royal Academy of Dance's Studio Theatre and The Place Theatre London, Critical Moment returns, this time to The Bridewell, with even more choreographers and talented performers.", "first_date": "2026-09-23", "last_date": "2026-09-23", "url": "https://sbf.org.uk/whats-on/view/critical-moment/", "tags": ["dance"], "id": "e375", "venue_name": "Bridewell Theatre", "venue_area": "Blackfriars"}, {"venue_id": "canal-cafe", "title": "How to Steal a Million Euros: The Frauds That Made Europe", "byline": "Financial journalist and author Matthew Partridge goes continental in his third ‘Horrible Histories for adults’ style show covering some of the juiciest frauds and scandals that “made” Europe.", "description": "Topics include the Scotsman who nearly bankrupted France (while creating the term ‘millionaire’), and the man who forged an entire nation’s currency, to the oligarch who was the most powerful man in Russia – until he installed a former cab driver as President.\n\nWritten, Directed & Performed by Matthew Partridge", "first_date": "2026-09-23", "last_date": "2026-09-23", "url": "https://canalcafetheatre.com/our-shows/how-to-steal-a-million-euros/", "tags": ["stand-up"], "id": "e376", "venue_name": "Canal Café Theatre", "venue_area": "Little Venice"}, {"venue_id": "greenwich-theatre", "title": "Fleetwood Mac UK", "byline": "Relive the unforgettable music of Fleetwood Mac with Fleetwood Mac UK Tributes, one of the UK’s premier tribute shows celebrating the legendary band’s timeless catalogue.", "description": "From the haunting beauty of Landslide and Songbird to the chart-topping anthems Go Your Own Way, Dreams, The Chain, and Don’t Stop, every performance captures the sound, style, and spirit that made Fleetwood Mac one of the world’s greatest bands. Featuring exceptional musicianship, stunning harmonies, and authentic costumes, this spectacular live show recreates the magic of Fleetwood Mac’s iconic concerts. Whether you’re a lifelong fan or discovering these classic songs for the first time, you’ll enjoy an evening filled with nostalgia, energy, and unforgettable performances.", "first_date": "2026-09-23", "last_date": "2026-09-23", "url": "https://greenwichtheatre.org.uk/events/fleetwood-mac-uk/", "tags": ["concert"], "id": "e377", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "oso-arts", "title": "Hauntings", "byline": "Hauntings is a spellbinding evening of three tales of the supernatural from two of the world’s greatest writers of ghost stories, E. F. Benson and M. R. James.", "description": "With masterful storytelling from the Olivier Award-nominated actor Gerard Logan, Hauntings will transport you to a world of invisible, but terrifyingly present, spirits.\n\nGerard Logan’s extensive stage career includes roles at the National Theatre and RSC. Directed by Gareth Armstrong, with music by Simon Slater.", "first_date": "2026-09-23", "last_date": "2026-09-23", "url": "https://osoarts.ticketsolve.com/ticketbooth/shows/1173674657", "tags": ["theatre", "spoken-word"], "price_min": 18.9, "price_max": 21.0, "id": "e378", "venue_name": "OSO Arts Centre", "venue_area": "Barnes"}, {"venue_id": "park-theatre", "title": "Kick Off With a Verse", "byline": "Kick off with a Verse is a series of weekly 90-minute sessions to support unpaid carers. It is a space where we use poems to start a conversation about the experiences of being a carer and tap into creative parts of ourselves.", "description": "In a session we get grounded and learn different ways to relax. We listen to a poem, noting what comes up for us and share, first in small groups, then in the large group. With guidance, we each find our own words or even just one word to describe our experiences, sharing with others if we choose to.\n\nSessions are run in parallel with Together in Time , Park Theatre’s singing sessions for people living with dementia and their carers. Both groups run in the same building at the same time. If you are a carer for someone living with dementia, they are welcome to attend Together in Time while you are at Kick Off with a Verse.", "first_date": "2026-09-23", "last_date": "2027-07-21", "url": "https://parktheatre.co.uk/programme/kick-off-with-a-verse/", "tags": ["class"], "id": "e379", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "pleasance-islington", "title": "El Manshiyyeh", "byline": "El-Manshiyyeh , by playwright Samer Al-Saber , ufolds through a simple, stripped-back theatrical language in which most physical elements are intentionally absent from the stage.", "description": "This deliberate minimalism invites the audience to actively engage their imagination. Everyday actions — pouring coffee, opening a cupboard — are suggested through gesture rather than realistic depiction, creating space for personal memory and individual interpretation. The “cupboard” you picture may well resemble one from your own past, shaped by memory rather than material presence. Theater aficionados will find its style reminiscent of Thornton Wilder’s classic Our Town .\n\nRooted in the traditions of Palestinian storytelling, the play draws deeply from oral history and collective memory. Its emphasis on the body, voice, and gesture, rather than conventional realism, places it within a wider Palestinian theatrical lineage—one that foregrounds imagination and honours the unseen connections between past and present. In this way, the performance becomes not just something to watch, but something to complete through recollection and feeling.\n\nThe intangible heritage of El-Manshiyyeh neighbourhood in Jaffa pulses through every aspect of the work: its language and dialect, its references to food and daily rituals, its folk stories, and the rhythms embedded in its speech. These elements conjure a vivid cultural landscape, one that has been carried across generations through lived experience and shared narrative. The stage becomes a meeting point for memory and imagination, where fragments of the past are reassembled in the present moment. Co-directed by Marina Johnson and Samer Al-Saber , the play asks two central questions: will El-Manshiyyeh survive 1948, and what will the future hold for its people?", "first_date": "2026-09-23", "last_date": "2026-09-26", "url": "https://www.pleasance.co.uk/event/el-manshiyyeh", "tags": ["theatre"], "id": "e380", "venue_name": "Pleasance Islington", "venue_area": "Caledonian Road"}, {"venue_id": "siobhan-davies", "title": "Re-making / Breaking Traditions III", "byline": "This workshop is for BPOC/Global majority artists working with performance.", "description": "Join us for Re-making/Breaking Traditions III exploring how rituals of cultural tradition can/not be translated into rituals of performance.\n\nThere will be movement discussion and devising facilitated by Annie Pui Ling Lok.", "first_date": "2026-09-23", "last_date": "2026-09-23", "url": "https://www.siobhandavies.com/events/re-making-breaking-traditions-iii/", "tags": ["class"], "id": "e381", "venue_name": "Siobhan Davies Studios", "venue_area": "Elephant and Castle"}, {"venue_id": "tabard", "title": "Girl Out Of The Blue", "byline": "When seventeen-year-old Abi tracks down the man she believes to be her father, she sets in motion a chain of events that will change two families forever.", "description": "Doug is a successful journalist with a wife, children and a carefully ordered life. Beth, Abi's mother, has spent seventeen years protecting her daughter from a truth she hoped would never come to light. But Abi wants answers, and once she steps into Doug's world, long-buried secrets can no longer remain hidden.\n\nSharp, funny and emotionally charged, Girl Out of the Blue is a compelling new play about family, identity, motherhood and the consequences of the choices we make.", "first_date": "2026-09-23", "last_date": "2026-10-10", "url": "https://www.tabard.org.uk/production/girl-out-of-the-blue", "tags": ["theatre"], "id": "e382", "venue_name": "Tabard Theatre", "venue_area": "Chiswick"}, {"venue_id": "tabernacle", "title": "Martha Wainwright", "byline": "Join Martha Wainwright for an intimate, unforgettable evening in London as she previews new songs from her upcoming album.", "description": "In this rare, close-up setting, Martha will share some of her newest material, offering fans a first glimpse into her latest work as well as your favourites from her back catalogue. Don’t miss this special night. Tickets", "first_date": "2026-09-23", "last_date": "2026-09-23", "url": "https://www.thetabernaclew11.com/events/2026/9/23/martha-wainwright", "tags": ["concert"], "id": "e383", "venue_name": "The Tabernacle", "venue_area": "Notting Hill"}, {"venue_id": "the-cockpit", "title": "Meet the Bloggers", "byline": "A free meet-up in the brand new Cockpit bar primarily for theatre writers, content creators, and reviewers to mingle with fringe companies, activists, and venue operators.", "description": "This event will begin with a meet and greet in the Cockpit bar, followed by an informal presentation or two by theatre commentors. Our host of the night can offer guided discussion, but this informal event encourages organic conversation between guests.\n\nThe aim is to provide a space for theatre commentors and theatre makers to get to know each other's work, to initiate professional relationships, and to help create a space where interesting ideas and issues can be aired, disseminated, and mobilised.", "first_date": "2026-09-23", "last_date": "2026-09-23", "url": "https://www.thecockpit.org.uk/meetthebloggers", "tags": ["social"], "id": "e384", "venue_name": "The Cockpit", "venue_area": "Marylebone"}, {"venue_id": "bridewell", "title": "Lovett", "byline": "A fascinating, darkly comic tale of Mrs Lovett's life before her infamous partnership with Sweeney Todd, we discover what would later lead her to turn pie-maker.", "description": null, "first_date": "2026-09-24", "last_date": "2026-09-24", "url": "https://sbf.org.uk/whats-on/view/lovett/", "tags": ["theatre"], "id": "e385", "venue_name": "Bridewell Theatre", "venue_area": "Blackfriars"}, {"venue_id": "etcetera", "title": "The Sociable Plover", "byline": "Nothing and nobody will stop Roy Tunt from spotting his wild birds. On a stormy December morning on England's desolate east coast, Roy is on a very special mission: to record all 567 species on the British List.", "description": "With conditions perfect for spotting the rare and beautiful Sociable Plover, Roy sequesters himself in a bird-spotter's hide on a flooded stretch of marshland. Armed with a packed lunch and a framed photograph of his ex-wife, he watches and waits.\n\nBut might he have other plans? And who is the tall, dark and handsome stranger battling through the flood waters towards him?", "first_date": "2026-09-24", "last_date": "2026-09-26", "url": "https://www.etceteratheatrecamden.com/events/the-sociable-plover-2", "tags": ["theatre"], "id": "e386", "venue_name": "Etcetera Theatre", "venue_area": "Camden Town"}, {"venue_id": "greenwich-theatre", "title": "Richard II", "byline": "Richard II Richard II is a story of power, betrayal, and political collapse.", "description": "Set against the turmoil of 1970s England, this new telling from Get a Proper Job Theatre Company explores the fragility of leadership and the cost of inherited authority in a nation on the brink of change. This production foregrounds the tension", "first_date": "2026-09-24", "last_date": "2026-09-25", "url": "https://greenwichtheatre.org.uk/events/richard-ii/", "tags": ["theatre"], "id": "e387", "venue_name": "Greenwich Theatre", "venue_area": "Greenwich"}, {"venue_id": "hen-and-chickens", "title": "Look Up at the Stars", "byline": "It’s the 1980s, and Patricia Meadows, glamorous star of British movies of the Forties and Fifties, has a tell-all memoir which threatens to expose many scandals.", "description": "But what price will Patricia pay to reclaim her place in show business history?\n\nStephen and Jessica first worked together on Stephen’s Dr Who story, The Greatest Show in the Galaxy. Their journey continues…", "first_date": "2026-09-24", "last_date": "2026-09-27", "url": "https://www.unrestrictedview.co.uk/events/look-up-at-the-stars", "tags": ["theatre"], "id": "e388", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "ica", "title": "CTM × ICA 2026", "byline": "Berlin's CTM Festival returns to the ICA for its fourth iteration, bringing together artists working across experimental composition and electronics, punk and performance.", "description": "From intricate new works and A/V weirdings to shattered club mutations, the program traces a range of approaches to contemporary sound.", "first_date": "2026-09-24", "last_date": "2026-09-25", "url": "https://www.ica.art/live/ctm-ica-2026", "tags": ["concert"], "id": "e389", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "ica", "title": "CTM × ICA: Tyondai Braxton + Rian Treanor with Rotherham Sight & Sound", "byline": "The first of two CTM × ICA 2026 nights converges on the art of reconstruction, pairing meticulous avant-garde worlds with hyper-regional sonic archaeology. Featuring Tyondai Braxton and Rian Treanor with Rotherham Sight & Sound.", "description": null, "first_date": "2026-09-24", "last_date": "2026-09-24", "url": "https://www.ica.art/live/ctmxica-2026-1", "tags": ["concert"], "id": "e390", "venue_name": "ICA", "venue_area": "The Mall"}, {"venue_id": "jacksons-lane", "title": "Mixed Doubles: Enrico Touche / Dulce Duca", "byline": "Mixed Doubles brings together two performances in one night. Carefully paired, each programme showcases different artists, disciplines and perspectives.", "description": "_____________________________________________________________________________________________\n\nHot Knees is a visually driven clown comedy about ambition, delusion and following your passions to their illogical conclusion. Combining physical comedy, games and audience interaction, the show delivers an almost wordless hour of escalating absurdity. The stage persona of Simon Ambrose Brown, Enrico blends clowning, slapstick and cabaret in a style that has entertained audiences across the UK and beyond.\n\nUm Belo Dia is a red pepper onto which we put wings and it becomes a butterfly”. An poetic, metaphorical, comic and surrealist show of physical theatre, circus, dance and juggling/club balancing, for all audiences.", "first_date": "2026-09-24", "last_date": "2026-09-24", "url": "https://www.jacksonslane.org.uk/events/mixed-doubles-dulce-duca-enrico-touche/", "tags": ["circus", "comedy"], "id": "e391", "venue_name": "Jacksons Lane", "venue_area": "Highgate"}, {"venue_id": "lyric-hammersmith", "title": "Savage & Simon Says: A Double Bill", "byline": "Savage & Simon Says ask what we truly owe each other, and where that responsibility ends.", "description": "Savage by Madeline Whitby and Simon Says by Elizabeth Whitby were selected from over 250 submissions to the Bill Cashmore Award: One Act Play Prize , to be performed by the 2026 SPRINGBOARD trainees.\n\nWhen outsiders threaten the peace of two young groups of friends, loyalties fracture and hidden motives surface.", "first_date": "2026-09-24", "last_date": "2026-10-03", "url": "https://lyric.co.uk/shows/a-double-bill-savage-simon-says/", "tags": ["theatre"], "id": "e392", "venue_name": "Lyric Hammersmith", "venue_area": "Hammersmith"}, {"venue_id": "park-theatre", "title": "Helen Bauer:  Working and God Willing Progressing (WIP)", "byline": "It is time to work up a brand-new hour of stand up! And sure it’s just ideas right now but how do you write about love until you have had it!?", "description": "Well easy just pretend. LIKE ALL OF YOU DO. Right!? RIGHT!? I don’t know. See you there. As seen on Live At The Apollo, Am I Being Unreasonable? and Make That Movie.", "first_date": "2026-09-24", "last_date": "2026-09-24", "url": "https://parktheatre.co.uk/events/helen-bauer-working-and-god-willing-progressing-wip/", "tags": ["stand-up"], "id": "e393", "venue_name": "Park Theatre", "venue_area": "Finsbury Park"}, {"venue_id": "regents-park", "title": "Alfa Mist", "byline": "Join Alfa Mist for one night only in the heart of Regent's Park as part of our Live Music Week!", "description": "Since the release of his first full-length project Nocturne in 2015, Alfa has established himself as one of the UK’s most focused, in-demand and distinct musical voices. He has worked with the likes of Jordan Rakei and Tom Misch . Artists look to him for his unique blend of intimate bedroom production and expansive jazz group orchestration, since Alfa is yet to be boxed into a specific genre. His music spans everything from hip-hop beat-making to producing for artists such as rapper Loyle Carner , composing neo-classical works for the London Contemporary Orchestra , and reworking tracks from composer Ólafur Arnalds and pioneering jazz label Blue Note .\n\nMain Auditorium Regent's Park Open Air Theatre London NW1 4NU", "first_date": "2026-09-24", "last_date": "2026-09-24", "url": "https://openairtheatre.com/production/alfa-mist", "tags": ["concert"], "id": "e394", "venue_name": "Regent's Park Open Air Theatre", "venue_area": "Regent's Park"}, {"venue_id": "sadlers-wells", "title": "English National Ballet - Rhythm Riot", "byline": "One stage, three moods. Explosive energy. Deep resonance. Unstoppable drive. Feel the pulse of ballet now.", "description": "A rhythm that ignites the night, George Balanchine’s Symphony in Three Movements is a 21-minute corker. No tutus – only leotards, no tiaras – only ponytails, and no story – only the bold propulsion of Stravinsky’s percussi
