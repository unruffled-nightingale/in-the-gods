der identity, and the desperate lengths a parent will go to for a dying child.", "first_date": "2026-11-03", "last_date": "2026-11-03", "url": "https://sbf.org.uk/whats-on/view/goldfish/", "tags": ["theatre"], "id": "e881", "venue_name": "Bridewell Theatre", "venue_area": "Blackfriars"}, {"venue_id": "camden-peoples-theatre", "title": "The Show I Feel I Cannot Do (WIP)", "byline": "Overwhelm? Yes. Paralysis? All the time mate. Breathe. Look inward. Discover yourself, the exact contours of your internal identity, and thus, solace.", "description": "Ok sounds good. Love solace. Love thinking about me. ... Feels like I can’t quite get it. The exact contours of your internal identity? Yeah, seems complex. Oh no, you’ll get it, keep trying. Really? There’s a lot of other stuff to be worried about, feel like I should maybe go and help - No, no, this is the key. Find that you-ness. The most you-y you. Become, attain, define. Well, that’s going to take forever. Hopefully. What was that? I said it will be worth it. ... Solace, remember? Protect your peace. Oh, yeah.", "first_date": "2026-11-03", "last_date": "2026-11-03", "url": "https://cptheatre.co.uk/whatson/The-Show-I-Feel-I-Cannot-Do-WIP", "tags": ["theatre"], "id": "e882", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "camden-peoples-theatre", "title": "She Was There (WIP)", "byline": "From Enoch Powell’s Rivers of Blood to Keir Starmer’s Island of Strangers, She Was There is a playful exploration of the lives and hidden histories of women who resisted racism in 1970s and 80s London.", "description": "The one-woman performance by Tasnim Siddiqa Amin is informed by in-depth research by Dr Julia Giese and will be followed by an Adda, an informal space for discussion with food and hot drinks provided.", "first_date": "2026-11-03", "last_date": "2026-11-03", "url": "https://cptheatre.co.uk/whatson/She-Was-There", "tags": ["theatre"], "id": "e883", "venue_name": "Camden People's Theatre", "venue_area": "Euston, NW1"}, {"venue_id": "drayton-arms", "title": "Where Would You Like To Start?", "byline": "Frances and Jonah are the happiest they've ever been. With changing friendships, doubt-inducing jobs, and an overheard therapy session however - is it true that you can only trust yourself?", "description": "Follow Frances and Jonah, Sadie and Rich, in Shaw Productions’ new play.\n\nStarring Eleanor Cross, Mia Haynes-French, James Walsh, Wesley Ruthven", "first_date": "2026-11-03", "last_date": "2026-11-07", "url": "https://thedraytonarmstheatre.co.uk/where-would-you-like-to-start", "tags": ["theatre"], "id": "e884", "venue_name": "Drayton Arms Theatre", "venue_area": "South Kensington"}, {"venue_id": "hen-and-chickens", "title": "Scenes With Girls", "byline": "3rd - 7th November 7.30pm £15\n\"You're only the greatest person ever invented and he's some boy who's probably never had a conversation with a side of the sun before”.", "description": "You know this friendship. You’ve had this friendship. This is that friendship. Lou and Tosh might be attached at the hip, but their philosophies couldn’t be further apart. While Lou is sleeping with anyone who asks nicely, Tosh has deemed herself radically celibate. Enter Fran: engaged and insufferable. Miriam Battye's play explores the fierce nature of female friendship and the parts of your twenties nobody prepared you for.", "first_date": "2026-11-03", "last_date": "2026-11-07", "url": "https://www.unrestrictedview.co.uk/events/scenes-with-girls", "tags": ["theatre"], "id": "e885", "venue_name": "Hen & Chickens Theatre", "venue_area": "Islington"}, {"venue_id": "hope-theatre", "title": "Coming To Conclusions", "byline": "A cocky and clever uni student is dead set on finding herself through fucking other people and living up to her expectations of modern queerness.", "description": "But one surprising hookup might bring her modern love montage to an end. From the comfort of her bedroom, we are with her through sex, situationships and spliff fuelled philosophical discussions. As people come in and out of her life and her bed, will they help her come to conclusions about her identity and her future? 'coming to conclusions. is a coming-of-age play exploring how we find and lose ourselves in other people through the self-inflicted sexual chaos of a queer university student. After a successful run during The Hope Theatre's 'Write Club' festival, 'coming to conclusions' is returning to the venue for an extended run. “Some people want to be in relationships, you know?” “I don’t get it.”", "first_date": "2026-11-03", "last_date": "2026-11-07", "url": "https://www.thehopetheatre.com/comingtoconclusions", "tags": ["theatre"], "id": "e886", "venue_name": "The Hope Theatre", "venue_area": "Islington"}, {"venue_id": "orange-tree", "title": "Cranford", "byline": "Welcome to Cranford: a small town where gossip travels fast and traditions run deep. But in the 1840s, change is coming – whether anyone likes it or not.", "description": "Tamsin Greig ( Black Books, Green Wing, Friday Night Dinner, Episodes ) leads an ensemble cast as Matty Jenkyns, who lives at the centre of a close-knit community of formidable women. Their lives are governed by a web of peculiar customs and unspoken rules. But as the outside world rushes in, the residents of Cranford must navigate troubled friendships, lost love, and the challenge of holding on to what matters most.\n\nElizabeth Gaskell ’s 1853 novel celebrates the complexities of everyday life with humour, heart, and extraordinary insight. It stands alongside her North and South and Wives and Daughters as a masterpiece of Victorian fiction. Director Josh Roche reunites with writers Lin Coghlan and Shaun McKenna following their ‘masterpiece’ adaptation of The Forsyte Saga at the RSC.", "first_date": "2026-11-03", "last_date": "2027-01-16", "url": "https://orangetreetheatre.co.uk/whats-on/cranford/", "tags": ["theatre"], "id": "e887", "venue_name": "Orange Tree", "venue_area": "Richmond"}, {"venue_id": "playground-theatre", "title": "Voila! Theatre Festival", "byline": "We’re thrilled to welcome Voila! Europe back to The Playground Theatre this November!", "description": "This dynamic festival celebrates multilingual, multicultural performances, bringing bold new voices and stories to the stage. Join us for two thrilling weeks of theatre, performance and creative exploration, with a specially curated series of double shows you won’t want to miss.\n\nTo make the most of your festival experience, we’ve created a range of multi-show passes so you can enjoy more for less :\n\n5th NOV : Deep, Deep Waters + (M)Others Between Shores 6th NOV: (Un)Shakespearean Nightmares + Deep, Deep Waters", "first_date": "2026-11-03", "last_date": "2026-11-21", "url": "https://www.theplaygroundtheatre.org.uk/projects/voilafestival-2026", "tags": ["theatre"], "id": "e888", "venue_name": "The Playground Theatre", "venue_area": "North Kensington"}, {"venue_id": "playground-theatre", "title": "Much Crazy About Nothing", "byline": "Much Crazy About Nothing is a surreal new play set in a world where professional breakup agents are hired to end relationships on behalf of their clients.", "description": "As one employee begins to question the system they help sustain, the boundary between performance and genuine emotion starts to dissolve.\n\nBlending absurdity with wit, the play explores emotional labour, race, identity and modern intimacy, asking what remains of human connection when our most intimate relationships become transactional.\n\nPlayful, unsettling and unexpectedly tender, Much Crazy About Nothing invites audiences into a world that feels both surreal and uncomfortably familiar.", "first_date": "2026-11-03", "last_date": "2026-11-04", "url": "https://www.theplaygroundtheatre.org.uk/projects/much-crazy-about-nothing", "tags": ["theatre"], "id": "e889", "venue_name": "The Playground Theatre", "venue_area": "North Kensington"}, {"venue_id": "underbelly-boulevard", "title": "Josh Thomas: Jiggle, Jiggle", "byline": "Josh started doing stand-up 20 years ago. In that time, he’s won some prizes and lost a lot of celebrity versions of reality TV shows.", "description": "His shows Please Like Me and Everything’s Gonna Be Okay were international sensations. They dealt with lots of important * issues * but this year he just wants to be silly.\n\nIf a customer requires the assistance of a personal assistant or a carer to attend, the companion is eligible for a complimentary personal assistant ticket. Free companion tickets can be booked in person, by email or over the phone.\n\nTucked away on Level 1 of Underbelly Boulevard Soho, our bar is one of Soho’s best kept secrets. With a selection of well-crafted classic cocktails, wines, beer and cider, as well as delicious non-alcoholic and soft options, tea and coffee, there’s a drink for every occasion and every taste on the menu.", "first_date": "2026-11-03", "last_date": "2026-11-08", "url": "https://underbellyboulevard.com/tickets/josh-thomas-jiggle-jiggle/", "tags": ["stand-up"], "id": "e890", "venue_name": "Underbelly Boulevard", "venue_area": "Soho"}, {"venue_id": "white-bear", "title": "Death of a Brixton Monday", "byline": "It's Jimmy's funeral and his widow Sheila is struggling to accept her loss. His old five-aside football team The Brixton Mondays are missing him too.", "description": "They're all there remembering the good times when they played every week at Brixton Rec - and they're enjoying the free booze! As Mad Al says, \"You have the best laughs at funerals\". But as the day moves on and the alcohol kicks in, secrets come out into the open and old resentments surface. And as for Jimmy, he is there in spirit - yes haunting the event and observing as friendships unravel and his wife plans for life without him. This play tackles big themes with a light comedic touch and characters you won't forget. Johnnie Sinnott's previous play The Famous Brixton const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = iso => { const d=new Date(iso+"T00:00:00"); return d.getDate()+" "+M[d.getMonth()]; };
const fmtRange = iso => {
  const d=new Date(iso+"T00:00:00");
  const y=filters.from.slice(0,4)!==filters.to.slice(0,4);
  return fmt(iso)+(y ? " "+d.getFullYear() : "");
};
const todayISO = () => {
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+
         String(d.getDate()).padStart(2,"0");
};
// Weekly extract still holds last night's closers; they cannot appear on a
// slider that starts today, so drop them from the page set and the total.
const EVENTS = _ALL.filter(e => (e.last_date||"") >= todayISO());
const parseISO = iso => {
  const [y,m,d]=(iso||"").split("-").map(Number);
  return Date.UTC(y, (m||1)-1, d||1);
};
const toISO = ms => new Date(ms).toISOString().slice(0,10);
function windowEndISO(){
  const d=new Date();
  // Last day of the month three months out (Sep → 30 Nov). If a show
  // *starts* after that, extend just far enough that it can appear —
  // otherwise it sits in the total but is unreachable on the slider.
  // Do not use last_date: standing bookings run years out.
  const end=new Date(d.getFullYear(), d.getMonth()+3, 0);
  let max=end.getFullYear()+"-"+String(end.getMonth()+1).padStart(2,"0")+"-"+
         String(end.getDate()).padStart(2,"0");
  for (const e of EVENTS){
    const start=e.first_date||"";
    if (start>max) max=start;
  }
  return max;
}
function dateSpan(){
  const min=todayISO();
  const max=windowEndISO();
  return {min, max: max<min ? min : max};
}
function rangeMax(){
  const s=dateSpan();
  return Math.max(1, Math.round((parseISO(s.max)-parseISO(s.min))/86400000));
}
const isoToIdx = iso => {
  const s=dateSpan(), max=rangeMax();
  return Math.max(0, Math.min(max,
    Math.round((parseISO(iso)-parseISO(s.min))/86400000)));
};
const idxToIso = i => toISO(parseISO(dateSpan().min)+i*86400000);

const TAG_ORDER=["theatre","concert","comedy","class","stand-up","dance","talk","musical","spoken-word","film","social","cabaret","opera","puppetry","sport","exhibition","immersive","magic","circus"];
const ALL_TAGS=[...new Set(EVENTS.flatMap(e=>e.tags||[]))].sort((a,b)=>{
  const ia=TAG_ORDER.indexOf(a), ib=TAG_ORDER.indexOf(b);
  if(ia>=0 && ib>=0) return ia-ib;
  if(ia>=0) return -1;
  if(ib>=0) return 1;
  return a.localeCompare(b);
});
const ALL_VENUES=[...new Map(EVENTS.map(e=>[e.venue_id, e.venue_name||e.venue_id])).entries()]
  .sort((a,b)=>a[1].localeCompare(b[1]));
const VENUE_IDS=new Set(ALL_VENUES.map(([id])=>id));

function defaultFilters(){
  const s=dateSpan();
  return {tags:[], venues:[], from:s.min, to:s.max};
}
let filters=defaultFilters();
let filtersOpen=false;

/* Stable key: venue + slugified title. Survives re-extraction, because
   array position does not. Value carries enough metadata that a starred
   show stays meaningful even after it drops out of the current feed. */
const slug = s => s.toLowerCase().normalize("NFKD")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80);
const keyOf = e => e.venue_id + "::" + slug(e.title);
const meta = e => ({title:e.title, venue:e.venue_name, url:e.url,
                    from:e.first_date, to:e.last_date, at:Date.now()});

let starred={}, binned={};      // key -> metadata
let mode="all", subset=null;

// Biased shuffle: theatre and starred rise, nothing is guaranteed first.
const THEATRE_W = 4;
const STAR_W = 5;
function weightOf(e){
  let w = 1;
  if ((e.tags || []).includes("theatre")) w *= THEATRE_W;
  if (keyOf(e) in starred) w *= STAR_W;
  return w;
}
function weightedShuffle(arr){
  return arr
    .map(e => ({e, k: Math.pow(Math.random(), 1 / weightOf(e))}))
    .sort((a, b) => b.k - a.k)
    .map(x => x.e);
}

function parseStore(raw){
  if(!raw) return {};
  try{
    const v = typeof raw === "string" ? JSON.parse(raw) : raw;
    return v && typeof v === "object" ? v : {};
  }catch(e){ return {}; }
}
async function readKey(name){
  // Claude artifacts expose window.storage; a normal page (and most MCP
  // UI iframes) use localStorage. Prefer the host store when it already
  // has data, otherwise fall back.
  if(window.storage && typeof window.storage.get === "function"){
    try{
      const r = await window.storage.get(name);
      const v = parseStore(r && r.value);
      if(Object.keys(v).length) return v;
    }catch(e){}
  }
  try{ return parseStore(localStorage.getItem(name)); }
  catch(e){ return {}; }
}
async function writeKey(name, obj){
  const json = JSON.stringify(obj);
  let ok = false;
  if(window.storage && typeof window.storage.set === "function"){
    try{ await window.storage.set(name, json); ok = true; }catch(e){}
  }
  try{ localStorage.setItem(name, json); ok = true; }catch(e){}
  if(!ok) console.warn("persist failed", name);
}
async function load(){
  starred = await readKey("starred.v2");
  binned  = await readKey("binned.v2");
  const seeded = await readKey("prestar-seeded.v1");
  let dirty=false;
  for (const k of Object.keys(seeded)){
    if (k in starred){ delete starred[k]; dirty=true; }
  }
  if (dirty) await writeKey("starred.v2", starred);
  if (Object.keys(seeded).length) await writeKey("prestar-seeded.v1", {});
  filters = defaultFilters();
}
let persistTimer = null;
function persist(){
  // debounce rapid taps so the last state is what gets written
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    writeKey("starred.v2", starred);
    writeKey("binned.v2", binned);
  }, 120);
}

function visible(){
  let l=EVENTS;
  if(filters.tags.length){
    const want=new Set(filters.tags);
    l=l.filter(e=>(e.tags||[]).some(t=>want.has(t)));
  }
  if(filters.venues.length){
    const want=new Set(filters.venues);
    l=l.filter(e=>want.has(e.venue_id));
  }
  l=l.filter(e=>e.first_date<=filters.to && e.last_date>=filters.from);
  if(subset){
    const have=new Map(l.map(e=>[e.id,e]));
    l=subset.map(id=>have.get(id)).filter(Boolean);
  }
  if(mode==="starred") l=l.filter(e=>keyOf(e) in starred);
  else if(mode==="binned") l=l.filter(e=>keyOf(e) in binned);
  else l=l.filter(e=>!(keyOf(e) in binned));
  return l;
}

function filtersActive(){
  const d=defaultFilters();
  return filters.tags.length>0 || filters.venues.length>0 ||
    filters.from!==d.from || filters.to!==d.to;
}

function syncFilterToggle(){
  document.getElementById("tFilter").setAttribute("aria-pressed",
    (filtersOpen || filtersActive()) ? "true" : "false");
}

function applyFilters(){
  persist();
  syncFilterToggle();
  render();
}

function resetFilters(){
  filters=defaultFilters();
  subset=null;
  syncFilterUI();

function restoreAll(){

function recount(){
  const list=visible();

    "<b>"+list.length+"</b> / "+EVENTS.length;
  syncBinTools();
  const main=document.getElementById("list");
  if(!list.length && !main.querySelector("article")){

function foldAway(article){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    article.remove();
    recount();
    return;
  }
  const h=article.offsetHeight;
  article.classList.add("folding");
  article.style.height=h+"px";
  const ms=Math.round(Math.min(560, Math.max(240, h/0.95)));
  // Web Animations is more reliable than transitionend on iOS
  const anim=article.animate(
    [{height:h+"px"},{height:"0px"}],
    {duration:ms, easing:"linear", fill:"forwards"}
  );
  let done=false;
  const finish=()=>{
    if(done) return;
    done=true;
    article.remove();
    recount();
  };
  anim.finished.then(finish, finish);
  setTimeout(finish, ms+80);
}

function syncRange(){
  const max=rangeMax();
  const a=isoToIdx(filters.from), b=isoToIdx(filters.to);
  const from=document.getElementById("rFrom");
  const to=document.getElementById("rTo");
  from.max=to.max=max;
  from.value=a; to.value=b;
  document.getElementById("labFrom").textContent=fmtRange(filters.from);
  document.getElementById("labTo").textContent=fmtRange(filters.to);
  const fill=document.getElementById("rangeFill");
  fill.style.left=(a/max*100)+"%";
  fill.style.width=((b-a)/max*100)+"%";
}

  document.querySelectorAll("#venueChips .chip").forEach(btn=>{

function toggleChip(kind, value){
  const arr = kind==="tag" ? filters.tags : filters.venues;
  const i=arr.indexOf(value);
  if(i>=0) arr.splice(i,1); else arr.push(value);

  applyFilters();
}

let filterAnim=null;
function setFiltersOpen(next){
  if(next===filtersOpen) return;
  filtersOpen=next;
  syncFilterToggle();
  document.getElementById("tFilter").setAttribute("aria-expanded", next);
  const panel=document.getElementById("filters");
  panel.setAttribute("aria-hidden", next ? "false" : "true");
  const inner=document.getElementById("filtersInner");
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(filterAnim){ try{ filterAnim.cancel(); }catch(e){} filterAnim=null; }
  if(reduce){
    panel.style.height = next ? "auto" : "0px";
    return;
  }
  const from = next ? 0 : panel.offsetHeight;
  const to = next ? inner.scrollHeight : 0;
  panel.style.height = from+"px";
  const ms=Math.round(Math.min(560, Math.max(240, Math.abs(to-from)/0.95)));
  filterAnim=panel.animate(
    [{height:from+"px"},{height:to+"px"}],
    {duration:ms, easing:"linear", fill:"forwards"}
  );
  const finish=()=>{
    try{ filterAnim.commitStyles(); filterAnim.cancel(); }catch(e){}
    panel.style.height = next ? "auto" : "0px";
    filterAnim=null;
  };
  filterAnim.finished.then(finish, finish);
}

function render(note){

      : '<p class="blurb none">No description</p>';
    const tags=(e.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('<span class="sep">·</span>');
    const venue=e.venue_name+(tags?'<span class="sep">·</span>'+tags:'');
    const byline = e.byline ? '<p class="byline">'+e.byline+'</p>' : '';
    return '<article class="'+(b?'binned':'')+'">'+
      '<div class="slot">'+
      '<div class="when caps">'+when+'</div>'+
      '<h2><a href="'+e.url+'" target="_blank" rel="noopener">'+e.title+'</a></h2>'+
      '<div class="venue caps">'+venue+'</div>'+
      byline+blurb+
      '<div class="acts">'+
        '<button class="act star" data-key="'+k+'" data-k="star" '+
          'aria-pressed="'+s+'" aria-label="Star">'+SVG.star+'</button>'+
        '<button class="act bin" data-key="'+k+'" data-k="bin" '+
          'aria-pressed="'+b+'" aria-label="Bin">'+SVG.bin+'</button>'+
      '</div></div></article>';
  }).join("");

  const byKey=Object.fromEntries(list.map(e=>[keyOf(e),e]));
  el.querySelectorAll(".act").forEach(btn=>{
    btn.onclick=()=>{
      const k=btn.dataset.key, e=byKey[k];
      if(btn.dataset.k==="star"){
        if(k in starred) delete starred[k];
        else { starred[k]=meta(e); delete binned[k]; }
      } else {
        if(k in binned) delete binned[k];
        else { binned[k]=meta(e); delete starred[k]; }
      }
      persist();
      if(visible().some(x=>keyOf(x)===k)) render();
      else {
        const article=btn.closest("article");
        if(k in binned){
          article.classList.add("binned");
          const bin=article.querySelector(".act.bin");
          if(bin) bin.setAttribute("aria-pressed","true");
        }
        recount();
        foldAway(article);
      }
    };
  });
}

function setMode(next){
  mode=(mode===next)?"all":next;
  document.getElementById("tStar").setAttribute("aria-pressed",mode==="starred");
  document.getElementById("tBin").setAttribute("aria-pressed",mode==="binned");
  render();
}
document.getElementById("tStar").onclick=()=>setMode("starred");
document.getElementById("tBin").onclick=()=>setMode("binned");
document.getElementById("tFilter").onclick=()=>setFiltersOpen(!filtersOpen);
document.getElementById("fReset").onclick=resetFilters;
document.getElementById("restoreAll").onclick=restoreAll;

function onRangeInput(which){
  let a=+document.getElementById("rFrom").value;
  let b=+document.getElementById("rTo").value;
  if(which==="from" && a>b) a=b;
  if(which==="to" && b<a) b=a;
  filters.from=idxToIso(a);
  filters.to=idxToIso(b);
  syncRange();
  applyFilters();
}
document.getElementById("rFrom").addEventListener("input",()=>onRangeInput("from"));
document.getElementById("rTo").addEventListener("input",()=>onRangeInput("to"));

const HINTS=[
  "political one-woman show",
  "spooky ghost story with handmade puppets, for adults",
  "in East London",
  "Dance with contemporary music and choreography",
];
let asking=false;

function syncAsk(){
  const empty=!document.getElementById("q").value.trim();
  const btn=document.getElementById("go");
  btn.disabled=asking||empty;
  btn.classList.toggle("busy", asking);
  btn.setAttribute("aria-busy", asking?"true":"false");
}

function startHints(){
  const q=document.getElementById("q");
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    q.placeholder=HINTS[0];
    return;
  }
  let i=0, pos=0, phase="type", paused=false;
  const step=()=>{
    if(q.value){
      q.placeholder="";
      paused=true;
      setTimeout(step, 400);
      return;
    }
    if(paused){
      paused=false;
      pos=0;
      phase="type";
      i=(i+1)%HINTS.length;
    }
    const text=HINTS[i];
    if(phase==="type"){
      pos++;
      q.placeholder=text.slice(0,pos);
      if(pos>=text.length){ phase="hold"; setTimeout(step, 1000); return; }
      setTimeout(step, 42);
      return;
    }
    if(phase==="hold"){
      phase="delete";
      setTimeout(step, 28);
      return;
    }
    if(phase==="delete"){
      pos--;
      q.placeholder=text.slice(0, pos);
      if(pos<=0){
        phase="gap";
        i=(i+1)%HINTS.length;
        setTimeout(step, 380);
        return;
      }
      setTimeout(step, 28);
      return;
    }
    phase="type";
    setTimeout(step, 42);
  };
  step();
}

async function ask(){
  const q=document.getElementById("q").value.trim();
  if(!q||asking){
    if(!q){ subset=null; render(""); }
    return;
  }
  asking=true; syncAsk();
  try{
    const res=await fetch("/api/search?"+new URLSearchParams({q, limit:"60"}));
    if(!res.ok) throw new Error("search "+res.status);
    const data=await res.json();
    subset=data.ids||[];
    render("");
  }catch(err){
    console.warn(err);
    subset=null;
    render("Search didn't respond.");
  }finally{ asking=false; syncAsk(); }
}
document.getElementById("go").onclick=ask;
document.getElementById("q").addEventListener("input", syncAsk);
document.getElementById("q").addEventListener("keydown",e=>{
  if(e.key==="Enter") ask();
});

function applyTodayStart(){
  const s=dateSpan();
  if(filters.from===s.min && filters.to<=s.max && filters.to>=s.min) return;
  filters.from=s.min;
  if(filters.to<s.min) filters.to=s.min;
  if(filters.to>s.max) filters.to=s.max;
  syncFilterUI();
  persist();
  render();
}
function scheduleDayRollover(){
  const n=new Date();
  const next=new Date(n.getFullYear(), n.getMonth(), n.getDate()+1);
  setTimeout(()=>{
    applyTodayStart();
    scheduleDayRollover();
  }, Math.max(1000, next-n+50));
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && filters.from<dateSpan().min)
    applyTodayStart();
});

(async()=>{
  buildChips();
  await load();
  EVENTS.splice(0, EVENTS.length, ...weightedShuffle(EVENTS));
  syncFilterUI();
  persist();
  render("");
  syncAsk();
  startHints();
  scheduleDayRollover();
})();

(function(){
  const el=document.getElementById("splash");
  if(!el) return;
  const hide=()=>{
    el.classList.add("out");
    const done=()=>el.remove();
    el.addEventListener("transitionend", done, {once:true});
    setTimeout(done, 500);
  };
  setTimeout(hide, 1000);
})();
</script>
